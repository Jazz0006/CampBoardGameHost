name: UI-R5 Sage ownership extraction one-shot

on:
  push:
    branches:
      - codex/ui-r5-square-table-stabilization
    paths:
      - .github/workflows/ui-r5-sage-ownership-one-shot.yml

permissions:
  contents: write

jobs:
  extract-sage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact trigger parent and source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "codex/ui-r5-square-table-stabilization"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "d82e1254bdb413445adb1fc2e66bb4401eea719e"
          remote_head="$(git ls-remote origin refs/heads/codex/ui-r5-square-table-stabilization | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt)" = "7b73f54343f8c3e51df47bb286ebe13454b3b276"
          test "$(git rev-parse HEAD:app/src/main/java/com/codex/campboardgamehost/ClocktowerSageStepMaterializer.kt)" = "7882ccb05d2a1ac8b08ff4ae426a84fffb34391a"
          test "$(git rev-parse HEAD:app/src/test/java/com/codex/campboardgamehost/ClocktowerSageStepMaterializerTest.kt)" = "89ce4a9ee2c93d982255d2b2bc4b433ff72d4fb0"
          test "$(git rev-parse HEAD:app/src/test/java/com/codex/campboardgamehost/ClocktowerSageSquareTableWiringTest.kt)" = "aef502544ae96391adf3b3b0c728ace340aec9e5"

      - name: Apply exact Sage Host ownership patch
        run: python .github/scripts/ui_r5_sage_ownership_patch.py

      - name: Audit production diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt"
          test "$changed" = "$expected"
          ! grep -Fq 'fun recommendedSageOptions(' app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt
          test "$(grep -Fc 'clocktowerSageStepMaterializer(' app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt)" = "1"
          grep -Fq 'val sageNightDeath =' app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt
          grep -Fq 'val sageDeathTriggerAbilityState =' app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt

      - name: Run focused Sage tests
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerSageStepMaterializerTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerSageSquareTablePresentationTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerSageSquareTableWiringTest' \
            --rerun-tasks

      - name: Run Android FAST checkpoint
        run: ./gradlew :app:testFast --rerun-tasks

      - name: Commit and push Sage extraction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote_head="$(git ls-remote origin refs/heads/codex/ui-r5-square-table-stabilization | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git add app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt
          git commit -m "refactor: delegate Sage materialization from Host"
          git push origin HEAD:codex/ui-r5-square-table-stabilization

      - name: Remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ui-r5-sage-ownership-one-shot.yml
          rm .github/scripts/ui_r5_sage_ownership_patch.py
          git add -A .github/workflows/ui-r5-sage-ownership-one-shot.yml .github/scripts/ui_r5_sage_ownership_patch.py
          git commit -m "chore: remove Sage ownership one-shot"
          git push origin HEAD:codex/ui-r5-square-table-stabilization
