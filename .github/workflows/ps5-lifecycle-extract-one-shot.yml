name: PS5 lifecycle extraction one-shot

on:
  push:
    branches:
      - codex/persistence-simplification
    paths:
      - .github/workflows/ps5-lifecycle-extract-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: codex/persistence-simplification

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Guard exact head, parent and target blob
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/persistence-simplification
          expected_parent=9e5479531e8fbce28041fafa30fd1c3c517a37bd
          expected_target_blob=5a38d994ae539e332241d77c286e851306129432
          target=app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          test "$(git rev-parse HEAD:$target)" = "$expected_target_blob"
          test -f app/src/main/java/com/codex/campboardgamehost/persistence/RecoveryLifecyclePersistence.kt
          test -f .github/scripts/ps5_lifecycle_extract_patch.py

          git fetch origin "$branch"
          test "$(git rev-parse origin/$branch)" = "$GITHUB_SHA"

      - name: Apply exact lifecycle extraction patch
        run: python .github/scripts/ps5_lifecycle_extract_patch.py

      - name: Verify exact working diff
        shell: bash
        run: |
          set -euo pipefail
          target=app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$target"
          git diff --check
          grep -Fq 'val latestPersistActiveGameState by rememberUpdatedState { force: Boolean ->' "$target"
          grep -Fq 'persistRecoveryForLifecycleEvent(event, latestPersistActiveGameState)' "$target"
          if grep -Fq 'if (event == Lifecycle.Event.ON_PAUSE || event == Lifecycle.Event.ON_STOP)' "$target"; then
            echo "legacy inline lifecycle persistence policy still present" >&2
            exit 1
          fi

      - name: Run Android FAST tests
        run: ./gradlew :app:testFast --no-daemon --build-cache

      - name: Commit and push behavior-preserving extraction
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/persistence-simplification
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git fetch origin "$branch"
          test "$(git rev-parse origin/$branch)" = "$GITHUB_SHA"

          git add app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          git commit -m 'refactor: route Recovery lifecycle writes through policy'
          git push origin "HEAD:$branch"
          product_sha="$(git rev-parse HEAD)"

          git rm .github/workflows/ps5-lifecycle-extract-one-shot.yml
          git rm .github/scripts/ps5_lifecycle_extract_patch.py
          git commit -m 'chore: remove PS5 lifecycle extraction patcher'

          git fetch origin "$branch"
          test "$(git rev-parse origin/$branch)" = "$product_sha"
          git push origin "HEAD:$branch"
