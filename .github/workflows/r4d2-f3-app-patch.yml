name: R4D2 F3 App Patch

on:
  push:
    branches:
      - codex/ui-r4d2-seating-first-setup

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'build: run F3 app patch' }}"
    runs-on: ubuntu-latest
    env:
      BRANCH: codex/ui-r4d2-seating-first-setup
      TARGET: app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
      EXPECTED_TARGET_BLOB: 0f5f1ba5331396bad3d8ec4a2a29dc165b0cd51a
      TEST_FILE: app/src/test/java/com/codex/campboardgamehost/HostSeatingRosterTest.kt
      EXPECTED_TEST_BLOB: 2d48b853816f3e8372f5a74382d18bae93bed7f7
      NAV_FILE: app/src/main/java/com/codex/campboardgamehost/HostSeatingBackNavigation.kt
      EXPECTED_NAV_BLOB: df4f74e4ad5aa679b25d26924132d1a3b7728cb1
      SCRIPT: .github/scripts/r4d2_f3_back_navigation_patch.py
      WORKFLOW: .github/workflows/r4d2-f3-app-patch.yml
      FOCUSED_WORKFLOW: .github/workflows/r4d2-f3-focused.yml

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      - name: Verify exact remote checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "${GITHUB_SHA}"
          test "$(git hash-object "$TARGET")" = "$EXPECTED_TARGET_BLOB"
          test "$(git hash-object "$TEST_FILE")" = "$EXPECTED_TEST_BLOB"
          test "$(git hash-object "$NAV_FILE")" = "$EXPECTED_NAV_BLOB"
          test -f "$SCRIPT"
          test -f "$FOCUSED_WORKFLOW"

      - name: Apply exact F3 navigation patch
        run: python "$SCRIPT"

      - name: Audit product diff
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "$TARGET"
          git diff --check
          grep -F 'fun applyHostSeatingBack(origin: HostSeatingBackOrigin)' "$TARGET"
          grep -F 'BackHandler(enabled = hostSeatingBackOrigin != null)' "$TARGET"
          grep -F 'Screen.GameSelection -> HostSeatingBackOrigin.GameSelection' "$TARGET"
          grep -F 'Screen.ClocktowerSettings -> HostSeatingBackOrigin.GameSettings' "$TARGET"
          test "$(grep -Fc 'applyHostSeatingBack(HostSeatingBackOrigin.GameSelection)' "$TARGET")" -eq 1
          test "$(grep -Fc 'applyHostSeatingBack(HostSeatingBackOrigin.GameSettings)' "$TARGET")" -eq 3
          if grep -Fq 'hostSeatingSetupFlow = hostSeatingSetupFlow.reopenSeating()' "$TARGET"; then
            echo 'Direct Game Selection reopen wiring remains.' >&2
            exit 1
          fi
          if grep -Fq 'hostSeatingSetupFlow = hostSeatingSetupFlow.returnToGameSelection()' "$TARGET"; then
            echo 'Direct game-settings return wiring remains.' >&2
            exit 1
          fi

      - name: Run F3 checkpoint tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew \
            :app:testDebugUnitTest \
            --tests com.codex.campboardgamehost.HostSeatingRosterTest \
            --no-daemon \
            --rerun-tasks
          ./gradlew :app:testFast --no-daemon --rerun-tasks

      - name: Commit product patch and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "${GITHUB_SHA}"

          git add "$TARGET"
          git commit -m 'feat: wire Android back to seating setup flow'
          product_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:${BRANCH}"

          remote_product_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "$remote_product_head" = "$product_sha"

          git rm "$SCRIPT" "$WORKFLOW" "$FOCUSED_WORKFLOW"
          git commit -m 'chore: remove temporary F3 validation workflows'
          git push origin "HEAD:${BRANCH}"

          echo "Product checkpoint: $product_sha"
