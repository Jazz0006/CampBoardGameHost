name: UI-NAV-1D live settings audit

on:
  push:
    branches:
      - codex/ui-nav-1-global-navigation-visual-unification
    paths:
      - .github/workflows/ui-nav-1d-settings-audit.yml

permissions:
  contents: write

jobs:
  audit-settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate live settings composables and shared header callers
        shell: bash
        run: |
          set -euo pipefail
          echo '=== settings screen definitions ==='
          grep -R -n -E 'fun (UndercoverSettingsScreen|ClocktowerSettingsScreen)' app/src/main/java || true
          echo '=== GameSettingsHeader callers ==='
          grep -R -n -F 'GameSettingsHeader(' app/src/main/java || true
          echo '=== onStart/onBack around settings ==='
          grep -R -n -E 'UndercoverSettingsScreen|ClocktowerSettingsScreen|onStart:|onBack:' app/src/main/java/com/codex/campboardgamehost | head -200 || true

      - name: Remove audit workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/ui-nav-1d-settings-audit.yml
          git add .github/workflows/ui-nav-1d-settings-audit.yml
          git commit -m 'chore: remove UI-NAV-1D settings audit'
          git push origin HEAD:codex/ui-nav-1-global-navigation-visual-unification
