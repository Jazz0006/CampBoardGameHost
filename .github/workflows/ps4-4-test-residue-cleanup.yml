name: PS4.4 test residue cleanup

on:
  push:
    branches:
      - codex/persistence-simplification
    paths:
      - .github/workflows/ps4-4-test-residue-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout locked branch
        uses: actions/checkout@v4
        with:
          ref: codex/persistence-simplification
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify cleanup preconditions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'a3869c646893bfb0272d4e66a716f58417ee3294'
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/persistence/RecoveryClocktowerRotationOwnershipTest.kt)" = 'fc21de62fd610a5217c2edc7bb34eaa38091330e'
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/persistence/RecoveryRestorePlannerTest.kt)" = 'e1d578eed4321ac56c659bf505907490dcc1f917'
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/persistence/RecoverySnapshotJsonCodecTest.kt)" = '57e172cc77c66a4e70a20cc1b0c26cc898ed369e'
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/clocktower/catalog/BuiltInClocktowerRulesetCatalogTest.kt)" = '88e490cd551c4138be87983697624e3ee910e26a'

      - name: Remove audited test-only legacy identity residue
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def remove_between(path_str: str, start: str, end: str) -> None:
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              if text.count(start) != 1:
                  raise SystemExit(f'{path}: expected exactly one start marker: {start!r}')
              start_index = text.index(start)
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f'{path}: end marker not found after start: {end!r}')
              text = text[:start_index] + text[end_index:]
              path.write_text(text, encoding='utf-8')

          remove_between(
              'app/src/test/java/com/codex/campboardgamehost/persistence/RecoveryClocktowerRotationOwnershipTest.kt',
              '        val persistedIdentity = PersistedActiveGameIdentityEnvelope.clocktower(',
              '        return RecoverySnapshot(',
          )
          remove_between(
              'app/src/test/java/com/codex/campboardgamehost/persistence/RecoveryRestorePlannerTest.kt',
              '        val identity = PersistedActiveGameIdentityEnvelope.clocktower(',
              '        return RecoverySnapshot(',
          )
          remove_between(
              'app/src/test/java/com/codex/campboardgamehost/persistence/RecoverySnapshotJsonCodecTest.kt',
              '        val identity = PersistedActiveGameIdentityEnvelope.werewolf(',
              '        val snapshot = RecoverySnapshot(',
          )
          remove_between(
              'app/src/test/java/com/codex/campboardgamehost/persistence/RecoverySnapshotJsonCodecTest.kt',
              '        val identity = PersistedActiveGameIdentityEnvelope.clocktower(',
              '        val snapshot = RecoverySnapshot(',
          )

          catalog = Path('app/src/test/java/com/codex/campboardgamehost/clocktower/catalog/BuiltInClocktowerRulesetCatalogTest.kt')
          text = catalog.read_text(encoding='utf-8')
          marker = '    @Test\n    fun `persistence coordinator consumes the shared catalog and owns no duplicate built-in loader`() {'
          if text.count(marker) != 1:
              raise SystemExit('Expected exactly one obsolete catalog architecture test.')
          start_index = text.index(marker)
          class_close = text.rfind('\n}')
          if class_close <= start_index:
              raise SystemExit('Could not locate catalog test class closing brace.')
          replacement = '''    @Test
          fun `recovery save validation consumes the shared catalog directly`() {
              val source = File(
                  "src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt",
              ).readText(Charsets.UTF_8)

              assertTrue(source.contains("BuiltInClocktowerRulesetCatalog.fromContext(baseContext)"))
              assertTrue(
                  source.contains(
                      "activeGameClocktowerRulesetCatalog.ruleset(currentClocktowerScript).script",
                  ),
              )
              assertFalse(source.contains("ActiveGamePersistenceCoordinator.fromContext(baseContext)"))
          }
          '''
          text = text[:start_index] + replacement + text[class_close:]
          catalog.write_text(text, encoding='utf-8')
          PY

      - name: Verify exact cleanup surface
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            app/src/test/java/com/codex/campboardgamehost/clocktower/catalog/BuiltInClocktowerRulesetCatalogTest.kt \
            app/src/test/java/com/codex/campboardgamehost/persistence/RecoveryClocktowerRotationOwnershipTest.kt \
            app/src/test/java/com/codex/campboardgamehost/persistence/RecoveryRestorePlannerTest.kt \
            app/src/test/java/com/codex/campboardgamehost/persistence/RecoverySnapshotJsonCodecTest.kt | sort)"
          if git grep -nE 'PersistedActiveGameIdentityEnvelope|PersistedGameContentIdentity|PersistedWerewolfGameIdentity' -- \
            app/src/test/java/com/codex/campboardgamehost/persistence/RecoveryClocktowerRotationOwnershipTest.kt \
            app/src/test/java/com/codex/campboardgamehost/persistence/RecoveryRestorePlannerTest.kt \
            app/src/test/java/com/codex/campboardgamehost/persistence/RecoverySnapshotJsonCodecTest.kt; then
            echo 'Dead legacy identity fixtures remain in typed Recovery tests.' >&2
            exit 1
          fi

      - name: Run affected tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.RecoveryClocktowerRotationOwnershipTest' \
            --tests 'com.codex.campboardgamehost.RecoveryRestorePlannerTest' \
            --tests 'com.codex.campboardgamehost.RecoverySnapshotJsonCodecTest' \
            --tests 'com.codex.campboardgamehost.clocktower.catalog.BuiltInClocktowerRulesetCatalogTest'

      - name: Run FAST regression suite
        run: ./gradlew testFast

      - name: Commit cleanup and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ps4-4-test-residue-cleanup.yml
          git add app/src/test/java/com/codex/campboardgamehost/clocktower/catalog/BuiltInClocktowerRulesetCatalogTest.kt \
            app/src/test/java/com/codex/campboardgamehost/persistence/RecoveryClocktowerRotationOwnershipTest.kt \
            app/src/test/java/com/codex/campboardgamehost/persistence/RecoveryRestorePlannerTest.kt \
            app/src/test/java/com/codex/campboardgamehost/persistence/RecoverySnapshotJsonCodecTest.kt
          git diff --cached --check
          git commit -m 'test: remove retired active identity residue'
          git push origin HEAD:codex/persistence-simplification
