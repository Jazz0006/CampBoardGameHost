name: R4D2 F5 Roadmap Closeout

on:
  push:
    branches:
      - codex/ui-r4d2-seating-first-setup
    paths:
      - .github/workflows/r4d2-f5-roadmap-closeout.yml

permissions:
  contents: write

jobs:
  patch-closeout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Guard exact docs-patch head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1c25bef163f37e4104910fb00a64b47b815c50eb"
          test "$(git rev-parse 1c25bef163f37e4104910fb00a64b47b815c50eb^)" = "c4f106c7cddd4d3bd9c8215d33c4d503d279e57b"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/r4d2-f5-roadmap-closeout.yml"

      - name: Apply exact roadmap closeout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/r4d2_f5_closeout_roadmap.py

      - name: Audit docs-only product diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "docs/CURRENT_DEVELOPMENT_ROADMAP.md"
          git diff --check
          grep -F "UI-R4D-2F / F6 — high-contrast seat/state typography corrections" docs/CURRENT_DEVELOPMENT_ROADMAP.md
          grep -F "UI-R4D-2F F5 typed pair Player Reveal hierarchy                        COMPLETE / VERIFIED" docs/CURRENT_DEVELOPMENT_ROADMAP.md
          grep -F "F5 executable cleanup head: c4f106c7cddd4d3bd9c8215d33c4d503d279e57b" docs/CURRENT_DEVELOPMENT_ROADMAP.md
          grep -F "final validation run `33703495351`" docs/CURRENT_DEVELOPMENT_ROADMAP.md

      - name: Commit roadmap and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/CURRENT_DEVELOPMENT_ROADMAP.md
          git commit -m "docs: close R4D2 F5 and activate F6"

          git rm \
            .github/workflows/r4d2-f5-roadmap-closeout.yml \
            tools/r4d2_f5_closeout_roadmap.py
          git commit -m "build: remove temporary F5 roadmap closeout"

          git push origin HEAD:codex/ui-r4d2-seating-first-setup
