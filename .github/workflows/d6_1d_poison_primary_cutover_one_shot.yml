name: D6.1d primary poison cutover one-shot

on:
  push:
    branches:
      - codex/d6-root-reaudit
    paths:
      - .github/workflows/d6_1d_poison_primary_cutover_one_shot.yml

permissions:
  contents: write

jobs:
  patch-test-push-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: codex/d6-root-reaudit
          fetch-depth: 0

      - name: Verify exact baseline and tooling scope
        shell: bash
        run: |
          set -euo pipefail
          BASE_PRODUCT='7081e04b05123aad64bd3a0f97ad64786a5c46fe'
          APP='app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt'
          EXPECTED_APP_BLOB='62c7a35a8603242a4633f067d0e1b9ea30d12c8d'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/codex/d6-root-reaudit | cut -f1)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE_PRODUCT" HEAD
          test "$(git hash-object "$APP")" = "$EXPECTED_APP_BLOB"
          actual="$(git diff --name-only "$BASE_PRODUCT"..HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/scripts/d6_1d_poison_primary_cutover_patch.py' \
            '.github/workflows/d6_1d_poison_primary_cutover_one_shot.yml' | sort)"
          test "$actual" = "$expected"

      - name: Apply bounded large-file patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/d6_1d_poison_primary_cutover_patch.py

      - name: Exact product diff audit
        shell: bash
        run: |
          set -euo pipefail
          APP='app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt'
          test "$(git diff --name-only)" = "$APP"
          git diff --check
          test "$(grep -c 'commitPoisonTargetBoundary(' "$APP")" -eq 1
          test "$(grep -c 'synchronizePoisonTargetWithinCurrentRevision(' "$APP")" -eq 2
          git diff -- "$APP"

      - name: Focused poison ownership tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.clocktower.session.ClocktowerGameSessionPoisonBoundaryTest' \
            --tests 'com.codex.campboardgamehost.clocktower.session.NightCheckpointHostTransactionTest' \
            --tests 'com.codex.campboardgamehost.clocktower.session.NightDawnOrdinaryPoisonOwnershipTest' \
            --tests 'com.codex.campboardgamehost.clocktower.session.NightDawnDurableMaterializationPlannerTest' \
            --tests 'com.codex.campboardgamehost.clocktower.session.DuskPoisonExpiryMaterializationPlannerTest' \
            --tests 'com.codex.campboardgamehost.clocktower.session.DuskPoisonExpiryRecoveryAuthorityTest' \
            --tests 'com.codex.campboardgamehost.clocktower.session.PoisonExecutionDuskTimelineRegressionTest' \
            --tests 'com.codex.campboardgamehost.clocktower.session.NightDawnRestoreRetryConvergenceAcceptanceTest' \
            --no-daemon

      - name: Android FAST
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testFast --no-daemon --build-cache

      - name: Commit and push product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          git commit -m 'refactor: route primary poison state through Clocktower session'
          git push origin HEAD:codex/d6-root-reaudit

      - name: Remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/scripts/d6_1d_poison_primary_cutover_patch.py \
            .github/workflows/d6_1d_poison_primary_cutover_one_shot.yml
          git commit -m 'chore: remove D6 primary poison cutover tooling'
          git push origin HEAD:codex/d6-root-reaudit
