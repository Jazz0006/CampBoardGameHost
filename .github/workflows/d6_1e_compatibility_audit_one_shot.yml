name: D6.1e compatibility audit one-shot

on:
  push:
    branches:
      - codex/d6-root-reaudit
    paths:
      - .github/workflows/d6_1e_compatibility_audit_one_shot.yml

permissions:
  contents: write

jobs:
  audit-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: codex/d6-root-reaudit
          fetch-depth: 0

      - name: Verify audit baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE='6176e681f2245c5dfbfe1068cd6c168fc7bfd9cc'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE" HEAD
          actual="$(git diff --name-only "$BASE"..HEAD)"
          test "$actual" = '.github/workflows/d6_1e_compatibility_audit_one_shot.yml'

      - name: Compatibility and read-side callsite inventory
        shell: bash
        run: |
          set -euo pipefail
          echo '=== production calls: ClocktowerGameSession.commitGlobalActionFact stateless form ==='
          git grep -n 'ClocktowerGameSession\.commitGlobalActionFact' -- app/src/main || true
          echo '=== production calls: ClocktowerGameSession.commitGlobalEpistemicObservation stateless form ==='
          git grep -n 'ClocktowerGameSession\.commitGlobalEpistemicObservation' -- app/src/main || true
          echo '=== production calls: updateGameState ==='
          git grep -n '\.updateGameState(' -- app/src/main || true
          echo '=== production calls: snapshot property ==='
          git grep -n '\.snapshot' -- app/src/main/java/com/codex/campboardgamehost | grep Clocktower || true
          echo '=== production calls: toGameSnapshot ==='
          git grep -n 'toGameSnapshot(' -- app/src/main || true
          echo '=== cards.toClocktowerGameState production callsites ==='
          git grep -n 'toClocktowerGameState' -- app/src/main || true
          echo '=== session.state.gameState production reads ==='
          git grep -n 'state\.gameState' -- app/src/main/java/com/codex/campboardgamehost || true
          echo '=== ClocktowerSessionView production reads/declaration ==='
          git grep -n 'ClocktowerSessionView' -- app/src/main || true
          echo '=== stale ownership wording ==='
          git grep -n -E 'until the full game state is session-owned|still the live mechanical source|not yet safe|not.*canonical|until D6\.1d' -- app/src/main docs/D6_1C_SESSION_AUTHORITY_CUTOVER_PROGRESS_2026-09-08.md docs/D6_1D_GAME_STATE_PROGRESS_2026-09-08.md docs/CURRENT_DEVELOPMENT_ROADMAP.md docs/NEXT_DEVELOPMENT_HANDOFF_2026-09-08_D6_POST_PERSISTENCE_REAUDIT.md || true
          echo '=== all source references to compatibility APIs (tests included) ==='
          git grep -n -E 'commitGlobalActionFact\(|commitGlobalEpistemicObservation\(|updateGameState\(|toGameSnapshot\(' -- app/src || true

      - name: Remove audit tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/d6_1e_compatibility_audit_one_shot.yml
          git commit -m 'chore: remove D6.1e compatibility audit tooling'
          git push origin HEAD:codex/d6-root-reaudit
