name: R4D2 F5 Typed Pair Reveal RED

on:
  push:
    branches:
      - codex/ui-r4d2-seating-first-setup
    paths:
      - .github/workflows/r4d2-f5-red.yml

permissions:
  contents: read

jobs:
  focused-red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Guard exact RED parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "98622ab624401217282466829bc200e67782b25e"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/r4d2-f5-red.yml"

      - name: Execute focused F5 RED
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests com.codex.campboardgamehost.ClocktowerPlayerDisplayPresentationTest \
            --rerun-tasks
