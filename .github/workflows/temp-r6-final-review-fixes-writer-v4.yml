name: Temp R6 final review fixes writer v4

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/r6-final-review-fixes-writer-temp
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply exact final review fixes
        run: python3 .github/scripts/temp_r6_final_review_writer.py
      - name: Validate focused contracts
        run: |
          test "$(git diff --name-only)" = "app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt"
          git diff --check
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests com.codex.campboardgamehost.ClocktowerGlobalObservationProductionWiringTest \
            --tests com.codex.campboardgamehost.clocktower.session.ClocktowerGlobalObservationCommitTest \
            --tests com.codex.campboardgamehost.ActiveGameSemanticHistoryProductionWiringTest \
            --console=plain
      - name: Commit generated App blob
        run: |
          test "$(git diff --name-only)" = "app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          git diff --cached --check
          git commit -m "fix: close final global observation review gaps"
          git push origin HEAD:codex/r6-final-review-fixes-writer-temp
