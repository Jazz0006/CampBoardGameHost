name: Codex host-table zero-bounds crash fix

on:
  push:
    branches:
      - codex/ui-info-1-beginner-night-guidance
    paths:
      - .github/workflows/codex-host-table-zero-bounds-fix.yml

permissions:
  contents: write

jobs:
  red-patch-green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Lock expected baseline
        shell: bash
        run: |
          set -euo pipefail
          expected_parent="0cb81b1e73e66ac2f934e0d9a411f7df856e95bd"
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          test "$(git rev-parse HEAD^:app/src/main/java/com/codex/campboardgamehost/ClocktowerSquareTableUi.kt)" = "570ad88f146d3f408573e9963b8fde184dfd0f41"
          test "$(git rev-parse HEAD^:app/src/main/java/com/codex/campboardgamehost/ClocktowerHostTableSurfaceLayout.kt)" = "cb10caa29f628d2a03bc857e9a51a2f87ab63309"
          test "$(git rev-parse HEAD^:app/src/test/java/com/codex/campboardgamehost/ClocktowerHostTableSurfaceLayoutTest.kt)" = "41e28311996804c66d7dadebc5ba1d33b4145789"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Add focused regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          path = Path("app/src/test/java/com/codex/campboardgamehost/ClocktowerHostTableSurfaceLayoutTest.kt")
          text = path.read_text()
          suffix = "\n}\n"
          if not text.endswith(suffix):
              raise SystemExit("unexpected test class suffix")
          payload = base64.b64decode("").decode()
          path.write_text(text[:-len(suffix)] + payload + suffix)
          PY

      - name: RED - guard policy is missing
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./gradlew :app:testDebugUnitTest --tests 'com.codex.campboardgamehost.ClocktowerHostTableSurfaceLayoutTest' --no-daemon > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/red.log"
          if [[ "$status" -eq 0 ]]; then
            echo "Expected regression test to be RED before the guard exists."
            exit 1
          fi
          grep -F "canRenderHostTableSurface" "$RUNNER_TEMP/red.log"

      - name: Patch renderability policy and shared Compose boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          surface_path = Path("app/src/main/java/com/codex/campboardgamehost/ClocktowerHostTableSurfaceLayout.kt")
          surface = surface_path.read_text()
          marker = "\nprivate val HOST_TABLE_COMPACT_FALLBACK_SCALES = listOf(0.96f, 0.92f, 0.88f, 0.84f, 0.80f)\n"
          if surface.count(marker) != 1:
              raise SystemExit(f"surface marker count={surface.count(marker)}")
          helper = base64.b64decode("").decode()
          surface_path.write_text(surface.replace(marker, helper + marker, 1))
          ui_path = Path("app/src/main/java/com/codex/campboardgamehost/ClocktowerSquareTableUi.kt")
          ui = ui_path.read_text()
          ui_marker = "        val availableHeight = maxHeight.value\n"
          if ui.count(ui_marker) != 1:
              raise SystemExit(f"ui marker count={ui.count(ui_marker)}")
          guard = base64.b64decode("ICAgICAgICBpZiAoIWNhblJlbmRlckhvc3RUYWJsZVN1cmZhY2UoYXZhaWxhYmxlV2lkdGgsIGF2YWlsYWJsZUhlaWdodCkpIHsKICAgICAgICAgICAgcmV0dXJuQEJveFdpdGhDb25zdHJhaW50cwogICAgICAgIH0K").decode()
          ui_path.write_text(ui.replace(ui_marker, ui_marker + guard, 1))
          PY

      - name: GREEN - focused regression
        run: ./gradlew :app:testDebugUnitTest --tests 'com.codex.campboardgamehost.ClocktowerHostTableSurfaceLayoutTest' --no-daemon

      - name: T1 Android FAST
        run: ./gradlew :app:testFast --no-daemon --build-cache

      - name: Exact diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' app/src/main/java/com/codex/campboardgamehost/ClocktowerHostTableSurfaceLayout.kt app/src/main/java/com/codex/campboardgamehost/ClocktowerSquareTableUi.kt app/src/test/java/com/codex/campboardgamehost/ClocktowerHostTableSurfaceLayoutTest.kt | sort)"
          test "$changed" = "$expected"
          grep -F "return@BoxWithConstraints" app/src/main/java/com/codex/campboardgamehost/ClocktowerSquareTableUi.kt
          grep -F "Host-table available height must be finite and positive" app/src/main/java/com/codex/campboardgamehost/ClocktowerHostTableLayout.kt

      - name: Commit fix and retire one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/codex-host-table-zero-bounds-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/codex/campboardgamehost/ClocktowerHostTableSurfaceLayout.kt app/src/main/java/com/codex/campboardgamehost/ClocktowerSquareTableUi.kt app/src/test/java/com/codex/campboardgamehost/ClocktowerHostTableSurfaceLayoutTest.kt .github/workflows/codex-host-table-zero-bounds-fix.yml
          git commit -m "fix: tolerate transient zero host-table bounds [full-ci]"
          git push origin HEAD:codex/ui-info-1-beginner-night-guidance
