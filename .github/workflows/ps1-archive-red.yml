name: PS1 Archive RED

on:
  push:
    branches:
      - codex/persistence-simplification

permissions:
  contents: read

jobs:
  archive-red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify RED fixture and untouched App blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/persistence/GameArchiveJsonCodecTest.kt)" = "98f9cd0838f22676cfafbab7bc5bb01e039e4b9f"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" = "72946669eabe654e4d0fb577a43f5d7d24398670"
          test ! -e app/src/main/java/com/codex/campboardgamehost/persistence/GameArchiveJsonCodec.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Confirm focused contract is RED for the missing archive seam
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.GameArchiveJsonCodecTest' \
            --rerun-tasks --no-daemon > "$RUNNER_TEMP/ps1-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/ps1-red.log"
          if [[ "$status" -eq 0 ]]; then
            echo "Expected focused archive contract to fail before production seam exists."
            exit 1
          fi
          grep -Eiq 'unresolved reference' "$RUNNER_TEMP/ps1-red.log"
          grep -Eq 'GameArchiveRecord|GameArchiveJsonCodec' "$RUNNER_TEMP/ps1-red.log"
          echo "RED PASS: archive contract is missing at the intended typed seam."
