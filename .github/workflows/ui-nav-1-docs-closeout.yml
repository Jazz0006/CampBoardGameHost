name: UI-NAV-1 docs closeout

on:
  push:
    branches:
      - codex/ui-nav-1-global-navigation-visual-unification
    paths:
      - .github/workflows/ui-nav-1-docs-closeout.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify production checkpoints
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/AppDealScreens.kt)" = "a89946ff5353c7d28a2130b479b77ed01a80a90e"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/AppGameReviewScreens.kt)" = "927dbc33e07bb7d8df71b83e25e033bab802fbb4"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/AppSettingsScreen.kt)" = "d1bb9772ef0d83790098b2f20331c6dbe5330d4a"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" = "b12a58f5d3d499e5070c90bdf6f185ac7ad9278d"

      - name: Reconcile authoritative docs
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/ui-nav-1-docs-closeout.py
          python .github/scripts/ui-nav-1-docs-closeout.py
          sed -i '4s/  $//' docs/NEXT_DEVELOPMENT_HANDOFF_2026-09-10_UI_NAV_1_GLOBAL_NAVIGATION_VISUAL_UNIFICATION.md
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' docs/CURRENT_DEVELOPMENT_ROADMAP.md docs/NEXT_DEVELOPMENT_HANDOFF_2026-09-10_UI_NAV_1_GLOBAL_NAVIGATION_VISUAL_UNIFICATION.md | sort)"
          test "$actual" = "$expected"

      - name: Commit docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_DEVELOPMENT_ROADMAP.md docs/NEXT_DEVELOPMENT_HANDOFF_2026-09-10_UI_NAV_1_GLOBAL_NAVIGATION_VISUAL_UNIFICATION.md
          git commit -m 'docs: record UI-NAV-1E and 1F completion'
          git fetch origin codex/ui-nav-1-global-navigation-visual-unification
          test "$(git rev-parse origin/codex/ui-nav-1-global-navigation-visual-unification)" = "$GITHUB_SHA"
          git push origin HEAD:codex/ui-nav-1-global-navigation-visual-unification

      - name: Remove docs closeout scaffolding
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ui-nav-1-docs-closeout.yml
          rm .github/scripts/ui-nav-1-docs-closeout.py
          git add .github/workflows/ui-nav-1-docs-closeout.yml .github/scripts/ui-nav-1-docs-closeout.py
          git commit -m 'chore: remove UI-NAV-1 docs closeout scaffolding'
          git push origin HEAD:codex/ui-nav-1-global-navigation-visual-unification
