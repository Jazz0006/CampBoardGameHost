name: Roadmap heading sync

on:
  push:
    branches:
      - codex/persistence-simplification
    paths:
      - .github/workflows/roadmap-heading-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/persistence-simplification
          fetch-depth: 0
      - name: Verify locked parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'b1c1ccd086d54371087d223a90b3766c25659f59'
          test "$(git ls-remote origin refs/heads/codex/persistence-simplification | cut -f1)" = "$(git rev-parse HEAD)"
      - name: Patch heading
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/CURRENT_DEVELOPMENT_ROADMAP.md')
          text = p.read_text(encoding='utf-8')
          old = '## 2. Current priority — PS4 Persistence Cleanup'
          new = '## 2. Current priority — PS5 Persistence Trigger Simplification'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one heading, found {text.count(old)}')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
      - name: Commit and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/CURRENT_DEVELOPMENT_ROADMAP.md
          git commit -m 'docs: point current priority to PS5'
          test "$(git ls-remote origin refs/heads/codex/persistence-simplification | cut -f1)" = "$(git rev-parse HEAD^)"
          git push origin HEAD:codex/persistence-simplification
          git rm .github/workflows/roadmap-heading-sync.yml
          git commit -m 'chore: remove roadmap heading sync workflow'
          git push origin HEAD:codex/persistence-simplification
