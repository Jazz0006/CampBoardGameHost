name: UI-INFO-1 restore Dawn broadcast one-shot

on:
  push:
    branches:
      - codex/ui-info-1-beginner-night-guidance
    paths:
      - .github/workflows/ui-info-1-restore-dawn-broadcast-one-shot.yml

permissions:
  contents: write

jobs:
  patch-test-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: codex/ui-info-1-beginner-night-guidance
          fetch-depth: 0

      - name: Lock branch and source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/codex/ui-info-1-beginner-night-guidance | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" = "777f2f72f1e9ffb46b7069f576bfc6c2927504b9"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerDayScreen.kt)" = "bd24b7560aa6c0e047b199bb87db994a5d89fbd0"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerDawnPresentationPolicy.kt)" = "bb2d7b6f4da36807fc08c61731b969afe98f4f96"
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/ClocktowerDawnPresentationPolicyTest.kt)" = "b86696464d88f3143f1b945189507d27c331ed61"
          test "$(git hash-object .github/scripts/ui_info_1_restore_dawn_broadcast_patch.py)" = "e96338f3487262a8a6f6092cd0746c0688520a92"

      - name: Prove Dawn host-surface regression is RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerDawnPresentationPolicyTest' \
            --rerun-tasks --no-daemon
          status=$?
          set -e
          test "$status" -ne 0

      - name: Apply fail-closed Dawn restoration patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ui_info_1_restore_dawn_broadcast_patch.py

      - name: Focused Dawn presentation GREEN
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerDawnPresentationPolicyTest' \
            --rerun-tasks --no-daemon

      - name: Android fast suite
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testFast --no-daemon

      - name: Verify retained and removed Dawn UI contracts
        shell: bash
        run: |
          set -euo pipefail
          day='app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerDayScreen.kt'
          app='app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt'
          grep -Fq 'PUBLIC ANNOUNCEMENT' "$day"
          grep -Fq '已完成播报，进入白天' "$day"
          ! grep -Fq 'showPublicAnnouncement' "$day"
          ! grep -Fq '全屏展示播报内容' "$day"
          ! grep -Fq 'Show announcement full screen' "$day"
          ! grep -Fq 'enterClocktowerDayAfterDawn' "$app"

      - name: Remove temporary one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ui-info-1-restore-dawn-broadcast-one-shot.yml
          rm .github/scripts/ui_info_1_restore_dawn_broadcast_patch.py

      - name: Exact diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/scripts/ui_info_1_restore_dawn_broadcast_patch.py' \
            '.github/workflows/ui-info-1-restore-dawn-broadcast-one-shot.yml' \
            'app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt' \
            'app/src/main/java/com/codex/campboardgamehost/ClocktowerDawnPresentationPolicy.kt' \
            'app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerDayScreen.kt' | sort)"
          test "$actual" = "$expected"
          git diff -- app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          git diff -- app/src/main/java/com/codex/campboardgamehost/ClocktowerDawnPresentationPolicy.kt
          git diff -- app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerDayScreen.kt

      - name: Commit and push production patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Jazz0006'
          git config user.email '37370802+Jazz0006@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore Dawn announcement host surface'
          test "$(git ls-remote origin refs/heads/codex/ui-info-1-beginner-night-guidance | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:codex/ui-info-1-beginner-night-guidance
