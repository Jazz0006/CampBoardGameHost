name: UX-MODE-1 legacy storyteller mode removal one-shot

on:
  push:
    branches:
      - codex/ux-mode-1
    paths:
      - .github/workflows/ux-mode-1-legacy-mode-removal-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          ref: codex/ux-mode-1
          fetch-depth: 0

      - name: Verify locked head and blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "a60343535587aca2bba84043b087e63a9ba04a73"
          test "$(git ls-remote origin refs/heads/codex/ux-mode-1 | cut -f1)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:app/src/main/java/com/codex/campboardgamehost/clocktower/domain/StorytellerAutomationMode.kt)" = "4aea6327f49cc5080131aecc5b9b1636ef814dd4"
          test "$(git rev-parse HEAD:app/src/main/java/com/codex/campboardgamehost/clocktower/domain/StorytellerRecommendationUxPolicy.kt)" = "e0134fbde0160eeb32ceea5b695a97c0416e9d93"
          test "$(git rev-parse HEAD:app/src/main/java/com/codex/campboardgamehost/clocktower/recommendation/UnifiedSelectionPool.kt)" = "a8de6265c4dd886024dbfad2e23880fcb82cb551"
          test "$(git rev-parse HEAD:app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt)" = "0611cfd8776a323acad8863bd78c8830fe3830b2"
          test "$(git rev-parse HEAD:app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHistoryScreen.kt)" = "ba9fcaa7a51a36f1acb08d4ea2d5c7ed02369f81"
          test "$(git rev-parse HEAD:app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerNightScreen.kt)" = "8d6cba113d313e3b8c761e5d88feb7eb0d9a63f2"
          test "$(git rev-parse HEAD:app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerDayScreen.kt)" = "b7dff1f8b9c7976ff6d48d81bbe1a709cec2ce80"
          test "$(git rev-parse HEAD:app/src/test/java/com/codex/campboardgamehost/clocktower/domain/StorytellerRecommendationUxPolicyTest.kt)" = "4250369ccc4fa3b29a0e2a87c8ef4e605963b4be"
          test "$(git rev-parse HEAD:app/src/test/java/com/codex/campboardgamehost/clocktower/recommendation/UnifiedSelectionPoolTest.kt)" = "70687629c657cddbd941c121bd34c7e8dc6ac754"
          test "$(git rev-parse HEAD:app/src/test/java/com/codex/campboardgamehost/ClocktowerStorytellerLegacyModeRemovalContractTest.kt)" = "a0232c27752c3a57ffc22506b3e7e95080fc05f5"
          test "$(git rev-parse HEAD:.github/scripts/ux_mode_1_legacy_mode_removal_patch.py)" = "604d7088f0246ca12ecbe970eefaa0552bd4b2d2"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Prove focused RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerStorytellerLegacyModeRemovalContractTest' \
            --rerun-tasks --no-daemon 2>&1 | tee /tmp/legacy-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'ClocktowerStorytellerLegacyModeRemovalContractTest > legacy storyteller automation mode compatibility surface is removed FAILED' /tmp/legacy-red.log

      - name: Apply exact legacy removal patch
        run: python3 .github/scripts/ux_mode_1_legacy_mode_removal_patch.py

      - name: Prove focused GREEN
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerStorytellerLegacyModeRemovalContractTest' \
            --rerun-tasks --no-daemon

      - name: Run Android FAST checkpoint
        run: ./gradlew :app:testFast --rerun-tasks --no-daemon

      - name: Exact diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import subprocess

          expected_status = {
              "app/src/main/java/com/codex/campboardgamehost/clocktower/domain/StorytellerAutomationMode.kt": "D",
              "app/src/main/java/com/codex/campboardgamehost/clocktower/domain/StorytellerRecommendationUxPolicy.kt": "M",
              "app/src/main/java/com/codex/campboardgamehost/clocktower/recommendation/UnifiedSelectionPool.kt": "M",
              "app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt": "M",
              "app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHistoryScreen.kt": "M",
              "app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerNightScreen.kt": "M",
              "app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerDayScreen.kt": "M",
              "app/src/test/java/com/codex/campboardgamehost/clocktower/domain/StorytellerRecommendationUxPolicyTest.kt": "D",
              "app/src/test/java/com/codex/campboardgamehost/clocktower/recommendation/UnifiedSelectionPoolTest.kt": "M",
          }
          expected_numstat = {
              "app/src/main/java/com/codex/campboardgamehost/clocktower/domain/StorytellerAutomationMode.kt": (0, 15),
              "app/src/main/java/com/codex/campboardgamehost/clocktower/domain/StorytellerRecommendationUxPolicy.kt": (0, 12),
              "app/src/main/java/com/codex/campboardgamehost/clocktower/recommendation/UnifiedSelectionPool.kt": (1, 5),
              "app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt": (0, 1),
              "app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHistoryScreen.kt": (0, 1),
              "app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerNightScreen.kt": (0, 1),
              "app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerDayScreen.kt": (0, 1),
              "app/src/test/java/com/codex/campboardgamehost/clocktower/domain/StorytellerRecommendationUxPolicyTest.kt": (0, 30),
              "app/src/test/java/com/codex/campboardgamehost/clocktower/recommendation/UnifiedSelectionPoolTest.kt": (0, 7),
          }

          status = {}
          for line in subprocess.check_output(["git", "diff", "--name-status"], text=True).splitlines():
              code, path = line.split("\t", 1)
              status[path] = code
          if status != expected_status:
              raise SystemExit(f"Unexpected name-status diff: {status}")

          numstat = {}
          for line in subprocess.check_output(["git", "diff", "--numstat"], text=True).splitlines():
              add, delete, path = line.split("\t", 2)
              numstat[path] = (int(add), int(delete))
          if numstat != expected_numstat:
              raise SystemExit(f"Unexpected numstat diff: {numstat}")
          PY
          test ! -e app/src/main/java/com/codex/campboardgamehost/clocktower/domain/StorytellerAutomationMode.kt
          test ! -e app/src/test/java/com/codex/campboardgamehost/clocktower/domain/StorytellerRecommendationUxPolicyTest.kt
          ! grep -RIn 'StorytellerAutomationMode\|fromLegacyMode' app/src/main/java --include='*.kt'
          grep -F 'enum class SelectionExecutionPolicy' app/src/main/java/com/codex/campboardgamehost/clocktower/recommendation/UnifiedSelectionPool.kt
          grep -F 'StorytellerExperienceMode.BEGINNER' app/src/main/java/com/codex/campboardgamehost/clocktower/domain/StorytellerRecommendationUxPolicy.kt
          grep -F 'StorytellerExperienceMode.EXPERIENCED' app/src/main/java/com/codex/campboardgamehost/clocktower/domain/StorytellerRecommendationUxPolicy.kt

      - name: Recheck remote head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/ux-mode-1 | cut -f1)" = "$GITHUB_SHA"

      - name: Commit and push product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A app/src/main/java app/src/test/java
          git commit -m 'refactor: remove legacy storyteller automation mode'
          product_sha=$(git rev-parse HEAD)
          echo "PRODUCT_SHA=$product_sha" >> "$GITHUB_ENV"
          git push origin HEAD:codex/ux-mode-1

      - name: Self-clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/scripts/ux_mode_1_legacy_mode_removal_patch.py
          git rm .github/workflows/ux-mode-1-legacy-mode-removal-one-shot.yml
          git commit -m 'chore(ci): remove legacy mode one-shot files'
          cleanup_sha=$(git rev-parse HEAD)
          echo "CLEANUP_SHA=$cleanup_sha" >> "$GITHUB_ENV"
          git push origin HEAD:codex/ux-mode-1

      - name: Report checkpoints
        run: |
          echo "product=$PRODUCT_SHA"
          echo "cleanup=$CLEANUP_SHA"
