name: SDE-2D5 calibration validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/sde-2d5-calibration-validation.yml

permissions:
  contents: read

jobs:
  calibration:
    name: SDE-2D5 calibration T3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run SDE-2D5 calibration evidence
        run: ./gradlew :app:sde2D5Calibration --no-daemon --rerun-tasks
