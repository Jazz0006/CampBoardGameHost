name: SDE-2D5 calibration validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/sde-2d5-calibration-validation.yml

permissions:
  contents: read

jobs:
  calibration:
    name: SDE-2D5 calibration T3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew
      - name: Generate repaired D5F calibration review
        run: >
          ./gradlew :app:sde2D5Calibration
          --tests '*Sde2D5CalibrationExperiment.real D5F calibration review export stays calibration only and deterministic'
          --no-daemon --rerun-tasks
      - name: Print D5F calibration review
        run: |
          echo "===== D5F CALIBRATION REVIEW ====="
          cat app/build/reports/sde-2d5f-calibration-review.md
