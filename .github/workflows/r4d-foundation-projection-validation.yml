name: R4D Foundation Projection Validation

on:
  push:
    branches:
      - codex/ui-r4d-persistent-table-foundation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Confirm GameState projection contract is RED before adapter
        shell: bash
        run: |
          set -euo pipefail
          green_head="$GITHUB_SHA"
          git checkout 4d960b08302b7892408d2add1511a5985c6dc338
          set +e
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerHostTableGameStateProjectionTest' \
            --rerun-tasks --no-daemon 2>&1 | tee "$RUNNER_TEMP/r4d-projection-red.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -Fq 'toHostSeatPresentations' "$RUNNER_TEMP/r4d-projection-red.log"
          git checkout "$green_head"

      - name: Run focused R4D foundation behavior tests
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerHostTableContractTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerHostTableGameStateProjectionTest' \
            --rerun-tasks --no-daemon

      - name: Run Android FAST unit tests
        run: ./gradlew :app:testFast --no-daemon --build-cache

      - name: Diff check
        run: git diff --check
