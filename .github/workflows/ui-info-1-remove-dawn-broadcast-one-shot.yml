name: UI-INFO-1 remove Dawn broadcast one-shot

on:
  push:
    branches:
      - codex/ui-info-1-beginner-night-guidance
    paths:
      - .github/workflows/ui-info-1-remove-dawn-broadcast-one-shot.yml

permissions:
  contents: write

# Retry 2: helper is anchored after resetClocktowerDayFlow so Kotlin local-function ownership compiles.
jobs:
  patch-test-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: codex/ui-info-1-beginner-night-guidance
          fetch-depth: 0

      - name: Lock branch, source, policy, and regression test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/codex/ui-info-1-beginner-night-guidance | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" = "c0f6858ef5792e056abccd8c0ade50ca38c07f64"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerDawnPresentationPolicy.kt)" = "bb2d7b6f4da36807fc08c61731b969afe98f4f96"
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/ClocktowerDawnPresentationPolicyTest.kt)" = "a10799c87b3a93f670671277d65a540ef5d225c3"

      - name: Apply fail-closed large-file patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ui_info_1_remove_dawn_broadcast_patch.py

      - name: Focused Dawn presentation regression
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerDawnPresentationPolicyTest' \
            --rerun-tasks --no-daemon

      - name: Android fast suite
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testFast --no-daemon

      - name: Remove temporary one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ui-info-1-remove-dawn-broadcast-one-shot.yml
          rm .github/scripts/ui_info_1_remove_dawn_broadcast_patch.py

      - name: Exact diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/scripts/ui_info_1_remove_dawn_broadcast_patch.py' \
            '.github/workflows/ui-info-1-remove-dawn-broadcast-one-shot.yml' \
            'app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt' | sort)"
          test "$actual" = "$expected"
          git diff -- app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt

      - name: Commit and push production patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Jazz0006'
          git config user.email '37370802+Jazz0006@users.noreply.github.com'
          git add -A
          git commit -m 'fix: skip legacy Dawn host broadcast'
          test "$(git ls-remote origin refs/heads/codex/ui-info-1-beginner-night-guidance | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:codex/ui-info-1-beginner-night-guidance
