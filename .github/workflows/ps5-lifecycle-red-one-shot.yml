name: PS5 lifecycle focused RED one-shot

on:
  push:
    branches:
      - codex/persistence-simplification
    paths:
      - .github/workflows/ps5-lifecycle-red-one-shot.yml

permissions:
  contents: write

jobs:
  focused-red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: codex/persistence-simplification

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Guard exact RED parent and remote head
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/persistence-simplification
          expected_red=192f031b67c9b4eb46bada4928425f9de332bb4a
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$expected_red"
          git fetch origin "$branch"
          test "$(git rev-parse origin/$branch)" = "$GITHUB_SHA"

      - name: Run focused lifecycle contract and require exact RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./gradlew :app:testFast \
            --tests 'com.codex.campboardgamehost.RecoveryLifecyclePersistenceTest' \
            --no-daemon --rerun-tasks > "$RUNNER_TEMP/focused-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/focused-red.log"
          test "$status" -ne 0

          report=app/build/test-results/testFast/TEST-com.codex.campboardgamehost.RecoveryLifecyclePersistenceTest.xml
          test -f "$report"
          python - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          assert int(root.attrib["tests"]) == 3, root.attrib
          assert int(root.attrib["failures"]) == 1, root.attrib
          failed = [case for case in root.findall("testcase") if case.find("failure") is not None]
          assert len(failed) == 1
          assert failed[0].attrib["name"] == "pauseThenStopAvoidsSecondPhysicalWriteAfterSuccessfulPause"
          failure = failed[0].find("failure")
          assert failure is not None
          payload = (failure.attrib.get("message") or "") + (failure.text or "")
          assert "expected:<1> but was:<2>" in payload, payload
          PY

      - name: Remove temporary RED workflow
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/persistence-simplification
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin "$branch"
          test "$(git rev-parse origin/$branch)" = "$GITHUB_SHA"
          git rm .github/workflows/ps5-lifecycle-red-one-shot.yml
          git commit -m 'chore: remove PS5 lifecycle RED runner'
          git push origin "HEAD:$branch"
