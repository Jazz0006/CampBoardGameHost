name: Apply dynamic night advance fix

on:
  push:
    branches:
      - codex/ui-r5-square-table-stabilization

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: apply dynamic night advance patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/ui-r5-square-table-stabilization
          fetch-depth: 0
      - name: Apply exact HostScreen patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt')
          text = path.read_text()

          old_state = '''    var nightStarted by nightStartedState
              var nightStepIndex by nightStepIndexState
              var dayMode by dayModeState
          '''
          if old_state not in text:
              old_state = '''    var nightStarted by nightStartedState
              var nightStepIndex by nightStepIndexState
              var dayMode by dayModeState
          '''.replace('              ', '    ')
          new_state = '''    var nightStarted by nightStartedState
              var nightStepIndex by nightStepIndexState
              var dayMode by dayModeState
              var deferredNightAdvanceIndex by remember(gameId, round, phase) { mutableStateOf<Int?>(null) }
          '''
          if old_state not in text:
              raise SystemExit('state anchor not found')
          text = text.replace(old_state, new_state, 1)

          old_active = '''    if ((phase == ClocktowerPhase.FirstNight || phase == ClocktowerPhase.Night) && nightStarted) {
              require(nightSteps.isNotEmpty()) { "A started night must contain an actionable step." }
          '''
          if old_active not in text:
              old_active = old_active.replace('              ', '        ')
          new_active = '''    if ((phase == ClocktowerPhase.FirstNight || phase == ClocktowerPhase.Night) && nightStarted) {
              require(nightSteps.isNotEmpty()) { "A started night must contain an actionable step." }
              LaunchedEffect(nightSteps.size, deferredNightAdvanceIndex) {
                  val requestedIndex = deferredNightAdvanceIndex ?: return@LaunchedEffect
                  if (
                      clocktowerDeferredNightAdvanceShouldComplete(
                          requestedStepIndex = requestedIndex,
                          refreshedStepCount = nightSteps.size,
                      )
                  ) {
                      deferredNightAdvanceIndex = null
                      onConfirmNight()
                  } else {
                      deferredNightAdvanceIndex = null
                  }
              }
          '''
          if old_active not in text:
              raise SystemExit('active-night anchor not found')
          text = text.replace(old_active, new_active, 1)

          old_tail = '''            recordNightStep(currentStep)
              if (currentStepIndex < nightSteps.lastIndex) {
                  nightStepIndex = currentStepIndex + 1
              } else {
                  onConfirmNight()
              }
          '''
          if old_tail not in text:
              old_tail = old_tail.replace('              ', '            ')
          new_tail = '''            recordNightStep(currentStep)
              val flowMayExpandAfterConfirmation = currentStep.action in setOf(
                  ClocktowerNightAction.DemonKill,
                  ClocktowerNightAction.MayorRedirect,
              )
              when (
                  val directive = clocktowerNightAdvanceDirective(
                      currentStepIndex = currentStepIndex,
                      currentStepCount = nightSteps.size,
                      flowMayExpandAfterConfirmation = flowMayExpandAfterConfirmation,
                  )
              ) {
                  is ClocktowerNightAdvanceDirective.MoveTo -> {
                      if (directive.stepIndex >= nightSteps.size) {
                          deferredNightAdvanceIndex = directive.stepIndex
                      }
                      nightStepIndex = directive.stepIndex
                  }
                  ClocktowerNightAdvanceDirective.CompleteNight -> onConfirmNight()
              }
          '''
          if old_tail not in text:
              raise SystemExit('advance tail anchor not found')
          text = text.replace(old_tail, new_tail, 1)

          path.write_text(text)
          Path('.github/workflows/apply-dynamic-night-advance-fix.yml').unlink()
      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt .github/workflows/apply-dynamic-night-advance-fix.yml
          git diff --cached --check
          git commit -m "fix: defer night completion until trigger flow refreshes"
          git push origin HEAD:codex/ui-r5-square-table-stabilization
