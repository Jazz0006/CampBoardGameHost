name: R4D3 docs closeout
on:
  push:
    branches: [codex/ui-r4d2-seating-first-setup]
permissions:
  contents: write
jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Guard handoff head
        run: test "$(git rev-parse HEAD)" = "c0e8ffb3965a59b46ba98b76b2bc8e397868f1a4"
      - name: Close F7 and activate R4D-3
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/CURRENT_DEVELOPMENT_ROADMAP.md')
          s = p.read_text()
          replacements = {
          '''live main at roadmap refresh:\nd71ccb45b81c8cd0f7741abe4707f361c8312898''': '''live main at roadmap refresh:\nbf37bbb (re-confirm live before implementation/merge)''',
          '''latest validated executable checkpoint:\nUI-R4D-2F / F6 — high-contrast Host seat/state typography\nbranch: codex/ui-r4d2-seating-first-setup\nF6 product checkpoint: ae3fa44063e6d8ad6457d0b5b06a48f4eccb579a\nF6 validation run: 33704315219\nF6 executable cleanup head: e5109cc95ebb18fdb51a336c24fd4d96e388a0c4\nlater branch heads after that checkpoint may be docs-only; always distinguish them from executable F6 state''': '''latest validated executable checkpoint:\nUI-R4D-2F / F7 — real-device correction closeout\nbranch: codex/ui-r4d2-seating-first-setup\nfinal product checkpoint: 40b604eae7ea489347357f88fd3d07be83ce5a78\nF7.6 field APK validation run: 33722208538\nreal-device acceptance: PASS (user-confirmed 2026-09-03)\nlater #79 heads are CI/docs cleanup only; permanent product files match the checkpoint''',
          '''active development target:\nUI-R4D-2F / F7 — real-device defect correction + closeout after 2026-09-03 field feedback\n\nblocked until R4D-2F is clean:\nUI-R4D-3 — Day Storyteller Workspace''': '''active development target:\nUI-R4D-3.1 — Day Overview migration into the persistent Host table workspace\n\nunblocked by completed R4D-2F:\nUI-R4D-3 — Day Storyteller Workspace''',
          '''UI-R4D-2F F7 real-device defect correction / closeout                   ACTIVE / FIELD DEFECTS CONFIRMED\nUI-R4D-3 day Storyteller workspace                             QUEUED AFTER R4D-2F''': '''UI-R4D-2F F7 real-device defect correction / closeout                   COMPLETE / REAL-DEVICE ACCEPTED\nUI-R4D-3 day Storyteller workspace                             ACTIVE — R4D-3.1 DAY OVERVIEW''',
          '''`docs/NEXT_DEVELOPMENT_HANDOFF_2026-09-03_F7_REAL_DEVICE_CORRECTIONS.md`''': '''`docs/NEXT_DEVELOPMENT_HANDOFF_2026-09-03_UI_R4D3_DAY_WORKSPACE.md`''',
          '''R4D-2 has a **validated structural/authority checkpoint**, but it is **not field-test complete**. Keep Draft PR #79 open and do not advance to R4D-3 yet.''': '''R4D-2F is **field-test complete**. Keep Draft PR #79 open/unmerged as the accepted upstream stack checkpoint; R4D-3 is now unblocked and must stack on #79 rather than on `main`.''',
          '''#### F7 — ACTIVE / REAL-DEVICE DEFECTS CONFIRMED''': '''#### F7 — COMPLETE / REAL-DEVICE ACCEPTED\n\nCloseout evidence: F7.1-F7.5 executable corrections are included in product checkpoint `40b604eae7ea489347357f88fd3d07be83ce5a78`; F7.6 workflow run `33722208538` built the fresh field APK from that checkpoint; the user confirmed the required real-device checks pass on 2026-09-03. The detailed defect/correction notes below are retained as historical implementation context.''',
          '''Only after F7.6 is clean should R4D-3 become active.''': '''F7.6 is clean and real-device accepted. R4D-3 is active; begin with R4D-3.1 Day Overview only.''',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit('missing roadmap anchor: '+old[:80])
              s=s.replace(old,new,1)
          p.write_text(s)

          h=Path('docs/NEXT_DEVELOPMENT_HANDOFF_2026-09-03_F7_REAL_DEVICE_CORRECTIONS.md')
          hs=h.read_text()
          marker='''\n## F7 closeout — 2026-09-03\n\nF7.1-F7.5 are executable and validated. F7.6 workflow run `33722208538` built a fresh debug APK from product checkpoint `40b604eae7ea489347357f88fd3d07be83ce5a78`. The user completed real-device acceptance and reported the F7 checklist passes.\n\nF7 is COMPLETE. R4D-3 is unblocked. Continue from `docs/NEXT_DEVELOPMENT_HANDOFF_2026-09-03_UI_R4D3_DAY_WORKSPACE.md`; do not merge Draft PR #78/#79 without explicit authorization.\n'''
          if '## F7 closeout — 2026-09-03' not in hs:
              h.write_text(hs.rstrip()+marker+'\n')
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/r4d3-doc-closeout.yml
      - name: Audit docs-only diff
        run: |
          git diff --check
          git diff --name-only c0e8ffb3965a59b46ba98b76b2bc8e397868f1a4 | sort > /tmp/actual
          printf '%s\n' docs/CURRENT_DEVELOPMENT_ROADMAP.md docs/NEXT_DEVELOPMENT_HANDOFF_2026-09-03_F7_REAL_DEVICE_CORRECTIONS.md | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
      - name: Commit closeout docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(R4D-3): close F7 and activate Day workspace"
          git push origin HEAD:codex/ui-r4d2-seating-first-setup
