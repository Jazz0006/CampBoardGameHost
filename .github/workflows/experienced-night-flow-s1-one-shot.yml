name: Experienced night flow S1 one-shot

on:
  push:
    branches:
      - codex/experienced-night-flow-correctness
    paths:
      - .github/workflows/experienced-night-flow-s1-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          ref: codex/experienced-night-flow-correctness
          fetch-depth: 0

      - name: Verify bootstrap head and blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/codex/experienced-night-flow-correctness | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerDynamicNightAdvance.kt)" = "6c85b6c20227f5c96737c4948c6b0e99caae5b34"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt)" = "b042a9e6f2e3c4f5c56311ef18fc185640faf46a"
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/ClocktowerDynamicNightAdvanceTest.kt)" = "ff81b60239b0df10f2e13bcc98f582f6f61e89f6"
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/ClocktowerDynamicNightAdvanceWiringTest.kt)" = "f25a0f0ef82e9b9fe6ad19ff755725ca89bf841d"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prove focused RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerDynamicNightAdvanceTest' \
            --rerun-tasks --no-daemon 2>&1 | tee /tmp/red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'dynamic last step cannot expose a cursor outside the current renderable flow' /tmp/red.log

      - name: Apply exact typed ownership patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/experienced_night_flow_s1_patch.py
          git rm app/src/test/java/com/codex/campboardgamehost/ClocktowerDynamicNightAdvanceWiringTest.kt

      - name: Run focused GREEN
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerDynamicNightAdvanceTest' \
            --rerun-tasks --no-daemon

      - name: Run T1 testFast
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testFast --rerun-tasks --no-daemon

      - name: Exact diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'app/src/main/java/com/codex/campboardgamehost/ClocktowerDynamicNightAdvance.kt' \
            'app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt' \
            'app/src/test/java/com/codex/campboardgamehost/ClocktowerDynamicNightAdvanceTest.kt' \
            'app/src/test/java/com/codex/campboardgamehost/ClocktowerDynamicNightAdvanceWiringTest.kt' | sort)"
          test "$actual" = "$expected"
          git diff -- app/src/main/java/com/codex/campboardgamehost/ClocktowerDynamicNightAdvance.kt
          git diff -- app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt
          git diff -- app/src/test/java/com/codex/campboardgamehost/ClocktowerDynamicNightAdvanceTest.kt

      - name: Reconfirm remote head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/experienced-night-flow-correctness | cut -f1)" = "$GITHUB_SHA"

      - name: Commit and push production patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/codex/campboardgamehost/ClocktowerDynamicNightAdvance.kt \
            app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt \
            app/src/test/java/com/codex/campboardgamehost/ClocktowerDynamicNightAdvanceTest.kt \
            app/src/test/java/com/codex/campboardgamehost/ClocktowerDynamicNightAdvanceWiringTest.kt
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            'app/src/main/java/com/codex/campboardgamehost/ClocktowerDynamicNightAdvance.kt' \
            'app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt' \
            'app/src/test/java/com/codex/campboardgamehost/ClocktowerDynamicNightAdvanceTest.kt' \
            'app/src/test/java/com/codex/campboardgamehost/ClocktowerDynamicNightAdvanceWiringTest.kt' | sort)"
          test "$staged" = "$expected"
          git commit -m 'fix: keep dynamic night cursor renderable'
          git push origin HEAD:codex/experienced-night-flow-correctness
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/experienced-night-flow-correctness | cut -f1)" = "$PRODUCT_SHA"
          git rm \
            .github/workflows/experienced-night-flow-s1-one-shot.yml \
            .github/scripts/experienced_night_flow_s1_patch.py
          git commit -m 'chore(ci): remove experienced night flow S1 one-shot'
          git push origin HEAD:codex/experienced-night-flow-correctness
          echo "CLEANUP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report checkpoints
        shell: bash
        run: |
          echo "Product checkpoint: $PRODUCT_SHA"
          echo "Cleanup checkpoint: $CLEANUP_SHA"
