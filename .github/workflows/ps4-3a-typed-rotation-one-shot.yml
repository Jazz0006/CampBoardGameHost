name: PS4.3a typed rotation one-shot

on:
  push:
    branches:
      - codex/persistence-simplification
    paths:
      - .github/workflows/ps4-3a-typed-rotation-one-shot.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: codex/persistence-simplification
          fetch-depth: 0

      - name: Verify bootstrap head and locked blobs
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='37ff058815c0c6b6d2b15123b44e26175a9f27ea'
          EXPECTED_APP_BLOB='ca7c2a2a9b08c7f9a95dde4d97f3b965d9bb9635'
          EXPECTED_TEST_BLOB='5b06477e22355e91eb114662bdb84ea16753e12d'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/codex/persistence-simplification | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" = "$EXPECTED_APP_BLOB"
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/persistence/RecoveryClocktowerRotationOwnershipTest.kt)" = "$EXPECTED_TEST_BLOB"

      - name: Prepatch ownership and reference audit
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'val troubleBrewingSetupRotationRecord: TroubleBrewingSetupRotationRecord? = null' app/src/main/java/com/codex/campboardgamehost/persistence/RecoverySnapshot.kt
          if sed -n '/internal data class LegacyRestoreCompatibility(/,/^)/p' app/src/main/java/com/codex/campboardgamehost/persistence/RecoverySnapshot.kt | grep -Fq 'troubleBrewingSetupRotationRecord'; then
            echo 'LegacyRestoreCompatibility still owns the rotation record' >&2
            exit 1
          fi
          grep -Fq 'game.troubleBrewingSetupRotationRecord?.let' app/src/main/java/com/codex/campboardgamehost/persistence/RecoverySnapshotJsonCodec.kt
          grep -Fq 'troubleBrewingSetupRotationRecord = setupRotationRecord' app/src/main/java/com/codex/campboardgamehost/persistence/RecoverySnapshotStrictDecoder.kt
          test "$(grep -Fc 'plan.snapshot.legacyRestoreCompatibility.troubleBrewingSetupRotationRecord' app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" = '1'
          test "$(grep -Fc 'troubleBrewingSetupRotationRecord = committedTroubleBrewingSetupRotationRecord,' app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" = '1'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply exact large-App patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ps4_3a_typed_rotation_patch.py

      - name: Exact postpatch semantic audit
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -Fc 'plan.snapshot.legacyRestoreCompatibility.troubleBrewingSetupRotationRecord' app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt || true)" = '0'
          test "$(grep -Fc 'troubleBrewingSetupRotationRecord = committedTroubleBrewingSetupRotationRecord,' app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" = '1'
          test "$(grep -Fc 'game.troubleBrewingSetupRotationRecord' app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" = '1'
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = '1'
          test "$(git diff --name-only)" = 'app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt'

      - name: Focused Recovery ownership tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.RecoveryClocktowerRotationOwnershipTest' \
            --tests 'com.codex.campboardgamehost.RecoverySnapshotJsonCodecTest' \
            --tests 'com.codex.campboardgamehost.RecoveryRestorePlannerTest' \
            --tests 'com.codex.campboardgamehost.RecoveryPreviewLoaderTest' \
            --tests 'com.codex.campboardgamehost.RecoveryApplicationCoordinatorTest' \
            --rerun-tasks --no-daemon

      - name: Compile app
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:compileDebugKotlin --rerun-tasks --no-daemon

      - name: Fast suite
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testFast --rerun-tasks --no-daemon

      - name: Final diff and remote race audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = '1'
          test "$(git diff --name-only)" = 'app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt'
          test "$(git ls-remote origin refs/heads/codex/persistence-simplification | cut -f1)" = "$GITHUB_SHA"

      - name: Commit and push App wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          git commit -m 'refactor: wire typed TB rotation recovery in App'
          git push origin HEAD:codex/persistence-simplification

      - name: Self-remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_HEAD="$(git rev-parse HEAD)"
          test "$(git ls-remote origin refs/heads/codex/persistence-simplification | cut -f1)" = "$PRODUCT_HEAD"
          git rm .github/scripts/ps4_3a_typed_rotation_patch.py .github/workflows/ps4-3a-typed-rotation-one-shot.yml
          git commit -m 'chore: remove PS4.3a one-shot tooling'
          git push origin HEAD:codex/persistence-simplification
