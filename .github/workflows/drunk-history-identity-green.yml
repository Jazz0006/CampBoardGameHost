name: Drunk history identity GREEN proof

on:
  push:
    branches:
      - codex/drunk-shown-identity-ownership-cleanup
    paths:
      - .github/workflows/drunk-history-identity-green.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: codex/drunk-shown-identity-ownership-cleanup
          fetch-depth: 0

      - name: Verify GREEN checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "8f6450c9e8e6fb9cced9fdd04a31dcd86145d918"
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/clocktower/history/HistoryCooldownTest.kt)" = "6346fd0e0c823ecea31d5dac32eae8b01a67f2d6"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/clocktower/history/HistoricalClueSignature.kt)" = "fe8f77bc86b3fec2ce2b6be336c12235618bba6a"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/clocktower/history/HistoryCooldown.kt)" = "b924a59588fa32489970f5e860047ae7e15bb6b5"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run focused history and ownership GREEN
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.clocktower.history.HistoryCooldownTest' \
            --tests 'com.codex.campboardgamehost.clocktower.recommendation.SetupRecommendationLockPolicyTest' \
            --tests 'com.codex.campboardgamehost.clocktower.recommendation.setup.SetupRecommendationShownIdentityOwnershipTest' \
            --rerun-tasks --no-daemon

      - name: Audit history ownership
        shell: bash
        run: |
          set -euo pipefail
          git diff --check 9cd72cba22737d1d803f8a30d25c2a5c25570211..HEAD
          ! grep -F 'drunkShownRole?.value' app/src/main/java/com/codex/campboardgamehost/clocktower/history/HistoricalClueSignature.kt
          ! grep -F 'informationObservation?.perceivedRole ?: plan.effectSignature.drunkShownRole' app/src/main/java/com/codex/campboardgamehost/clocktower/history/HistoricalClueSignature.kt
          ! grep -F 'candidate.drunkShownRole' app/src/main/java/com/codex/campboardgamehost/clocktower/history/HistoryCooldown.kt

      - name: Reconfirm remote head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/drunk-shown-identity-ownership-cleanup | cut -f1)" = "$GITHUB_SHA"

      - name: Remove temporary RED and GREEN workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/drunk-history-identity-red.yml .github/workflows/drunk-history-identity-green.yml
          git commit -m 'chore(ci): remove Drunk history proof workflows'
          git push origin HEAD:codex/drunk-shown-identity-ownership-cleanup
