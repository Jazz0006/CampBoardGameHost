name: D6 post-D6.1 residual root audit

on:
  push:
    branches:
      - codex/d6-root-reaudit
    paths:
      - .github/workflows/d6_post_d6_1_residual_root_audit.yml

permissions:
  contents: write

jobs:
  audit-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: codex/d6-root-reaudit
          fetch-depth: 0

      - name: Verify audit baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE='30adff1ecb195123c7096757c1454c4a4a61ccca'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE"..HEAD)" = '.github/workflows/d6_post_d6_1_residual_root_audit.yml'

      - name: Residual root responsibility inventory
        shell: bash
        run: |
          set -euo pipefail
          APP='app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt'
          HOST='app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt'
          echo '=== file sizes ==='
          wc -lc "$APP" "$HOST"
          echo '=== largest Kotlin production files ==='
          find app/src/main/java -type f -name '*.kt' -printf '%s %p\n' | sort -nr | sed -n '1,20p'
          echo '=== root local function families ==='
          grep -nE '^    fun (clocktower|currentClocktower|buildClocktower|applyClocktower|restoreClocktower|materializeClocktower|recordClocktower|resetClocktower|setClocktower|clearClocktower|advanceClocktower|publishClocktower|requireClocktower)' "$APP" || true
          echo '=== revision calls ==='
          grep -n 'advanceClocktowerGameStateRevision()' "$APP" || true
          echo '=== Recovery references in App root ==='
          grep -nE 'Recovery|recovery' "$APP" | head -120 || true
          echo '=== cards.toClocktowerGameState by production file ==='
          git grep -l 'toClocktowerGameState' -- app/src/main | while read -r f; do printf '%4d %s\n' "$(grep -c 'toClocktowerGameState' "$f")" "$f"; done | sort -nr
          echo '=== Clocktower screen definitions ==='
          git grep -nE 'fun Clocktower(Judge|Host|Night|Day|History)Screen' -- app/src/main || true
          python3 - <<'PY'
          from pathlib import Path
          import re
          app = Path('app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt').read_text()
          host = Path('app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt').read_text()

          def balanced(text, needle):
              start = text.find(needle)
              if start < 0:
                  return None
              p = text.find('(', start)
              if p < 0:
                  return None
              depth = 0
              in_str = False
              esc = False
              for i in range(p, len(text)):
                  c = text[i]
                  if in_str:
                      if esc:
                          esc = False
                      elif c == '\\':
                          esc = True
                      elif c == '"':
                          in_str = False
                      continue
                  if c == '"':
                      in_str = True
                  elif c == '(':
                      depth += 1
                  elif c == ')':
                      depth -= 1
                      if depth == 0:
                          return text[start:i+1]
              return None

          call = balanced(app, 'ClocktowerJudgeScreen')
          if call:
              callbacks = re.findall(r'(?m)^\s*(on[A-Z][A-Za-z0-9_]*)\s*=', call)
              named = re.findall(r'(?m)^\s*([a-zA-Z][A-Za-z0-9_]*)\s*=', call)
              print('=== ClocktowerJudgeScreen App call fanout ===')
              print('call_chars', len(call))
              print('named_args', len(named))
              print('callbacks', len(callbacks))
              print('callback_names')
              for n in callbacks:
                  print(' ', n)
          else:
              print('ClocktowerJudgeScreen call not found')

          definition = balanced(host, 'fun ClocktowerJudgeScreen')
          if definition:
              params = re.findall(r'(?m)^\s*([a-zA-Z][A-Za-z0-9_]*)\s*:', definition)
              callbacks = [p for p in params if p.startswith('on')]
              print('=== ClocktowerJudgeScreen definition fanout ===')
              print('definition_chars', len(definition))
              print('params', len(params))
              print('callback_params', len(callbacks))
          else:
              print('ClocktowerJudgeScreen definition not found in ClocktowerHostScreen.kt')

          # Approximate mutable Clocktower root surface: declarations in the App function body.
          root_vars = re.findall(r'(?m)^    var (clocktower[A-Za-z0-9_]+)', app)
          print('=== App-root Clocktower var declarations ===')
          print('count', len(root_vars))
          for n in root_vars:
              print(' ', n)
          PY
          echo '=== production diff from main ==='
          git fetch origin main:refs/remotes/origin/main
          git diff --name-only origin/main...HEAD -- app/src/main | sort

      - name: Remove audit tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/d6_post_d6_1_residual_root_audit.yml
          git commit -m 'chore: remove post-D6.1 residual root audit tooling'
          git push origin HEAD:codex/d6-root-reaudit
