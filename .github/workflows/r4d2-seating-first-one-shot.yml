name: R4D2 Seating First One Shot

on:
  push:
    branches:
      - codex/ui-r4d2-seating-first-setup

permissions:
  contents: write

jobs:
  patch-validate-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Lock branch and source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote origin refs/heads/codex/ui-r4d2-seating-first-setup | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" = "708670903fe02543a91657c8a6f47c8fb9eacf1b"
          test "$(git hash-object .github/scripts/r4d2_seating_first_patch.py)" = "9d43b85e0119fa75e3c0fa7ad96248dcacd751e2"

      - name: Confirm seating roster contract was RED before production foundation
        shell: bash
        run: |
          set -euo pipefail
          green_head="$GITHUB_SHA"
          git checkout 825c9f469c4060b6d1608a7e675ebb039d68601a
          set +e
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.HostSeatingRosterTest' \
            --rerun-tasks --no-daemon 2>&1 | tee "$RUNNER_TEMP/r4d2-red.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -Eq 'confirmHostSeating|HostSeatAssignment|ConfirmedHostSeating' "$RUNNER_TEMP/r4d2-red.log"
          git checkout "$green_head"

      - name: Validate small R4D2 foundation before router patch
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.HostSeatingRosterTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerHostTableContractTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerHostTableGameStateProjectionTest' \
            --rerun-tasks --no-daemon

      - name: Apply exact-anchor App router patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/r4d2_seating_first_patch.py
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" != "708670903fe02543a91657c8a6f47c8fb9eacf1b"
          changed="$(git diff --name-only)"
          test "$changed" = "app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt"

      - name: Run focused seating-first behavior tests
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.HostSeatingRosterTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerHostTableContractTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerHostTableGameStateProjectionTest' \
            --rerun-tasks --no-daemon

      - name: Run Android FAST unit tests
        run: ./gradlew :app:testFast --no-daemon --build-cache

      - name: Exact diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt"

      - name: Commit product patch and self-remove temporary writer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          git rm .github/workflows/r4d2-seating-first-one-shot.yml
          git rm .github/scripts/r4d2_seating_first_patch.py
          git commit -m "feat: wire seating-first setup flow"
          git push origin HEAD:codex/ui-r4d2-seating-first-setup
