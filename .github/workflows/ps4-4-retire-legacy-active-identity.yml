name: PS4.4 retire legacy active identity

on:
  push:
    branches:
      - codex/persistence-simplification
    paths:
      - .github/workflows/ps4-4-retire-legacy-active-identity.yml

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout locked branch
        uses: actions/checkout@v4
        with:
          ref: codex/persistence-simplification
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify deletion preconditions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '769c14aa2a36ee7d21020458f88c1e3be025c988'
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/persistence/ActiveGamePersistenceCoordinator.kt)" = '41f56040746259a99ae7da06878c22f32285de76'
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/persistence/ActiveGameIdentityEnvelope.kt)" = 'a23e6bec2acc68ce1d7659c1e306b6d5f4592cd8'
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/persistence/PersistedGameIdentity.kt)" = 'ce26177dc87c1faa8d3492bf5cf6ae6089c73e4d'
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/clocktower/persistence/ClocktowerPersistenceIdentityFactory.kt)" = 'b58646dbe27a903e87f628e650dd7281862d9c95'
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/werewolf/WerewolfPersistenceIdentityFactory.kt)" = '1420f722899cd0459dd81f58030376d9ecd3f2b7'
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/persistence/ActiveGamePersistenceCoordinatorTest.kt)" = '0bfd3694d6c66446a5ae379853cbce0042e7e407'
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/persistence/ActiveGameIdentityEnvelopeTest.kt)" = '234d7634ca2600f3b4ce7c187a3b12f083af1479'
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/persistence/PersistedGameIdentityTest.kt)" = '81d27848ee1ed04e2baacb3a3b7982294957dc67'

      - name: Prove legacy symbols are isolated to deletion set
        shell: bash
        run: |
          set -euo pipefail
          PATTERN='ActiveGamePersistenceInputs|ActiveGamePersistenceResolution|ActiveGamePersistenceCoordinator|PersistedActiveGameIdentityEnvelope|PersistedActiveGameIdentityJsonCodec|PersistedGameContentIdentity|PersistedVariantKind|PersistedGameCompatibility|PersistedWerewolfGameIdentity|PersistedGameContentIdentityJsonCodec|PersistedWerewolfGameIdentityJsonCodec|ClocktowerPersistenceIdentityFactory|WerewolfPersistenceIdentityFactory'
          git grep -nE "$PATTERN" -- app/src/main app/src/test | tee /tmp/legacy_active_identity_refs.txt || true
          python3 - <<'PY'
          from pathlib import Path
          expected = {
              'app/src/main/java/com/codex/campboardgamehost/persistence/ActiveGamePersistenceCoordinator.kt',
              'app/src/main/java/com/codex/campboardgamehost/persistence/ActiveGameIdentityEnvelope.kt',
              'app/src/main/java/com/codex/campboardgamehost/persistence/PersistedGameIdentity.kt',
              'app/src/main/java/com/codex/campboardgamehost/clocktower/persistence/ClocktowerPersistenceIdentityFactory.kt',
              'app/src/main/java/com/codex/campboardgamehost/werewolf/WerewolfPersistenceIdentityFactory.kt',
              'app/src/test/java/com/codex/campboardgamehost/persistence/ActiveGamePersistenceCoordinatorTest.kt',
              'app/src/test/java/com/codex/campboardgamehost/persistence/ActiveGameIdentityEnvelopeTest.kt',
              'app/src/test/java/com/codex/campboardgamehost/persistence/PersistedGameIdentityTest.kt',
          }
          lines = Path('/tmp/legacy_active_identity_refs.txt').read_text(encoding='utf-8').splitlines()
          actual = {line.split(':', 1)[0] for line in lines if ':' in line}
          if actual != expected:
              missing = sorted(expected - actual)
              unexpected = sorted(actual - expected)
              raise SystemExit(
                  'Legacy deletion set mismatch.\nMissing expected:\n' + '\n'.join(missing) +
                  '\nUnexpected consumers:\n' + '\n'.join(unexpected)
              )
          print('Legacy active identity references are fully isolated to the deletion set.')
          PY

      - name: Delete retired schema and dedicated tests
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            app/src/main/java/com/codex/campboardgamehost/persistence/ActiveGamePersistenceCoordinator.kt \
            app/src/main/java/com/codex/campboardgamehost/persistence/ActiveGameIdentityEnvelope.kt \
            app/src/main/java/com/codex/campboardgamehost/persistence/PersistedGameIdentity.kt \
            app/src/main/java/com/codex/campboardgamehost/clocktower/persistence/ClocktowerPersistenceIdentityFactory.kt \
            app/src/main/java/com/codex/campboardgamehost/werewolf/WerewolfPersistenceIdentityFactory.kt \
            app/src/test/java/com/codex/campboardgamehost/persistence/ActiveGamePersistenceCoordinatorTest.kt \
            app/src/test/java/com/codex/campboardgamehost/persistence/ActiveGameIdentityEnvelopeTest.kt \
            app/src/test/java/com/codex/campboardgamehost/persistence/PersistedGameIdentityTest.kt
          PATTERN='ActiveGamePersistenceInputs|ActiveGamePersistenceResolution|ActiveGamePersistenceCoordinator|PersistedActiveGameIdentityEnvelope|PersistedActiveGameIdentityJsonCodec|PersistedGameContentIdentity|PersistedVariantKind|PersistedGameCompatibility|PersistedWerewolfGameIdentity|PersistedGameContentIdentityJsonCodec|PersistedWerewolfGameIdentityJsonCodec|ClocktowerPersistenceIdentityFactory|WerewolfPersistenceIdentityFactory'
          if git grep -nE "$PATTERN" -- app/src/main app/src/test; then
            echo 'Legacy active identity symbols remain after deletion.' >&2
            exit 1
          fi
          git diff --check

      - name: Compile all tests through focused validator target
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests 'com.codex.campboardgamehost.ActiveGameSaveInvariantValidatorTest'

      - name: Run FAST regression suite
        run: ./gradlew testFast

      - name: Commit retirement and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ps4-4-retire-legacy-active-identity.yml
          git diff --cached --check
          git commit -m 'refactor: retire legacy active-game identity schema'
          git push origin HEAD:codex/persistence-simplification
