name: R4D2 F4 Roadmap Closeout

on:
  push:
    branches:
      - codex/ui-r4d2-seating-first-setup
    paths:
      - .github/workflows/r4d2-f4-closeout-roadmap.yml

permissions:
  contents: write

jobs:
  patch-cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Guard exact closeout head
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "codex/ui-r4d2-seating-first-setup"
          test "$(git rev-parse HEAD^)" = "9221c4a415472ad9ee6bcf22881270bba478eedc"
          test "$(git rev-parse 9221c4a415472ad9ee6bcf22881270bba478eedc^)" = "c5a6c3a2687e6cf2ba52c19d355ecd36a7da8984"

      - name: Apply exact roadmap closeout
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/r4d2_f4_closeout_roadmap.py

      - name: Audit roadmap-only diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "docs/CURRENT_DEVELOPMENT_ROADMAP.md"
          git diff --check
          grep -F "UI-R4D-2F / F5 — dedicated typed pair Player Reveal / readable seat-number hierarchy" docs/CURRENT_DEVELOPMENT_ROADMAP.md
          grep -F "UI-R4D-2F F4 Manual pair resolved-display transition                COMPLETE / VERIFIED" docs/CURRENT_DEVELOPMENT_ROADMAP.md
          grep -F "F4 executable cleanup head: c5a6c3a2687e6cf2ba52c19d355ecd36a7da8984" docs/CURRENT_DEVELOPMENT_ROADMAP.md
          grep -F "final one-shot run `33700851236`" docs/CURRENT_DEVELOPMENT_ROADMAP.md

      - name: Commit roadmap and self-cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/CURRENT_DEVELOPMENT_ROADMAP.md
          git commit -m "docs: close R4D2 F4 and activate F5"
          echo "Roadmap checkpoint: $(git rev-parse HEAD)"

          git rm \
            .github/workflows/r4d2-f4-closeout-roadmap.yml \
            tools/r4d2_f4_closeout_roadmap.py
          git commit -m "build: remove temporary F4 roadmap closeout"
          echo "Cleanup head: $(git rev-parse HEAD)"

          git push origin HEAD:codex/ui-r4d2-seating-first-setup
