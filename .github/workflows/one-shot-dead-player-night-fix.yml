name: One-shot night death and ghost vote fix

on:
  push:
    branches:
      - codex/dead-player-square-table
    paths:
      - .github/workflows/one-shot-dead-player-night-fix.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-dead-player-night-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v6
        with:
          ref: codex/dead-player-square-table
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Apply exact-anchor patch
        run: python scripts/patch_dead_player_night_ghost_vote.py

      - name: Audit production and test diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          printf 'Changed working-tree paths:\n%s\n' "${changed[*]}"
          expected=(
            app/src/main/java/com/codex/campboardgamehost/ClocktowerChefSquareTableUi.kt
            app/src/main/java/com/codex/campboardgamehost/ClocktowerDayOverviewTableState.kt
            app/src/main/java/com/codex/campboardgamehost/ClocktowerEmpathSquareTableUi.kt
            app/src/main/java/com/codex/campboardgamehost/ClocktowerFortuneTellerSquareTableUi.kt
            app/src/main/java/com/codex/campboardgamehost/ClocktowerGhostVotePresentation.kt
            app/src/main/java/com/codex/campboardgamehost/ClocktowerHostSeatContentPresentation.kt
            app/src/main/java/com/codex/campboardgamehost/ClocktowerHostTableContract.kt
            app/src/main/java/com/codex/campboardgamehost/ClocktowerHostTableUi.kt
            app/src/main/java/com/codex/campboardgamehost/ClocktowerNightActionSquareTableUi.kt
            app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
            app/src/main/java/com/codex/campboardgamehost/ClocktowerPairManualSelectionUi.kt
            app/src/main/java/com/codex/campboardgamehost/ClocktowerSquareTableUi.kt
            app/src/main/java/com/codex/campboardgamehost/ClocktowerUndertakerSquareTableUi.kt
            app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt
            app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerVoteTableUi.kt
            app/src/test/java/com/codex/campboardgamehost/ClocktowerGhostVotePresentationTest.kt
            app/src/test/java/com/codex/campboardgamehost/ClocktowerPairManualSeatPresentationTest.kt
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          [[ ${#changed[@]} -eq ${#expected_sorted[@]} ]]
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Run focused presentation tests
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerGhostVotePresentationTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerPairManualSeatPresentationTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerSquareTableLifeMarkersTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerHostSeatContentPresentationTest' \
            --no-daemon --build-cache

      - name: Run Android FAST tests
        run: ./gradlew :app:testFast --no-daemon --build-cache

      - name: Commit product patch and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main app/src/test
          git rm \
            .github/workflows/one-shot-dead-player-night-audit.yml \
            .github/workflows/one-shot-dead-player-night-fix.yml \
            scripts/patch_dead_player_night_ghost_vote.py \
            tmp/night-seat-audit.txt
          git diff --cached --check
          git commit -m 'fix: unify dead and ghost vote night presentation'
          git push origin HEAD:codex/dead-player-square-table
