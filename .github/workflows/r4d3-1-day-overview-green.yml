name: R4D3.1 Day overview GREEN
on:
  push:
    branches: [codex/ui-r4d3-day-storyteller-workspace]
permissions:
  contents: write
jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - name: Guard R4D3.1 baseline
        run: |
          git merge-base --is-ancestor 87c1e2aded8a32468eba695457633fe7edf902c2 HEAD
          test -f .github/r4d3_1_apply.py
      - name: Apply exact Day overview migration
        run: python .github/r4d3_1_apply.py
      - name: Focused Day and Host-table contracts
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests com.codex.campboardgamehost.ClocktowerDayOverviewTableStateTest \
            --tests com.codex.campboardgamehost.ClocktowerHostTableGameStateProjectionTest \
            --tests com.codex.campboardgamehost.ClocktowerHostTableLayoutTest \
            --tests com.codex.campboardgamehost.ClocktowerRoundedRectanglePerimeterLayoutTest \
            --tests com.codex.campboardgamehost.ClocktowerSquareTableSeatLayoutTest \
            --no-daemon --build-cache
      - name: Fast regression suite
        run: ./gradlew :app:testFast --no-daemon --build-cache
      - name: Remove temporary migration tooling
        run: rm .github/r4d3_1_apply.py .github/workflows/r4d3-1-day-overview-green.yml
      - name: Exact permanent diff audit
        run: |
          git add -N \
            app/src/main/java/com/codex/campboardgamehost/ClocktowerDayOverviewTableState.kt \
            app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerDayOverviewTableUi.kt
          git diff --check 6dc5e5b5ee9433b156aed14ac24d021bfe947138
          git diff --name-only 6dc5e5b5ee9433b156aed14ac24d021bfe947138 | sort > /tmp/actual
          printf '%s\n' \
            app/src/main/java/com/codex/campboardgamehost/ClocktowerDayOverviewTableState.kt \
            app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerDayOverviewTableUi.kt \
            app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerDayScreen.kt \
            app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt \
            app/src/test/java/com/codex/campboardgamehost/ClocktowerDayOverviewTableStateTest.kt | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          test "$(wc -c < app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerDayScreen.kt)" -lt 63135
      - name: Commit product checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(R4D-3.1): move Day overview into persistent table"
          git push origin HEAD:codex/ui-r4d3-day-storyteller-workspace
