name: Update R4D2 field-test roadmap

on:
  push:
    branches:
      - codex/ui-r4d2-seating-first-setup

permissions:
  contents: write

jobs:
  update-roadmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Lock exact inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c215f835edb9baac3bee4610c6f597c00f26247d"
          test "$(git hash-object .github/scripts/update_r4d2_field_test_roadmap.py)" = "d7d734f905f8fa2549ab5c8b2bef62a215cc1bd1"
          test "$(git hash-object docs/CURRENT_DEVELOPMENT_ROADMAP.md)" = "bccfb8a1fdca0ccece1f7bc49400cb2d9cc02c8c"

      - name: Apply exact-anchor roadmap update
        run: python3 .github/scripts/update_r4d2_field_test_roadmap.py

      - name: Audit roadmap update
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "docs/CURRENT_DEVELOPMENT_ROADMAP.md"
          grep -Fq "UI-R4D-2F — Real-Device Field-Test Corrections / Seating Workspace Closeout" docs/CURRENT_DEVELOPMENT_ROADMAP.md
          grep -Fq "F1  constraint/capacity-aware HostTableLayout + behavior tests" docs/CURRENT_DEVELOPMENT_ROADMAP.md
          grep -Fq "Manual pair resolved-display RED -> GREEN" docs/CURRENT_DEVELOPMENT_ROADMAP.md
          grep -Fq "Do **not** start R4D-3" docs/CURRENT_DEVELOPMENT_ROADMAP.md

      - name: Commit roadmap and self-remove writer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_DEVELOPMENT_ROADMAP.md
          git rm .github/scripts/update_r4d2_field_test_roadmap.py
          git rm .github/workflows/update-r4d2-field-test-roadmap.yml
          git commit -m "docs: record R4D2 field-test correction gate"
          git push origin HEAD:codex/ui-r4d2-seating-first-setup
