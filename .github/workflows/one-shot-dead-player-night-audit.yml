name: One-shot night seat life audit

on:
  push:
    branches:
      - codex/dead-player-square-table
    paths:
      - .github/workflows/one-shot-dead-player-night-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/dead-player-square-table
          fetch-depth: 0

      - name: Locate night seat and ghost-vote ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('app/src/main/java/com/codex/campboardgamehost')
          files = sorted(root.rglob('*.kt'))

          def emit(title, pattern, context=6, max_matches=120):
              rx = re.compile(pattern, re.I)
              print(f'=== {title} ===')
              count = 0
              for path in files:
                  lines = path.read_text(encoding='utf-8').splitlines()
                  for idx, line in enumerate(lines):
                      if not rx.search(line):
                          continue
                      count += 1
                      if count > max_matches:
                          print(f'... truncated after {max_matches} matches')
                          return
                      print(f'--- {path}:{idx + 1} ---')
                      lo = max(0, idx - context)
                      hi = min(len(lines), idx + context + 1)
                      for j in range(lo, hi):
                          print(f'{j + 1:05d}: {lines[j]}')
              print(f'=== matches: {count} ===')

          emit('direct square-table model construction', r'ClocktowerSquareTableSeatUiModel\(', 10, 80)
          emit('HostTableShell calls', r'HostTableShell\(', 8, 100)
          emit('ghost vote authority', r'ghostVoteAuthority|ClocktowerGhostVoteAuthority|spentSeatIds', 10, 100)
          emit('night life/dead eligibility', r'eliminatedRound|isAlive|dead|死亡|阵亡|淘汰|Poisoner|投毒者|Imp|小恶魔', 8, 180)
          PY
