name: One-shot night seat life audit

on:
  push:
    branches:
      - codex/dead-player-square-table
    paths:
      - .github/workflows/one-shot-dead-player-night-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/dead-player-square-table
          fetch-depth: 0

      - name: Persist final wiring report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          python - <<'PY' > tmp/night-seat-audit.txt
          from pathlib import Path
          import re

          root = Path('app/src/main/java/com/codex/campboardgamehost')
          files = sorted(root.rglob('*.kt'))
          patterns = [
              re.compile(r'ClocktowerNightStepCardLocalized\('),
              re.compile(r'ClocktowerDayOverviewScreen\('),
              re.compile(r'ClocktowerVoteTableScreen\('),
              re.compile(r'clocktowerDayOverviewTableState\('),
              re.compile(r'ClocktowerPendingNominationTableScreen\('),
              re.compile(r'ClocktowerSlayerTableScreen\('),
              re.compile(r'ClocktowerArtistTableScreen\('),
              re.compile(r'ClocktowerKlutzTableScreen\('),
          ]
          for path in files:
              lines = path.read_text(encoding='utf-8').splitlines()
              hits = []
              for idx, line in enumerate(lines):
                  if any(p.search(line) for p in patterns):
                      hits.append(idx)
              if not hits:
                  continue
              print(f'## {path}')
              for idx in hits:
                  print(f'### line {idx + 1}')
                  lo = max(0, idx - 14)
                  hi = min(len(lines), idx + 24)
                  for j in range(lo, hi):
                      print(f'{j + 1:05d}: {lines[j]}')
                  print()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/night-seat-audit.txt
          git commit -m 'chore: capture ghost vote presentation wiring'
          git push origin HEAD:codex/dead-player-square-table
