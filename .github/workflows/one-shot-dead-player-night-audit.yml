name: One-shot night seat life audit

on:
  push:
    branches:
      - codex/dead-player-square-table
    paths:
      - .github/workflows/one-shot-dead-player-night-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/dead-player-square-table
          fetch-depth: 0

      - name: Persist focused ownership report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          python - <<'PY' > tmp/night-seat-audit.txt
          from pathlib import Path
          import re

          root = Path('app/src/main/java/com/codex/campboardgamehost')
          files = sorted(root.rglob('*.kt'))
          patterns = [
              re.compile(r'data class HostSeatPresentation'),
              re.compile(r'toStorytellerHostSeatPresentation'),
              re.compile(r'HostSeatPresentation\('),
              re.compile(r'ghostVoteAuthority'),
          ]
          for path in files:
              lines = path.read_text(encoding='utf-8').splitlines()
              hit_indices = sorted({
                  idx
                  for idx, line in enumerate(lines)
                  for pattern in patterns
                  if pattern.search(line)
              })
              if not hit_indices:
                  continue
              print(f'## {path}')
              for idx in hit_indices:
                  print(f'### line {idx + 1}')
                  lo = max(0, idx - 8)
                  hi = min(len(lines), idx + 9)
                  for j in range(lo, hi):
                      print(f'{j + 1:05d}: {lines[j]}')
                  print()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/night-seat-audit.txt
          git commit -m 'chore: refresh night seat audit report'
          git push origin HEAD:codex/dead-player-square-table
