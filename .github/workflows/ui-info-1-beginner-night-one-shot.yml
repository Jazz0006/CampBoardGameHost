name: UI-INFO-1 beginner night one-shot

on:
  push:
    branches:
      - codex/ui-info-1-beginner-night-guidance
    paths:
      - .github/workflows/ui-info-1-beginner-night-one-shot.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: codex/ui-info-1-beginner-night-guidance
          fetch-depth: 0

      - name: Lock branch and source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/codex/ui-info-1-beginner-night-guidance | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt)" = "3d9dbe18272318ef4fcbe5c14e48fad067805efd"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerNightActionSquareTableUi.kt)" = "c4b940d6ea4c39e3eaf5e09c9724d7ef936ffb12"

      - name: Focused presentation contract before wiring
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest --tests 'com.codex.campboardgamehost.ClocktowerBeginnerNightGuidanceTest' --no-daemon

      - name: Apply exact production patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ui_info_1_beginner_night_patch.py

      - name: Focused presentation contract after wiring
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest --tests 'com.codex.campboardgamehost.ClocktowerBeginnerNightGuidanceTest' --rerun-tasks --no-daemon

      - name: FAST checkpoint
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testFast --no-daemon

      - name: Exact diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "app/src/main/java/com/codex/campboardgamehost/ClocktowerNightActionSquareTableUi.kt"
          test "${changed[1]}" = "app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt"

      - name: Commit production patch and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/ui_info_1_beginner_night_patch.py
          git rm .github/workflows/ui-info-1-beginner-night-one-shot.yml
          git add app/src/main/java/com/codex/campboardgamehost/ClocktowerNightActionSquareTableUi.kt
          git add app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          git commit -m "feat: apply beginner night guidance hierarchy"
          git push origin HEAD:codex/ui-info-1-beginner-night-guidance
