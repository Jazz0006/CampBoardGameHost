name: UX-MODE-1 Beginner ready one-shot

on:
  push:
    branches:
      - codex/ux-mode-1
    paths:
      - .github/workflows/ux-mode-1-beginner-ready-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: codex/ux-mode-1
          fetch-depth: 0

      - name: Verify bootstrap head and locked blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "11f8c5b623338cb57902b4feb41d39ddd17839a9"
          test "$(git ls-remote origin refs/heads/codex/ux-mode-1 | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUi.kt)" = "145096d0521dbfc35a8901439063214f6a780116"
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUiModeContractTest.kt)" = "ee633d32a80cd9eda17542d4adc5326ce335d844"
          test "$(git hash-object .github/scripts/ux_mode_1_beginner_ready_patch.py)" = "c1d066e59713fc7b01c5c8d11d57f0efbd1033c5"
          test -z "$(git status --porcelain)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prove focused RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerStorytellerRecommendationUiModeContractTest' \
            --rerun-tasks --no-daemon 2>&1 | tee /tmp/beginner-ready-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'beginner hides setup recommendation only after automatic recommendation is applied' /tmp/beginner-ready-red.log
          grep -F 'FAILED' /tmp/beginner-ready-red.log

      - name: Apply exact production patch
        run: python3 .github/scripts/ux_mode_1_beginner_ready_patch.py

      - name: Run focused GREEN
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerStorytellerRecommendationUiModeContractTest' \
            --rerun-tasks --no-daemon

      - name: Run FAST checkpoint
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testFast --rerun-tasks --no-daemon

      - name: Exact diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "app/src/main/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUi.kt"
          read -r added deleted path < <(git diff --numstat -- app/src/main/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUi.kt)
          test "$added" = "2"
          test "$deleted" = "0"
          test "$path" = "app/src/main/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUi.kt"
          test "$(grep -Fc 'if (automaticStorytellerInfo && appliedStyle == selectedStyle) return' app/src/main/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUi.kt)" -eq 1
          grep -F 'RecommendationUiState.Loading' app/src/main/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUi.kt
          grep -F 'RecommendationUiState.Empty' app/src/main/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUi.kt
          grep -F 'is RecommendationUiState.InvalidLocks' app/src/main/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUi.kt
          grep -F 'is RecommendationUiState.Error' app/src/main/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUi.kt
          git diff -- app/src/main/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUi.kt

      - name: Reconfirm remote head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/ux-mode-1 | cut -f1)" = "$GITHUB_SHA"

      - name: Commit and push product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUi.kt
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -eq 1
          test "${staged[0]}" = "app/src/main/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUi.kt"
          git commit -m 'fix: hide applied Beginner setup recommendation card'
          git push origin HEAD:codex/ux-mode-1
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/ux-mode-1 | cut -f1)" = "$(git rev-parse HEAD)"
          git rm .github/workflows/ux-mode-1-beginner-ready-one-shot.yml .github/scripts/ux_mode_1_beginner_ready_patch.py
          git commit -m 'chore(ci): remove Beginner ready one-shot scaffolding'
          git push origin HEAD:codex/ux-mode-1
          echo "CLEANUP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report checkpoints
        run: |
          echo "Product checkpoint: $PRODUCT_SHA"
          echo "Cleanup checkpoint: $CLEANUP_SHA"
