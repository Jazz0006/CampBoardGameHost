name: UI-NAV-1E identity reveal one-shot

on:
  push:
    branches:
      - codex/ui-nav-1-global-navigation-visual-unification
    paths:
      - .github/workflows/ui-nav-1e-identity-reveal-one-shot.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact production baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/AppDealScreens.kt)" = "531517f7857158a027f2600babf38f28823d3207"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" = "646e9a480d77441f35efdceafaa419141d63d36e"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt)" = "e561320c45e4e6161a41fe3d59205291035aebb2"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUi.kt)" = "75e4a3233aee16118c32f9cc4dae3dc63a298567"

      - name: Apply patch and privacy audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/scripts/ui-nav-1e-identity-reveal-patch.py').read_text()
          source = source.replace('from textwrap import dedent', 'from textwrap import dedent, indent', 1)

          def preserve_nested_indent(text: str, label: str) -> str:
              label_pos = text.index(f'"{label}"')
              start = text.rfind('deal = replace_once(', 0, label_pos)
              block = text[start:label_pos]
              output = []
              inside = False
              converted = 0
              for line in block.splitlines(keepends=True):
                  plain = line.rstrip('\n')
                  newline = '\n' if line.endswith('\n') else ''
                  if plain == '    dedent(':
                      output.append('    indent(dedent(' + newline)
                      inside = True
                  elif inside and plain == '    ),':
                      output.append('    ), "        "),' + newline)
                      inside = False
                      converted += 1
                  else:
                      output.append(line)
              assert converted == 2, (label, converted)
              return text[:start] + ''.join(output) + text[label_pos:]

          source = preserve_nested_indent(source, 'Clocktower controller call')
          source = preserve_nested_indent(source, 'Clocktower player reveal call')
          Path('/tmp/ui-nav-1e-patch.py').write_text(source)
          PY
          python -m py_compile /tmp/ui-nav-1e-patch.py
          python /tmp/ui-nav-1e-patch.py
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            app/src/main/java/com/codex/campboardgamehost/AppDealScreens.kt \
            app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt \
            app/src/main/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUi.kt \
            app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt | sort)"
          test "$actual" = "$expected"
          echo 'UI-NAV-1E exact four-file diff PASS'

      - name: Run Android validation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testFast --no-daemon
          ./gradlew :app:assembleDebug --no-daemon

      - name: Commit and push production checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/codex/campboardgamehost/AppDealScreens.kt \
            app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt \
            app/src/main/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUi.kt \
            app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt
          git commit -m 'ui: migrate identity reveal to Storyteller square table'
          git fetch origin codex/ui-nav-1-global-navigation-visual-unification
          test "$(git rev-parse origin/codex/ui-nav-1-global-navigation-visual-unification)" = "$GITHUB_SHA"
          git push origin HEAD:codex/ui-nav-1-global-navigation-visual-unification

      - name: Remove one-shot scaffolding
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ui-nav-1e-identity-reveal-one-shot.yml
          rm .github/workflows/ui-nav-1e-seam-audit.yml
          rm .github/scripts/ui-nav-1e-identity-reveal-patch.py
          git add .github/workflows/ui-nav-1e-identity-reveal-one-shot.yml .github/workflows/ui-nav-1e-seam-audit.yml .github/scripts/ui-nav-1e-identity-reveal-patch.py
          git commit -m 'chore: remove UI-NAV-1E one-shot scaffolding'
          git push origin HEAD:codex/ui-nav-1-global-navigation-visual-unification
