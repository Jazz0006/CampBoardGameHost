name: UI-NAV-1E identity reveal one-shot

on:
  push:
    branches:
      - codex/ui-nav-1-global-navigation-visual-unification
    paths:
      - .github/workflows/ui-nav-1e-identity-reveal-one-shot.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact production baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/AppDealScreens.kt)" = "531517f7857158a027f2600babf38f28823d3207"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" = "646e9a480d77441f35efdceafaa419141d63d36e"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt)" = "e561320c45e4e6161a41fe3d59205291035aebb2"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUi.kt)" = "75e4a3233aee16118c32f9cc4dae3dc63a298567"

      - name: Apply narrow identity controller migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise AssertionError(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          deal_path = Path('app/src/main/java/com/codex/campboardgamehost/AppDealScreens.kt')
          text = deal_path.read_text()
          text = replace_once(text, '''internal fun PassPhoneScreen(
              playerName: String,
              gameKind: GameKind,
              current: Int,
              total: Int,
              onReveal: () -> Unit,
          ) {''', '''internal fun PassPhoneScreen(
              playerName: String,
              playerNames: List<String>,
              gameKind: GameKind,
              current: Int,
              total: Int,
              onReveal: () -> Unit,
              onPrevious: () -> Unit,
              onHostTools: () -> Unit,
              onNext: () -> Unit,
          ) {''', 'PassPhoneScreen signature')
          text = replace_once(text, '''        ClocktowerDealHandoffScreen(
                      playerName = playerName,
                      current = current,
                      total = total,
                      onReveal = onReveal,
                  )''', '''        ClocktowerDealHandoffScreen(
                      playerName = playerName,
                      playerNames = playerNames,
                      current = current,
                      total = total,
                      onReveal = onReveal,
                      onPrevious = onPrevious,
                      onHostTools = onHostTools,
                      onNext = onNext,
                  )''', 'Clocktower controller call')
          text = replace_once(text, '''        ClocktowerPlayerRoleRevealScreen(
                      card = card,
                      current = current,
                      total = total,
                      onHide = onHide,
                  )''', '''        ClocktowerPlayerRoleRevealScreen(
                      card = card,
                      onHide = onHide,
                  )''', 'Clocktower player reveal call')

          start = text.index('@Composable\nprivate fun ClocktowerDealHandoffScreen(')
          mid = text.index('@Composable\nprivate fun ClocktowerPlayerRoleRevealScreen(', start)
          end = text.index('@Composable\nprivate fun FullScreenColumn(', mid)

          controller = '''@Composable
          private fun ClocktowerDealHandoffScreen(
              playerName: String,
              playerNames: List<String>,
              current: Int,
              total: Int,
              onReveal: () -> Unit,
              onPrevious: () -> Unit,
              onHostTools: () -> Unit,
              onNext: () -> Unit,
          ) {
              val language = LocalContext.current.resources.configuration.locales[0].language
              fun text(zh: String, en: String): String = if (language == "en") en else zh
              require(total == playerNames.size) { "Identity controller total must match the physical seat count" }
              require(current in 1..total) { "Identity controller current seat must be in range" }
              require(playerNames[current - 1] == playerName) { "Identity controller target must match the current seat" }
              val seats = playerNames.mapIndexed { index, name ->
                  HostSeatPresentation(
                      seatId = ClocktowerSeatId(index + 1),
                      playerName = name,
                      isAlive = true,
                  )
              }
              val currentSeatId = ClocktowerSeatId(current)

              ClocktowerDarkTheme {
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(MaterialTheme.colorScheme.background),
                  ) {
                      Surface(color = MaterialTheme.colorScheme.surface, shadowElevation = 8.dp) {
                          Column(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(horizontal = 18.dp, vertical = 12.dp),
                              verticalArrangement = Arrangement.spacedBy(3.dp),
                          ) {
                              Text(
                                  text("身份展示", "IDENTITY REVEAL"),
                                  color = MaterialTheme.colorScheme.primary,
                                  style = MaterialTheme.typography.labelMedium,
                                  fontWeight = FontWeight.Black,
                                  letterSpacing = 1.2.sp,
                              )
                              Text(
                                  "$current / $total",
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  style = MaterialTheme.typography.bodyMedium,
                                  fontWeight = FontWeight.Bold,
                              )
                          }
                      }

                      HostTableShell(
                          seats = seats,
                          modifier = Modifier
                              .weight(1f)
                              .fillMaxWidth(),
                          interaction = HostTableInteractionState(
                              mode = HostTableInteractionMode.Sequential,
                              currentSeatId = currentSeatId,
                          ),
                      ) {
                          Surface(
                              modifier = Modifier
                                  .align(Alignment.Center)
                                  .padding(horizontal = 68.dp),
                              color = MaterialTheme.colorScheme.surfaceVariant,
                              shape = RoundedCornerShape(18.dp),
                              border = BorderStroke(1.dp, MaterialTheme.colorScheme.primary.copy(alpha = 0.34f)),
                          ) {
                              Column(
                                  modifier = Modifier.padding(16.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally,
                                  verticalArrangement = Arrangement.spacedBy(10.dp),
                              ) {
                                  Text(
                                      "$current / $total",
                                      color = MaterialTheme.colorScheme.primary,
                                      style = MaterialTheme.typography.titleMedium,
                                      fontWeight = FontWeight.Black,
                                  )
                                  Text(
                                      text(
                                          "给 ${current} 号 $playerName 展示身份",
                                          "Show the role to seat $current · $playerName",
                                      ),
                                      color = MaterialTheme.colorScheme.onSurface,
                                      style = MaterialTheme.typography.titleMedium,
                                      fontWeight = FontWeight.Bold,
                                      textAlign = TextAlign.Center,
                                  )
                                  Button(
                                      onClick = onReveal,
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .height(48.dp),
                                      shape = RoundedCornerShape(14.dp),
                                  ) {
                                      Text(text("展示身份", "Show identity"), fontWeight = FontWeight.Bold)
                                  }
                              }
                          }
                      }

                      Surface(color = MaterialTheme.colorScheme.surface, shadowElevation = 12.dp) {
                          HostBottomActionBar(
                              previousLabel = text("上一步", "Previous"),
                              hostToolsLabel = text("主持工具", "Host Tools"),
                              nextLabel = text("下一步", "Next"),
                              onPrevious = onPrevious,
                              onHostTools = onHostTools,
                              onNext = onNext,
                              modifier = Modifier.padding(horizontal = 16.dp, vertical = 12.dp),
                              previousEnabled = current > 1,
                          )
                      }
                  }
              }
          }
          '''.replace('\n          ', '\n').lstrip()

          reveal = '''@Composable
          private fun ClocktowerPlayerRoleRevealScreen(
              card: PlayerCard,
              onHide: () -> Unit,
          ) {
              val context = LocalContext.current
              val language = context.resources.configuration.locales[0].language
              fun text(zh: String, en: String): String = if (language == "en") en else zh
              val shownRole = card.clocktowerShownRole
              val roleName = shownRole?.nameFor(language) ?: card.roleLabel ?: stringResource(card.role.labelResId())
              val team = shownRole?.team
              val teamName = team?.label(context)
              val description = shownRole?.descriptionFor(language) ?: card.word
              val accentColor = when (team) {
                  ClocktowerTeam.Townsfolk -> Color(0xFF8FB6D6)
                  ClocktowerTeam.Outsider -> Color(0xFF9AAEC0)
                  ClocktowerTeam.Minion -> Color(0xFFD09A6A)
                  ClocktowerTeam.Demon -> Color(0xFFD96B70)
                  null -> Color(0xFFC5A56A)
              }

              ClocktowerDarkTheme {
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(MaterialTheme.colorScheme.background),
                  ) {
                      Surface(color = MaterialTheme.colorScheme.surface, shadowElevation = 8.dp) {
                          Column(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(horizontal = 18.dp, vertical = 14.dp),
                              verticalArrangement = Arrangement.spacedBy(3.dp),
                          ) {
                              Text(
                                  text("仅供你查看", "FOR YOUR EYES ONLY"),
                                  color = MaterialTheme.colorScheme.error,
                                  style = MaterialTheme.typography.labelMedium,
                                  fontWeight = FontWeight.Black,
                                  letterSpacing = 1.2.sp,
                              )
                              Text(card.name, color = MaterialTheme.colorScheme.onSurfaceVariant)
                          }
                      }

                      Column(
                          modifier = Modifier
                              .weight(1f)
                              .fillMaxWidth()
                              .padding(18.dp),
                          verticalArrangement = Arrangement.Center,
                      ) {
                          Surface(
                              color = accentColor.copy(alpha = 0.12f),
                              shape = RoundedCornerShape(28.dp),
                              border = BorderStroke(1.dp, accentColor.copy(alpha = 0.48f)),
                          ) {
                              Column(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .padding(horizontal = 22.dp, vertical = 28.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally,
                                  verticalArrangement = Arrangement.spacedBy(14.dp),
                              ) {
                                  teamName?.let {
                                      Surface(
                                          color = accentColor.copy(alpha = 0.18f),
                                          shape = RoundedCornerShape(50),
                                      ) {
                                          Text(
                                              text = it,
                                              modifier = Modifier.padding(horizontal = 14.dp, vertical = 7.dp),
                                              color = accentColor,
                                              style = MaterialTheme.typography.labelLarge,
                                              fontWeight = FontWeight.Black,
                                          )
                                      }
                                  }
                                  Text(
                                      roleName,
                                      color = accentColor,
                                      style = MaterialTheme.typography.displayMedium,
                                      fontWeight = FontWeight.Black,
                                      textAlign = TextAlign.Center,
                                  )
                                  HorizontalDivider(color = accentColor.copy(alpha = 0.28f))
                                  Text(
                                      text("你的能力", "YOUR ABILITY"),
                                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                                      style = MaterialTheme.typography.labelMedium,
                                      fontWeight = FontWeight.Bold,
                                  )
                                  Text(
                                      description,
                                      color = MaterialTheme.colorScheme.onSurface,
                                      style = MaterialTheme.typography.titleMedium,
                                      textAlign = TextAlign.Center,
                                  )
                              }
                          }
                          Spacer(modifier = Modifier.height(16.dp))
                          Text(
                              text(
                                  "记住角色和能力。隐藏页面后把手机交回说书人。",
                                  "Remember your character and ability. Hide this screen, then return the phone to the Storyteller.",
                              ),
                              color = MaterialTheme.colorScheme.onSurfaceVariant,
                              textAlign = TextAlign.Center,
                              style = MaterialTheme.typography.bodySmall,
                          )
                      }

                      Surface(color = MaterialTheme.colorScheme.surface, shadowElevation = 12.dp) {
                          Button(
                              onClick = onHide,
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(horizontal = 16.dp, vertical = 12.dp)
                                  .height(54.dp),
                              shape = RoundedCornerShape(14.dp),
                          ) {
                              Text(
                                  text = text("隐藏身份，交回说书人", "Hide role and return to Storyteller"),
                                  fontWeight = FontWeight.Bold,
                              )
                          }
                      }
                  }
              }
          }
          '''.replace('\n          ', '\n').lstrip()

          text = text[:start] + controller + reveal + text[end:]
          deal_path.write_text(text)

          root_path = Path('app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt')
          text = root_path.read_text()
          route_start = text.index('                    Screen.PassPhone -> PassPhoneScreen(')
          route_end = text.index('                    Screen.ClocktowerJudge -> ClocktowerJudgeScreen(', route_start)
          old_routes = text[route_start:route_end]
          if old_routes.count('currentDealIndex += 1') != 1 or 'GameKind.Clocktower -> Screen.ClocktowerJudge' not in old_routes:
              raise AssertionError('Unexpected legacy identity route shape')
          new_routes = '''                    Screen.PassPhone -> PassPhoneScreen(
                        playerName = cards[currentDealIndex].name,
                        playerNames = cards.map { it.name },
                        gameKind = currentGameKind,
                        current = currentDealIndex + 1,
                        total = cards.size,
                        onReveal = { screen = Screen.RevealCard },
                        onPrevious = {
                            if (currentGameKind == GameKind.Clocktower && currentDealIndex > 0) {
                                currentDealIndex -= 1
                            }
                        },
                        onHostTools = {
                            if (currentGameKind == GameKind.Clocktower) {
                                hostToolTab = HostToolTab.Roles
                                showHostTools = true
                            }
                        },
                        onNext = {
                            if (currentGameKind == GameKind.Clocktower) {
                                if (currentDealIndex == cards.lastIndex) {
                                    screen = Screen.ClocktowerJudge
                                } else {
                                    currentDealIndex += 1
                                }
                            }
                        },
                    )

                    Screen.RevealCard -> RevealCardScreen(
                        card = cards[currentDealIndex],
                        gameKind = currentGameKind,
                        current = currentDealIndex + 1,
                        total = cards.size,
                        onHide = {
                            when (currentGameKind) {
                                GameKind.Werewolf -> error("Werewolf runtime has been removed.")
                                GameKind.Clocktower -> screen = Screen.PassPhone
                                GameKind.Undercover -> {
                                    if (currentDealIndex == cards.lastIndex) {
                                        screen = Screen.Game
                                    } else {
                                        currentDealIndex += 1
                                        screen = Screen.PassPhone
                                    }
                                }
                            }
                        },
                    )

'''
          text = text[:route_start] + new_routes + text[route_end:]
          old = '''                        onHostTools = {
                            hostToolTab = HostToolTab.Roles
                            showHostTools = true
                        },
                        onSelectNightDeath = { selected ->'''
          new = '''                        onHostTools = {
                            hostToolTab = HostToolTab.Roles
                            showHostTools = true
                        },
                        onPreviousFromFirstNightReady = {
                            currentDealIndex = cards.lastIndex
                            screen = Screen.PassPhone
                        },
                        onSelectNightDeath = { selected ->'''
          text = replace_once(text, old, new, 'root first-night previous callback')
          root_path.write_text(text)

          host_path = Path('app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt')
          text = host_path.read_text()
          text = replace_once(text, '''    onRecordEpistemicObservation: (EpistemicObservationDraft) -> Unit,
              onHostTools: () -> Unit,
              onMovePreviousNightStep: () -> Unit,''', '''    onRecordEpistemicObservation: (EpistemicObservationDraft) -> Unit,
              onHostTools: () -> Unit,
              onPreviousFromFirstNightReady: () -> Unit,
              onMovePreviousNightStep: () -> Unit,''', 'ClocktowerJudgeScreen signature')
          text = replace_once(text, '''            title = text("说书人开局准备", "STORYTELLER SETUP"),
              subtitle = text("首夜裁定推荐", "First-night recommendations"),
              description = text(
                  "这是说书人私密页面。确认推荐与裁定后，直接进入首夜流程。",
                  "This is a private Storyteller screen. Review the plan, then begin the first night.",
              ),
              buttonLabel = text("确认裁定，开始首夜", "Confirm plan and begin first night"),
              onHostTools = onHostTools,
              onStartNight = {''', '''            title = text("身份展示完成", "IDENTITY DISPLAY COMPLETE"),
              subtitle = text("准备进入首夜", "Prepare for the first night"),
              description = text(
                  "这是说书人私密页面。可返回最后一位玩家重新展示身份，或确认首夜裁定后开始夜晚。",
                  "This is a private Storyteller screen. You may return to the final player to show the role again, or confirm the first-night rulings and begin the night.",
              ),
              buttonLabel = text("确认裁定，开始首夜", "Confirm plan and begin first night"),
              onHostTools = onHostTools,
              onPrevious = onPreviousFromFirstNightReady,
              onStartNight = {''', 'first-night identity-complete boundary')
          host_path.write_text(text)

          recommendation_path = Path('app/src/main/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUi.kt')
          text = recommendation_path.read_text()
          text = replace_once(text, '''    buttonLabel: String,
              onHostTools: () -> Unit,
              onStartNight: () -> Unit,
              content: @Composable () -> Unit,''', '''    buttonLabel: String,
              onHostTools: () -> Unit,
              onStartNight: () -> Unit,
              onPrevious: (() -> Unit)? = null,
              content: @Composable () -> Unit,''', 'recommendation previous parameter')
          text = replace_once(text, '''                    onPrevious = {},
                      onHostTools = onHostTools,
                      onNext = onStartNight,
                      modifier = Modifier.padding(horizontal = 16.dp, vertical = 12.dp),
                      previousEnabled = false,''', '''                    onPrevious = onPrevious ?: {},
                      onHostTools = onHostTools,
                      onNext = onStartNight,
                      modifier = Modifier.padding(horizontal = 16.dp, vertical = 12.dp),
                      previousEnabled = onPrevious != null,''', 'recommendation bottom previous')
          recommendation_path.write_text(text)
          PY

      - name: Exact diff and privacy audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            app/src/main/java/com/codex/campboardgamehost/AppDealScreens.kt \
            app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt \
            app/src/main/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUi.kt \
            app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt | sort)"
          test "$actual" = "$expected"
          python - <<'PY'
          from pathlib import Path

          deal = Path('app/src/main/java/com/codex/campboardgamehost/AppDealScreens.kt').read_text()
          start = deal.index('private fun ClocktowerDealHandoffScreen(')
          end = deal.index('@Composable\nprivate fun ClocktowerPlayerRoleRevealScreen(', start)
          controller = deal[start:end]
          for forbidden in ('PlayerCard', 'clocktowerRole', 'clocktowerShownRole', 'actualRole', 'shownRole', 'ClocktowerTeam'):
              assert forbidden not in controller, f'privacy leak in controller: {forbidden}'
          for required in ('playerNames: List<String>', 'HostTableShell(', 'currentSeatId = currentSeatId', 'HostBottomActionBar('):
              assert required in controller, f'missing controller contract: {required}'

          reveal_start = deal.index('private fun ClocktowerPlayerRoleRevealScreen(')
          reveal_end = deal.index('@Composable\nprivate fun FullScreenColumn(', reveal_start)
          reveal = deal[reveal_start:reveal_end]
          for forbidden in ('HostTableShell(', 'HostBottomActionBar(', 'onHostTools', 'pass to next player', '交给下一位玩家'):
              assert forbidden not in reveal, f'player reveal privacy/navigation leak: {forbidden}'
          assert 'Hide role and return to Storyteller' in reveal

          root = Path('app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt').read_text()
          route_start = root.index('Screen.PassPhone -> PassPhoneScreen(')
          route_end = root.index('Screen.ClocktowerJudge -> ClocktowerJudgeScreen(', route_start)
          routes = root[route_start:route_end]
          assert 'playerNames = cards.map { it.name }' in routes
          assert 'GameKind.Clocktower -> screen = Screen.PassPhone' in routes
          assert 'GameKind.Clocktower -> Screen.ClocktowerJudge' not in routes
          assert routes.count('currentDealIndex += 1') == 2  # Clocktower Next + preserved Undercover Hide
          assert 'onPreviousFromFirstNightReady' in root

          host = Path('app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt').read_text()
          first_start = host.index('if (phase == ClocktowerPhase.FirstNight && !nightStarted)')
          first_end = host.index('if (phase == ClocktowerPhase.Night && !nightStarted)', first_start)
          first = host[first_start:first_end]
          assert 'onPrevious = onPreviousFromFirstNightReady' in first
          assert '身份展示完成' in first and '准备进入首夜' in first
          later = host[first_end:host.index('if ((phase == ClocktowerPhase.FirstNight || phase == ClocktowerPhase.Night) && nightStarted)', first_end)]
          assert 'onPrevious =' not in later
          PY
          echo 'UI-NAV-1E exact diff + privacy audit PASS'

      - name: Run focused Android validation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testFast --no-daemon
          ./gradlew :app:assembleDebug --no-daemon

      - name: Commit and push production checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/codex/campboardgamehost/AppDealScreens.kt \
            app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt \
            app/src/main/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUi.kt \
            app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt
          git commit -m 'ui: migrate identity reveal to Storyteller square table'
          git fetch origin codex/ui-nav-1-global-navigation-visual-unification
          test "$(git rev-parse origin/codex/ui-nav-1-global-navigation-visual-unification)" = "$GITHUB_SHA"
          git push origin HEAD:codex/ui-nav-1-global-navigation-visual-unification

      - name: Remove one-shot audit scaffolding
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ui-nav-1e-identity-reveal-one-shot.yml
          rm .github/workflows/ui-nav-1e-seam-audit.yml
          git add .github/workflows/ui-nav-1e-identity-reveal-one-shot.yml .github/workflows/ui-nav-1e-seam-audit.yml
          git commit -m 'chore: remove UI-NAV-1E one-shot scaffolding'
          git push origin HEAD:codex/ui-nav-1-global-navigation-visual-unification
