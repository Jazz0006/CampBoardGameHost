name: Mark hotfix PR ready

on:
  push:
    branches:
      - codex/hotfix-first-night-evil-info-display-crash

permissions:
  contents: write
  pull-requests: write

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 69 --repo Jazz0006/CampBoardGameHost

  cleanup:
    needs: ready
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/hotfix-first-night-evil-info-display-crash
          token: ${{ github.token }}
      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mark-hotfix-pr-ready.yml
          git commit -m "chore: remove temporary PR ready workflow"
          git push
