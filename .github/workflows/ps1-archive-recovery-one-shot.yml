name: PS1 Archive Recovery One Shot

on:
  push:
    branches:
      - codex/persistence-simplification

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v6
        with:
          ref: codex/persistence-simplification
          fetch-depth: 2

      - name: Verify locked parent and blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "dfb2b2af3d8abae0c41987fd2c4d25cd923aca27"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" = "72946669eabe654e4d0fb577a43f5d7d24398670"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/persistence/GameArchiveJsonCodec.kt)" = "ae2815d2a3bc9711a1f4ecc78a7ea1f953a09abc"
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/persistence/GameArchiveJsonCodecTest.kt)" = "98f9cd0838f22676cfafbab7bc5bb01e039e4b9f"
          test "$(git hash-object .github/scripts/ps1_archive_recovery_patch.py)" = "cc5ae3bf1a1a17388918a524a6041469e3664e36"
          test -z "$(git status --porcelain)"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Prove independent archive codec GREEN before App wiring
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.GameArchiveJsonCodecTest' \
            --rerun-tasks --no-daemon

      - name: Patch App archive wiring
        run: python3 .github/scripts/ps1_archive_recovery_patch.py

      - name: Exact diff audit before tests
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt"
          git diff -- app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt

      - name: Run PS1 focused contract after wiring
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.GameArchiveJsonCodecTest' \
            --rerun-tasks --no-daemon

      - name: Run Android fast regression suite
        run: ./gradlew :app:testFast --no-daemon

      - name: Commit and push PS1 product change
        id: product
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          git commit -m "refactor: separate archive records from active recovery"
          product_sha="$(git rev-parse HEAD)"
          echo "product_sha=$product_sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:codex/persistence-simplification

      - name: Self-remove one-shot patch machinery
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/scripts/ps1_archive_recovery_patch.py .github/workflows/ps1-archive-recovery-one-shot.yml
          git commit -m "ci: remove PS1 archive one-shot"
          cleanup_sha="$(git rev-parse HEAD)"
          echo "cleanup_sha=$cleanup_sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:codex/persistence-simplification

      - name: Report checkpoint
        run: |
          echo "PS1 product commit: ${{ steps.product.outputs.product_sha }}"
          echo "PS1 cleanup commit: ${{ steps.cleanup.outputs.cleanup_sha }}"
