name: Field Test Stacked Source Validation

on:
  push:
    branches:
      - codex/field-test-apk-stacked-source-fix

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: b3c723aa96b09983eb08d78d8053a5dabfc30a0a
      VERSION_CODE: "100069"
      VERSION_NAME: 0.1.4-ft.fix.b3c723aa96b0
      RELEASE_TAG: field-test-latest
      APK_NAME: CampBoardGameHost-field-test.apk
    steps:
      - name: Checkout exact F6 source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Apply transient field-test overlay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          original = text

          marker = "\nandroid {\n"
          if 'providers.gradleProperty("fieldTestVersionCode")' not in text:
              if text.count(marker) != 1:
                  raise SystemExit("Unable to locate unique android block")
              text = text.replace(
                  marker,
                  '\nval fieldTestVersionCode = providers.gradleProperty("fieldTestVersionCode").orNull?.toInt()\n'
                  'val fieldTestVersionName = providers.gradleProperty("fieldTestVersionName").orNull\n\n'
                  'android {\n',
                  1,
              )
          if "versionCode = fieldTestVersionCode ?:" not in text:
              text, n = re.subn(
                  r'(?m)^(\s*)versionCode\s*=\s*(\d+)\s*$',
                  r'\1versionCode = fieldTestVersionCode ?: \2',
                  text,
                  count=1,
              )
              if n != 1:
                  raise SystemExit("Unable to overlay versionCode")
          if "versionName = fieldTestVersionName ?:" not in text:
              text, n = re.subn(
                  r'(?m)^(\s*)versionName\s*=\s*"([^"]+)"\s*$',
                  r'\1versionName = fieldTestVersionName ?: "\2"',
                  text,
                  count=1,
              )
              if n != 1:
                  raise SystemExit("Unable to overlay versionName")
          if 'applicationIdSuffix = ".fieldtest"' not in text:
              if "buildTypes {" in text:
                  raise SystemExit("Unexpected custom buildTypes without field-test suffix")
              compile_marker = "\n    compileOptions {\n"
              if text.count(compile_marker) != 1:
                  raise SystemExit("Unable to locate compileOptions")
              text = text.replace(
                  compile_marker,
                  '\n    buildTypes {\n'
                  '        getByName("debug") {\n'
                  '            applicationIdSuffix = ".fieldtest"\n'
                  '            versionNameSuffix = "-fieldtest"\n'
                  '        }\n'
                  '    }\n\n'
                  '    compileOptions {\n',
                  1,
              )

          path.write_text(text, encoding="utf-8")
          if text == original:
              raise SystemExit("Expected stacked source to require field-test overlay")
          PY
          test "$(git diff --name-only)" = "app/build.gradle.kts"
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install fixed field-test signing key
        env:
          FIELD_TEST_DEBUG_KEYSTORE_BASE64: ${{ secrets.FIELD_TEST_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIELD_TEST_DEBUG_KEYSTORE_BASE64"
          mkdir -p "$HOME/.android"
          printf '%s' "$FIELD_TEST_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Test and build exact F6 field-test APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testFast :app:assembleDebug \
            -PfieldTestVersionCode="$VERSION_CODE" \
            -PfieldTestVersionName="$VERSION_NAME" \
            --no-daemon --rerun-tasks

      - name: Verify APK identity version and signature
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path('app/build/outputs/apk/debug/output-metadata.json').read_text())
          assert metadata['applicationId'] == 'com.codex.campboardgamehost.fieldtest', metadata['applicationId']
          element = metadata['elements'][0]
          assert int(element['versionCode']) == int('${{ env.VERSION_CODE }}'), element['versionCode']
          print('APK metadata OK')
          PY
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "$sdk_root/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          apk='app/build/outputs/apk/debug/app-debug.apk'
          "$apksigner" verify --verbose --print-certs "$apk"
          cert_sha256="$($apksigner verify --print-certs "$apk" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$cert_sha256"
          echo "cert_sha256=$cert_sha256" >> "$GITHUB_OUTPUT"

      - name: Publish corrected F6 field-test APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/$APK_NAME"
          cat > "$RUNNER_TEMP/field-test-build.txt" <<EOF
          source_ref=$SOURCE_SHA
          source_sha=$SOURCE_SHA
          version_code=$VERSION_CODE
          version_name=$VERSION_NAME-fieldtest
          application_id=com.codex.campboardgamehost.fieldtest
          certificate_sha256=${{ steps.verify.outputs.cert_sha256 }}
          workflow_run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          Latest sideloadable Android field-test build.

          - Source ref: \`$SOURCE_SHA\`
          - Source commit: \`$SOURCE_SHA\`
          - Version code: \`$VERSION_CODE\`
          - Version name: \`$VERSION_NAME-fieldtest\`
          - Application ID: \`com.codex.campboardgamehost.fieldtest\`
          - Signing certificate SHA-256: \`${{ steps.verify.outputs.cert_sha256 }}\`

          Stable APK asset: \`$APK_NAME\`
          EOF
          gh release edit "$RELEASE_TAG" --title 'Field Test APK (latest)' --notes-file "$notes"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/$APK_NAME" "$RUNNER_TEMP/field-test-build.txt" --clobber
