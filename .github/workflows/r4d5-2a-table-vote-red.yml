name: R4D-5.2A table voter RED

on:
  push:
    branches:
      - codex/ui-r4d5-2a-table-voting

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - name: Require focused RED for missing table-vote authority
        shell: bash
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest --tests com.codex.campboardgamehost.ClocktowerTableVoteStateTest --no-daemon --build-cache > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/red.log"
          if [[ $status -eq 0 ]]; then
            echo "Expected R4D-5.2A RED, but focused test passed."
            exit 1
          fi
          grep -Eq "unresolved reference.*(clocktowerTableVoteState|MultiSelection|togglePendingVoter)|Unresolved reference.*(clocktowerTableVoteState|MultiSelection|togglePendingVoter)" "$RUNNER_TEMP/red.log"
      - name: Remove temporary RED workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r4d5-2a-table-vote-red.yml
          git commit -m "ci(R4D-5.2A): remove temporary RED workflow"
          git push
