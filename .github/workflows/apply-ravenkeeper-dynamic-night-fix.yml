name: Apply Ravenkeeper dynamic-night fix

on:
  push:
    branches:
      - codex/ui-r5-square-table-stabilization

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: stage Ravenkeeper dynamic-night fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v6
        with:
          ref: codex/ui-r5-square-table-stabilization
          fetch-depth: 5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply exact HostScreen patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt')
          text = path.read_text()

          if 'deferredNightAdvanceIndex' in text:
              raise SystemExit('HostScreen already contains deferred night advance wiring')

          old_state = '''    var nightStarted by nightStartedState
    var nightStepIndex by nightStepIndexState
    var dayMode by dayModeState
'''
          new_state = old_state + '''    var deferredNightAdvanceIndex by remember(gameId, round, phase) { mutableStateOf<Int?>(null) }
'''
          if text.count(old_state) != 1:
              raise SystemExit(f'state anchor count={text.count(old_state)}')
          text = text.replace(old_state, new_state, 1)

          old_advance = '''            recordNightStep(currentStep)
            if (currentStepIndex < nightSteps.lastIndex) {
                nightStepIndex = currentStepIndex + 1
            } else {
                onConfirmNight()
            }
        }

        LaunchedEffect(
            automaticStorytellerInfo,
            currentStepIndex,
'''
          new_advance = '''            recordNightStep(currentStep)
            val flowMayExpandAfterConfirmation = currentStep.action in setOf(
                ClocktowerNightAction.DemonKill,
                ClocktowerNightAction.MayorRedirect,
            )
            when (
                val directive = clocktowerNightAdvanceDirective(
                    currentStepIndex = currentStepIndex,
                    currentStepCount = nightSteps.size,
                    flowMayExpandAfterConfirmation = flowMayExpandAfterConfirmation,
                )
            ) {
                is ClocktowerNightAdvanceDirective.MoveTo -> {
                    if (directive.stepIndex >= nightSteps.size) {
                        deferredNightAdvanceIndex = directive.stepIndex
                    }
                    nightStepIndex = directive.stepIndex
                }
                ClocktowerNightAdvanceDirective.CompleteNight -> onConfirmNight()
            }
        }

        LaunchedEffect(nightSteps.size, deferredNightAdvanceIndex) {
            val requestedIndex = deferredNightAdvanceIndex ?: return@LaunchedEffect
            if (
                clocktowerDeferredNightAdvanceShouldComplete(
                    requestedStepIndex = requestedIndex,
                    refreshedStepCount = nightSteps.size,
                )
            ) {
                deferredNightAdvanceIndex = null
                onConfirmNight()
            } else {
                deferredNightAdvanceIndex = null
            }
        }

        LaunchedEffect(
            automaticStorytellerInfo,
            currentStepIndex,
'''
          if text.count(old_advance) != 1:
              raise SystemExit(f'advance anchor count={text.count(old_advance)}')
          text = text.replace(old_advance, new_advance, 1)

          if text.count('clocktowerNightAdvanceDirective(') != 1:
              raise SystemExit('unexpected dynamic advance directive call count')
          if text.count('clocktowerDeferredNightAdvanceShouldComplete(') != 1:
              raise SystemExit('unexpected deferred reconciliation call count')

          path.write_text(text)

      - name: Exact diff guard
        run: |
          git diff --check
          git diff -- app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt

      - name: Run Android FAST tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testFast --no-daemon --build-cache

      - name: Commit production fix and remove one-off workflow
        run: |
          rm .github/workflows/apply-ravenkeeper-dynamic-night-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt .github/workflows/apply-ravenkeeper-dynamic-night-fix.yml
          git diff --cached --check
          git commit -m "fix: defer night completion until trigger flow refreshes"
          git push origin HEAD:codex/ui-r5-square-table-stabilization
