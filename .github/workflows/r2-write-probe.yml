name: R2 Clocktower setup visibility fix

on:
  push:
    branches:
      - codex/storyteller-algorithm-v4
    paths:
      - .github/workflows/r2-write-probe.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/r2-write-probe.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/storyteller-algorithm-v4
          fetch-depth: 0

      - name: Expose shared Clocktower theme mechanically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt")
          source = source_path.read_text(encoding="utf-8")
          old = "@Composable\nprivate fun ClocktowerDarkTheme(content: @Composable () -> Unit) {"
          new = "@Composable\ninternal fun ClocktowerDarkTheme(content: @Composable () -> Unit) {"

          if new in source:
              print("ClocktowerDarkTheme is already internal")
          else:
              if source.count(old) != 1:
                  raise SystemExit("ClocktowerDarkTheme marker missing or not unique")
              source = source.replace(old, new, 1)
              source_path.write_text(source.rstrip() + "\n", encoding="utf-8")
          PY

          git diff --check
          grep -q "internal fun ClocktowerDarkTheme" app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
            git diff --cached --check
            git commit -m "refactor: expose shared Clocktower theme for setup UI"
            git push origin HEAD:codex/storyteller-algorithm-v4
          fi
