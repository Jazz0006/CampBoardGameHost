name: R2 Undercover extraction executor

on:
  push:
    branches:
      - codex/storyteller-algorithm-v4
    paths:
      - .github/workflows/r2-write-probe.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/r2-write-probe.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/storyteller-algorithm-v4
          fetch-depth: 0

      - name: Verify Undercover extraction is present
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/codex/campboardgamehost/undercover/UndercoverSupport.kt
          grep -q "internal fun UndercoverSettingsScreen" app/src/main/java/com/codex/campboardgamehost/undercover/UndercoverSupport.kt
          grep -q "internal fun wordPairsFor" app/src/main/java/com/codex/campboardgamehost/undercover/UndercoverSupport.kt
          grep -q "internal fun GameSettingsHeader" app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          grep -q "internal fun StepperRow" app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          if grep -q "private fun UndercoverSettingsScreen" app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt; then
            echo "UndercoverSettingsScreen still exists in app root" >&2
            exit 1
          fi
          git diff --check
