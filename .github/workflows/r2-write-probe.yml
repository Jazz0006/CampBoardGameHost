name: R2 app-shell extraction executor

on:
  push:
    branches:
      - codex/storyteller-algorithm-v4
    paths:
      - .github/workflows/r2-write-probe.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/r2-write-probe.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/storyteller-algorithm-v4
          fetch-depth: 0

      - name: Extract Android Activity shell mechanically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("app/src/main/java/com/codex/campboardgamehost/MainActivity.kt")
          target_path = Path("app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt")
          source = source_path.read_text(encoding="utf-8")

          if target_path.exists() and "private enum class Screen {" not in source:
              target = target_path.read_text(encoding="utf-8")
              if "internal fun CampBoardGameHostApp()" not in target:
                  raise SystemExit("existing app file does not expose CampBoardGameHostApp internally")
              print("Android Activity shell already extracted")
              raise SystemExit(0)

          activity_marker = "class MainActivity : ComponentActivity() {"
          app_body_marker = "private enum class Screen {"
          activity_start = source.find(activity_marker)
          if activity_start < 0:
              raise SystemExit("MainActivity declaration not found")
          if source.find(activity_marker, activity_start + 1) >= 0:
              raise SystemExit("MainActivity declaration is not unique")

          app_body_start = source.find(app_body_marker, activity_start)
          if app_body_start < 0:
              raise SystemExit("app body marker not found after MainActivity")

          activity_block = source[activity_start:app_body_start].rstrip() + "\n"
          app_source = source[:activity_start] + source[app_body_start:]

          root_marker = "@Composable\nprivate fun CampBoardGameHostApp() {"
          if app_source.count(root_marker) != 1:
              raise SystemExit("CampBoardGameHostApp declaration is missing or not unique")
          app_source = app_source.replace(
              root_marker,
              "@Composable\ninternal fun CampBoardGameHostApp() {",
              1,
          )

          main_header = "\n".join([
              "package com.codex.campboardgamehost",
              "",
              "import android.os.Bundle",
              "import androidx.activity.ComponentActivity",
              "import androidx.activity.compose.setContent",
              "import androidx.activity.enableEdgeToEdge",
              "import androidx.core.view.WindowInsetsCompat",
              "import androidx.core.view.WindowInsetsControllerCompat",
              "",
          ])
          main_source = main_header + activity_block

          required_main = (
              "class MainActivity : ComponentActivity()",
              "CampBoardGameHostApp()",
              "enterImmersiveMode()",
          )
          for marker in required_main:
              if marker not in main_source:
                  raise SystemExit(f"missing MainActivity shell marker: {marker}")

          forbidden_main = (
              "private enum class Screen {",
              "@Composable",
              "remember {",
              "clocktowerGameStateRevision",
              "A4ObservationCacheRebuildExecutor",
          )
          for marker in forbidden_main:
              if marker in main_source:
                  raise SystemExit(f"non-shell declaration leaked into MainActivity: {marker}")

          if "internal fun CampBoardGameHostApp()" not in app_source:
              raise SystemExit("CampBoardGameHostApp was not made cross-file visible")
          if "class MainActivity : ComponentActivity()" in app_source:
              raise SystemExit("MainActivity class leaked into CampBoardGameHostApp.kt")

          source_path.write_text(main_source.rstrip() + "\n", encoding="utf-8")
          target_path.write_text(app_source.rstrip() + "\n", encoding="utf-8")
          PY

          git diff --check
          git diff --stat
          test -f app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/codex/campboardgamehost/MainActivity.kt \
                    app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
            git diff --cached --check
            git commit -m "refactor: separate MainActivity shell from app root"
            git push origin HEAD:codex/storyteller-algorithm-v4
          fi
