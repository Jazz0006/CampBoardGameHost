name: R2 Werewolf UI extraction verifier

on:
  push:
    branches:
      - codex/storyteller-algorithm-v4
    paths:
      - .github/workflows/r2-write-probe.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/r2-write-probe.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/storyteller-algorithm-v4
          fetch-depth: 0

      - name: Verify Werewolf UI extraction
        shell: bash
        run: |
          set -euo pipefail
          source_file=app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          target_file=app/src/main/java/com/codex/campboardgamehost/werewolf/WerewolfHostScreen.kt

          test -f "$target_file"
          grep -q "internal fun WerewolfSettingsScreen" "$target_file"
          grep -q "internal fun WerewolfJudgeScreen" "$target_file"
          grep -q "private fun templateLabel" "$target_file"
          grep -q "private fun RoleToggleRow" "$target_file"

          grep -q "internal const val MIN_WEREWOLF_PLAYERS = 4" "$source_file"
          grep -q "internal data class EliminationRecord(" "$source_file"
          grep -q "internal data class GameOutcome(" "$source_file"
          grep -q "internal fun HostProgressCard(" "$source_file"
          grep -q "internal fun HostScriptCard(" "$source_file"
          grep -q "internal fun HostInstructionBlock(" "$source_file"
          grep -q "internal fun HostActionSection(" "$source_file"
          grep -q "internal fun SelectablePlayerChips(" "$source_file"
          grep -q "internal fun WerewolfPlayerStatusRow(" "$source_file"
          grep -q "internal fun WerewolfRoleLine(" "$source_file"
          grep -q "internal fun EliminationRecord.displayText()" "$source_file"

          if grep -q "private fun WerewolfSettingsScreen(" "$source_file"; then
            echo "WerewolfSettingsScreen still exists in app root" >&2
            exit 1
          fi
          if grep -q "private fun WerewolfJudgeScreen(" "$source_file"; then
            echo "WerewolfJudgeScreen still exists in app root" >&2
            exit 1
          fi

          git diff --check
