name: R2 write probe

on:
  push:
    branches:
      - codex/storyteller-algorithm-v4
    paths:
      - .github/workflows/r2-write-probe.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/r2-write-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: echo "R2 write permission workflow registered"
