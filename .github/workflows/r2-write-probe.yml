name: R2 main-thread boundary

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/storyteller-algorithm-v4
    paths:
      - app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
      - app/src/main/java/com/codex/campboardgamehost/MainActivity.kt
      - app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerSetupScreen.kt
      - app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerDayScreen.kt
      - app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerNightScreen.kt
      - app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt
      - app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHistoryScreen.kt
      - .github/workflows/r2-write-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify extracted R2 boundaries
        shell: bash
        run: |
          set -euo pipefail
          root=app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          main=app/src/main/java/com/codex/campboardgamehost/MainActivity.kt
          setup=app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerSetupScreen.kt
          day=app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerDayScreen.kt
          night=app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerNightScreen.kt
          host=app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt
          history=app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHistoryScreen.kt

          for file in "$root" "$main" "$setup" "$day" "$night" "$host" "$history"; do
            test -f "$file"
          done

          if grep -q "fun ClocktowerSettingsScreen(" "$root"; then
            echo "ClocktowerSettingsScreen still lives in CampBoardGameHostApp.kt" >&2
            exit 1
          fi
          grep -q "internal fun ClocktowerSettingsScreen" "$setup"

          for name in \
            ClocktowerDayOverviewScreen \
            ClocktowerDawnSummaryScreen \
            ClocktowerNominationScreen \
            ClocktowerVoteScreen \
            ClocktowerExecutionConfirmScreen \
            ClocktowerSpecialDayActionScreen
          do
            if grep -q "fun ${name}(" "$root"; then
              echo "${name} still lives in CampBoardGameHostApp.kt" >&2
              exit 1
            fi
            grep -q "internal fun ${name}" "$day"
          done

          grep -q "private fun ClocktowerDayPlayerTile" "$day"
          grep -q "private fun ClocktowerDayActionHeader" "$day"

          for name in ClocktowerNightActiveScreen ClocktowerNightReadyCard; do
            if grep -q "fun ${name}(" "$root"; then
              echo "${name} still lives in CampBoardGameHostApp.kt" >&2
              exit 1
            fi
            grep -q "internal fun ${name}" "$night"
          done

          if grep -q "fun ClocktowerJudgeScreen(" "$root"; then
            echo "ClocktowerJudgeScreen still lives in CampBoardGameHostApp.kt" >&2
            exit 1
          fi
          grep -q "internal fun ClocktowerJudgeScreen" "$host"
          grep -q "private fun ClocktowerStorytellerRecommendationScreen" "$host"
          grep -q "private fun ClocktowerNightStepCardLocalized" "$host"
          grep -q "internal fun PlayerCard.clocktowerShownAsDifferentRole" "$host"

          for name in ClocktowerGameRecordPanel ClocktowerPlayerStatusRow ClocktowerResultsDialog; do
            if grep -q "fun ${name}(" "$root"; then
              echo "${name} still lives in CampBoardGameHostApp.kt" >&2
              exit 1
            fi
            grep -q "internal fun ${name}" "$history"
          done
          grep -q "internal fun clocktowerEventPhaseLabel" "$history"
          grep -q "private fun ClocktowerTimelineRow" "$history"
          grep -q "private fun ClocktowerResultPlayerRow" "$history"

          main_lines="$(wc -l < "$main")"
          main_bytes="$(wc -c < "$main")"
          test "$main_lines" -lt 200
          test "$main_bytes" -lt 6000

  remove-debug-buttons:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/storyteller-algorithm-v4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/storyteller-algorithm-v4
          fetch-depth: 0
      - name: Remove Clocktower debug UI buttons by exact anchors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt")
          text = path.read_text(encoding="utf-8")

          def replace_span(label: str, start: str, end: str, replacement: str):
              global text
              if text.count(start) != 1:
                  raise SystemExit(f"{label}: expected exactly one start anchor, found {text.count(start)}")
              start_index = text.index(start)
              end_index = text.find(end, start_index + len(start))
              if end_index < 0:
                  raise SystemExit(f"{label}: end anchor not found")
              text = text[:start_index] + replacement + text[end_index + len(end):]

          replace_span(
              "day diagnostics",
              "            diagnosticContent = if (BuildConfig.DEBUG) {\n",
              "            onStartNomination = {\n",
              "            diagnosticContent = null,\n            onStartNomination = {\n",
          )
          replace_span(
              "active night diagnostics",
              "            onNext = advanceNightStep,\n        ) {\n            if (BuildConfig.DEBUG) {\n",
              "            ClocktowerNightStepCardLocalized(\n",
              "            onNext = advanceNightStep,\n        ) {\n            ClocktowerNightStepCardLocalized(\n",
          )
          replace_span(
              "host footer diagnostics",
              "        if (BuildConfig.DEBUG) {\n            item {\n                OutlinedButton(\n                    onClick = { debugDiagnosticsExpanded = !debugDiagnosticsExpanded },\n",
              "        item {\n            HorizontalDivider()\n",
              "        item {\n            HorizontalDivider()\n",
          )
          replace_span(
              "first-night pool benchmark button",
              "            if (BuildConfig.DEBUG && debugDiagnosticsExpanded && firstNightPool != null) {\n",
              "            if (step.spyRegistrationKey != null && spyCard != null) {\n",
              "            if (step.spyRegistrationKey != null && spyCard != null) {\n",
          )

          forbidden = [
              "Show developer diagnostics",
              "Hide developer diagnostics",
              "Run A4 benchmark (11 samples)",
              "Run A4 prewarm cancellation probe",
              "Run unified setup selector benchmark (11 samples)",
              "Run first-night unified pool benchmark (11 samples)",
          ]
          remaining = [label for label in forbidden if label in text]
          if remaining:
              raise SystemExit(f"debug UI labels remain: {remaining}")

          path.write_text(text, encoding="utf-8")
          PY
          git diff --check
          git diff -- app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt
          git diff --cached --quiet && exit 0
          git commit -m "chore(release): remove Clocktower debug buttons"
          git push origin HEAD:codex/storyteller-algorithm-v4
