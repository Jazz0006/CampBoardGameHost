name: R2 Clocktower setup extraction verifier

on:
  push:
    branches:
      - codex/storyteller-algorithm-v4
    paths:
      - .github/workflows/r2-write-probe.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/r2-write-probe.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/storyteller-algorithm-v4
          fetch-depth: 0

      - name: Verify Clocktower setup extraction
        shell: bash
        run: |
          set -euo pipefail
          source_file=app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          target_file=app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerSetupScreen.kt

          test -f "$target_file"
          grep -q "internal fun ClocktowerSettingsScreen" "$target_file"
          grep -q "private fun ClocktowerSetupSummaryRow" "$target_file"

          grep -q "internal const val MIN_CLOCKTOWER_PLAYERS = 5" "$source_file"
          grep -q "internal fun canStartClocktowerScript(script: ClocktowerScript): Boolean" "$source_file"
          grep -q "internal fun clocktowerDistribution(playerCount: Int): Map<ClocktowerTeam, Int>" "$source_file"
          grep -q "internal fun ClocktowerScript.nameFor(language: String): String" "$source_file"
          grep -q "internal fun ClocktowerTeam.label(context: Context): String" "$source_file"
          grep -q "internal fun ClocktowerDarkTheme" "$source_file"

          if grep -q "private fun ClocktowerSettingsScreen(" "$source_file"; then
            echo "ClocktowerSettingsScreen still exists in app root" >&2
            exit 1
          fi

          git diff --check
