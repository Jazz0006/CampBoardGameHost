name: R4.1 cache contract writer

on:
  push:
    branches:
      - codex/storyteller-algorithm-v4
    paths:
      - .github/workflows/r2-write-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guarded-r4-cache-contract:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v6
        with:
          ref: codex/storyteller-algorithm-v4
          fetch-depth: 0

      - name: Verify clean R4.1 gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/workflows/ci.yml)" = 'd541d29507871b804cc050170a85f768acbe045f'
          cache=app/src/main/java/com/codex/campboardgamehost/clocktower/epistemic/A4ShadowWorldSetCache.kt
          executor=app/src/main/java/com/codex/campboardgamehost/clocktower/epistemic/A4ObservationCacheRebuildExecutor.kt
          test_file=app/src/test/java/com/codex/campboardgamehost/clocktower/epistemic/A4ObservationCacheRebuildExecutorTest.kt
          grep -q 'generation.scope.gameId != key.gameId || currentByGame\[key.gameId\] != generation' "$cache"
          grep -q 'coarseMaxHeapDeltaBytes = (heapBytes() - heapStart)' "$executor"
          grep -q 'coarseMaxHeapDeltaBytes = 11' "$test_file"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply R4.1 cache and telemetry contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          cache = Path('app/src/main/java/com/codex/campboardgamehost/clocktower/epistemic/A4ShadowWorldSetCache.kt')
          executor = Path('app/src/main/java/com/codex/campboardgamehost/clocktower/epistemic/A4ObservationCacheRebuildExecutor.kt')
          test_file = Path('app/src/test/java/com/codex/campboardgamehost/clocktower/epistemic/A4ObservationCacheRebuildExecutorTest.kt')

          cache_text = cache.read_text(encoding='utf-8')
          old_guard = '        if (generation.scope.gameId != key.gameId || currentByGame[key.gameId] != generation) return false\n'
          new_guard = '''        if (generation.scope.gameId != key.gameId ||
            generation.scope.gameStateRevision != key.gameStateRevision ||
            generation.scope.formalSnapshotId != key.formalSnapshotId ||
            generation.scope.rollout != key.rollout ||
            currentByGame[key.gameId] != generation
        ) return false
'''
          if old_guard not in cache_text:
              raise SystemExit('missing old cache commit guard')
          cache_text = cache_text.replace(old_guard, new_guard, 1)
          if 'generation.scope.gameStateRevision != key.gameStateRevision' not in cache_text or \
             'generation.scope.formalSnapshotId != key.formalSnapshotId' not in cache_text or \
             'generation.scope.rollout != key.rollout' not in cache_text:
              raise SystemExit('cache scope patch did not apply completely')
          cache.write_text(cache_text.rstrip() + '\n', encoding='utf-8')

          executor_text = executor.read_text(encoding='utf-8')
          if 'coarseMaxHeapDeltaBytes = (heapBytes() - heapStart).coerceAtLeast(0L)' not in executor_text:
              raise SystemExit('missing executor end-heap telemetry assignment')
          executor_text = executor_text.replace('coarseMaxHeapDeltaBytes', 'coarseEndHeapDeltaBytes')
          if 'coarseEndHeapDeltaBytes = (heapBytes() - heapStart).coerceAtLeast(0L)' not in executor_text:
              raise SystemExit('executor telemetry rename did not apply')
          executor.write_text(executor_text.rstrip() + '\n', encoding='utf-8')

          test_text = test_file.read_text(encoding='utf-8')
          marker = '    @Test fun `newer revision during a build makes completed and queued work stale`() {\n'
          if marker not in test_text:
              raise SystemExit('missing insertion marker for scope mismatch test')
          new_test = '''    @Test fun `cache commit fails closed when key disagrees with generation scope`() {
        val formal = formal()
        val request = request(formal, EpistemicObservationLog(), "unused").copy(appendedRecordId = "missing")
        val knowledge = knowledge(formal, EpistemicObservationLog()).getValue(1)
        val cache = A4ShadowWorldSetCache()
        val generation = cache.beginVersion(request.cacheScope())
        val key = request.cacheKey(knowledge)
        val value = worldSet(request, knowledge)
        val mismatchedKeys = listOf(
            key.copy(gameStateRevision = key.gameStateRevision + 1),
            key.copy(formalSnapshotId = "${key.formalSnapshotId}-stale"),
            key.copy(rollout = A4WorldEngineRollout.ENUMERATED_ONLY),
        )

        mismatchedKeys.forEach { mismatched ->
            assertFalse(cache.commitIfCurrent(generation, mismatched, value))
            assertNull(cache.read(mismatched))
        }
        assertTrue(cache.commitIfCurrent(generation, key, value))
        assertSame(value, cache.read(key))
    }

'''
          test_text = test_text.replace(marker, new_test + marker, 1)
          if 'coarseMaxHeapDeltaBytes = 11' not in test_text:
              raise SystemExit('missing old report telemetry fixture')
          test_text = test_text.replace('coarseMaxHeapDeltaBytes = 11', 'coarseEndHeapDeltaBytes = 11', 1)
          old_assert = '        assertTrue(report.toLogLine(request).contains("status=1:READY_REUSED,2:MISSING_REBUILT"))\n'
          if old_assert not in test_text:
              raise SystemExit('missing telemetry log assertion marker')
          test_text = test_text.replace(
              old_assert,
              old_assert + '        assertTrue(report.toLogLine(request).contains("coarseEndHeapDeltaBytes=11"))\n' +
              '        assertFalse(report.toLogLine(request).contains("coarseMaxHeapDeltaBytes"))\n',
              1,
          )
          test_file.write_text(test_text.rstrip() + '\n', encoding='utf-8')
          PY

          allowed="$({
            printf '%s\n' \
              app/src/main/java/com/codex/campboardgamehost/clocktower/epistemic/A4ObservationCacheRebuildExecutor.kt \
              app/src/main/java/com/codex/campboardgamehost/clocktower/epistemic/A4ShadowWorldSetCache.kt \
              app/src/test/java/com/codex/campboardgamehost/clocktower/epistemic/A4ObservationCacheRebuildExecutorTest.kt
          } | sort -u)"
          actual="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          test "$actual" = "$allowed"
          git diff --check

      - name: Run focused R4.1 tests
        run: |
          bash ./gradlew :app:testDebugUnitTest \
            --tests '*A4ObservationCacheRebuildExecutorTest' \
            --tests '*A4IdentityRevealPrewarmCoordinatorTest' \
            --no-daemon --build-cache

      - name: Run full Android regression
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --build-cache

      - name: Run ASP contract regression
        run: |
          python tools/asp_oracle/oracle_harness.py validate \
            --fixtures tools/asp_oracle/scenarios/trouble_brewing_a2.json
          python -m unittest discover \
            -s tools/asp_oracle \
            -p 'test_*.py'

      - name: Run real Clingo cross-validation
        run: |
          python -m pip install clingo==5.8.0
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/clingo" <<'EOF'
          #!/usr/bin/env bash
          exec python -m clingo "$@"
          EOF
          chmod +x "$RUNNER_TEMP/bin/clingo"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          python tools/asp_oracle/oracle_harness.py fetch \
            --checkout-dir build/oracles/botc-asp
          python tools/asp_oracle/oracle_harness.py run \
            --fixtures tools/asp_oracle/scenarios/trouble_brewing_a2.json \
            --botc-asp-dir build/oracles/botc-asp \
            --report build/reports/asp-oracle-a2.json \
            --timeout 30

      - name: Commit validated R4.1 source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            app/src/main/java/com/codex/campboardgamehost/clocktower/epistemic/A4ObservationCacheRebuildExecutor.kt \
            app/src/main/java/com/codex/campboardgamehost/clocktower/epistemic/A4ShadowWorldSetCache.kt \
            app/src/test/java/com/codex/campboardgamehost/clocktower/epistemic/A4ObservationCacheRebuildExecutorTest.kt
          staged="$(git diff --cached --name-only | sort -u)"
          expected="$({
            printf '%s\n' \
              app/src/main/java/com/codex/campboardgamehost/clocktower/epistemic/A4ObservationCacheRebuildExecutor.kt \
              app/src/main/java/com/codex/campboardgamehost/clocktower/epistemic/A4ShadowWorldSetCache.kt \
              app/src/test/java/com/codex/campboardgamehost/clocktower/epistemic/A4ObservationCacheRebuildExecutorTest.kt
          } | sort -u)"
          test "$staged" = "$expected"
          git diff --cached --check
          git commit -m 'fix(r4): harden shadow cache contract'
          git push origin HEAD:codex/storyteller-algorithm-v4
