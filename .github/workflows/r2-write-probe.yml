name: R2 structural decomposition verifier

on:
  push:
    branches:
      - codex/storyteller-algorithm-v4
    paths:
      - .github/workflows/r2-write-probe.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/r2-write-probe.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/storyteller-algorithm-v4
          fetch-depth: 0

      - name: Verify completed R2 boundaries
        shell: bash
        run: |
          set -euo pipefail

          main=app/src/main/java/com/codex/campboardgamehost/MainActivity.kt
          root=app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          undercover=app/src/main/java/com/codex/campboardgamehost/undercover/UndercoverSupport.kt
          wolf_support=app/src/main/java/com/codex/campboardgamehost/werewolf/WerewolfGameSupport.kt
          wolf_ui=app/src/main/java/com/codex/campboardgamehost/werewolf/WerewolfHostScreen.kt
          ct_setup=app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerSetupScreen.kt

          test -f "$main"
          test -f "$root"
          test -f "$undercover"
          test -f "$wolf_support"
          test -f "$wolf_ui"
          test -f "$ct_setup"

          grep -q "class MainActivity" "$main"
          grep -q "internal fun CampBoardGameHostApp" "$root"
          grep -q "internal fun UndercoverSettingsScreen" "$undercover"
          grep -q "internal enum class WerewolfJudgeStep" "$wolf_support"
          grep -q "internal fun WerewolfJudgeScreen" "$wolf_ui"
          grep -q "internal fun ClocktowerSettingsScreen" "$ct_setup"
          grep -q "internal fun ClocktowerDarkTheme" "$root"

          if grep -q "private fun UndercoverSettingsScreen(" "$root"; then exit 1; fi
          if grep -q "private fun WerewolfJudgeScreen(" "$root"; then exit 1; fi
          if grep -q "private fun ClocktowerSettingsScreen(" "$root"; then exit 1; fi

          git diff --check
