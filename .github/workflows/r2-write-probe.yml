name: R2 main-thread boundary

on:
  # Validate stacked PRs as well as main-bound PRs.
  pull_request:
  push:
    branches:
      - codex/storyteller-algorithm-v4
      - 'cleanup/**'
    paths:
      - app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
      - app/src/main/java/com/codex/campboardgamehost/ClocktowerHostCoreSemantics.kt
      - app/src/main/java/com/codex/campboardgamehost/ClocktowerHostSelectionSemantics.kt
      - app/src/main/java/com/codex/campboardgamehost/ClocktowerHostPresentationModels.kt
      - app/src/main/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUi.kt
      - app/src/main/java/com/codex/campboardgamehost/ClocktowerPlayerDisplayUi.kt
      - app/src/main/java/com/codex/campboardgamehost/ClocktowerRegistrationDecisionControls.kt
      - app/src/main/java/com/codex/campboardgamehost/ClocktowerAutomaticRegistrationEffect.kt
      - app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
      - app/src/main/java/com/codex/campboardgamehost/MainActivity.kt
      - app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerSetupScreen.kt
      - app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerDayScreen.kt
      - app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerDayOverviewTableUi.kt
      - app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerNightScreen.kt
      - app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt
      - app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerResultsScreen.kt
      - app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerNominationInteraction.kt
      - app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerSlayerInteraction.kt
      - .github/workflows/r2-write-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify extracted R2 boundaries
        shell: bash
        run: |
          set -euo pipefail
          root=app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          core=app/src/main/java/com/codex/campboardgamehost/ClocktowerHostCoreSemantics.kt
          selection=app/src/main/java/com/codex/campboardgamehost/ClocktowerHostSelectionSemantics.kt
          presentation=app/src/main/java/com/codex/campboardgamehost/ClocktowerHostPresentationModels.kt
          recommendation_ui=app/src/main/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUi.kt
          player_display_ui=app/src/main/java/com/codex/campboardgamehost/ClocktowerPlayerDisplayUi.kt
          registration_controls=app/src/main/java/com/codex/campboardgamehost/ClocktowerRegistrationDecisionControls.kt
          legacy_registration_ui=app/src/main/java/com/codex/campboardgamehost/ClocktowerRegistrationUi.kt
          night_step_ui=app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          main=app/src/main/java/com/codex/campboardgamehost/MainActivity.kt
          setup=app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerSetupScreen.kt
          day=app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerDayScreen.kt
          day_overview=app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerDayOverviewTableUi.kt
          night=app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerNightScreen.kt
          host=app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt
          results=app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerResultsScreen.kt

          for file in "$root" "$core" "$selection" "$presentation" "$recommendation_ui" "$player_display_ui" "$registration_controls" "$night_step_ui" "$main" "$setup" "$day" "$day_overview" "$night" "$host" "$results"; do
            test -f "$file"
          done
          test ! -e "$legacy_registration_ui"

          if grep -q "fun ClocktowerSettingsScreen(" "$root"; then
            echo "ClocktowerSettingsScreen still lives in CampBoardGameHostApp.kt" >&2
            exit 1
          fi
          grep -q "internal fun ClocktowerSettingsScreen" "$setup"

          if grep -q "fun ClocktowerDayOverviewScreen(" "$root"; then
            echo "ClocktowerDayOverviewScreen still lives in CampBoardGameHostApp.kt" >&2
            exit 1
          fi
          if grep -q "fun ClocktowerDayOverviewScreen(" "$day"; then
            echo "ClocktowerDayOverviewScreen still lives in ClocktowerDayScreen.kt" >&2
            exit 1
          fi
          grep -q "internal fun ClocktowerDayOverviewScreen" "$day_overview"
          grep -q "HostTableShell(" "$day_overview"
          grep -q "private fun ClocktowerDayOverviewCenterContent" "$day_overview"

          for name in ClocktowerDawnSummaryScreen ClocktowerExecutionConfirmScreen
          do
            if grep -q "fun ${name}(" "$root"; then
              echo "${name} still lives in CampBoardGameHostApp.kt" >&2
              exit 1
            fi
            grep -q "internal fun ${name}" "$day"
          done

          if grep -q "fun ClocktowerDayPlayerTile(" "$day"; then
            echo "Legacy ClocktowerDayPlayerTile returned to ClocktowerDayScreen.kt" >&2
            exit 1
          fi
          grep -q "private fun ClocktowerDayActionHeader" "$day"

          for name in ClocktowerNightActiveScreen ClocktowerNightReadyCard; do
            if grep -q "fun ${name}(" "$root"; then
              echo "${name} still lives in CampBoardGameHostApp.kt" >&2
              exit 1
            fi
            grep -q "internal fun ${name}" "$night"
          done

          if grep -q "fun ClocktowerJudgeScreen(" "$root"; then
            echo "ClocktowerJudgeScreen still lives in CampBoardGameHostApp.kt" >&2
            exit 1
          fi
          grep -q "internal fun ClocktowerJudgeScreen" "$host"
          if grep -q "fun ClocktowerNightStepCardLocalized(" "$host"; then
            echo "ClocktowerNightStepCardLocalized still lives in ClocktowerHostScreen.kt" >&2
            exit 1
          fi
          grep -q "internal fun ClocktowerNightStepCardLocalized" "$night_step_ui"
          if grep -q "fun ClocktowerInfoCard(" "$host"; then
            echo "ClocktowerInfoCard remains in ClocktowerHostScreen.kt" >&2
            exit 1
          fi
          if grep -Pzq '\n    return\s*\n\s*LazyColumn\(' "$host"; then
            echo "Unreachable legacy LazyColumn remains after the active UI return" >&2
            exit 1
          fi

          if grep -q "internal fun PlayerCard.clocktowerShownAsDifferentRole" "$host"; then
            echo "clocktowerShownAsDifferentRole still lives in ClocktowerHostScreen.kt" >&2
            exit 1
          fi
          grep -q "internal fun PlayerCard.clocktowerShownAsDifferentRole" "$core"
          grep -q "internal fun isClocktowerEvil" "$core"
          grep -q "internal fun clocktowerPrivateObservationRecordId" "$core"

          for symbol in \
            "private data class ClocktowerDisplayOption" \
            "private fun clocktowerInformationCandidateId" \
            "private data class ClocktowerDecisionOption" \
            "private fun unifiedDecisionPool" \
            "private fun unifiedFirstNightInformationPool" \
            "private data class ClocktowerRegistrationRecommendationOption" \
            "private fun unifiedRegistrationPool"
          do
            if grep -q "$symbol" "$host"; then
              echo "$symbol still lives in ClocktowerHostScreen.kt" >&2
              exit 1
            fi
          done
          grep -q "internal data class ClocktowerDisplayOption" "$selection"
          grep -q "internal fun clocktowerInformationCandidateId" "$selection"

          for symbol in \
            "internal data class ClocktowerDecisionOption" \
            "internal fun unifiedDecisionPool" \
            "internal data class ClocktowerRegistrationRecommendationOption" \
            "internal fun unifiedRegistrationPool"
          do
            if grep -q "$symbol" "$selection"; then
              echo "Purged legacy recommendation authority returned: $symbol" >&2
              exit 1
            fi
          done

          for symbol in \
            RecommendationStyle \
            RecommendationPlan \
            WeightedStableSelector \
            RecommendationProfile \
            GameBalanceEvaluator \
            TemporaryAutomaticStorytellerPolicy \
            ImpairedInformationPolicy \
            SetupRecommendationService \
            SetupEvaluator \
            PairInformationAbilityRecommender \
            MayorRedirectRecommender \
            DemonSuccessorRecommender \
            MalfunctionPolicy \
            RegistrationPolicy \
            ConsequenceEvaluator \
            rankFixedPoint \
            withinFamilyWeightFixedPoint
          do
            if grep -R -q "$symbol" app/src/main/java; then
              echo "Purged RES-3 legacy recommendation symbol returned: $symbol" >&2
              exit 1
            fi
          done

          for symbol in \
            BeginnerConservativeV1Policy \
            BeginnerConservativeV1Selector \
            BeginnerConservativeV2Policy \
            DrunkAssignmentQ04V1Policy \
            DrunkAssignmentQ04V1ProductionAdapter \
            DrunkAssignmentQ04V1ReplayEngine \
            FunctioningLibrarianV2ProductionSelector \
            FunctioningInvestigatorInv1ProductionSelector \
            DecisionPolicyReplay \
            DecisionTrace \
            DecisionTraceArchive \
            MultiPolicyReplay \
            PairInformationShadowReplayBridge \
            SdeRuntimeShadowCoordinator \
            SdeOfflineReplayCoordinator
          do
            if grep -R -q "$symbol" app/src/main/java; then
              echo "Purged RES-4 named policy/trace symbol returned: $symbol" >&2
              exit 1
            fi
          done

          for symbol in \
            "internal enum class ClocktowerRegistrationDetail" \
            "internal enum class ClocktowerPairInformationAbility" \
            "internal data class ClocktowerNightStepUi"
          do
            if grep -q "$symbol" "$host"; then
              echo "$symbol still lives in ClocktowerHostScreen.kt" >&2
              exit 1
            fi
            grep -q "$symbol" "$presentation"
          done

          if grep -R -q "fun RecommendationReasonSummary(" app/src/main/java/com/codex/campboardgamehost; then
            echo "Dead RecommendationReasonSummary returned to production" >&2
            exit 1
          fi
          if grep -q "fun ClocktowerStorytellerRecommendationScreen(" "$host"; then
            echo "ClocktowerStorytellerRecommendationScreen still lives in ClocktowerHostScreen.kt" >&2
            exit 1
          fi
          grep -q "internal fun ClocktowerStorytellerRecommendationScreen" "$recommendation_ui"
          for symbol in StorytellerRecommendationCard RecommendationDecisionEditor; do
            if grep -R -q "fun ${symbol}(" app/src/main/java/com/codex/campboardgamehost; then
              echo "Purged legacy recommendation UI returned: ${symbol}" >&2
              exit 1
            fi
          done

          for name in ClocktowerPlayerDisplayCardLocalized ClocktowerPlayerDisplayCard EvilInfoDisplay; do
            if grep -q "fun ${name}(" "$host"; then
              echo "${name} still lives in ClocktowerHostScreen.kt" >&2
              exit 1
            fi
          done
          grep -q "internal fun ClocktowerPlayerDisplayCardLocalized" "$player_display_ui"
          grep -q "fun ClocktowerPlayerDisplayCard" "$player_display_ui"
          grep -q "fun EvilInfoDisplay" "$player_display_ui"

          for name in SpyRegistrationPanel RecluseRegistrationPanel; do
            if grep -R -q "fun ${name}(" app/src/main/java/com/codex/campboardgamehost; then
              echo "Legacy ${name} still exists in production" >&2
              exit 1
            fi
          done
          grep -q "internal fun ClocktowerSpyRegistrationDecisionControls" "$registration_controls"
          grep -q "internal fun ClocktowerRecluseRegistrationDecisionControls" "$registration_controls"
          # TB Virgin retains Spy-as-Townsfolk TYPE registration in its interaction owner.
          nomination=app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerNominationInteraction.kt
          grep -q "ClocktowerNominationInteraction(" "$host"
          grep -q "internal fun ClocktowerNominationInteraction" "$nomination"
          grep -q "ClocktowerSpyTownsfolkTypeDecisionControls(" "$nomination"
          # No supported script has both Klutz and Spy. Guard against restoring
          # the unreachable special-good UI or invented prechoice ruling.
          if grep -q "ClocktowerSpyGoodAlignmentDecisionControls(" "$host" "$nomination"; then
            echo "Unreachable Klutz/Spy alignment picker resurfaced in production Host" >&2
            exit 1
          fi
          # Slayer retains the legal Recluse registration controls in its interaction owner.
          slayer=app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerSlayerInteraction.kt
          grep -q "ClocktowerSlayerInteraction(" "$host"
          grep -q "internal fun ClocktowerSlayerInteraction" "$slayer"
          grep -q "ClocktowerRecluseRegistrationDecisionControls(" "$slayer"

          for name in ClocktowerResultsDialog; do
            if grep -q "fun ${name}(" "$root"; then
              echo "${name} still lives in CampBoardGameHostApp.kt" >&2
              exit 1
            fi
            grep -q "internal fun ${name}" "$results"
          done
          grep -q "private fun ClocktowerResultPlayerRow" "$results"

          main_lines="$(wc -l < "$main")"
          main_bytes="$(wc -c < "$main")"
          test "$main_lines" -lt 200
          test "$main_bytes" -lt 6000
