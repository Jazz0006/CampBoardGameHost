name: PS3.2 preview cutover one-shot

on:
  push:
    branches:
      - codex/persistence-simplification
    paths:
      - .github/workflows/ps3-2-preview-cutover-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: codex/persistence-simplification
          fetch-depth: 0

      - name: Verify bootstrap head and blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/codex/persistence-simplification | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" = "31221134f3f16c39e3ea61d1649bbb249f9c15dd"
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/persistence/RecoveryPreviewLoaderTest.kt)" = "9179426c708ccad4a0ef551b8e3375207d3ac762"
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/persistence/RecoveryRestorePlannerNoGreaterJoyTest.kt)" = "c1ff314e8e7446da6d49a12af3bbcd9bea9b5a92"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Confirm typed preview baseline
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.RecoveryPreviewLoaderTest' \
            --tests 'com.codex.campboardgamehost.RecoveryRestorePlannerNoGreaterJoyTest' \
            --tests 'com.codex.campboardgamehost.RecoveryRestorePlannerTest' \
            --rerun-tasks --no-daemon

      - name: Apply exact App preview patch
        run: python3 .github/scripts/ps3_2_preview_cutover_patch.py

      - name: Run focused preview GREEN
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.RecoveryPreviewLoaderTest' \
            --tests 'com.codex.campboardgamehost.RecoveryRestorePlannerNoGreaterJoyTest' \
            --tests 'com.codex.campboardgamehost.RecoveryRestorePlannerTest' \
            --rerun-tasks --no-daemon

      - name: Run Android FAST checkpoint
        run: ./gradlew :app:testFast --rerun-tasks --no-daemon

      - name: Exact App diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt"
          git diff -- app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt

      - name: Reconfirm remote head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/persistence-simplification | cut -f1)" = "$GITHUB_SHA"

      - name: Commit and push product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          test "$(git diff --cached --name-only)" = "app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt"
          git commit -m 'refactor: cut preview over to typed recovery'
          git push origin HEAD:codex/persistence-simplification
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/persistence-simplification | cut -f1)" = "$PRODUCT_SHA"
          git rm .github/workflows/ps3-2-preview-cutover-one-shot.yml .github/scripts/ps3_2_preview_cutover_patch.py
          test "$(git diff --cached --name-only | sort | paste -sd ' ' -)" = ".github/scripts/ps3_2_preview_cutover_patch.py .github/workflows/ps3-2-preview-cutover-one-shot.yml"
          git commit -m 'ci: remove ps3.2 preview cutover one-shot'
          git push origin HEAD:codex/persistence-simplification
          echo "CLEANUP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report checkpoints
        run: |
          echo "Product checkpoint: $PRODUCT_SHA"
          echo "Cleanup checkpoint: $CLEANUP_SHA"
