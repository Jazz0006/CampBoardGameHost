name: UX-MODE-1 legacy reference audit

on:
  push:
    branches:
      - codex/ux-mode-1
    paths:
      - .github/workflows/ux-mode-1-legacy-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: codex/ux-mode-1
          fetch-depth: 0

      - name: Verify audited parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "0f0528ba0c58dd4612f540de9f46d5fca01c4483"

      - name: Inventory legacy storyteller references
        shell: bash
        run: |
          set -euo pipefail
          command -v grep >/dev/null

          echo '=== StorytellerAutomationMode / fromLegacyMode / legacy enum values ==='
          status=0
          grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=build \
            --include='*.kt' \
            --include='*.kts' \
            'StorytellerAutomationMode|fromLegacyMode|AUTO_BALANCED|AUTO_AGGRESSIVE|AUTO_GENTLE' \
            . || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi

          echo '=== StorytellerRecommendationUxPolicy automationMode field references ==='
          status=0
          grep -RInE \
            --exclude-dir=build \
            --include='*.kt' \
            '\.automationMode|automationMode[[:space:]]*[:=]' \
            app/src || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
