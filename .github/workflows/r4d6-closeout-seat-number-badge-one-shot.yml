name: R4D-6 seat number badge one-shot patch

on:
  push:
    branches:
      - codex/ui-r4d6-closeout-seat-number-badge
    paths:
      - .github/workflows/r4d6-closeout-seat-number-badge-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: codex/ui-r4d6-closeout-seat-number-badge
          fetch-depth: 0

      - name: Verify bootstrap head and blobs
        shell: bash
        run: |
          set -euo pipefail
          square='app/src/main/java/com/codex/campboardgamehost/ClocktowerSquareTableUi.kt'
          player_display='app/src/main/java/com/codex/campboardgamehost/ClocktowerPlayerDisplayUi.kt'
          seat_label='app/src/main/java/com/codex/campboardgamehost/ClocktowerSeatNumberLabel.kt'
          pair_presentation='app/src/main/java/com/codex/campboardgamehost/ClocktowerPairPlayerRevealPresentation.kt'
          label_test='app/src/test/java/com/codex/campboardgamehost/ClocktowerSeatNumberLabelTest.kt'
          square_test='app/src/test/java/com/codex/campboardgamehost/ClocktowerSquareTableSeatLayoutTest.kt'
          player_display_test='app/src/test/java/com/codex/campboardgamehost/ClocktowerPlayerDisplayPresentationTest.kt'
          patch_script='.github/scripts/r4d6_closeout_seat_number_badge_patch.py'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '3c146a04de5ae09828a5203b2ffcaca8e9f1e9b7'
          test "$(git ls-remote origin refs/heads/codex/ui-r4d6-closeout-seat-number-badge | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object "$square")" = 'ca2916ec1b28acec66f8f12e9ca7e1bb1fd6469f'
          test "$(git hash-object "$player_display")" = '2e50e1923378cc7f17a325adae37bba8a3f34882'
          test "$(git hash-object "$seat_label")" = 'd1f24ddff4fd3e42b0ad1a0ac1c1a4032ce243b5'
          test "$(git hash-object "$pair_presentation")" = '5ebf9353297cd44f7ee6839ee8761f9881c0f64d'
          test "$(git hash-object "$label_test")" = 'c7b2e8f6f7edb50a3e923e2a00823f3e9ada4660'
          test "$(git hash-object "$square_test")" = '009a8a9f33c5a48d521938c91db8eb7bb8c5d7a6'
          test "$(git hash-object "$player_display_test")" = 'b1e92f98b5114fedf0010ce1a96571f2b93b4fbf'
          test "$(git hash-object "$patch_script")" = '0fc66898581234f0c02f23d3373ed2862e0c7d42'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prove focused baseline
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerSeatNumberLabelTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerSquareTableSeatLayoutTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerPlayerDisplayPresentationTest' \
            --rerun-tasks --no-daemon

      - name: Apply exact production patch
        run: python3 .github/scripts/r4d6_closeout_seat_number_badge_patch.py

      - name: Run focused post-patch evidence
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerSeatNumberLabelTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerSquareTableSeatLayoutTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerPlayerDisplayPresentationTest' \
            --rerun-tasks --no-daemon

      - name: Run checkpoint testFast
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testFast --rerun-tasks --no-daemon

      - name: Exact diff and semantic audit
        shell: bash
        run: |
          set -euo pipefail
          player_display='app/src/main/java/com/codex/campboardgamehost/ClocktowerPlayerDisplayUi.kt'
          badge='app/src/main/java/com/codex/campboardgamehost/ClocktowerSeatNumberBadge.kt'
          square='app/src/main/java/com/codex/campboardgamehost/ClocktowerSquareTableUi.kt'
          pair_presentation='app/src/main/java/com/codex/campboardgamehost/ClocktowerPairPlayerRevealPresentation.kt'
          expected=$(printf '%s\n' "$player_display" "$badge" "$square")
          git diff --check
          test "$(git diff --name-only)" = "$expected"
          grep -F 'text = seatNumber.toString()' "$badge"
          grep -F 'contentDescription = localizedSeatDescription' "$badge"
          grep -F 'ClocktowerSeatNumberBadgeScale.Compact' "$square"
          grep -F 'ClocktowerSeatNumberBadgeScale.PlayerReveal' "$player_display"
          grep -F 'val playerName: String' "$pair_presentation"
          if grep -F 'text = clocktowerSeatNumberLabel(seat.seatNumber, language)' "$square"; then
            echo 'Legacy localized visual seat label remains on square table' >&2
            exit 1
          fi
          if grep -F 'text = clocktowerSeatNumberLabel(seat.seatId.number, language)' "$player_display"; then
            echo 'Legacy localized visual seat label remains on Player Reveal' >&2
            exit 1
          fi
          git diff -- "$player_display" "$badge" "$square"

      - name: Reconfirm remote head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/ui-r4d6-closeout-seat-number-badge | cut -f1)" = "$GITHUB_SHA"

      - name: Commit and push product patch
        shell: bash
        run: |
          set -euo pipefail
          player_display='app/src/main/java/com/codex/campboardgamehost/ClocktowerPlayerDisplayUi.kt'
          badge='app/src/main/java/com/codex/campboardgamehost/ClocktowerSeatNumberBadge.kt'
          square='app/src/main/java/com/codex/campboardgamehost/ClocktowerSquareTableUi.kt'
          expected=$(printf '%s\n' "$player_display" "$badge" "$square")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$player_display" "$badge" "$square"
          test "$(git diff --cached --name-only)" = "$expected"
          git commit -m 'feat(R4D-6): unify seat number badge presentation'
          git push origin HEAD:codex/ui-r4d6-closeout-seat-number-badge
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/ui-r4d6-closeout-seat-number-badge | cut -f1)" = "$PRODUCT_SHA"
          git rm .github/workflows/r4d6-closeout-seat-number-badge-one-shot.yml .github/scripts/r4d6_closeout_seat_number_badge_patch.py
          git commit -m 'chore(ci): remove R4D-6 seat badge one-shot files'
          git push origin HEAD:codex/ui-r4d6-closeout-seat-number-badge
          echo "CLEANUP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report checkpoints
        run: |
          echo "Product checkpoint: $PRODUCT_SHA"
          echo "Cleanup checkpoint: $CLEANUP_SHA"
