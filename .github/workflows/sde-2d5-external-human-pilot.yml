name: SDE-2D5 external human pilot

on:
  push:
    branches:
      - sde-2d5-calibration-policy-evidence
    paths:
      - app/src/test/java/com/codex/campboardgamehost/clocktower/review/Sde2D5ExternalHumanPilot.kt
      - app/src/test/java/com/codex/campboardgamehost/clocktower/review/Sde2D5CalibrationExperiment.kt
      - .github/workflows/sde-2d5-external-human-pilot.yml

concurrency:
  group: sde-2d5-external-human-pilot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pilot:
    name: Compare ClockTracker human choices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run SDE-2D5 calibration including external human pilot
        run: ./gradlew :app:sde2D5Calibration --no-daemon --rerun-tasks

      - name: Print B3 calibration review and generated v2 manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for report in \
            app/build/reports/sde-2d5f-calibration-review.md \
            app/build/reports/sde-2d5f-human-label-manifest.tsv
          do
            if [[ -f "$report" ]]; then
              echo "===== $report ====="
              cat "$report"
            fi
          done

      - name: Print external human pilot report
        shell: bash
        run: |
          set -euo pipefail
          report="app/build/reports/sde-2d5-external-human-pilot.md"
          test -f "$report"
          cat "$report"

      - name: Upload external human pilot report
        uses: actions/upload-artifact@v4
        with:
          name: sde-2d5-external-human-pilot
          path: app/build/reports/sde-2d5-external-human-pilot.md
          if-no-files-found: error