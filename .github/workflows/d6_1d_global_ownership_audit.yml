name: D6.1d global ownership audit

on:
  push:
    branches:
      - codex/d6-root-reaudit
    paths:
      - .github/workflows/d6_1d_global_ownership_audit.yml

permissions:
  contents: write

jobs:
  audit-test-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: codex/d6-root-reaudit
          fetch-depth: 0

      - name: Verify exact audit baseline and tooling-only delta
        shell: bash
        run: |
          set -euo pipefail
          BASE_PRODUCT='6686d1160f3d01f2e872721472919064afdf2ab9'
          APP='app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt'
          EXPECTED_APP_BLOB='2a448ae9e2ad62a5a988716594cb0c0a06731bbd'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/codex/d6-root-reaudit | cut -f1)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE_PRODUCT" HEAD
          test "$(git hash-object "$APP")" = "$EXPECTED_APP_BLOB"
          actual="$(git diff --name-only "$BASE_PRODUCT"..HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/scripts/d6_1d_global_ownership_audit.py' \
            '.github/workflows/d6_1d_global_ownership_audit.yml' | sort)"
          test "$actual" = "$expected"

      - name: Global writer inventory and ownership assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/d6_1d_global_ownership_audit.py

      - name: Production dependency and scope audit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git diff --check origin/main...HEAD
          echo '=== production files changed from main ==='
          git diff --name-only origin/main...HEAD -- app/src/main | sort
          actual="$(git diff --name-only origin/main...HEAD -- app/src/main | sort)"
          expected="$(printf '%s\n' \
            'app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt' \
            'app/src/main/java/com/codex/campboardgamehost/clocktower/session/ClocktowerGameSession.kt' \
            'app/src/main/java/com/codex/campboardgamehost/clocktower/session/ClocktowerGameSessionAliveBoundaries.kt' \
            'app/src/main/java/com/codex/campboardgamehost/clocktower/session/ClocktowerGameSessionPoisonBoundaries.kt' \
            'app/src/main/java/com/codex/campboardgamehost/clocktower/session/ClocktowerGameSessionRoleIdentityBoundaries.kt' | sort)"
          test "$actual" = "$expected"
          test -z "$(git diff --name-only origin/main...HEAD -- app/src/main/java/com/codex/campboardgamehost/recovery)"
          test -z "$(git diff --name-only origin/main...HEAD -- app/src/main/java/com/codex/campboardgamehost/clocktower/rules)"
          test -z "$(git diff --name-only origin/main...HEAD -- app/src/main/java/com/codex/campboardgamehost/clocktower/epistemic)"
          test -z "$(git diff --name-only origin/main...HEAD -- app/src/main/java/com/codex/campboardgamehost/werewolf)"
          echo 'AUDIT PASS: Recovery/rules/A4-epistemic/Werewolf production packages unchanged.'

      - name: Combined D6.1d focused contracts
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.clocktower.session.ClocktowerGameSessionTest' \
            --tests 'com.codex.campboardgamehost.clocktower.session.ClocktowerGameSessionGameStateBoundaryTest' \
            --tests 'com.codex.campboardgamehost.clocktower.session.ClocktowerGameSessionRoleIdentityBoundaryTest' \
            --tests 'com.codex.campboardgamehost.clocktower.session.ClocktowerGameSessionAliveBoundaryTest' \
            --tests 'com.codex.campboardgamehost.clocktower.session.ClocktowerGameSessionPoisonBoundaryTest' \
            --tests 'com.codex.campboardgamehost.clocktower.session.NightDawnDurableMaterializationPlannerTest' \
            --tests 'com.codex.campboardgamehost.clocktower.session.NightDawnRestoreRetryConvergenceAcceptanceTest' \
            --tests 'com.codex.campboardgamehost.clocktower.session.NightDawnOrdinaryPoisonOwnershipTest' \
            --tests 'com.codex.campboardgamehost.clocktower.session.DuskPoisonExpiryMaterializationPlannerTest' \
            --tests 'com.codex.campboardgamehost.clocktower.session.PoisonExecutionDuskTimelineRegressionTest' \
            --no-daemon

      - name: Android FAST combined checkpoint
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testFast --no-daemon --build-cache

      - name: Remove audit tooling after PASS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            .github/scripts/d6_1d_global_ownership_audit.py \
            .github/workflows/d6_1d_global_ownership_audit.yml
          git commit -m 'chore: remove D6.1d global ownership audit tooling'
          git push origin HEAD:codex/d6-root-reaudit
