name: R4D-5.3 Vote Detail History Retry
on:
  push:
    branches:
      - codex/ui-r4d5-3-vote-detail-history
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Patch Host, test, audit, commit
        run: |
          set +e
          status=0
          python3 - <<'PY' || status=$?
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt')
          text = path.read_text()

          pattern = re.compile(
              r'val recordVoteEvent = \{\s*'
              r'onRecordEvent\(\s*'
              r'ClocktowerEventType\.Vote,\s*'
              r'text\("提名与投票", "Nomination and vote"\),\s*'
              r'"\$\{playerSeatLabel\(cards, nominatorName\)\} → \$\{playerSeatLabel\(cards, nomineeName\)\} · \$currentVoteCount/\$executionThreshold",\s*'
              r'listOfNotNull\(nominatorName, nomineeName\),\s*'
              r'\)\s*\}'
          )
          replacement = '\n'.join([
              'val recordVoteEvent: (ClocktowerConfirmedVoteRecord) -> Unit = { voteRecord ->',
              '            val voterDetail = voteRecord.voterDetail(',
              '                playerLabel = { playerName -> playerSeatLabel(cards, playerName) },',
              '                ghostVoteSuffix = text("（幽灵票）", " (ghost vote)"),',
              '                noVotesLabel = text("无人投票", "No votes"),',
              '            )',
              '            onRecordEvent(',
              '                ClocktowerEventType.Vote,',
              '                text("提名与投票", "Nomination and vote"),',
              '                "${playerSeatLabel(cards, nominatorName)} → ${playerSeatLabel(cards, nomineeName)} · ${voteRecord.voteCount}/$executionThreshold · ${text("投票人：", "Voters: ")}$voterDetail",',
              '                listOfNotNull(nominatorName, nomineeName) + voteRecord.voters.map { voter -> voter.playerName },',
              '            )',
              '        }',
          ])
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'recordVoteEvent semantic anchor count={count}')

          pattern2 = re.compile(
              r'onConfirm = \{ selectedVoterSeatIds, confirmedGhostVoteAuthority ->\s*'
              r'onGhostVoteAuthorityChange\(confirmedGhostVoteAuthority\)\s*'
              r'currentVoteCount = selectedVoterSeatIds\.size\s*'
              r'recordVoteEvent\(\)'
          )
          replacement2 = '\n'.join([
              'onConfirm = { voteRecord, confirmedGhostVoteAuthority ->',
              '                onGhostVoteAuthorityChange(confirmedGhostVoteAuthority)',
              '                currentVoteCount = voteRecord.voteCount',
              '                recordVoteEvent(voteRecord)',
          ])
          text, count2 = pattern2.subn(replacement2, text, count=1)
          if count2 != 1:
              raise SystemExit(f'onConfirm semantic anchor count={count2}')
          path.write_text(text)
          PY

          if [ "$status" -eq 0 ]; then
            ./gradlew :app:testDebugUnitTest \
              --tests com.codex.campboardgamehost.ClocktowerVoteHistoryRecordTest \
              --tests com.codex.campboardgamehost.ClocktowerTableVoteStateTest \
              --tests com.codex.campboardgamehost.ClocktowerGhostVoteAuthorityTest \
              --no-daemon --build-cache || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            ./gradlew :app:testFast --no-daemon --build-cache || status=$?
          fi

          git rm .github/workflows/r4d5-3-vote-history-green2.yml || status=$?
          git add -A

          if [ "$status" -eq 0 ]; then
            expected=$(cat <<'EOF'
          app/src/main/java/com/codex/campboardgamehost/ClocktowerVoteHistoryRecord.kt
          app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt
          app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerVoteTableUi.kt
          app/src/test/java/com/codex/campboardgamehost/ClocktowerVoteHistoryRecordTest.kt
          EOF
            )
            actual=$(git diff --cached --name-only 39a7d99340dce908aa3f826f1af2b92da02c8a3a | sort)
            expected_sorted=$(printf '%s\n' "$expected" | sed 's/^          //' | sort)
            if [ "$actual" != "$expected_sorted" ]; then
              echo "Unexpected permanent diff" >&2
              printf '%s\n' "$actual" >&2
              echo "Expected" >&2
              printf '%s\n' "$expected_sorted" >&2
              status=1
            fi
          fi
          if [ "$status" -eq 0 ]; then
            git diff --cached --check || status=$?
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$status" -eq 0 ]; then
            git commit -m "feat(R4D-5.3): record voter identities and ghost votes" || status=$?
          else
            git restore --staged . || true
            git checkout -- app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt || true
            git add -A
            git commit -m "chore: remove failed R4D-5.3 validation workflow" || true
          fi
          git push origin HEAD:${GITHUB_REF_NAME} || status=$?
          exit "$status"
