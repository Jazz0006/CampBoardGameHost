name: R5.5 S5 other-night planner wiring patch

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/r55-s5-other-night-wiring.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'codex/storyteller-algorithm-v4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/storyteller-algorithm-v4
          fetch-depth: 0
      - name: Apply exact other-night planner wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          host_path = Path("app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt")
          host = host_path.read_text(encoding="utf-8")

          def block(*lines: str) -> str:
              return "\n".join(lines)

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              return text.replace(old, new, 1)

          host = replace_once(
              host,
              block(
                  'import com.codex.campboardgamehost.clocktower.flow.ClocktowerProductionFirstNightFlow',
                  'import com.codex.campboardgamehost.clocktower.flow.ClocktowerProductionNightStepIdentity',
              ),
              block(
                  'import com.codex.campboardgamehost.clocktower.flow.ClocktowerProductionFirstNightFlow',
                  'import com.codex.campboardgamehost.clocktower.flow.ClocktowerProductionOtherNightFlow',
                  'import com.codex.campboardgamehost.clocktower.flow.ClocktowerProductionNightStepIdentity',
                  'import com.codex.campboardgamehost.clocktower.flow.ClocktowerResolvedFlowFact',
                  'import com.codex.campboardgamehost.clocktower.flow.ClocktowerResolvedFlowFacts',
              ),
              'other-night production imports',
          )

          host = replace_once(
              host,
              block(
                  '    val demonCard = cards.firstOrNull { it.clocktowerRole?.team == ClocktowerTeam.Demon }',
                  '    val sageNightDeath = resolvedNightDeathCard',
              ),
              block(
                  '    val demonCard = cards.firstOrNull { it.clocktowerRole?.team == ClocktowerTeam.Demon }',
                  '    val livingImp = demonCard?.takeIf {',
                  '        it.eliminatedRound == null && it.clocktowerRole?.enName == "Imp"',
                  '    }',
                  '    val impSelfKillNeedsSuccessor =',
                  '        livingImp != null &&',
                  '            pendingNightDeath == livingImp.name &&',
                  '            !demonPoisonedTonight &&',
                  '            aliveCards.any { it.clocktowerTeam == ClocktowerTeam.Minion }',
                  '    val sageNightDeath = resolvedNightDeathCard',
              ),
              'resolved Imp succession outcome',
          )

          host = replace_once(
              host,
              block(
                  '            val livingImp = demonCard?.takeIf {',
                  '                it.eliminatedRound == null && it.clocktowerRole?.enName == "Imp"',
                  '            }',
                  '            val impSelfKillNeedsSuccessor =',
                  '                livingImp != null &&',
                  '                    pendingNightDeath == livingImp.name &&',
                  '                    !demonPoisonedTonight &&',
                  '                    aliveCards.any { it.clocktowerTeam == ClocktowerTeam.Minion }',
              ),
              '',
              'remove duplicate inline Imp succession outcome',
          )

          start_marker = '    fun legacyOtherNightOrder(step: ClocktowerNightStepUi): Int = when {'
          end_marker = '\n\n    playerDisplayStep?.let'
          if host.count(start_marker) != 1:
              raise SystemExit(f"night-order start: expected exactly one anchor, found {host.count(start_marker)}")
          if host.count(end_marker) != 1:
              raise SystemExit(f"night-order end: expected exactly one anchor, found {host.count(end_marker)}")
          start = host.index(start_marker)
          end = host.index(end_marker, start)
          if end <= start:
              raise SystemExit("night-order anchors are out of order")

          replacement = block(
              '    val firstNightWakingRoleIds = buildSet {',
              '        cards.forEach { card ->',
              '            card.clocktowerRole?.enName?.let { add(RoleId(it)) }',
              '            if (card.clocktowerRole?.enName == "Drunk") {',
              '                card.clocktowerShownRole?.enName?.let { add(RoleId(it)) }',
              '            }',
              '        }',
              '    }',
              '    val otherNightWakingRoleIds = buildSet {',
              '        aliveCards.forEach { card ->',
              '            card.clocktowerRole?.enName?.let { add(RoleId(it)) }',
              '            if (card.clocktowerRole?.enName == "Drunk") {',
              '                card.clocktowerShownRole?.enName?.let { add(RoleId(it)) }',
              '            }',
              '        }',
              '    }',
              '    val otherNightResolvedFacts = ClocktowerResolvedFlowFacts(',
              '        buildSet {',
              '            if (lastExecutedName != null) add(ClocktowerResolvedFlowFact.EXECUTION_OCCURRED_TODAY)',
              '            if (ravenkeeperTrigger != null) add(ClocktowerResolvedFlowFact.RAVENKEEPER_DIED_AT_NIGHT)',
              '            if (mayorCanRedirect) add(ClocktowerResolvedFlowFact.MAYOR_REDIRECT_ELIGIBLE)',
              '            if (impSelfKillNeedsSuccessor) add(ClocktowerResolvedFlowFact.DEMON_SUCCESSION_REQUIRED)',
              '            if (sageNightDeath != null) add(ClocktowerResolvedFlowFact.SAGE_KILLED_BY_DEMON)',
              '        },',
              '    )',
              '    val nightSteps = if (phase == ClocktowerPhase.FirstNight) {',
              '        ClocktowerProductionFirstNightFlow.order(',
              '            ruleset = BuiltInClocktowerRulesetCatalog.fromContext(context).ruleset(script),',
              '            playerCount = cards.size,',
              '            inPlayRoleIds = firstNightWakingRoleIds,',
              '            productionSteps = filteredNightSteps,',
              '            identityOf = { step ->',
              '                when {',
              '                    step.title == minionInfoTitle -> ClocktowerProductionNightStepIdentity.minionInfo()',
              '                    step.title == demonInfoTitle -> ClocktowerProductionNightStepIdentity.demonInfo()',
              '                    step.action == ClocktowerNightAction.RedHerring ->',
              '                        ClocktowerProductionNightStepIdentity.fortuneTellerRedHerring()',
              '                    else -> ClocktowerProductionNightStepIdentity.role(',
              '                        RoleId(requireNotNull(step.roleEnName) {',
              '                            "First-night production step is missing a stable role identity."',
              '                        }),',
              '                    )',
              '                }',
              '            },',
              '        )',
              '    } else {',
              '        ClocktowerProductionOtherNightFlow.order(',
              '            ruleset = BuiltInClocktowerRulesetCatalog.fromContext(context).ruleset(script),',
              '            playerCount = cards.size,',
              '            wakingRoleIds = otherNightWakingRoleIds,',
              '            resolvedFacts = otherNightResolvedFacts,',
              '            productionSteps = filteredNightSteps,',
              '            identityOf = { step ->',
              '                when {',
              '                    step.action == ClocktowerNightAction.DemonSuccessor ->',
              '                        ClocktowerProductionNightStepIdentity.demonSuccessor()',
              '                    step.action == ClocktowerNightAction.MayorRedirect ->',
              '                        ClocktowerProductionNightStepIdentity.mayorRedirect()',
              '                    step.action == ClocktowerNightAction.DemonKill ->',
              '                        ClocktowerProductionNightStepIdentity.role(RoleId("Imp"))',
              '                    else -> ClocktowerProductionNightStepIdentity.role(',
              '                        RoleId(requireNotNull(step.roleEnName) {',
              '                            "Other-night production step is missing a stable role identity."',
              '                        }),',
              '                    )',
              '                }',
              '            },',
              '        )',
              '    }',
          )
          host = host[:start] + replacement + host[end:]
          host_path.write_text(host, encoding="utf-8")

          differential_path = Path("app/src/test/java/com/codex/campboardgamehost/clocktower/flow/ClocktowerLegacyPlannerDifferentialTest.kt")
          differential = differential_path.read_text(encoding="utf-8")
          test_start = '    @Test\n    fun `production other-night legacy priority remains the differential anchor after first-night cutover`() {'
          test_end = '\n\n    @Test\n    fun `first-night shadow projection matches the canonical production order`() {'
          if differential.count(test_start) != 1:
              raise SystemExit(f"differential test start: expected exactly one anchor, found {differential.count(test_start)}")
          if differential.count(test_end) != 1:
              raise SystemExit(f"differential test end: expected exactly one anchor, found {differential.count(test_end)}")
          ds = differential.index(test_start)
          de = differential.index(test_end, ds)
          new_test = block(
              '    @Test',
              '    fun `production night ordering is owned by canonical planner seams after cutover`() {',
              '        assertFalse(',
              '            "Combined legacy night-order table must remain removed.",',
              '            legacyHostSource.contains("fun officialNightOrder(step: ClocktowerNightStepUi): Int"),',
              '        )',
              '        assertFalse(',
              '            "Other-night legacy numeric order table must be removed after cutover.",',
              '            legacyHostSource.contains("fun legacyOtherNightOrder(step: ClocktowerNightStepUi): Int"),',
              '        )',
              '        assertFalse(',
              '            "Production must not sort night steps through the legacy numeric table.",',
              '            legacyHostSource.contains("filteredNightSteps.sortedBy(::legacyOtherNightOrder)"),',
              '        )',
              '        assertTrue(',
              '            "Production first night must be owned by the canonical planner seam.",',
              '            legacyHostSource.contains("ClocktowerProductionFirstNightFlow.order("),',
              '        )',
              '        assertTrue(',
              '            "Production other night must be owned by the event-aware canonical planner seam.",',
              '            legacyHostSource.contains("ClocktowerProductionOtherNightFlow.order("),',
              '        )',
              '    }',
          )
          differential = differential[:ds] + new_test + differential[de:]
          differential_path.write_text(differential, encoding="utf-8")
          PY
          git diff --check
          git diff -- app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt app/src/test/java/com/codex/campboardgamehost/clocktower/flow/ClocktowerLegacyPlannerDifferentialTest.kt
      - name: Commit exact patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt app/src/test/java/com/codex/campboardgamehost/clocktower/flow/ClocktowerLegacyPlannerDifferentialTest.kt
          git diff --cached --quiet && exit 0
          git commit -m "feat(r5.5): cut production other night to planner"
          git push origin HEAD:codex/storyteller-algorithm-v4
