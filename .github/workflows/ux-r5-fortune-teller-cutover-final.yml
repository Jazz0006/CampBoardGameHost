name: UX-R5 Fortune Teller final cutover

on:
  push:
    branches:
      - codex/ux-r5-small-domain-specialization
    paths:
      - .github/workflows/ux-r5-fortune-teller-cutover-final.yml

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: codex/ux-r5-small-domain-specialization
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Lock exact trigger state and target blobs
        env:
          EXPECTED_PARENT: bbad80c9c2875f4203d9830f2066d324975f77b0
          EXPECTED_HOST_BLOB: a87b00ffae3cb11b0605f53f3f9fd36cff30ad1c
          EXPECTED_NIGHT_BLOB: 98171a02838ee5d17541b06da4888d59ece2f88b
          EXPECTED_SCRIPT_BLOB: 850207ce76b1f1c76959e0ec3893c0109237d32b
          BRANCH: codex/ux-r5-small-domain-specialization
          HOST: app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt
          NIGHT: app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          SCRIPT: .github/scripts/ux_r5_fortune_teller_cutover.py
          WORKFLOW: .github/workflows/ux-r5-fortune-teller-cutover-final.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-parse HEAD:$HOST)" = "$EXPECTED_HOST_BLOB"
          test "$(git rev-parse HEAD:$NIGHT)" = "$EXPECTED_NIGHT_BLOB"
          test "$(git rev-parse HEAD:$SCRIPT)" = "$EXPECTED_SCRIPT_BLOB"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          test "$changed" = "$WORKFLOW"
          remote_head="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          test -f .github/scripts/ux_r5_fortune_teller_cutover_patch.py
          test -f .github/scripts/ux_r5_fortune_teller_cutover_fix.py
          test -f .github/workflows/ux-r5-fortune-teller-cutover-one-shot.yml
          test -f .github/workflows/ux-r5-fortune-teller-cutover-rerun.yml

      - name: Apply exact typed Fortune Teller cutover
        run: python3 .github/scripts/ux_r5_fortune_teller_cutover.py

      - name: Exact production diff audit
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            'app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt'
            'app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt'
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done
          test "$(grep -F -c 'displayProposition = fortuneTellerMatched?.let { matched ->' app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt)" -eq 2
          test "$(grep -F -c 'StructuredBooleanInformationDecisionPanel(' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt)" -eq 1
          test "$(grep -F -c 'findBooleanDisplayOption(' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt)" -eq 1
          grep -F 'step.informationReliability != InformationReliability.RELIABLE' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          grep -F 'informationDecisionExpectedSnapshot = model.contextSnapshot' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          if grep -Fq 'fortuneTellerYesLabel' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt; then
            echo 'Fortune Teller cutover must not synthesize display identity from localized labels' >&2
            exit 1
          fi

      - name: Focused Fortune Teller and numeric GREEN
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.StructuredFortuneTellerInformationAdapterTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerBooleanDisplayOptionSelectionTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerFortuneTellerPhaseAuthorityTest' \
            --tests 'com.codex.campboardgamehost.StructuredChefInformationAdapterTest' \
            --tests 'com.codex.campboardgamehost.StructuredEmpathInformationAdapterTest' \
            --tests 'com.codex.campboardgamehost.clocktower.session.SmallDomainPresentationTest' \
            --rerun-tasks --no-daemon

      - name: UX-R5 small-domain checkpoint FAST suite
        run: ./gradlew :app:testFast --no-daemon --build-cache

      - name: Commit Fortune Teller product cutover
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt \
            app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt
          git commit -m 'UX-R5: wire Fortune Teller structured boolean presentation'

      - name: Self-remove every Fortune Teller one-shot file
        run: |
          set -euo pipefail
          git rm \
            .github/scripts/ux_r5_fortune_teller_cutover.py \
            .github/scripts/ux_r5_fortune_teller_cutover_patch.py \
            .github/scripts/ux_r5_fortune_teller_cutover_fix.py \
            .github/workflows/ux-r5-fortune-teller-cutover-one-shot.yml \
            .github/workflows/ux-r5-fortune-teller-cutover-rerun.yml \
            .github/workflows/ux-r5-fortune-teller-cutover-final.yml
          git commit -m 'chore: remove UX-R5 Fortune Teller one-shots'

      - name: Push exact branch successor
        env:
          BRANCH: codex/ux-r5-small-domain-specialization
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
