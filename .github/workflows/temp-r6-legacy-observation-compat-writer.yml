name: Temp R6 legacy observation compatibility writer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/r6-legacy-observation-compat-writer-temp
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply exact LegacyLocal compatibility branch
        shell: python
        run: |
          from pathlib import Path
          path = Path("app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt")
          text = path.read_text(encoding="utf-8")
          start_anchor = "    fun recordEpistemicObservation(draft: EpistemicObservationDraft) {"
          end_anchor = "    fun addClocktowerEvent(\n"
          if text.count(start_anchor) != 1 or text.count(end_anchor) != 1:
              raise SystemExit("record/event anchors are not unique")
          start = text.index(start_anchor)
          end = text.index(end_anchor, start)
          old = text[start:end]
          required = [
              "ClocktowerGameSession.commitGlobalEpistemicObservation(",
              "clocktowerEpistemicObservations.addAll(committed.observationLog.records)",
              "clocktowerPlayerInputRevision = committed.playerInputRevision",
              "clocktowerNextTimelineGlobalSequence = committed.nextTimelineGlobalSequence",
              "a4ObservationDurabilityGate.markPending(committed.record.recordId)",
          ]
          for needle in required:
              if needle not in old:
                  raise SystemExit(f"unexpected current Global seam; missing {needle}")
          new = '''    fun recordEpistemicObservation(draft: EpistemicObservationDraft) {
              when (clocktowerSemanticHistoryMode) {
                  ClocktowerSemanticHistoryMode.LEGACY_LOCAL -> {
                      if (clocktowerEpistemicObservations.any { it.recordId == draft.recordId }) return
                      clocktowerEpistemicObservations += draft.bindLegacyLocal()
                      advanceClocktowerPlayerInputRevision()
                      a4ObservationDurabilityGate.markPending(draft.recordId)
                  }
                  ClocktowerSemanticHistoryMode.GLOBAL_V1 -> {
                      val committed = ClocktowerGameSession.commitGlobalEpistemicObservation(
                          semanticHistoryMode = clocktowerSemanticHistoryMode,
                          observationLog = EpistemicObservationLog(clocktowerEpistemicObservations.toList()),
                          nextTimelineGlobalSequence = clocktowerNextTimelineGlobalSequence,
                          playerInputRevision = clocktowerPlayerInputRevision,
                          draft = draft,
                      )
                      clocktowerEpistemicObservations.clear()
                      clocktowerEpistemicObservations.addAll(committed.observationLog.records)
                      clocktowerPlayerInputRevision = committed.playerInputRevision
                      clocktowerNextTimelineGlobalSequence = committed.nextTimelineGlobalSequence
                      a4ObservationDurabilityGate.markPending(committed.record.recordId)
                  }
              }
          }

          '''
          path.write_text(text[:start] + new + text[end:], encoding="utf-8")
      - name: Validate focused contracts
        run: |
          git diff --check
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests com.codex.campboardgamehost.ClocktowerGlobalObservationProductionWiringTest \
            --tests com.codex.campboardgamehost.clocktower.session.ClocktowerGlobalObservationCommitTest \
            --tests com.codex.campboardgamehost.ActiveGameSemanticHistoryProductionWiringTest \
            --console=plain
      - name: Commit generated App blob
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          git diff --cached --check
          git commit -m "temp: materialize legacy observation compatibility patch"
          git push origin HEAD:codex/r6-legacy-observation-compat-writer-temp
