name: One-shot AGENTS fan-out gate

on:
  push:
    branches:
      - codex/dead-player-square-table
    paths:
      - .github/workflows/one-shot-agents-fanout-gate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact working branch
        uses: actions/checkout@v6
        with:
          ref: codex/dead-player-square-table
          fetch-depth: 0

      - name: Verify exact head and AGENTS blob
        shell: bash
        run: |
          set -euo pipefail
          event_head="${GITHUB_SHA}"
          local_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote origin refs/heads/codex/dead-player-square-table | awk '{print $1}')"
          [[ "$local_head" == "$event_head" ]]
          [[ "$remote_head" == "$event_head" ]]
          agents_blob="$(git rev-parse HEAD:AGENTS.md)"
          [[ "$agents_blob" == "f27fa1b740221312d54f79eaed2aafbd98de7152" ]]
          test -f .github/scripts/patch_agents_fanout_gate.py

      - name: Apply exact-anchor AGENTS patch
        run: python .github/scripts/patch_agents_fanout_gate.py

      - name: Audit docs-only diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          [[ ${#changed[@]} -eq 1 ]]
          [[ "${changed[0]}" == "AGENTS.md" ]]
          grep -Fq '### 3.1.1 Shared-contract / fan-out gate' AGENTS.md
          grep -Fq '"Shared renderer without shared projection" is an architecture smell' AGENTS.md

      - name: Commit docs patch and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/codex/dead-player-square-table | awk '{print $1}')"
          [[ "$remote_head" == "${GITHUB_SHA}" ]]
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AGENTS.md
          git rm .github/scripts/patch_agents_fanout_gate.py .github/workflows/one-shot-agents-fanout-gate.yml
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=(
            .github/scripts/patch_agents_fanout_gate.py
            .github/workflows/one-shot-agents-fanout-gate.yml
            AGENTS.md
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          [[ ${#staged[@]} -eq ${#expected_sorted[@]} ]]
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${staged[@]}")
          git diff --cached --check
          git commit -m 'docs: require shared-contract fan-out audit'
          git push origin HEAD:codex/dead-player-square-table
