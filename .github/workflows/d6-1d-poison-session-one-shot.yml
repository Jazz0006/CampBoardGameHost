name: D6.1d Poison Session Boundary One Shot

on:
  push:
    branches:
      - codex/d6-root-reaudit
    paths:
      - .github/workflows/d6-1d-poison-session-one-shot.yml
      - scripts/d6_1d_poison_session_patch.py

permissions:
  contents: write

jobs:
  patch-test-push-cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trigger head
        uses: actions/checkout@v6
        with:
          fetch-depth: 3

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify fail-closed baseline
        shell: bash
        run: |
          set -euo pipefail
          base='ae4306bb365a67d600a976070b27c719363d3137'
          test "$(git rev-parse HEAD~2)" = "$base"
          test "$(git rev-parse "$base":app/src/main/java/com/codex/campboardgamehost/clocktower/session/ClocktowerGameSession.kt)" = "aac51d57d2182acb86ac5d426a1af6018a43e09e"
          test "$(git rev-parse "$base":app/src/test/java/com/codex/campboardgamehost/clocktower/session/ClocktowerGameSessionPoisonBoundaryTest.kt)" = "dcb78fea4a515fb9e7a2cf033c634ed1b181f2f4"
          if git cat-file -e "$base":app/src/main/java/com/codex/campboardgamehost/clocktower/session/ClocktowerGameSessionPoisonBoundaries.kt 2>/dev/null; then
            echo 'Poison boundary source unexpectedly already exists.' >&2
            exit 1
          fi
          expected=$(printf '%s\n' '.github/workflows/d6-1d-poison-session-one-shot.yml' 'scripts/d6_1d_poison_session_patch.py')
          actual=$(git diff --name-only "$base" HEAD | sort)
          test "$actual" = "$expected"
          test -z "$(git status --porcelain)"

      - name: Apply bounded session patch
        run: python3 scripts/d6_1d_poison_session_patch.py

      - name: Audit exact product diff
        shell: bash
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' \
            'app/src/main/java/com/codex/campboardgamehost/clocktower/session/ClocktowerGameSession.kt' \
            'app/src/main/java/com/codex/campboardgamehost/clocktower/session/ClocktowerGameSessionPoisonBoundaries.kt')
          actual=$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort)
          test "$actual" = "$expected"
          git diff --check
          test "$(grep -c '^    fun synchronizeGameStateWithinCurrentRevision(nextState: GameState): ClocktowerSessionState {' app/src/main/java/com/codex/campboardgamehost/clocktower/session/ClocktowerGameSession.kt)" -eq 1
          test "$(grep -c '^internal fun ClocktowerGameSession.commitPoisonTargetBoundary(' app/src/main/java/com/codex/campboardgamehost/clocktower/session/ClocktowerGameSessionPoisonBoundaries.kt)" -eq 1
          test "$(grep -c '^internal fun ClocktowerGameSession.synchronizePoisonTargetWithinCurrentRevision(' app/src/main/java/com/codex/campboardgamehost/clocktower/session/ClocktowerGameSessionPoisonBoundaries.kt)" -eq 1
          git diff -- app/src/main/java/com/codex/campboardgamehost/clocktower/session/ClocktowerGameSession.kt
          cat app/src/main/java/com/codex/campboardgamehost/clocktower/session/ClocktowerGameSessionPoisonBoundaries.kt

      - name: Run focused session contracts
        run: ./gradlew :app:testDebugUnitTest --tests 'com.codex.campboardgamehost.clocktower.session.ClocktowerGameSessionPoisonBoundaryTest' --tests 'com.codex.campboardgamehost.clocktower.session.ClocktowerGameSessionGameStateBoundaryTest' --tests 'com.codex.campboardgamehost.clocktower.session.ClocktowerGameSessionRoleIdentityBoundaryTest' --no-daemon --build-cache

      - name: Run Android FAST
        run: ./gradlew :app:testFast --no-daemon --build-cache

      - name: Commit and push product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/codex/campboardgamehost/clocktower/session/ClocktowerGameSession.kt app/src/main/java/com/codex/campboardgamehost/clocktower/session/ClocktowerGameSessionPoisonBoundaries.kt
          expected=$(printf '%s\n' \
            'app/src/main/java/com/codex/campboardgamehost/clocktower/session/ClocktowerGameSession.kt' \
            'app/src/main/java/com/codex/campboardgamehost/clocktower/session/ClocktowerGameSessionPoisonBoundaries.kt')
          actual=$(git diff --cached --name-only | sort)
          test "$actual" = "$expected"
          git commit -m 'feat: add Clocktower poison state boundaries'
          git push origin HEAD:codex/d6-root-reaudit

      - name: Remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/d6-1d-poison-session-one-shot.yml scripts/d6_1d_poison_session_patch.py
          git commit -m 'chore: remove D6.1d poison-session one-shot tooling'
          git push origin HEAD:codex/d6-root-reaudit
