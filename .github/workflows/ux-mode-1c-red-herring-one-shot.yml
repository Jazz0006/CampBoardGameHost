name: UX-MODE-1C Red Herring one-shot

on:
  push:
    branches:
      - codex/ux-mode-1

permissions:
  contents: write

jobs:
  patch-red-herring:
    if: "${{ github.event.head_commit.message == 'chore: stage UX-MODE-1C Red Herring workflow' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate exact head and locked blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote origin refs/heads/codex/ux-mode-1 | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt)" = '249893bdb952bf8d18edee4756d672b39724fdd0'
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/ClocktowerRedHerringAutoAdvanceWiringTest.kt)" = '446b7ff27823928d9ca31ddec6c3ddecd0627e75'
          test -z "$(git status --porcelain)"

      - name: Apply exact Red Herring patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ux_mode_1c_red_herring_patch.py

      - name: Exact diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = 'app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt'
          test "$(grep -c 'shouldAutoAdvanceRedHerring(' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt)" = '1'
          grep -q 'isRedHerringStep = step.action == ClocktowerNightAction.RedHerring' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          grep -q 'isRealAction = step.isRealAction' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          grep -q 'hasSelectedRedHerring = selectedName != null' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Focused Red Herring validation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerRedHerringAutoAdvanceWiringTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerHostSelectionSemanticsCharacterizationTest' \
            --rerun-tasks --no-daemon

      - name: Commit and push product patch
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/codex/ux-mode-1 | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          git commit -m 'feat: auto-advance beginner Red Herring setup'
          git push origin HEAD:codex/ux-mode-1

      - name: Remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/ux_mode_1c_red_herring_patch.py
          rm .github/workflows/ux-mode-1c-red-herring-one-shot.yml
          git add -A
          git commit -m 'chore: remove UX-MODE-1C Red Herring one-shot files'
          git push origin HEAD:codex/ux-mode-1
