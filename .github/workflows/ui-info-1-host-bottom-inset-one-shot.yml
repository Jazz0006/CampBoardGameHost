name: UI-INFO-1 host bottom inset one-shot

on:
  push:
    branches:
      - codex/ui-info-1-beginner-night-guidance
    paths:
      - .github/workflows/ui-info-1-host-bottom-inset-one-shot.yml

permissions:
  contents: write

jobs:
  red-patch-test-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: codex/ui-info-1-beginner-night-guidance
          fetch-depth: 0

      - name: Lock branch and blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/codex/ui-info-1-beginner-night-guidance | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerNightActionSquareTableUi.kt)" = "712597cf26fac42c4e857bc7f3e0f5cb88689794"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerDayTableScaffoldUi.kt)" = "d5663e004e44cfd451bc14a9a48c467688e90316"
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/ClocktowerHostBottomInsetPolicyTest.kt)" = "0753980101c7d1fd1be1eaf94528ad378419143a"
          test "$(git hash-object .github/scripts/ui_info_1_host_bottom_inset_patch.py)" = "4fa48c3ec9d6dcbc528fe8baa71411f070a9c4b5"
          test ! -e app/src/main/java/com/codex/campboardgamehost/ClocktowerHostBottomInsetPolicy.kt

      - name: Focused RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerHostBottomInsetPolicyTest' \
            --rerun-tasks --no-daemon > inset-red.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -Eq 'ClocktowerHostBottomInsetPolicy|clocktowerHostBottomInsetPolicy' inset-red.log
          echo 'RED confirmed: shared Clocktower bottom inset policy is absent before production patch.'

      - name: Apply fail-closed production patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ui_info_1_host_bottom_inset_patch.py

      - name: Focused GREEN
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerHostBottomInsetPolicyTest' \
            --rerun-tasks --no-daemon

      - name: Android fast suite
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testFast --no-daemon

      - name: Structural inset ownership audit
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn 'navigationBarsIgnoringVisibility' app/src/main
          test "$(grep -c 'clocktowerHostBottomNavigationBarPadding()' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightActionSquareTableUi.kt)" = "1"
          test "$(grep -c 'clocktowerHostBottomNavigationBarPadding()' app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerDayTableScaffoldUi.kt)" = "1"
          test "$(grep -RIl 'hide(WindowInsetsCompat.Type.systemBars())' app/src/main/java | wc -l)" = "1"
          grep -q 'hide(WindowInsetsCompat.Type.systemBars())' app/src/main/java/com/codex/campboardgamehost/MainActivity.kt

      - name: Remove temporary one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ui-info-1-host-bottom-inset-one-shot.yml
          rm .github/scripts/ui_info_1_host_bottom_inset_patch.py
          rm -f inset-red.log

      - name: Exact diff audit
        shell: bash
        run: |
          set -euo pipefail
          git add -N app/src/main/java/com/codex/campboardgamehost/ClocktowerHostBottomInsetPolicy.kt
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/scripts/ui_info_1_host_bottom_inset_patch.py' \
            '.github/workflows/ui-info-1-host-bottom-inset-one-shot.yml' \
            'app/src/main/java/com/codex/campboardgamehost/ClocktowerHostBottomInsetPolicy.kt' \
            'app/src/main/java/com/codex/campboardgamehost/ClocktowerNightActionSquareTableUi.kt' \
            'app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerDayTableScaffoldUi.kt' | sort)"
          test "$actual" = "$expected"
          git diff -- app/src/main/java/com/codex/campboardgamehost/ClocktowerHostBottomInsetPolicy.kt
          git diff -- app/src/main/java/com/codex/campboardgamehost/ClocktowerNightActionSquareTableUi.kt
          git diff -- app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerDayTableScaffoldUi.kt

      - name: Commit and push inset fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Jazz0006'
          git config user.email '37370802+Jazz0006@users.noreply.github.com'
          git add -A
          git commit -m 'fix: unify immersive host bottom insets'
          test "$(git ls-remote origin refs/heads/codex/ui-info-1-beginner-night-guidance | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:codex/ui-info-1-beginner-night-guidance
