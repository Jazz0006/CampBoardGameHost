name: R4D2 Confirmed Roster Authority One Shot

on:
  push:
    branches:
      - codex/ui-r4d2-seating-first-setup

permissions:
  contents: write

jobs:
  patch-validate-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Lock branch and source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote origin refs/heads/codex/ui-r4d2-seating-first-setup | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" = "41da326514ab6f9ba8764e3d35cf6e487967fff5"
          test "$(git hash-object .github/scripts/r4d2_confirmed_roster_authority_patch.py)" = "32b89cd06d2dbf961deeb1dd28e24cfc37136317"

      - name: Confirm production roster authority contract was RED
        shell: bash
        run: |
          set -euo pipefail
          green_head="$GITHUB_SHA"
          git checkout 97088e45c6e2b9c61dd05f59f818887dfd25f32d
          set +e
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.HostSeatingRosterTest' \
            --rerun-tasks --no-daemon 2>&1 | tee "$RUNNER_TEMP/r4d2-authority-red.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -Fq 'playerNamesFor' "$RUNNER_TEMP/r4d2-authority-red.log"
          git checkout "$green_head"

      - name: Validate small seating authority before App patch
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.HostSeatingRosterTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerHostTableContractTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerHostTableGameStateProjectionTest' \
            --rerun-tasks --no-daemon 2>&1 | tee "$RUNNER_TEMP/r4d2-authority-green.log"
          if grep -E 'HostSeatingRoster\.kt:.*Non-public primary constructor' "$RUNNER_TEMP/r4d2-authority-green.log"; then
            echo 'New HostSeatingRoster data-class visibility warning remains' >&2
            exit 1
          fi

      - name: Apply exact confirmed-roster App patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/r4d2_confirmed_roster_authority_patch.py
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" != "41da326514ab6f9ba8764e3d35cf6e487967fff5"
          changed="$(git diff --name-only)"
          test "$changed" = "app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt"
          test "$(grep -Fc 'val playerNames = hostSeatingSetupFlow.playerNamesFor' app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" -eq 4

      - name: Run focused seating-first behavior tests
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.HostSeatingRosterTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerHostTableContractTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerHostTableGameStateProjectionTest' \
            --rerun-tasks --no-daemon

      - name: Run Android FAST unit tests
        run: ./gradlew :app:testFast --no-daemon --build-cache

      - name: Exact diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt"

      - name: Commit authority patch and self-remove temporary writer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          git rm .github/workflows/r4d2-confirmed-roster-authority-one-shot.yml
          git rm .github/scripts/r4d2_confirmed_roster_authority_patch.py
          git commit -m "fix: bind game starts to confirmed seating roster"
          git push origin HEAD:codex/ui-r4d2-seating-first-setup
