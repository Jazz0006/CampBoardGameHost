name: F7.3 seating presentation GREEN

on:
  push:
    branches:
      - codex/ui-r4d2-seating-first-setup

permissions:
  contents: write

jobs:
  seating-presentation-green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Apply F7.3 patch
        run: python .github/scripts/f7_3_patch.py

      - name: Run focused F7.3 contracts
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests com.codex.campboardgamehost.ClocktowerSeatNumberLabelTest \
            --tests com.codex.campboardgamehost.ClocktowerHostTableContractTest \
            --tests com.codex.campboardgamehost.ClocktowerSquareTableSeatLayoutTest \
            --tests com.codex.campboardgamehost.ClocktowerHostTableReorderTest \
            --tests com.codex.campboardgamehost.HostSeatingRosterTest \
            --no-daemon

      - name: Run Android FAST regression
        run: ./gradlew :app:testFast --no-daemon --build-cache

      - name: Remove temporary validation files
        run: |
          rm .github/scripts/f7_3_patch.py
          rm .github/workflows/f7-3-seating-presentation-green.yml

      - name: Audit exact permanent diff
        run: |
          set -euo pipefail
          git add -N app/src/main/java/com/codex/campboardgamehost/ClocktowerSeatNumberLabel.kt
          git add -N app/src/test/java/com/codex/campboardgamehost/ClocktowerSeatNumberLabelTest.kt
          git diff --check
          git diff --name-only 3b757cdfcca5a672b4d500a1da12a95db680213b | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          app/src/main/java/com/codex/campboardgamehost/ClocktowerHostTableUi.kt
          app/src/main/java/com/codex/campboardgamehost/ClocktowerPlayerDisplayUi.kt
          app/src/main/java/com/codex/campboardgamehost/ClocktowerSeatNumberLabel.kt
          app/src/main/java/com/codex/campboardgamehost/ClocktowerSquareTableUi.kt
          app/src/main/java/com/codex/campboardgamehost/SeatingFirstSetupUi.kt
          app/src/test/java/com/codex/campboardgamehost/ClocktowerSeatNumberLabelTest.kt
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          ! grep -E '前移|后移|Earlier|Later' app/src/main/java/com/codex/campboardgamehost/SeatingFirstSetupUi.kt

      - name: Commit verified F7.3 product checkpoint
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(F7.3): simplify seating presentation"
          git push origin HEAD:codex/ui-r4d2-seating-first-setup
