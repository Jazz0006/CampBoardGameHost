name: UI-NAV-1D generic game one-shot

on:
  push:
    branches:
      - codex/ui-nav-1-global-navigation-visual-unification
    paths:
      - .github/workflows/ui-nav-1d-game-one-shot.yml

permissions:
  contents: write

jobs:
  migrate-generic-game-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact trigger parent and source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "codex/ui-nav-1-global-navigation-visual-unification"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "57da20ae2d10995a93a14f4a66352c43fbcd0bba"
          remote_head="$(git ls-remote origin refs/heads/codex/ui-nav-1-global-navigation-visual-unification | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" = "c881a361b7af924e2365cb6a5051986470ee3c8a"
          test "$(git rev-parse HEAD:app/src/main/java/com/codex/campboardgamehost/AppGameScreen.kt)" = "31bc252f2fae37b79b6d6ce57aff89bca57f9624"
          test "$(git rev-parse HEAD:.github/scripts/ui_nav_1d_game_cleanup.py)" = "1a48fd7f25c0136b750ef2992b66d3eba055528f"

      - name: Apply exact generic Game migration
        run: python .github/scripts/ui_nav_1d_game_cleanup.py

      - name: Audit exact production diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            app/src/main/java/com/codex/campboardgamehost/AppGameScreen.kt \
            app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt | sort)"
          test "$changed" = "$expected"
          grep -Fq 'HostBottomActionBar(' app/src/main/java/com/codex/campboardgamehost/AppGameScreen.kt
          grep -Fq 'onHostTools: () -> Unit' app/src/main/java/com/codex/campboardgamehost/AppGameScreen.kt
          grep -Fq 'Screen.Game -> GameScreen(' app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          grep -Fq 'onHostTools = {' app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          ! grep -Fq 'colors = ButtonDefaults.buttonColors(containerColor = MaterialTheme.colorScheme.secondary)' app/src/main/java/com/codex/campboardgamehost/AppGameScreen.kt

      - name: Run Android FAST checkpoint
        run: ./gradlew :app:testFast --rerun-tasks

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --rerun-tasks

      - name: Commit and push generic Game migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote_head="$(git ls-remote origin refs/heads/codex/ui-nav-1-global-navigation-visual-unification | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git add \
            app/src/main/java/com/codex/campboardgamehost/AppGameScreen.kt \
            app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          git commit -m "ui: move generic game navigation to bottom bar"
          git push origin HEAD:codex/ui-nav-1-global-navigation-visual-unification

      - name: Remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ui-nav-1d-game-one-shot.yml
          rm .github/scripts/ui_nav_1d_game_cleanup.py
          git add -A \
            .github/workflows/ui-nav-1d-game-one-shot.yml \
            .github/scripts/ui_nav_1d_game_cleanup.py
          git commit -m "chore: remove UI-NAV-1D generic game one-shot"
          git push origin HEAD:codex/ui-nav-1-global-navigation-visual-unification
