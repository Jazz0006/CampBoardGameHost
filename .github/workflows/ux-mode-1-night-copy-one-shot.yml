name: UX-MODE-1 night copy one-shot

on:
  push:
    branches:
      - codex/ux-mode-1
    paths:
      - .github/workflows/ux-mode-1-night-copy-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: codex/ux-mode-1
          fetch-depth: 0

      - name: Verify bootstrap head and locked blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "80d1690bd5765167fc7130d3083197270a90bba5"
          test "$(git ls-remote origin refs/heads/codex/ux-mode-1 | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt)" = "cea4287b0d5d561cc78c3c645f290673092c45ec"
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/ClocktowerNightStepExperienceCopyContractTest.kt)" = "c1993bda23568b2470cd2e02174c22503aabe650"
          test "$(git hash-object .github/scripts/ux_mode_1_night_copy_patch.py)" = "77251ad8d61bfde73e086ca912fd978a3256ce89"
          test -z "$(git status --porcelain)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prove focused RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerNightStepExperienceCopyContractTest' \
            --rerun-tasks --no-daemon 2>&1 | tee /tmp/night-copy-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'night recommendation copy uses Beginner and Experienced interaction semantics' /tmp/night-copy-red.log
          grep -F 'FAILED' /tmp/night-copy-red.log

      - name: Apply exact production patch
        run: python3 .github/scripts/ux_mode_1_night_copy_patch.py

      - name: Run focused GREEN
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerNightStepExperienceCopyContractTest' \
            --rerun-tasks --no-daemon

      - name: Run FAST checkpoint
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testFast --rerun-tasks --no-daemon

      - name: Exact diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt"
          read -r added deleted path < <(git diff --numstat -- app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt)
          test "$added" = "2"
          test "$deleted" = "2"
          test "$path" = "app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt"
          test "$(grep -Fc 'The recommended information has been selected automatically.' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt)" -eq 1
          test "$(grep -Fc '推荐信息已自动选定' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt)" -eq 1
          test "$(grep -Fc 'Choose another legal option only if you want to intervene manually.' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt)" -eq 1
          test "$(grep -Fc '仅在需要手动干预时选择其他合法信息' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt)" -eq 1
          ! grep -Fq 'The automatic mode selected this information.' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          ! grep -Fq '已按当前自动模式选定信息' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          ! grep -Fq 'The balanced option is the default' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          ! grep -Fq '平衡方案适合直接采用' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          git diff -- app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt

      - name: Reconfirm remote head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/ux-mode-1 | cut -f1)" = "$GITHUB_SHA"

      - name: Commit and push product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -eq 1
          test "${staged[0]}" = "app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt"
          git commit -m 'fix: align night recommendation copy with experience modes'
          git push origin HEAD:codex/ux-mode-1
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/ux-mode-1 | cut -f1)" = "$(git rev-parse HEAD)"
          git rm .github/workflows/ux-mode-1-night-copy-one-shot.yml .github/scripts/ux_mode_1_night_copy_patch.py
          git commit -m 'chore(ci): remove night copy one-shot scaffolding'
          git push origin HEAD:codex/ux-mode-1
          echo "CLEANUP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report checkpoints
        run: |
          echo "Product checkpoint: $PRODUCT_SHA"
          echo "Cleanup checkpoint: $CLEANUP_SHA"
