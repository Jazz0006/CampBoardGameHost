name: tmp-discover-nightstep-caller
on:
  push:
    branches:
      - ui-polish-poison-top3-2026-09-15
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find Judge and NightStep call sites
        run: |
          set -euxo pipefail
          rg -n "fun ClocktowerJudgeScreen|ClocktowerNightStepCardLocalized" app/src/main/java app/src/test || true
