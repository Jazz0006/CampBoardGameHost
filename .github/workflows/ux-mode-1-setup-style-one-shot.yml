name: UX-MODE-1 setup-style one-shot large-file patch

on:
  push:
    branches:
      - codex/ux-mode-1
    paths:
      - .github/workflows/ux-mode-1-setup-style-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: codex/ux-mode-1
      TARGET_FILE: app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt
      TEST_FILE: app/src/test/java/com/codex/campboardgamehost/ClocktowerSetupRecommendationStyleWiringTest.kt
      PATCH_SCRIPT: .github/scripts/ux_mode_1_setup_style_patch.py
      WORKFLOW_FILE: .github/workflows/ux-mode-1-setup-style-one-shot.yml
      EXPECTED_PARENT: f6a70f03e8289352802467a779c0c12fb3410726
      EXPECTED_TARGET_BLOB: d898d4db93427bb222e6a68661d80f38bba36d4d
      EXPECTED_TEST_BLOB: 0b230e2ecf6f99211f1af5c5321a19954e8cabad
      EXPECTED_SCRIPT_BLOB: 9b458ddd30befe11cdb3c43e50af58771ba294d3
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          ref: codex/ux-mode-1
          fetch-depth: 0

      - name: Verify bootstrap head and blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object "$TARGET_FILE")" = "$EXPECTED_TARGET_BLOB"
          test "$(git hash-object "$TEST_FILE")" = "$EXPECTED_TEST_BLOB"
          test "$(git hash-object "$PATCH_SCRIPT")" = "$EXPECTED_SCRIPT_BLOB"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Prove focused RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerSetupRecommendationStyleWiringTest' \
            --rerun-tasks --no-daemon 2>&1 | tee /tmp/red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'ClocktowerSetupRecommendationStyleWiringTest > first-night setup selection uses the unified automatic Storyteller style FAILED' /tmp/red.log

      - name: Apply exact production patch
        run: python3 "$PATCH_SCRIPT"

      - name: Run focused GREEN
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerSetupRecommendationStyleWiringTest' \
            --rerun-tasks --no-daemon

      - name: Run Android FAST checkpoint
        run: ./gradlew :app:testFast --rerun-tasks --no-daemon

      - name: Exact diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$TARGET_FILE"
          test "$(git diff --numstat -- "$TARGET_FILE")" = $'3\t3\tapp/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt'
          test "$(grep -Fxc '        mutableStateOf(automaticStorytellerStyle)' "$TARGET_FILE")" -eq 1
          test "$(grep -Fxc '                    selectedRecommendationStyle = automaticStorytellerStyle' "$TARGET_FILE")" -eq 2
          test "$(grep -Fc 'fun recommendedDrunkInvestigatorOption(actor: PlayerCard): ClocktowerDisplayOption?' "$TARGET_FILE")" -eq 1
          test "$(grep -Fc 'listOfNotNull(recommendedDrunkInvestigatorOption(actor))' "$TARGET_FILE")" -eq 1
          git diff -- "$TARGET_FILE"

      - name: Reconfirm remote head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$GITHUB_SHA"

      - name: Commit and push production patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET_FILE"
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -eq 1
          test "${staged[0]}" = "$TARGET_FILE"
          git commit -m 'fix: unify setup recommendation style default'
          git push origin HEAD:"$TARGET_BRANCH"
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$PRODUCT_SHA"
          git rm "$WORKFLOW_FILE" "$PATCH_SCRIPT"
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -eq 2
          printf '%s\n' "${staged[@]}" | grep -Fx "$PATCH_SCRIPT"
          printf '%s\n' "${staged[@]}" | grep -Fx "$WORKFLOW_FILE"
          git commit -m 'chore(ci): remove UX mode setup-style one-shot workflow'
          git push origin HEAD:"$TARGET_BRANCH"
          echo "CLEANUP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report checkpoints
        run: |
          echo "Product checkpoint: $PRODUCT_SHA"
          echo "Cleanup checkpoint: $CLEANUP_SHA"
