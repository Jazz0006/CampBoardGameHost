name: UX-MODE-1 Demon bluff style one-shot large-file patch

on:
  push:
    branches:
      - codex/ux-mode-1
    paths:
      - .github/workflows/ux-mode-1-demon-bluff-style-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: codex/ux-mode-1
      PRESENTATION_FILE: app/src/main/java/com/codex/campboardgamehost/ClocktowerDemonBluffPresentation.kt
      HOST_FILE: app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt
      TEST_FILE: app/src/test/java/com/codex/campboardgamehost/ClocktowerDemonBluffPresentationTest.kt
      PATCH_SCRIPT: .github/scripts/ux_mode_1_demon_bluff_style_patch.py
      WORKFLOW_FILE: .github/workflows/ux-mode-1-demon-bluff-style-one-shot.yml
      EXPECTED_PARENT: a8b071847a0b10d7472d9e1da277a526ac6ce0d8
      EXPECTED_PRESENTATION_BLOB: d7541990267bd6e14252dea66e9fea1a906ee99a
      EXPECTED_HOST_BLOB: 6e37c1d83ebcf5ae356a27386e33956c684e2d47
      EXPECTED_TEST_BLOB: bf6a3d7d58877f2cdf5b1992909e848cb806242d
      EXPECTED_SCRIPT_BLOB: a9ae7c639e886ff9260b1b1587bd4e64a1ff58d8
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          ref: codex/ux-mode-1
          fetch-depth: 0

      - name: Verify bootstrap head and blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object "$PRESENTATION_FILE")" = "$EXPECTED_PRESENTATION_BLOB"
          test "$(git hash-object "$HOST_FILE")" = "$EXPECTED_HOST_BLOB"
          test "$(git hash-object "$TEST_FILE")" = "$EXPECTED_TEST_BLOB"
          test "$(git hash-object "$PATCH_SCRIPT")" = "$EXPECTED_SCRIPT_BLOB"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Prove focused RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerDemonBluffPresentationTest' \
            --rerun-tasks --no-daemon 2>&1 | tee /tmp/red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'ClocktowerDemonBluffPresentationTest > manual Demon bluff fallback is explicitly wired to the unified storyteller style FAILED' /tmp/red.log

      - name: Apply exact production and API patch
        run: python3 "$PATCH_SCRIPT"

      - name: Run focused GREEN
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerDemonBluffPresentationTest' \
            --rerun-tasks --no-daemon

      - name: Run Android FAST checkpoint
        run: ./gradlew :app:testFast --rerun-tasks --no-daemon

      - name: Exact diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 3
          printf '%s\n' "${changed[@]}" | grep -Fx "$PRESENTATION_FILE"
          printf '%s\n' "${changed[@]}" | grep -Fx "$HOST_FILE"
          printf '%s\n' "${changed[@]}" | grep -Fx "$TEST_FILE"
          test "$(git diff --numstat -- "$PRESENTATION_FILE")" = $'4\t4\tapp/src/main/java/com/codex/campboardgamehost/ClocktowerDemonBluffPresentation.kt'
          test "$(git diff --numstat -- "$HOST_FILE")" = $'1\t0\tapp/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt'
          test "$(git diff --numstat -- "$TEST_FILE")" = $'1\t1\tapp/src/test/java/com/codex/campboardgamehost/ClocktowerDemonBluffPresentationTest.kt'
          test "$(grep -Fc 'storytellerStyle: RecommendationStyle,' "$PRESENTATION_FILE")" -eq 1
          test "$(grep -Fc 'style = storytellerStyle,' "$PRESENTATION_FILE")" -eq 1
          test "$(grep -Fc 'storytellerStyle = automaticStorytellerStyle,' "$HOST_FILE")" -eq 1
          test "$(grep -Fc 'storytellerStyle = RecommendationStyle.AGGRESSIVE,' "$TEST_FILE")" -eq 1
          ! grep -Fq 'preferredManualStyle: RecommendationStyle = RecommendationStyle.BALANCED' "$PRESENTATION_FILE"
          git diff -- "$PRESENTATION_FILE" "$HOST_FILE" "$TEST_FILE"

      - name: Reconfirm remote head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$GITHUB_SHA"

      - name: Commit and push Demon bluff style patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PRESENTATION_FILE" "$HOST_FILE" "$TEST_FILE"
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -eq 3
          printf '%s\n' "${staged[@]}" | grep -Fx "$PRESENTATION_FILE"
          printf '%s\n' "${staged[@]}" | grep -Fx "$HOST_FILE"
          printf '%s\n' "${staged[@]}" | grep -Fx "$TEST_FILE"
          git commit -m 'fix: unify Demon bluff recommendation style'
          git push origin HEAD:"$TARGET_BRANCH"
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$PRODUCT_SHA"
          git rm "$WORKFLOW_FILE" "$PATCH_SCRIPT"
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -eq 2
          printf '%s\n' "${staged[@]}" | grep -Fx "$PATCH_SCRIPT"
          printf '%s\n' "${staged[@]}" | grep -Fx "$WORKFLOW_FILE"
          git commit -m 'chore(ci): remove Demon bluff style one-shot workflow'
          git push origin HEAD:"$TARGET_BRANCH"
          echo "CLEANUP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report checkpoints
        run: |
          echo "Product checkpoint: $PRODUCT_SHA"
          echo "Cleanup checkpoint: $CLEANUP_SHA"
