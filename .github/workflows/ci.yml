name: CI

on:
  push:
    branches:
      - main
      # Draft cleanup PRs can have merge conflicts; validate the branch's actual HEAD.
      - 'cleanup/**'
  # Stacked feature PRs need the same independent gate as main-targeted PRs.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.classify.outputs.android }}
      android_full: ${{ steps.classify.outputs.android_full }}

    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          android=false
          android_full=false
          full_checkpoint=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual runs are always full acceptance gates.
            full_checkpoint=true
          else
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              head="${{ github.event.pull_request.head.sha }}"
              if [[ "${{ github.event.action }}" == "synchronize" ]]; then
                # For normal PR iteration classify only the newly pushed commit range,
                # not the entire accumulated PR diff against main.
                base="${{ github.event.before }}"
              else
                # First/opened/reopened PR validation has no prior PR head to compare.
                base="${{ github.event.pull_request.base.sha }}"
              fi

              commit_message="$(git log -1 --format=%B "$head")"
              if grep -Fqi '[full-ci]' <<< "$commit_message"; then
                full_checkpoint=true
              fi
            else
              # A main push is full only when it contains a non-documentation change.
              # Docs-only pushes stay on the lightweight classifier/gate path.
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
            fi

            if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="$(git rev-parse "${head}^")"
            fi

            echo "Classification range: $base..$head"
            git diff --name-only --no-renames "$base" "$head" > "$RUNNER_TEMP/changed-files.txt"
            echo "Changed files:"
            cat "$RUNNER_TEMP/changed-files.txt"

            if [[ "${{ github.event_name }}" == "push" ]]; then
              while IFS= read -r path; do
                [[ -z "$path" ]] && continue

                case "$path" in
                  docs/*|AGENTS.md|README.md)
                    continue
                    ;;
                  *)
                    full_checkpoint=true
                    break
                    ;;
                esac
              done < "$RUNNER_TEMP/changed-files.txt"

              if [[ "$full_checkpoint" == true ]]; then
                echo "Main push contains executable/configuration changes; full checkpoint selected."
              else
                echo "Main push is documentation-only; heavy validation skipped."
              fi
            fi
          fi

          if [[ "$full_checkpoint" == true ]]; then
            android=true
            android_full=true
            echo "Full checkpoint selected."
          else
            while IFS= read -r path; do
              [[ -z "$path" ]] && continue

              # Explicitly safe non-executable surfaces.
              case "$path" in
                docs/*|AGENTS.md|README.md)
                  continue
                  ;;
              esac

              # CI routing changes validate every gate at full strength.
              case "$path" in
                .github/workflows/*)
                  android=true
                  android_full=true
                  continue
                  ;;
              esac

              classified=false

              # Gradle/build/dependency changes require full Android validation immediately.
              case "$path" in
                build.gradle.kts|settings.gradle.kts|gradle.properties|gradle/*|gradlew|gradlew.bat|app/build.gradle.kts)
                  android=true
                  android_full=true
                  classified=true
                  ;;
              esac

              # Ordinary Android application/test/assets changes get FAST PR feedback.
              # Logical checkpoints opt into FULL with [full-ci].
              case "$path" in
                app/*)
                  android=true
                  classified=true
                  ;;
              esac

              # Fail safe: an unknown new repository surface receives complete validation
              # until it is deliberately classified above.
              if [[ "$classified" == false ]]; then
                android=true
                android_full=true
              fi
            done < "$RUNNER_TEMP/changed-files.txt"
          fi

          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "android_full=$android_full" >> "$GITHUB_OUTPUT"
          echo "Routing: android=$android android_full=$android_full"

  android-tests:
    name: Android tests
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run Android FAST unit tests
        if: needs.changes.outputs.android_full != 'true'
        run: ./gradlew :app:testFast --no-daemon --build-cache

      - name: Run full Android unit tests and build debug APK
        if: needs.changes.outputs.android_full == 'true'
        run: ./gradlew :app:testFull :app:assembleDebug --no-daemon --rerun-tasks

      # Diagnostic-only: show actual JUnit failure messages for the unchanged main source tree.
      - name: Print full test failure details
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          paths = sorted(glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"))
          print(f"JUnit XML files: {len(paths)}")
          failures = 0
          for path in paths:
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  for child in case:
                      if child.tag in ("failure", "error"):
                          failures += 1
                          print(f"\n===== TEST FAILURE {failures}: {case.get('classname')}::{case.get('name')} =====")
                          print("message:", child.get("message", ""))
                          print((child.text or "")[:8500])
          print(f"TOTAL FAILED TEST CASES: {failures}")
          PY

      - name: Upload baseline full test XML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-baseline-full-junit
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 3

      - name: Attach draft whole-game AI Android test APK
        if: needs.changes.outputs.android_full == 'true' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: botc-ai-assisted-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ci-gate:
    name: CI gate
    needs:
      - changes
      - android-tests
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require every selected validation to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          ANDROID_RESULT: ${{ needs.android-tests.result }}
        run: |
          set -euo pipefail

          [[ "$CHANGES_RESULT" == "success" ]]

          for result in "$ANDROID_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Selected validation did not pass: $result"
              exit 1
            fi
          done
