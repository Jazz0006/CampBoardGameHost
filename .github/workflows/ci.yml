name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android-tests:
    name: Android tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run Android unit tests and build debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --build-cache

  asp-contract-tests:
    name: ASP contract tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate golden corpus
        run: |
          python tools/asp_oracle/oracle_harness.py validate \
            --fixtures tools/asp_oracle/scenarios/trouble_brewing_a2.json

      - name: Run Oracle harness unit tests
        run: |
          python -m unittest discover \
            -s tools/asp_oracle \
            -p 'test_*.py'

  asp-oracle:
    name: Real Clingo cross-validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Clingo 5.8.0
        run: |
          python -m pip install --upgrade pip
          python -m pip install clingo==5.8.0
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/clingo" <<'EOF'
          #!/usr/bin/env bash
          exec python -m clingo "$@"
          EOF
          chmod +x "$RUNNER_TEMP/bin/clingo"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Verify Clingo
        run: clingo --version

      - name: Fetch frozen botc-asp Oracle
        run: |
          python tools/asp_oracle/oracle_harness.py fetch \
            --checkout-dir build/oracles/botc-asp

      - name: Run Oracle cross-validation
        run: |
          python tools/asp_oracle/oracle_harness.py run \
            --fixtures tools/asp_oracle/scenarios/trouble_brewing_a2.json \
            --botc-asp-dir build/oracles/botc-asp \
            --report build/reports/asp-oracle-a2.json \
            --timeout 30

  r2-history-extraction:
    name: R2 guarded history extraction
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v6
        with:
          ref: codex/storyteller-algorithm-v4
          fetch-depth: 0

      - name: Check extraction gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          root=app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          history=app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHistoryScreen.kt
          if grep -q '^internal fun ClocktowerGameRecordPanel(' "$root" && [ ! -e "$history" ]; then
            echo 'needs_extract=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needs_extract=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.gate.outputs.needs_extract == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.gate.outputs.needs_extract == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Python
        if: steps.gate.outputs.needs_extract == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Mechanically extract Clocktower history and result UI
        if: steps.gate.outputs.needs_extract == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root_path = Path('app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt')
          history_path = Path('app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHistoryScreen.kt')
          root = root_path.read_text(encoding='utf-8')

          start1 = '@Composable\ninternal fun ClocktowerGameRecordPanel('
          end1 = '@OptIn(ExperimentalLayoutApi::class)\n@Composable\nprivate fun GameScreen('
          start2 = '@Composable\nprivate fun ClocktowerResultsDialog('
          end2 = '@Composable\nprivate fun ResultsDialog('
          for marker in (start1, end1, start2, end2):
              assert root.count(marker) == 1, (marker, root.count(marker))
          assert not history_path.exists()

          s1, e1 = root.index(start1), root.index(end1)
          s2, e2 = root.index(start2), root.index(end2)
          assert s1 < e1 < s2 < e2
          block1 = root[s1:e1].rstrip() + '\n'
          block2 = root[s2:e2].rstrip() + '\n'
          assert block1.count('private fun clocktowerEventPhaseLabel(') == 1
          assert block1.count('internal fun ClocktowerPlayerStatusRow(') == 1
          assert block2.count('private fun ClocktowerResultsDialog(') == 1
          block1 = block1.replace(
              'private fun clocktowerEventPhaseLabel(',
              'internal fun clocktowerEventPhaseLabel(',
              1,
          )
          block2 = block2.replace(
              'private fun ClocktowerResultsDialog(',
              'internal fun ClocktowerResultsDialog(',
              1,
          )

          import_start = root.index('import ')
          import_end = root.index('\nprivate enum class Screen')
          imports = root[import_start:import_end].rstrip()
          history = 'package com.codex.campboardgamehost\n\n' + imports + '\n\n' + block1 + '\n' + block2

          root = root[:s2] + root[e2:]
          root = root[:s1] + root[e1:s2] + root[s2:]
          assert 'fun ClocktowerGameRecordPanel(' not in root
          assert 'fun ClocktowerResultsDialog(' not in root
          history_path.write_text(history.rstrip() + '\n', encoding='utf-8')
          root_path.write_text(root.rstrip() + '\n', encoding='utf-8')
          PY

          allowed='app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHistoryScreen.kt'
          actual="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          test "$actual" = "$allowed"
          git diff --check

      - name: Fast Kotlin compile gate
        if: steps.gate.outputs.needs_extract == 'true'
        run: bash ./gradlew :app:compileDebugKotlin --no-daemon --build-cache

      - name: Verify extracted Android source
        if: steps.gate.outputs.needs_extract == 'true'
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --build-cache

      - name: Verify ASP contracts
        if: steps.gate.outputs.needs_extract == 'true'
        run: |
          python tools/asp_oracle/oracle_harness.py validate --fixtures tools/asp_oracle/scenarios/trouble_brewing_a2.json
          python -m unittest discover -s tools/asp_oracle -p 'test_*.py'

      - name: Verify real Clingo cross-validation
        if: steps.gate.outputs.needs_extract == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install clingo==5.8.0
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/clingo" <<'EOF'
          #!/usr/bin/env bash
          exec python -m clingo "$@"
          EOF
          chmod +x "$RUNNER_TEMP/bin/clingo"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          python tools/asp_oracle/oracle_harness.py fetch --checkout-dir build/oracles/botc-asp
          python tools/asp_oracle/oracle_harness.py run \
            --fixtures tools/asp_oracle/scenarios/trouble_brewing_a2.json \
            --botc-asp-dir build/oracles/botc-asp \
            --report build/reports/asp-oracle-a2.json \
            --timeout 30

      - name: Commit validated extraction only
        if: steps.gate.outputs.needs_extract == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root=app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          history=app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHistoryScreen.kt
          git add -- "$root" "$history"
          staged="$(git diff --cached --name-only | sort -u)"
          expected="$(printf '%s\n%s\n' "$root" "$history" | sort -u)"
          test "$staged" = "$expected"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(r2): extract Clocktower history UI'
          git push origin HEAD:codex/storyteller-algorithm-v4
