name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-tests:
    name: Android tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run Android unit tests and build debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --build-cache

  asp-contract-tests:
    name: ASP contract tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate golden corpus
        run: |
          python tools/asp_oracle/oracle_harness.py validate \
            --fixtures tools/asp_oracle/scenarios/trouble_brewing_a2.json

      - name: Run Oracle harness unit tests
        run: |
          python -m unittest discover \
            -s tools/asp_oracle \
            -p 'test_*.py'

  asp-oracle:
    name: Real Clingo cross-validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Clingo 5.8.0
        run: |
          python -m pip install --upgrade pip
          python -m pip install clingo==5.8.0
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/clingo" <<'EOF'
          #!/usr/bin/env bash
          exec python -m clingo "$@"
          EOF
          chmod +x "$RUNNER_TEMP/bin/clingo"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Verify Clingo
        run: clingo --version

      - name: Fetch frozen botc-asp Oracle
        run: |
          python tools/asp_oracle/oracle_harness.py fetch \
            --checkout-dir build/oracles/botc-asp

      - name: Run Oracle cross-validation
        run: |
          python tools/asp_oracle/oracle_harness.py run \
            --fixtures tools/asp_oracle/scenarios/trouble_brewing_a2.json \
            --botc-asp-dir build/oracles/botc-asp \
            --report build/reports/asp-oracle-a2.json \
            --timeout 30

  r2-night-ui-extraction:
    name: R2 guarded night UI extraction
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/storyteller-algorithm-v4'
    needs:
      - android-tests
      - asp-contract-tests
      - asp-oracle
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v6
        with:
          ref: codex/storyteller-algorithm-v4
          fetch-depth: 0

      - name: Check extraction gate
        id: gate
        shell: bash
        run: |
          night=app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerNightScreen.kt
          if test -f "$night"; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.gate.outputs.needed == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.gate.outputs.needed == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Python
        if: steps.gate.outputs.needed == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Mechanically extract Clocktower night active UI
        if: steps.gate.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path("app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt")
          target = Path("app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerNightScreen.kt")
          text = root.read_text(encoding="utf-8")

          start_marker = "@Composable\nprivate fun ClocktowerNightActiveScreen("
          end_marker = "@Composable\nprivate fun ClocktowerNewDemonConfirmationScreen("
          if target.exists():
              raise SystemExit(f"target already exists: {target}")
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit("expected unique night active extraction markers")

          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]

          name = "ClocktowerNightActiveScreen"
          needle = f"private fun {name}("
          if block.count(needle) != 1:
              raise SystemExit(f"expected exactly one extracted declaration: {name}")
          if block.count("private fun ") != 1:
              raise SystemExit("unexpected private declaration inside night active block")
          block = block.replace(needle, f"internal fun {name}(", 1)

          remaining = text[:start] + text[end:]
          if f"private fun {name}(" in remaining or f"internal fun {name}(" in remaining:
              raise SystemExit(f"night active declaration still present in root: {name}")

          imports = [line for line in text.splitlines() if line.startswith("import ")]
          header = (
              "package com.codex.campboardgamehost\n\n"
              + "\n".join(imports)
              + "\n\n/** Behavior-preserving R2 extraction for Clocktower night active UI. */\n"
          )
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text((header + block.lstrip()).rstrip() + "\n", encoding="utf-8")
          root.write_text(remaining.rstrip() + "\n", encoding="utf-8")
          PY

          root=app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          night=app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerNightScreen.kt
          test -f "$night"
          grep -q "internal fun ClocktowerNightActiveScreen" "$night"
          if grep -q "fun ClocktowerNightActiveScreen(" "$root"; then exit 1; fi
          grep -q "private fun ClocktowerNewDemonConfirmationScreen(" "$root"

          actual="$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u )"
          expected="$(printf '%s\n' "$root" "$night" | sort)"
          test "$actual" = "$expected"
          git diff --check

      - name: Verify extracted Android source
        if: steps.gate.outputs.needed == 'true'
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --build-cache

      - name: Verify ASP contracts
        if: steps.gate.outputs.needed == 'true'
        run: |
          python tools/asp_oracle/oracle_harness.py validate \
            --fixtures tools/asp_oracle/scenarios/trouble_brewing_a2.json
          python -m unittest discover -s tools/asp_oracle -p 'test_*.py'

      - name: Verify real Clingo cross-validation
        if: steps.gate.outputs.needed == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install clingo==5.8.0
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/clingo" <<'EOF'
          #!/usr/bin/env bash
          exec python -m clingo "$@"
          EOF
          chmod +x "$RUNNER_TEMP/bin/clingo"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          python tools/asp_oracle/oracle_harness.py fetch \
            --checkout-dir build/oracles/botc-asp
          python tools/asp_oracle/oracle_harness.py run \
            --fixtures tools/asp_oracle/scenarios/trouble_brewing_a2.json \
            --botc-asp-dir build/oracles/botc-asp \
            --report build/reports/asp-oracle-a2.json \
            --timeout 30

      - name: Commit validated extraction only
        if: steps.gate.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root=app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          night=app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerNightScreen.kt
          expected="$(printf '%s\n' "$root" "$night" | sort)"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$root" "$night"
          staged="$(git diff --cached --name-only | sort)"
          printf 'Expected staged files:\n%s\nActual staged files:\n%s\n' "$expected" "$staged"
          test "$staged" = "$expected"
          git diff --cached --check
          git commit -m "refactor(r2): extract Clocktower night active UI"
          git push origin HEAD:codex/storyteller-algorithm-v4
