name: UX default common players validation

on:
  push:
    branches:
      - codex/ui-r4d5-nomination-gesture

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - run: chmod +x ./gradlew

      - name: Guard expected baseline
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f2f046ec4c60f4f99ed9a19e5814a41d0c059ab1 HEAD

      - name: Wire defaults into common-player loading
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt")
          source = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r"private fun Context\.loadCommonPlayers\(\): List<String> \{.*?\n\}\n\nprivate fun Context\.saveCommonPlayers",
              re.S,
          )
          replacement = '''private fun Context.loadCommonPlayers(): List<String> {
              val preferences = getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
              val hasStoredPlayers = preferences.contains(COMMON_PLAYERS_KEY)
              val raw = preferences.getString(COMMON_PLAYERS_KEY, null)
              val storedPlayers = raw?.let { encoded ->
                  runCatching {
                      val json = JSONArray(encoded)
                      List(json.length()) { index -> json.getString(index) }
                          .map { it.trim() }
                          .filter { it.isNotEmpty() }
                          .distinct()
                  }.getOrElse { emptyList() }
              } ?: emptyList()
              return resolveInitialCommonPlayers(
                  hasStoredPlayers = hasStoredPlayers,
                  storedPlayers = storedPlayers,
              )
          }

          private fun Context.saveCommonPlayers'''
          updated, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f"Expected exactly one loadCommonPlayers block, found {count}")
          path.write_text(updated, encoding="utf-8")

      - name: Run fast Android tests
        run: ./gradlew :app:testFast --no-daemon --build-cache

      - name: Remove temporary workflow and audit final tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/ux-default-common-players.yml
          git diff --check f2f046ec4c60f4f99ed9a19e5814a41d0c059ab1
          actual="$(git diff --name-only f2f046ec4c60f4f99ed9a19e5814a41d0c059ab1 | sort)"
          expected="$(printf '%s\n' \
            app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt \
            app/src/main/java/com/codex/campboardgamehost/CommonPlayersDefaultPolicy.kt \
            app/src/test/java/com/codex/campboardgamehost/CommonPlayersDefaultPolicyTest.kt | sort)"
          test "$actual" = "$expected" || {
            echo "Unexpected final diff:"
            printf '%s\n' "$actual"
            exit 1
          }

      - name: Commit validated UX tweak
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          git commit -m "feat(UX): seed eight common players on fresh install"
          git push origin HEAD:codex/ui-r4d5-nomination-gesture
