name: TBSP 6L roadmap sync

on:
  push:
    branches:
      - codex/trouble-brewing-setup-presets-v2
    paths:
      - .github/workflows/tbsp-6l-roadmap-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: codex/trouble-brewing-setup-presets-v2
          fetch-depth: 0

      - name: Verify bootstrap head and roadmap blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/codex/trouble-brewing-setup-presets-v2 | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object docs/CURRENT_DEVELOPMENT_ROADMAP.md)" = "eab959a6bd433d44b035e246d71b4e15422d2d45"

      - name: Apply exact roadmap update
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/CURRENT_DEVELOPMENT_ROADMAP.md')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one roadmap anchor, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'last fully validated logical acceptance checkpoint:\n'
              '6b80b7ade7235d890bd2a492ed8b33a19c43ffaa\n\n'
              'accepted production checkpoint under that gate:\n'
              '68d29c53a0a37f2c30b9d88ed8967d5d9548b4bc\n\n'
              'checkpoint meaning:\n'
              'TBSP-6K final full acceptance accepted\n'
              'CI #1158 / run 33343377258 SUCCESS\n'
              'Android :app:testFull + :app:assembleDebug SUCCESS\n'
              'ASP contract tests SUCCESS\n'
              'Real Clingo cross-validation SUCCESS\n'
              'R2 #1081 / run 33343377271 SUCCESS',
              'last fully validated logical acceptance checkpoint:\n'
              '45a60a3c32c7471c68d89b7fb886c4dbb00f1781\n\n'
              'accepted production checkpoint under that gate:\n'
              '4c8108c91be188d33435233efb9aba26397f6b87\n\n'
              'checkpoint meaning:\n'
              'TBSP-6L provenance durability repair accepted\n'
              'CI #1167 / run 33344886176 SUCCESS\n'
              'Android :app:testFull + :app:assembleDebug SUCCESS\n'
              'ASP contract tests SUCCESS\n'
              'Real Clingo cross-validation SUCCESS\n'
              'R2 #1090 / run 33344886170 SUCCESS',
          )

          replace_once(
              'final TBSP acceptance checkpoint:\n'
              'docs/TBSP_6K_FINAL_ACCEPTANCE_CHECKPOINT_2026-08-31.md',
              'final TBSP acceptance checkpoint:\n'
              'docs/TBSP_6L_PROVENANCE_DURABILITY_REPAIR_2026-08-31.md',
          )

          replace_once(
              'Commits after `68d29c5...` that only update documentation are carriers on top of the accepted production tree, not new production checkpoints.',
              'Commits after `4c8108c...` that only remove temporary one-shot CI files or update documentation are carriers on top of the accepted production tree, not new production checkpoints.',
          )

          replace_once(
              'TBSP-6K final full acceptance                                COMPLETE\n'
              'MS-SETUP generic multi-script setup architecture             NEXT / NOT STARTED',
              'TBSP-6K final full acceptance                                COMPLETE\n'
              'TBSP-6L provenance durability repair                         COMPLETE\n'
              'MS-SETUP generic multi-script setup architecture             NEXT / NOT STARTED',
          )

          replace_once(
              'This executed the complete intentional Android JVM suite through `:app:testDebugUnitTest` and the debug APK build. No repair slice was required.',
              'This executed the complete intentional Android JVM suite through `:app:testDebugUnitTest` and the debug APK build. No repair slice was identified during 6K itself; the later post-acceptance global audit identified the narrow 6L provenance durability cut-point.',
          )

          replace_once(
              '**TBSP-1 through TBSP-6K are accepted. P1–P16 are revalidated on the integrated branch.**\n\n'
              'PR #57 remains Draft until the user explicitly authorizes Ready/merge.\n\n'
              '### 8.1 Next campaign — MS-SETUP generic multi-script setup architecture\n\n'
              'TBSP-6K is accepted. MS-SETUP is now the next planned campaign, but implementation has not started.',
              '**TBSP-1 through TBSP-6K were accepted by the 6K gate. P1–P16 were revalidated on the integrated branch.**\n\n'
              '### 8.1 TBSP-6L — post-acceptance provenance durability repair — COMPLETE\n\n'
              'The post-6K global audit found a narrow process-death cut-point: `resetDealState()` persisted an active-game snapshot before `committedTroubleBrewingSetupSelection` was written back, leaving a small window in which cards/seed could survive restore while exact original preset provenance was absent.\n\n'
              'Accepted repair evidence:\n\n'
              '```text\n'
              'test checkpoint:        8406bdf39a1203d8c69f5a51f7c94474516477ff\n'
              'production checkpoint: 4c8108c91be188d33435233efb9aba26397f6b87\n'
              'cleanup carrier:       d0bcbb6f6eaf9bfe31a81bc0f9c7efd73dc591fd\n'
              'T4 trigger:            45a60a3c32c7471c68d89b7fb886c4dbb00f1781\n'
              'one-shot run:          33344478383 SUCCESS\n'
              'CI #1167:              33344886176 SUCCESS\n'
              'R2 #1090:              33344886170 SUCCESS\n'
              '```\n\n'
              'The production diff is exactly one added call to `persistActiveGameStateIfNeeded()` immediately after the committed TB setup selection assignment. Focused RED/GREEN, `:app:testFast`, exact diff audit, full Android JVM tests/APK, ASP contracts, Real Clingo, CI gate and R2 all passed.\n\n'
              '**TBSP-1 through TBSP-6L are now complete and accepted.**\n\n'
              'PR #57 remains Draft until the user explicitly authorizes Ready/merge.\n\n'
              '### 8.2 Next campaign — MS-SETUP generic multi-script setup architecture\n\n'
              'TBSP-6L is accepted. MS-SETUP is now the next planned campaign, but implementation has not started.',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Exact docs diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | paste -sd ' ' -)" = "docs/CURRENT_DEVELOPMENT_ROADMAP.md"
          grep -F 'TBSP-6L provenance durability repair                         COMPLETE' docs/CURRENT_DEVELOPMENT_ROADMAP.md
          grep -F 'docs/TBSP_6L_PROVENANCE_DURABILITY_REPAIR_2026-08-31.md' docs/CURRENT_DEVELOPMENT_ROADMAP.md
          grep -F 'MS-SETUP generic multi-script setup architecture             NEXT / NOT STARTED' docs/CURRENT_DEVELOPMENT_ROADMAP.md

      - name: Commit roadmap and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/trouble-brewing-setup-presets-v2 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CURRENT_DEVELOPMENT_ROADMAP.md
          git rm .github/workflows/tbsp-6l-roadmap-sync.yml
          test "$(git diff --cached --name-only | paste -sd ' ' -)" = ".github/workflows/tbsp-6l-roadmap-sync.yml docs/CURRENT_DEVELOPMENT_ROADMAP.md"
          git commit -m 'docs: advance roadmap through TBSP 6L acceptance'
          git push origin HEAD:codex/trouble-brewing-setup-presets-v2
