name: UI-R2 pair Manual one-shot large-file patch

on:
  push:
    branches:
      - codex/ui-r2-pair-manual-square-table
    paths:
      - .github/workflows/ui-r2-pair-manual-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          ref: codex/ui-r2-pair-manual-square-table
          fetch-depth: 0

      - name: Verify bootstrap head and blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/codex/ui-r2-pair-manual-square-table | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt)" = "8125c0af95e2964dd880218ce03a482552ce3d86"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerPairManualSelectionUi.kt)" = "441c0f2f70eb8f4ae414c764a677b9e447c2a877"
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/ClocktowerPairManualSelectionModelTest.kt)" = "1dc92a79c91485f5489ea0bf5d4d07132dfb28a1"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerPairRecommendationPresentationUi.kt)" = "8770a63a0ffe88175c79e56a9aa6ba15fa10696a"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Confirm focused GREEN baseline
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerPairManualSelectionModelTest' \
            --rerun-tasks --no-daemon

      - name: Apply exact production patch
        run: python3 .github/scripts/ui_r2_pair_manual_patch.py

      - name: Exact semantic and diff audit
        shell: bash
        run: |
          set -euo pipefail
          target='app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt'
          git diff --check
          test "$(git diff --name-only | paste -sd ' ' -)" = "$target"
          test "$(grep -Fc 'ClocktowerPairManualSelectionDialog(' "$target")" -eq 1
          test "$(grep -Fc 'showRecommendedDisplayOption(manualOption)' "$target")" -eq 1
          test "$(grep -Fc 'step.manualInformationCandidates' "$target")" -eq 1
          ! grep -Fq 'manualPairEntries' "$target"
          ! grep -Fq 'selectedManualPairRole' "$target"
          ! grep -Fq 'selectedManualPairFirstSeat' "$target"
          ! grep -Fq 'RecommendationReasonSummary(option.reasonCodes, option.warningCodes, language)' "$target"
          git diff -- "$target"

      - name: Run focused GREEN after wiring
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerPairManualSelectionModelTest' \
            --rerun-tasks --no-daemon

      - name: Run UI-R2 checkpoint suite
        run: ./gradlew :app:testFast --rerun-tasks --no-daemon

      - name: Reconfirm remote head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/ui-r2-pair-manual-square-table | cut -f1)" = "$GITHUB_SHA"

      - name: Commit and push production patch
        shell: bash
        run: |
          set -euo pipefail
          target='app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          test "$(git diff --cached --name-only | paste -sd ' ' -)" = "$target"
          git commit -m 'UI-R2: wire pair Manual full-screen square table'
          git push origin HEAD:codex/ui-r2-pair-manual-square-table
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/ui-r2-pair-manual-one-shot.yml .github/scripts/ui_r2_pair_manual_patch.py
          git commit -m 'chore(ci): remove UI-R2 one-shot patch'
          git push origin HEAD:codex/ui-r2-pair-manual-square-table
          echo "CLEANUP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report checkpoints
        run: |
          echo "Product checkpoint: $PRODUCT_SHA"
          echo "Cleanup checkpoint: $CLEANUP_SHA"
