name: PS4 final roadmap sync

on:
  push:
    branches:
      - codex/persistence-simplification
    paths:
      - .github/workflows/ps4-final-roadmap-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/persistence-simplification
          fetch-depth: 0

      - name: Verify locked parent and remote head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'e8b5be30b7c3d1fb988f91bc169c6cbd9889e15c'
          test "$(git ls-remote origin refs/heads/codex/persistence-simplification | cut -f1)" = "$(git rev-parse HEAD)"

      - name: Patch authoritative roadmap to PS4 complete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/CURRENT_DEVELOPMENT_ROADMAP.md')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''Persistence Simplification remains the active campaign. PS4 cleanup implementation is complete through PS4.5 and the current task is:\n\n> **PS4.6 — final architecture / full-validation checkpoint**\n\nDo not begin PS5, Werewolf module deletion or D6 decomposition until PS4.6 has passed the full validation gate and the checkpoint is documented.''',
                  '''Persistence Simplification PS0–PS4 is complete. The next planned campaign slice is:\n\n> **PS5 — simplify persistence triggers**\n\nPS5 is NEXT / NOT STARTED. Start it only with a fresh audit of current save triggers/timing; do not mix trigger redesign with persistence-content/schema changes. Werewolf module deletion and D6 remain separate future work.''',
              ),
              (
                  'PS4  retire superseded active-save infrastructure   IN PROGRESS (PS4.1–PS4.5 COMPLETE; PS4.6 VALIDATING)',
                  'PS4  retire superseded active-save infrastructure   COMPLETE',
              ),
              (
                  'PS5  simplify persistence triggers                   NOT STARTED',
                  'PS5  simplify persistence triggers                   NEXT / NOT STARTED',
              ),
              (
                  'Status: **in progress — PS4.1 through PS4.5 complete; PS4.6 final validation in progress**.',
                  'Status: **COMPLETE — PS4.1 through PS4.6 complete**.',
              ),
              (
                  '''Current progress:\n\n- `docs/PS4_CLEANUP_PROGRESS_2026-09-07.md`''',
                  '''Current progress / final checkpoint:\n\n- `docs/PS4_CLEANUP_PROGRESS_2026-09-07.md`\n- `docs/PS4_FINAL_CHECKPOINT_2026-09-08.md`''',
              ),
              (
                  '''#### PS4.6 — Final architecture checkpoint\n\nTarget absence:''',
                  '''#### PS4.6 — Final architecture checkpoint\n\nStatus: **COMPLETE**. Static architecture audit run `34169917902` passed; final `[full-ci]` run `34170266988` and R2 run `34170266998` also passed. Formal checkpoint: `docs/PS4_FINAL_CHECKPOINT_2026-09-08.md`.\n\nTarget absence:''',
              ),
              (
                  'Final PS4 checkpoint should run focused Recovery + Archive behavior tests, `:app:testFast`, `:app:testFull`, `:app:assembleDebug`, applicable ASP/Clingo, R2, exact diff/reference audits and remote-head race lock.',
                  'Final PS4 validation completed successfully: current Archive rejection tests, static ownership audit, `:app:testFull`, `:app:assembleDebug`, ASP/oracle harness, real Clingo cross-validation, R2, exact post-audit change comparison and remote-head race checks all passed.',
              ),
              (
                  'Status: **not started; do not enter from PS4 cleanup automatically**.',
                  'Status: **NEXT / NOT STARTED**.',
              ),
              (
                  '- `docs/NEXT_DEVELOPMENT_HANDOFF_2026-09-07_PS4_CLEANUP.md` — **current next-chat implementation authority**;',
                  '- `docs/NEXT_DEVELOPMENT_HANDOFF_2026-09-07_PS4_CLEANUP.md` — historical PS4 implementation route;',
              ),
              (
                  '- `docs/PS4_CLEANUP_PROGRESS_2026-09-07.md` — current PS4 audited progress/entry checkpoint.',
                  '- `docs/PS4_CLEANUP_PROGRESS_2026-09-07.md` — completed PS4 progress record;\n- `docs/PS4_FINAL_CHECKPOINT_2026-09-08.md` — authoritative PS4 completion evidence.',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one roadmap anchor, found {count}: {old[:120]!r}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- docs/CURRENT_DEVELOPMENT_ROADMAP.md

      - name: Commit roadmap completion
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/persistence-simplification | cut -f1)" = "$(git rev-parse HEAD)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/CURRENT_DEVELOPMENT_ROADMAP.md
          git commit -m 'docs: mark PS4 complete and PS5 next'
          git push origin HEAD:codex/persistence-simplification

      - name: Self-clean workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/persistence-simplification | cut -f1)" = "$(git rev-parse HEAD)"
          git rm .github/workflows/ps4-final-roadmap-sync.yml
          git commit -m 'chore: remove PS4 final roadmap sync workflow'
          git push origin HEAD:codex/persistence-simplification
