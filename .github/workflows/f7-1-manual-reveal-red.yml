name: F7.1 Manual Reveal RED

on:
  push:
    branches:
      - codex/ui-r4d2-seating-first-setup
    paths:
      - app/src/test/java/com/codex/campboardgamehost/ClocktowerFirstNightPlayerRevealHandoffTest.kt
      - .github/workflows/f7-1-manual-reveal-red.yml

permissions:
  contents: read

jobs:
  focused-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - name: Run focused F7.1 regression
        run: ./gradlew :app:testDebugUnitTest --tests "com.codex.campboardgamehost.ClocktowerFirstNightPlayerRevealHandoffTest" --no-daemon --rerun-tasks
