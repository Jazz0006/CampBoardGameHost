name: UX-R2B ready transition one-shot

on:
  push:
    branches:
      - codex/ux-r2b-pair-manual-authority
    paths:
      - .github/workflows/ux-r2b-ready-one-shot.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  ready-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "codex/ux-r2b-pair-manual-authority"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Mark PR 64 ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr ready 64 --repo Jazz0006/CampBoardGameHost

      - name: Self-remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ux-r2b-ready-one-shot.yml
          git commit -m "chore: remove PR ready one-shot workflow"
          git push origin HEAD:codex/ux-r2b-pair-manual-authority
