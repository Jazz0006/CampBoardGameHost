name: UI-R5 result surface ownership one-shot

on:
  push:
    branches:
      - codex/ui-r5-square-table-stabilization
    paths:
      - .github/workflows/ui-r5-result-surface-one-shot.yml

permissions:
  contents: write

jobs:
  cleanup-result-surfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact trigger parent and source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "codex/ui-r5-square-table-stabilization"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "e21c230e6ab1939fb7c88cdbc555012f208f7879"
          remote_head="$(git ls-remote origin refs/heads/codex/ui-r5-square-table-stabilization | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt)" = "5b0988816ad59c9523aaf365cd182232f72b290c"
          test "$(git rev-parse HEAD:app/src/test/java/com/codex/campboardgamehost/ClocktowerNightStepResultSurfaceOwnershipTest.kt)" = "25e1dff3b0f52fcf78520f91e9b92ed2715ddb02"
          test "$(git rev-parse HEAD:.github/scripts/ui_r5_result_surface_cleanup.py)" = "9bf1237932923f11a5a23a8398678897622f9577"

      - name: Prove focused ownership RED
        shell: bash
        run: |
          set -uo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerNightStepResultSurfaceOwnershipTest' \
            --rerun-tasks
          status=$?
          test "$status" -ne 0
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path('app/build/test-results/testDebugUnitTest/TEST-com.codex.campboardgamehost.ClocktowerNightStepResultSurfaceOwnershipTest.xml')
          assert report.exists(), 'focused RED XML report missing'
          root = ET.parse(report).getroot()
          assert int(root.attrib.get('tests', '0')) == 2, root.attrib
          assert int(root.attrib.get('failures', '0')) == 2, root.attrib
          PY

      - name: Apply exact result-surface cleanup
        run: python .github/scripts/ui_r5_result_surface_cleanup.py

      - name: Audit production diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt"
          test "$changed" = "$expected"
          ! grep -Fq 'nonPairResultFirstCandidates' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          test "$(grep -Fc 'step.action != ClocktowerNightAction.Chambermaid' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt)" -ge 3
          grep -Fq 'ClocktowerPairInformationSquareTableDialog(' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          grep -Fq 'ClocktowerChambermaidSquareTableDialog(' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt

      - name: Run focused ownership GREEN
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerNightStepResultSurfaceOwnershipTest' \
            --rerun-tasks

      - name: Run Android FAST checkpoint
        run: ./gradlew :app:testFast --rerun-tasks

      - name: Commit and push result-surface cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote_head="$(git ls-remote origin refs/heads/codex/ui-r5-square-table-stabilization | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git add app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          git commit -m "refactor: retire superseded generic result surfaces"
          git push origin HEAD:codex/ui-r5-square-table-stabilization

      - name: Remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ui-r5-result-surface-one-shot.yml
          rm .github/scripts/ui_r5_result_surface_cleanup.py
          git add -A .github/workflows/ui-r5-result-surface-one-shot.yml .github/scripts/ui_r5_result_surface_cleanup.py
          git commit -m "chore: remove UI-R5 result-surface one-shot"
          git push origin HEAD:codex/ui-r5-square-table-stabilization
