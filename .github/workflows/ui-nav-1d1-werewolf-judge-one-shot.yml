name: UI-NAV-1D.1 Werewolf judge one-shot

on:
  push:
    branches:
      - codex/ui-nav-1-global-navigation-visual-unification
    paths:
      - .github/workflows/ui-nav-1d1-werewolf-judge-one-shot.yml

permissions:
  contents: write

jobs:
  patch-werewolf-judge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRANCH: codex/ui-nav-1-global-navigation-visual-unification
      SCRIPT: .github/scripts/ui_nav_1d1_werewolf_judge_patch.py
      WORKFLOW: .github/workflows/ui-nav-1d1-werewolf-judge-one-shot.yml
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preflight exact head and production blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object "$SCRIPT")" = "3f0c9bfa3700f5d641b25949bc270c0f61272bff"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" = "3b5105bbc82f13744f9404d955d5f3d9f6848fac"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/werewolf/WerewolfHostScreen.kt)" = "0510f4f9fa9cbf5554f985998682fc50959d40c1"

      - name: Apply exact UI-NAV-1D.1 patch
        run: python3 "$SCRIPT"

      - name: Audit exact production diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          cat > /tmp/expected-files.txt <<'EOF'
          app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          app/src/main/java/com/codex/campboardgamehost/werewolf/WerewolfHostScreen.kt
          EOF
          git diff --name-only | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

          ! grep -q 'screen == Screen.WerewolfJudge ||' app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          grep -q 'screen == Screen.Game' app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          grep -q 'HostBottomActionBar(' app/src/main/java/com/codex/campboardgamehost/werewolf/WerewolfHostScreen.kt
          grep -q 'previousEnabled = currentIndex > 0' app/src/main/java/com/codex/campboardgamehost/werewolf/WerewolfHostScreen.kt
          grep -q 'nextEnabled = currentIndex < steps.lastIndex' app/src/main/java/com/codex/campboardgamehost/werewolf/WerewolfHostScreen.kt
          grep -q 'onHostTools = onHostTools' app/src/main/java/com/codex/campboardgamehost/werewolf/WerewolfHostScreen.kt

      - name: Run Android FAST validation
        run: ./gradlew :app:testFast --no-daemon

      - name: Recheck remote head before production push
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"

      - name: Commit and push production patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt app/src/main/java/com/codex/campboardgamehost/werewolf/WerewolfHostScreen.kt
          git diff --cached --check
          git commit -m "ui: unify Werewolf judge navigation"
          git push origin "HEAD:$BRANCH"

      - name: Remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git rm "$SCRIPT" "$WORKFLOW"
          git commit -m "chore(ci): remove UI-NAV-1D.1 one-shot"
          git push origin "HEAD:$BRANCH"
