name: R4D-6 revert Day localization experiment

on:
  push:
    branches:
      - codex/ui-r4d6-closeout-postdeal-role-visibility
    paths:
      - .github/workflows/r4d6-revert-day-role-cards-localization.yml

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/ui-r4d6-closeout-postdeal-role-visibility
          fetch-depth: 20

      - name: Lock bootstrap state
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c3a89bb4a7d4967337ea31cde4245cc96d2b175e"
          test "$(git show -s --format=%s 96615807bdcc0b0c60501e7032f80c4154a275c1)" = "fix(R4D-6): align Day role localization with active cards"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Revert experimental Day localization change
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git revert --no-edit 96615807bdcc0b0c60501e7032f80c4154a275c1
          git diff HEAD^ --check
          test "$(git diff --name-only HEAD^ HEAD | sort)" = $'app/src/main/java/com/codex/campboardgamehost/ClocktowerRoleLocalization.kt\napp/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt'
          test "$(grep -cF 'roleDisplayName = { roleId -> clocktowerRoleLabel(roleId, language) },' app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt)" -eq 6
          test "$(grep -cF 'roleDisplayName = { roleId -> clocktowerRoleLabel(roleId, language, cards) },' app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt || true)" -eq 0

      - name: Run focused GREEN
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerDayOverviewTableStateTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerHostSeatContentPresentationTest' \
            --no-daemon

      - name: Run testFast
        run: ./gradlew :app:testFast --rerun-tasks --no-daemon

      - name: Recheck privacy boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:app/src/main/java/com/codex/campboardgamehost/ClocktowerPlayerDisplayUi.kt)" = "930762d4a13108799ace45580ed1d9aeb57a6518"
          test "$(git rev-parse HEAD:app/src/main/java/com/codex/campboardgamehost/ClocktowerPairPlayerRevealPresentation.kt)" = "5ebf9353297cd44f7ee6839ee8761f9881c0f64d"

      - name: Recheck remote head before push
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin refs/heads/codex/ui-r4d6-closeout-postdeal-role-visibility | cut -f1)"
          test "$remote" = "$(git rev-parse HEAD~2)"

      - name: Push revert
        id: push_revert
        run: |
          set -euo pipefail
          revert_sha="$(git rev-parse HEAD)"
          echo "revert_sha=$revert_sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:codex/ui-r4d6-closeout-postdeal-role-visibility

      - name: Remove one-shot workflow
        id: cleanup
        run: |
          set -euo pipefail
          git rm .github/workflows/r4d6-revert-day-role-cards-localization.yml
          git commit -m 'chore(ci): remove Day localization revert one-shot'
          cleanup_sha="$(git rev-parse HEAD)"
          echo "cleanup_sha=$cleanup_sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:codex/ui-r4d6-closeout-postdeal-role-visibility

      - name: Report
        run: |
          echo "REVERT_SHA=${{ steps.push_revert.outputs.revert_sha }}"
          echo "CLEANUP_SHA=${{ steps.cleanup.outputs.cleanup_sha }}"
