name: D6.1d Session GameState Boundary One Shot

on:
  push:
    branches:
      - codex/d6-root-reaudit
    paths:
      - .github/workflows/d6-1d-session-boundary-one-shot.yml
      - scripts/d6_1d_session_boundary_patch.py

permissions:
  contents: write

jobs:
  patch-test-push-cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trigger head
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify fail-closed baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ec315ba7c8f23c04ac5764a216c0b502602319e9"
          test "$(git rev-parse HEAD^:app/src/main/java/com/codex/campboardgamehost/clocktower/session/ClocktowerGameSession.kt)" = "e3a3670fee095569a0dbdb8df01d4b04f7f1e92d"
          test "$(git rev-parse HEAD^:app/src/test/java/com/codex/campboardgamehost/clocktower/session/ClocktowerGameSessionGameStateBoundaryTest.kt)" = "3cbdb101fe20bb9871ea284a6b261be2867a2df6"
          expected=$(printf '%s\n' '.github/workflows/d6-1d-session-boundary-one-shot.yml' 'scripts/d6_1d_session_boundary_patch.py')
          actual=$(git diff --name-only HEAD^ HEAD | sort)
          test "$actual" = "$expected"
          test -z "$(git status --porcelain)"

      - name: Apply bounded session patch
        run: python3 scripts/d6_1d_session_boundary_patch.py

      - name: Audit exact product diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "app/src/main/java/com/codex/campboardgamehost/clocktower/session/ClocktowerGameSession.kt"
          git diff --check
          test "$(grep -c 'fun commitGameStateBoundary(nextState: GameState)' app/src/main/java/com/codex/campboardgamehost/clocktower/session/ClocktowerGameSession.kt)" -eq 1
          git diff -- app/src/main/java/com/codex/campboardgamehost/clocktower/session/ClocktowerGameSession.kt

      - name: Run focused boundary contract
        run: ./gradlew :app:testDebugUnitTest --tests 'com.codex.campboardgamehost.clocktower.session.ClocktowerGameSessionGameStateBoundaryTest' --no-daemon --build-cache

      - name: Run Android FAST
        run: ./gradlew :app:testFast --no-daemon --build-cache

      - name: Commit and push GREEN
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/codex/campboardgamehost/clocktower/session/ClocktowerGameSession.kt
          test "$(git diff --cached --name-only)" = "app/src/main/java/com/codex/campboardgamehost/clocktower/session/ClocktowerGameSession.kt"
          git commit -m 'feat: add atomic Clocktower game-state boundary'
          git push origin HEAD:codex/d6-root-reaudit

      - name: Remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/d6-1d-session-boundary-one-shot.yml scripts/d6_1d_session_boundary_patch.py
          git commit -m 'chore: remove D6.1d session-boundary one-shot tooling'
          git push origin HEAD:codex/d6-root-reaudit
