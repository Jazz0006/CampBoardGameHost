name: UX-MODE-1C night ruling one-shot

on:
  push:
    branches:
      - codex/ux-mode-1

permissions:
  contents: write

jobs:
  patch-night-rulings:
    if: "${{ github.event.head_commit.message == 'chore: stage UX-MODE-1C night ruling workflow' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate exact head and locked blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote origin refs/heads/codex/ux-mode-1 | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt)" = '6cf024e3909747a90d5216e27b1cf028822ba5f9'
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerRegistrationUi.kt)" = '9ff16cf9893e97cc04f5a29f84f78cf25dd18491'
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerTemporaryAutomaticRulings.kt)" = '11b0080e4b5b0ee606365ff9ba5b7642c1b13e49'
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/ClocktowerTemporaryAutomaticRulingsTest.kt)" = '54c6f9f5db802e2b7483baa8da21f6b109887249'
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/clocktower/recommendation/TemporaryAutomaticStorytellerPolicy.kt)" = 'a7b7cc75dc8e66809c51e2e9c1cf3e99d7a02af2'
          test -z "$(git status --porcelain)"

      - name: Apply exact night ruling patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ux_mode_1c_night_ruling_patch.py

      - name: Exact diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt' \
            'app/src/main/java/com/codex/campboardgamehost/ClocktowerRegistrationUi.kt' | sort)"
          test "$changed" = "$expected"
          ! grep -q 'WeightedStableSelector' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          ! grep -q 'val decisionKey = selectionAudit?.selectionId' app/src/main/java/com/codex/campboardgamehost/ClocktowerRegistrationUi.kt
          grep -q 'clocktowerTemporaryMayorSelection(' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          grep -q 'clocktowerTemporaryDemonSuccessorSelection(' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          grep -q 'step.decisionOptions.isNotEmpty() && !automaticStorytellerInfo' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          test "$(grep -c 'automaticDecisionKey = clocktowerTemporaryNightDecisionKey(' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt)" = '2'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Focused automatic ruling validation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerTemporaryAutomaticRulingsTest' \
            --tests 'com.codex.campboardgamehost.clocktower.recommendation.TemporaryAutomaticStorytellerPolicyTest' \
            --rerun-tasks --no-daemon

      - name: Commit and push product patch
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/codex/ux-mode-1 | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt \
            app/src/main/java/com/codex/campboardgamehost/ClocktowerRegistrationUi.kt
          git commit -m 'feat: automate Mayor and demon succession rulings'
          git push origin HEAD:codex/ux-mode-1

      - name: Remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/ux_mode_1c_night_ruling_patch.py
          rm .github/workflows/ux-mode-1c-night-ruling-one-shot.yml
          git add -A
          git commit -m 'chore: remove UX-MODE-1C night ruling one-shot files'
          git push origin HEAD:codex/ux-mode-1
