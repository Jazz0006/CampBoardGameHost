name: PS5 persistence trigger audit

on:
  push:
    branches:
      - codex/persistence-simplification
    paths:
      - .github/workflows/ps5-trigger-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/persistence-simplification
          fetch-depth: 0

      - name: Verify locked parent and dump trigger ownership
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'f8984b77a272bb8225999056e41424706ab18c2a'

          echo '=== all active Recovery persist call sites ==='
          git grep -n -C 6 -E 'persistActiveGameStateIfNeeded\(|persistAndReleaseA4ObservationRebuildIfDurable\(' -- app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt app/src/test || true

          echo '=== A4 durability gate ownership ==='
          git grep -n -C 6 -E 'a4ObservationDurabilityGate|A4ObservationDurabilityGate|releaseAfterPersistence|arm|mark.*Durab|pending.*Observation' -- app/src/main app/src/test || true

          echo '=== mutation/persistence tests ==='
          git grep -n -C 4 -E 'SideEffect|ON_PAUSE|ON_STOP|persistActiveGameStateIfNeeded|saveActiveGameState|ACTIVE_GAME_STATE_KEY' -- app/src/test || true

          echo '=== likely game transaction entry points around active state ==='
          git grep -n -E '^    fun (start|confirm|commit|apply|resolve|advance|record|complete|finish|archive|restart|return|persist)[A-Z]' -- app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt | head -n 500 || true

          echo '=== exact SideEffect/lifecycle block ==='
          sed -n '1758,1792p' app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt

          echo '=== explicit start-save contexts ==='
          sed -n '1948,1972p' app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          sed -n '2098,2120p' app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt

          echo '=== archive/clear contexts ==='
          sed -n '2208,2272p' app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
