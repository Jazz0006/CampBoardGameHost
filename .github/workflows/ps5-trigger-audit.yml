name: PS5 Recovery write gate cutover

on:
  push:
    branches:
      - codex/persistence-simplification
    paths:
      - .github/workflows/ps5-trigger-audit.yml

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/persistence-simplification
          fetch-depth: 0

      - name: Verify locked parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '22086dd984fb7992d00e3226d444affb76adb509'
          test "$(git ls-remote origin refs/heads/codex/persistence-simplification | cut -f1)" = "$(git rev-parse HEAD)"

      - name: Patch App to use semantic Recovery write gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''    val cards = remember { mutableStateListOf<PlayerCard>() }\n    val records = remember { mutableStateListOf<EliminationRecord>() }\n    val clocktowerEvents = remember { mutableStateListOf<ClocktowerEvent>() }''',
                  '''    val cards = remember { mutableStateListOf<PlayerCard>() }\n    val records = remember { mutableStateListOf<EliminationRecord>() }\n    val recoveryWriteGate = remember { RecoveryWriteGate() }\n    val clocktowerEvents = remember { mutableStateListOf<ClocktowerEvent>() }''',
              ),
              (
                  '''    fun clearSavedGameState() {\n        baseContext.clearActiveGameState()\n        savedGamePreview = null\n    }''',
                  '''    fun clearSavedGameState() {\n        baseContext.clearActiveGameState()\n        recoveryWriteGate.clear()\n        savedGamePreview = null\n    }''',
              ),
              (
                  '''    fun persistActiveGameStateIfNeeded(): Boolean {\n        if (!screen.isActiveGameScreen() || cards.isEmpty()) return false\n        return baseContext.saveActiveGameState(\n            RecoverySnapshotJsonCodec.encode(activeGameRecoverySnapshot()),\n        )\n    }\n\n    fun persistAndReleaseA4ObservationRebuildIfDurable() {\n        val persisted = persistActiveGameStateIfNeeded()\n        val recordId = a4ObservationDurabilityGate.releaseAfterPersistence(persisted) ?: return\n        a4ObservationCacheRebuildRequest = a4ObservationCacheRebuildRequestOrNull(recordId)\n    }''',
                  '''    fun persistActiveGameStateIfNeeded(force: Boolean = false): Boolean {\n        if (!screen.isActiveGameScreen() || cards.isEmpty()) return false\n        val snapshot = activeGameRecoverySnapshot()\n        return recoveryWriteGate.persist(snapshot, force = force) { durableSnapshot ->\n            baseContext.saveActiveGameState(RecoverySnapshotJsonCodec.encode(durableSnapshot))\n        }\n    }\n\n    fun persistAndReleaseA4ObservationRebuildIfDurable(force: Boolean = false) {\n        val persisted = persistActiveGameStateIfNeeded(force = force)\n        val recordId = a4ObservationDurabilityGate.releaseAfterPersistence(persisted) ?: return\n        a4ObservationCacheRebuildRequest = a4ObservationCacheRebuildRequestOrNull(recordId)\n    }''',
              ),
              (
                  '''    val latestPersistActiveGameState by rememberUpdatedState {\n        persistAndReleaseA4ObservationRebuildIfDurable()\n    }''',
                  '''    val latestPersistActiveGameState by rememberUpdatedState {\n        persistAndReleaseA4ObservationRebuildIfDurable(force = true)\n    }''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one App anchor, found {count}: {old[:100]!r}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Focused Recovery write gate test
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --tests 'com.codex.campboardgamehost.RecoveryWriteGateTest' --no-daemon --build-cache

      - name: FAST regression gate
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testFast --no-daemon --build-cache

      - name: Exact trigger and diff audit
        shell: bash
        run: |
          set -euo pipefail
          APP='app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt'
          GATE='app/src/main/java/com/codex/campboardgamehost/persistence/RecoveryWriteGate.kt'
          TEST='app/src/test/java/com/codex/campboardgamehost/persistence/RecoveryWriteGateTest.kt'

          test -f "$GATE"
          test -f "$TEST"
          test "$(grep -c 'val recoveryWriteGate = remember { RecoveryWriteGate() }' "$APP")" -eq 1
          test "$(grep -c 'return recoveryWriteGate.persist(snapshot, force = force)' "$APP")" -eq 1
          test "$(grep -c 'persistAndReleaseA4ObservationRebuildIfDurable(force = true)' "$APP")" -eq 1
          test "$(grep -c 'recoveryWriteGate.clear()' "$APP")" -eq 1
          test "$(grep -c 'baseContext.saveActiveGameState' "$APP")" -eq 1
          test "$(grep -c 'baseContext.clearActiveGameState()' "$APP")" -eq 1
          grep -n -C 4 -E 'recoveryWriteGate|persistActiveGameStateIfNeeded|persistAndReleaseA4ObservationRebuildIfDurable|ON_PAUSE|ON_STOP|SideEffect' "$APP"
          git diff --check
          git diff -- "$APP"

      - name: Commit validated cutover
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          git commit -m 'refactor: dedupe semantic Recovery writes'
          git push origin HEAD:codex/persistence-simplification

      - name: Self-clean workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/ps5-trigger-audit.yml
          git commit -m 'chore: remove PS5 trigger audit workflow'
          git push origin HEAD:codex/persistence-simplification
