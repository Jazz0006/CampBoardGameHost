name: D6.1b Session RED

on:
  push:
    branches:
      - codex/d6-root-reaudit
    paths:
      - .github/workflows/d6_1b_session_red.yml

permissions:
  contents: read

jobs:
  focused-red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run ClocktowerGameSession focused test
        run: ./gradlew :app:testDebugUnitTest --tests com.codex.campboardgamehost.clocktower.session.ClocktowerGameSessionTest --no-daemon --rerun-tasks
