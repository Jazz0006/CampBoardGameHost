name: S4 night target draft toggle one-shot

on:
  push:
    branches:
      - codex/experienced-night-flow-correctness
    paths:
      - .github/workflows/s4-night-target-draft-toggle-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: codex/experienced-night-flow-correctness
          fetch-depth: 0

      - name: Verify bootstrap head and blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/codex/experienced-night-flow-correctness | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt)" = "39dd3cdcf4be21b408696475bee499e918233504"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerHostSelectionSemantics.kt)" = "4db7112a6eb21811ae3bfcdc9a0b0f875cdf635b"
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/ClocktowerHostSelectionSemanticsCharacterizationTest.kt)" = "577608426b3e0c17963163fe002f2ed05212284b"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prove focused baseline
        run: ./gradlew :app:testDebugUnitTest --tests 'com.codex.campboardgamehost.ClocktowerHostSelectionSemanticsCharacterizationTest' --rerun-tasks --no-daemon

      - name: Apply exact production patch
        run: python3 .github/scripts/s4_night_target_draft_toggle_patch.py

      - name: Run focused GREEN
        run: ./gradlew :app:testDebugUnitTest --tests 'com.codex.campboardgamehost.ClocktowerHostSelectionSemanticsCharacterizationTest' --rerun-tasks --no-daemon

      - name: Run S4 checkpoint suite
        run: ./gradlew :app:testFast --rerun-tasks --no-daemon

      - name: Exact diff audit
        shell: bash
        run: |
          set -euo pipefail
          target='app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt'
          git diff --check
          test "$(git diff --name-only | paste -sd ' ' -)" = "$target"
          test "$(git hash-object "$target")" = "336b78ead007669c8e96f24dd3f736ff6aa11d37"
          git diff -- "$target"

      - name: Reconfirm remote head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/experienced-night-flow-correctness | cut -f1)" = "$GITHUB_SHA"

      - name: Commit and push production patch
        shell: bash
        run: |
          set -euo pipefail
          target='app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          test "$(git diff --cached --name-only | paste -sd ' ' -)" = "$target"
          git commit -m 'fix: route night target edits through visible draft'
          git push origin HEAD:codex/experienced-night-flow-correctness
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/s4-night-target-draft-toggle-one-shot.yml .github/scripts/s4_night_target_draft_toggle_patch.py
          git commit -m 'chore(ci): remove S4 night target one-shot workflow'
          git push origin HEAD:codex/experienced-night-flow-correctness
          echo "CLEANUP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report checkpoints
        run: |
          echo "Product checkpoint: $PRODUCT_SHA"
          echo "Cleanup checkpoint: $CLEANUP_SHA"
