name: PS4.5a persistence hygiene validation

on:
  push:
    branches:
      - codex/persistence-simplification
    paths:
      - .github/workflows/ps4-5a-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout locked branch
        uses: actions/checkout@v4
        with:
          ref: codex/persistence-simplification
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify validation preconditions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '7cd29bddceef942af0964855dfbcafdaa18b8b6d'

      - name: Verify PS4.5a cleanup references
        shell: bash
        run: |
          set -euo pipefail
          test ! -e app/src/main/java/com/codex/campboardgamehost/persistence/CommittedClocktowerSetupPersistence.kt
          test ! -e app/src/test/java/com/codex/campboardgamehost/persistence/CommittedClocktowerSetupPersistenceTest.kt
          PATTERN='ClocktowerRulesetPersistenceBasisJsonCodec|resolveLegacyBasisForRestore|resolveForRestore|CommittedClocktowerSetupPersistence'
          if git grep -nE "$PATTERN" -- app/src/main app/src/test; then
            echo 'Removed PS4.5a persistence helper still referenced.' >&2
            exit 1
          fi
          grep -q 'fun refFor(' app/src/main/java/com/codex/campboardgamehost/clocktower/persistence/ClocktowerRulesetPersistence.kt
          grep -q 'ClocktowerRulesetPersistenceBasis' app/src/main/java/com/codex/campboardgamehost/clocktower/persistence/ClocktowerRulesetPersistence.kt
          git diff --check HEAD~8..HEAD

      - name: Run focused current ruleset basis test
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests 'com.codex.campboardgamehost.ClocktowerRulesetPersistenceBasisTest'

      - name: Run FAST regression suite
        run: ./gradlew testFast

      - name: Self-clean validation workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ps4-5a-validation.yml
          git commit -m 'chore: remove PS4.5a validation workflow'
          git push origin HEAD:codex/persistence-simplification
