name: TBSP 6H-A first-night precompute lifecycle

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tbsp-6h-a-first-night-precompute-core.yml

permissions:
  contents: write

jobs:
  lifecycle:
    if: github.head_ref == 'codex/trouble-brewing-setup-presets-v2'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: codex/trouble-brewing-setup-presets-v2
      EXPECTED_PARENT: bf8c46bd1acde81c15c7323d858594c648b3b845
      WORKFLOW_PATH: .github/workflows/tbsp-6h-a-first-night-precompute-core.yml
      PROD_PATH: app/src/main/java/com/codex/campboardgamehost/clocktower/session/TroubleBrewingFirstNightPrecomputeCoordinator.kt
      TEST_PATH: app/src/test/java/com/codex/campboardgamehost/clocktower/session/TroubleBrewingFirstNightPrecomputeCoordinatorTest.kt

    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v6
        with:
          ref: codex/trouble-brewing-setup-presets-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Verify locked parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          actual="$(git diff --name-only "$EXPECTED_PARENT"..HEAD)"
          test "$actual" = "$WORKFLOW_PATH"
          remote_line="$(git ls-remote origin "refs/heads/$TARGET_BRANCH")"
          remote_sha="${remote_line%%$'\t'*}"
          test "$remote_sha" = "$(git rev-parse HEAD)"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create typed RED contract and deliberately incomplete stub
        shell: bash
        run: |
          set -euo pipefail
          cat > "$TEST_PATH" <<'EOF'
          package com.codex.campboardgamehost.clocktower.session

          import kotlinx.coroutines.CoroutineStart
          import kotlinx.coroutines.async
          import kotlinx.coroutines.runBlocking
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertNull
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class TroubleBrewingFirstNightPrecomputeCoordinatorTest {
              @Test fun `reveal prewarm queues expensive work without building synchronously`() {
                  var buildCalls = 0
                  val queued = mutableListOf<() -> Unit>()
                  val coordinator = TroubleBrewingFirstNightPrecomputeCoordinator<String, String> { request ->
                      buildCalls += 1
                      "result:$request"
                  }

                  coordinator.prewarm("committed-game-v1") { work -> queued += work }

                  assertEquals(0, buildCalls)
                  assertEquals(1, queued.size)
                  assertEquals(TroubleBrewingFirstNightPrecomputeStatus.BUSY, coordinator.statusFor("committed-game-v1"))
                  assertNull(coordinator.readyFor("committed-game-v1"))
              }

              @Test fun `exact busy consumer awaits queued work then exact ready result is reused`() = runBlocking {
                  var buildCalls = 0
                  val queued = mutableListOf<() -> Unit>()
                  val coordinator = TroubleBrewingFirstNightPrecomputeCoordinator<String, String> { request ->
                      buildCalls += 1
                      "result:$request"
                  }
                  coordinator.prewarm("committed-game-v1") { work -> queued += work }

                  val waiting = async(start = CoroutineStart.UNDISPATCHED) {
                      coordinator.resultFor("committed-game-v1")
                  }
                  assertFalse(waiting.isCompleted)

                  queued.single().invoke()

                  assertEquals("result:committed-game-v1", waiting.await())
                  assertEquals(1, buildCalls)
                  assertEquals(TroubleBrewingFirstNightPrecomputeStatus.READY, coordinator.statusFor("committed-game-v1"))
                  assertEquals("result:committed-game-v1", coordinator.readyFor("committed-game-v1"))
                  assertEquals("result:committed-game-v1", coordinator.resultFor("committed-game-v1"))
                  assertEquals(1, buildCalls)
              }

              @Test fun `miss recomputes exact requested input and stale background cannot overwrite it`() = runBlocking {
                  val built = mutableListOf<String>()
                  val queued = mutableListOf<() -> Unit>()
                  val coordinator = TroubleBrewingFirstNightPrecomputeCoordinator<String, String> { request ->
                      built += request
                      "result:$request"
                  }
                  coordinator.prewarm("old-game") { work -> queued += work }

                  assertEquals("result:current-game", coordinator.resultFor("current-game"))
                  assertEquals(listOf("current-game"), built)
                  assertEquals("result:current-game", coordinator.readyFor("current-game"))
                  assertEquals(TroubleBrewingFirstNightPrecomputeStatus.MISS, coordinator.statusFor("old-game"))

                  queued.single().invoke()

                  assertEquals(listOf("current-game", "old-game"), built)
                  assertEquals("result:current-game", coordinator.readyFor("current-game"))
                  assertNull(coordinator.readyFor("old-game"))
                  assertTrue(coordinator.statusFor("current-game") == TroubleBrewingFirstNightPrecomputeStatus.READY)
              }
          }
          EOF

          cat > "$PROD_PATH" <<'EOF'
          package com.codex.campboardgamehost.clocktower.session

          internal enum class TroubleBrewingFirstNightPrecomputeStatus {
              MISS,
              BUSY,
              READY,
          }

          internal class TroubleBrewingFirstNightPrecomputeCoordinator<Request : Any, Result : Any>(
              private val build: (Request) -> Result,
          ) {
              fun prewarm(request: Request, launchBackground: ((() -> Unit) -> Unit)) {
                  launchBackground { build(request) }
              }

              fun statusFor(request: Request): TroubleBrewingFirstNightPrecomputeStatus =
                  TroubleBrewingFirstNightPrecomputeStatus.MISS

              fun readyFor(request: Request): Result? = null

              suspend fun resultFor(request: Request): Result = build(request)
          }
          EOF

      - name: Prove typed RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./gradlew :app:testFast \
            --tests '*TroubleBrewingFirstNightPrecomputeCoordinatorTest' \
            --rerun-tasks > /tmp/tbsp-6h-red.log 2>&1
          code=$?
          set -e
          cat /tmp/tbsp-6h-red.log
          test "$code" -ne 0
          grep -Eq 'FAILED|failed|AssertionError|expected' /tmp/tbsp-6h-red.log

      - name: Implement lifecycle GREEN
        shell: bash
        run: |
          set -euo pipefail
          cat > "$PROD_PATH" <<'EOF'
          package com.codex.campboardgamehost.clocktower.session

          import kotlinx.coroutines.CompletableDeferred

          internal enum class TroubleBrewingFirstNightPrecomputeStatus {
              MISS,
              BUSY,
              READY,
          }

          /**
           * Exact-input lifecycle owner for Trouble Brewing First Night precomputation.
           *
           * Dispatch policy is intentionally owned by the caller: reveal wiring supplies an
           * off-main launcher, while a point-of-use MISS must invoke [resultFor] from an
           * existing safe background context. The coordinator owns only exact request identity,
           * BUSY awaiting, READY reuse, and stale-result rejection.
           */
          internal class TroubleBrewingFirstNightPrecomputeCoordinator<Request : Any, Result : Any>(
              private val build: (Request) -> Result,
          ) {
              private class Entry<Request : Any, Result : Any>(
                  val request: Request,
                  val completion: CompletableDeferred<Result> = CompletableDeferred(),
              ) {
                  var readyResult: Result? = null
                  var failed: Boolean = false
              }

              private val lock = Any()
              private var current: Entry<Request, Result>? = null

              fun prewarm(
                  request: Request,
                  launchBackground: ((() -> Unit) -> Unit),
              ) {
                  val entry = synchronized(lock) {
                      current?.takeIf { it.request == request }?.let { return }
                      Entry<Request, Result>(request).also { current = it }
                  }
                  launchBackground {
                      try {
                          val result = build(request)
                          synchronized(lock) {
                              if (current === entry) {
                                  entry.readyResult = result
                              }
                          }
                          entry.completion.complete(result)
                      } catch (error: Throwable) {
                          synchronized(lock) {
                              if (current === entry) {
                                  entry.failed = true
                              }
                          }
                          entry.completion.completeExceptionally(error)
                      }
                  }
              }

              fun statusFor(request: Request): TroubleBrewingFirstNightPrecomputeStatus = synchronized(lock) {
                  val entry = current?.takeIf { it.request == request }
                      ?: return@synchronized TroubleBrewingFirstNightPrecomputeStatus.MISS
                  when {
                      entry.readyResult != null -> TroubleBrewingFirstNightPrecomputeStatus.READY
                      entry.failed -> TroubleBrewingFirstNightPrecomputeStatus.MISS
                      else -> TroubleBrewingFirstNightPrecomputeStatus.BUSY
                  }
              }

              fun readyFor(request: Request): Result? = synchronized(lock) {
                  current
                      ?.takeIf { it.request == request && !it.failed }
                      ?.readyResult
              }

              suspend fun resultFor(request: Request): Result {
                  val exact = synchronized(lock) {
                      current?.takeIf { it.request == request && !it.failed }
                  }
                  if (exact != null) {
                      exact.readyResult?.let { return it }
                      try {
                          return exact.completion.await()
                      } catch (_: Throwable) {
                          // Failed reveal work is not reusable. Recompute the exact current input
                          // through the caller's safe point-of-use background context.
                      }
                  }
                  return buildFallback(request)
              }

              private fun buildFallback(request: Request): Result {
                  val entry = Entry<Request, Result>(request)
                  synchronized(lock) {
                      current = entry
                  }
                  return try {
                      val result = build(request)
                      synchronized(lock) {
                          if (current === entry) {
                              entry.readyResult = result
                          }
                      }
                      entry.completion.complete(result)
                      result
                  } catch (error: Throwable) {
                      synchronized(lock) {
                          if (current === entry) {
                              entry.failed = true
                          }
                      }
                      entry.completion.completeExceptionally(error)
                      throw error
                  }
              }
          }
          EOF

      - name: Run focused 6H-A GREEN and predecessor First Night contracts
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testFast \
            --tests '*TroubleBrewingFirstNightPrecomputeCoordinatorTest' \
            --tests '*FirstNightInformationLifecycleTest' \
            --tests '*FirstNightInformationMigrationTest' \
            --tests '*FirstNightPoisonLifecycleTest' \
            --rerun-tasks

      - name: Audit exact scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git diff --name-only HEAD | sort)"
          expected="$(printf '%s\n%s\n' "$PROD_PATH" "$TEST_PATH" | sort)"
          test "$actual" = "$expected"
          test ! -e app/src/test/java/com/codex/campboardgamehost/clocktower/session/TroubleBrewingSetupRecommendationProductionWiringTest.kt
          git diff --stat

      - name: Commit and push 6H-A lifecycle core
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PROD_PATH" "$TEST_PATH"
          git commit -m 'feat: add TBSP 6H first-night precompute lifecycle'
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Remove one-shot workflow and push cleanup
        shell: bash
        run: |
          set -euo pipefail
          git rm "$WORKFLOW_PATH"
          git commit -m 'chore(ci): remove TBSP 6H-A one-shot workflow'
          git push origin "HEAD:$TARGET_BRANCH"
