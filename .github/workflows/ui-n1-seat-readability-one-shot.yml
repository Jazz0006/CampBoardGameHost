name: UI-N1 seat readability one-shot

on:
  push:
    branches:
      - codex/ui-n1-inline-wake-cue
    paths:
      - .github/workflows/ui-n1-seat-readability-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore(ci) run UI-N1 seat readability one-shot'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          ref: codex/ui-n1-inline-wake-cue
          fetch-depth: 0

      - name: Verify exact head and protected blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/codex/ui-n1-inline-wake-cue | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerSquareTableUi.kt)" = "37e3d31195739ab2a35e3acdad3b3ff2b4861626"
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/ClocktowerSquareTableSeatDensityPolicyTest.kt)" = "76aab3046587be87b67b9150d1051602be6aea13"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Confirm existing focused GREEN baseline
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerSquareTableSeatDensityPolicyTest' \
            --rerun-tasks --no-daemon

      - name: Apply exact visual patch
        run: python3 .github/scripts/ui_n1_seat_readability_patch.py

      - name: Re-run focused existing tests
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerSquareTableSeatDensityPolicyTest' \
            --rerun-tasks --no-daemon

      - name: Run FAST checkpoint tests
        run: ./gradlew :app:testFast --rerun-tasks --no-daemon

      - name: Exact diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git diff --name-only | sort | tr '\n' ' ' | sed 's/ $//')"
          expected="app/src/main/java/com/codex/campboardgamehost/ClocktowerSquareTableUi.kt"
          test "$actual" = "$expected"
          grep -F 'text = seat.seatNumber.toString()' app/src/main/java/com/codex/campboardgamehost/ClocktowerSquareTableUi.kt
          grep -F '.align(Alignment.TopStart)' app/src/main/java/com/codex/campboardgamehost/ClocktowerSquareTableUi.kt
          ! grep -F 'ClocktowerSeatNumberBadge(' app/src/main/java/com/codex/campboardgamehost/ClocktowerSquareTableUi.kt
          ! grep -F 'LocalContext' app/src/main/java/com/codex/campboardgamehost/ClocktowerSquareTableUi.kt
          git diff --stat

      - name: Reconfirm remote head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/ui-n1-inline-wake-cue | cut -f1)" = "$GITHUB_SHA"

      - name: Commit and push visual patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/codex/campboardgamehost/ClocktowerSquareTableUi.kt
          test "$(git diff --cached --name-only)" = "app/src/main/java/com/codex/campboardgamehost/ClocktowerSquareTableUi.kt"
          git commit -m 'feat(ui): watermark square-table seat numbers'
          git push origin HEAD:codex/ui-n1-inline-wake-cue
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/ui-n1-inline-wake-cue | cut -f1)" = "$PRODUCT_SHA"
          git rm .github/workflows/ui-n1-seat-readability-one-shot.yml .github/scripts/ui_n1_seat_readability_patch.py
          git commit -m 'chore(ci): remove UI-N1 seat readability one-shot'
          git push origin HEAD:codex/ui-n1-inline-wake-cue
          echo "CLEANUP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report checkpoints
        run: |
          echo "Product checkpoint: $PRODUCT_SHA"
          echo "Cleanup checkpoint: $CLEANUP_SHA"
