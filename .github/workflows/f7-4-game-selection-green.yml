name: F7.4 game selection GREEN

on:
  push:
    branches:
      - codex/ui-r4d2-seating-first-setup

permissions:
  contents: write

jobs:
  game-selection-green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Guard F7.4 base
        run: test "$(git rev-parse HEAD^)" = "2999f68ec92bb8ffcf184e40c215a8ad1d61b22d"

      - name: Apply F7.4 hierarchy correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/codex/campboardgamehost/SeatingFirstSetupUi.kt")
          text = path.read_text()
          old = '''            Row(
                modifier = Modifier.fillMaxWidth(),
                horizontalArrangement = Arrangement.SpaceBetween,
                verticalAlignment = Alignment.CenterVertically,
            ) {
                TextButton(onClick = onBackToSeating) {
                    Text(text("重新安排座位", "Edit seats"))
                }
                Text(
                    text = text("选择游戏", "Choose game"),
                    style = MaterialTheme.typography.titleLarge,
                    fontWeight = FontWeight.Bold,
                )
                Text(text("${playerCount}人", "$playerCount players"))
            }

            HostTableShell(
                seats = seating.toHostSeatPresentations(),
                modifier = Modifier
                    .fillMaxWidth()
                    .weight(1f),
            ) {
                Column(
                    modifier = Modifier.fillMaxWidth(),
                    verticalArrangement = Arrangement.spacedBy(8.dp),
                ) {
                    Button(
                        onClick = onOpenClocktowerSettings,
                        enabled = playerCount >= MIN_CLOCKTOWER_PLAYERS,
                        modifier = Modifier.fillMaxWidth(),
                    ) {
                        Text(text("血染钟楼", "Blood on the Clocktower"))
                    }
                    OutlinedButton(
                        onClick = onOpenUndercoverSettings,
                        enabled = playerCount >= MIN_PLAYERS,
                        modifier = Modifier.fillMaxWidth(),
                    ) {
                        Text(text("谁是卧底", "Who is Undercover"))
                    }
                    OutlinedButton(
                        onClick = onOpenWerewolfSettings,
                        enabled = playerCount >= MIN_WEREWOLF_PLAYERS,
                        modifier = Modifier.fillMaxWidth(),
                    ) {
                        Text(text("狼人杀", "Werewolf"))
                    }
                }
            }
'''
          new = '''            HostTableShell(
                seats = seating.toHostSeatPresentations(),
                modifier = Modifier
                    .fillMaxWidth()
                    .weight(1f),
            ) {
                Column(
                    modifier = Modifier.fillMaxWidth(),
                    verticalArrangement = Arrangement.spacedBy(8.dp),
                    horizontalAlignment = Alignment.CenterHorizontally,
                ) {
                    Text(
                        text = text("选择游戏", "Choose game"),
                        style = MaterialTheme.typography.titleLarge,
                        fontWeight = FontWeight.Bold,
                    )
                    Text(
                        text = text("${playerCount}人", "$playerCount players"),
                        style = MaterialTheme.typography.bodySmall,
                        color = MaterialTheme.colorScheme.onSurfaceVariant,
                    )
                    Button(
                        onClick = onOpenClocktowerSettings,
                        enabled = playerCount >= MIN_CLOCKTOWER_PLAYERS,
                        modifier = Modifier.fillMaxWidth(),
                    ) {
                        Text(text("血染钟楼", "Blood on the Clocktower"))
                    }
                    OutlinedButton(
                        onClick = onOpenUndercoverSettings,
                        enabled = playerCount >= MIN_PLAYERS,
                        modifier = Modifier.fillMaxWidth(),
                    ) {
                        Text(text("谁是卧底", "Who is Undercover"))
                    }
                    OutlinedButton(
                        onClick = onOpenWerewolfSettings,
                        enabled = playerCount >= MIN_WEREWOLF_PLAYERS,
                        modifier = Modifier.fillMaxWidth(),
                    ) {
                        Text(text("狼人杀", "Werewolf"))
                    }
                    Surface(
                        modifier = Modifier
                            .fillMaxWidth()
                            .height(1.dp),
                        color = MaterialTheme.colorScheme.outlineVariant,
                    ) {}
                    TextButton(
                        onClick = onBackToSeating,
                        modifier = Modifier.fillMaxWidth(),
                    ) {
                        Text(text("重新安排座位", "Edit seats"))
                    }
                }
            }
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one Game Selection anchor, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Run focused authority/table contracts
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests com.codex.campboardgamehost.HostSeatingRosterTest \
            --tests com.codex.campboardgamehost.ClocktowerHostTableContractTest \
            --tests com.codex.campboardgamehost.ClocktowerSquareTableSeatLayoutTest \
            --no-daemon

      - name: Run Android FAST regression
        run: ./gradlew :app:testFast --no-daemon --build-cache

      - name: Remove temporary workflow and audit permanent diff
        run: |
          set -euo pipefail
          rm .github/workflows/f7-4-game-selection-green.yml
          git diff --check
          git diff --name-only 2999f68ec92bb8ffcf184e40c215a8ad1d61b22d | sort > /tmp/actual.txt
          printf '%s\n' 'app/src/main/java/com/codex/campboardgamehost/SeatingFirstSetupUi.kt' > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Commit verified F7.4 product checkpoint
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(F7.4): clarify game selection hierarchy"
          git push origin HEAD:codex/ui-r4d2-seating-first-setup
