# Retry after fixing the compact completion test fixture metadata.
name: MS-S1R TB completion cutover one-shot

on:
  push:
    branches:
      - codex/ms-setup-generic-architecture
    paths:
      - .github/workflows/ms-s1r-tb-completion-cutover-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: codex/ms-setup-generic-architecture
          fetch-depth: 0

      - name: Verify bootstrap head and blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/codex/ms-setup-generic-architecture | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" = "356dad1adc7249c2e29e9cee7bb3a79a8a349216"
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/persistence/ActiveGameProductionPersistenceWiringTest.kt)" = "c83c03a66d3154ba613cb554d2ad59495e88a78d"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/clocktower/setup/TroubleBrewingSetupRotationRecordFactory.kt)" = "9edab48a8dd1a94f0f311de0a47910ed94fe0759"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/persistence/TroubleBrewingSetupCompletionPersistence.kt)" = "3e12bd15c4e81d5b827af6853bd4135a3158cbd9"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/persistence/TroubleBrewingSetupRotationHistoryStore.kt)" = "1a258e6c3d197ca6b70a6e8696bc52a7a19e51a6"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate compact completion seams before App mutation
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.clocktower.setup.TroubleBrewingSetupRotationRecordFactoryTest' \
            --tests 'com.codex.campboardgamehost.TroubleBrewingSetupCompletionPersistenceTest' \
            --tests 'com.codex.campboardgamehost.TroubleBrewingSetupRotationRecordStoreTest' \
            --tests 'com.codex.campboardgamehost.TroubleBrewingSetupRotationHistoryStoreTest' \
            --rerun-tasks --no-daemon

      - name: Prove focused App wiring RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ActiveGameProductionPersistenceWiringTest' \
            --rerun-tasks --no-daemon 2>&1 | tee /tmp/ms-s1r-tb-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          test -f app/build/test-results/testDebugUnitTest/TEST-com.codex.campboardgamehost.ActiveGameProductionPersistenceWiringTest.xml
          grep -F '<failure' app/build/test-results/testDebugUnitTest/TEST-com.codex.campboardgamehost.ActiveGameProductionPersistenceWiringTest.xml

      - name: Apply exact App production patch
        run: python3 .github/scripts/ms_s1r_tb_completion_cutover_patch.py

      - name: Run focused GREEN
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ActiveGameProductionPersistenceWiringTest' \
            --tests 'com.codex.campboardgamehost.clocktower.setup.TroubleBrewingSetupRotationRecordFactoryTest' \
            --tests 'com.codex.campboardgamehost.TroubleBrewingSetupCompletionPersistenceTest' \
            --tests 'com.codex.campboardgamehost.TroubleBrewingSetupRotationRecordStoreTest' \
            --tests 'com.codex.campboardgamehost.TroubleBrewingSetupRotationHistoryStoreTest' \
            --tests 'com.codex.campboardgamehost.CommittedClocktowerSetupPersistenceTest' \
            --rerun-tasks --no-daemon

      - name: Run FAST checkpoint suite
        run: ./gradlew :app:testFast --rerun-tasks --no-daemon

      - name: Exact diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | paste -sd ' ' -)" = "app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt"
          grep -F 'TroubleBrewingSetupCompletionPersistence.encode(record)' app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          grep -F 'TroubleBrewingSetupCompletionPersistence.decodeOrNull(json)' app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          grep -F 'committedTroubleBrewingSetupRotationRecord = TroubleBrewingSetupRotationRecordFactory.fromSelection(' app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          grep -F 'record = record' app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          ! grep -F 'TroubleBrewingSetupProvenancePersistence' app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          ! grep -F 'committedTroubleBrewingSetupSelection' app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt').read_text()
          restore = text.split('fun restoreSavedGame()', 1)[1].split('val latestPersistActiveGameState', 1)[0]
          assert 'trouble_brewing_setup_presets_v2_final.json' not in restore
          PY
          git diff -- app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt

      - name: Reconfirm remote bootstrap head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/ms-setup-generic-architecture | cut -f1)" = "$GITHUB_SHA"

      - name: Commit and push product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          test "$(git diff --cached --name-only | paste -sd ' ' -)" = "app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt"
          git commit -m 'feat(ms-s1r): restore TB completion summary directly'
          git push origin HEAD:codex/ms-setup-generic-architecture
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/ms-setup-generic-architecture | cut -f1)" = "$PRODUCT_SHA"
          git rm .github/workflows/ms-s1r-tb-completion-cutover-one-shot.yml .github/scripts/ms_s1r_tb_completion_cutover_patch.py
          git commit -m 'chore(ci): remove MS-S1R TB completion cutover one-shot'
          git push origin HEAD:codex/ms-setup-generic-architecture
          echo "CLEANUP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report checkpoints
        run: |
          echo "Product checkpoint: $PRODUCT_SHA"
          echo "Cleanup checkpoint: $CLEANUP_SHA"
