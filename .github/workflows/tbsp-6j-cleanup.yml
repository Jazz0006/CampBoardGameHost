name: TBSP 6J cleanup

on:
  push:
    branches:
      - codex/trouble-brewing-setup-presets-v2
    paths:
      - .github/workflows/tbsp-6j-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: codex/trouble-brewing-setup-presets-v2
          fetch-depth: 0

      - name: Verify bootstrap head and App blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/codex/trouble-brewing-setup-presets-v2 | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" = "d3b6be6f39b8f4f9214ff4863c72858c606d293b"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply exact cleanup patch
        run: python3 .github/scripts/tbsp_6j_cleanup_patch.py

      - name: Compile Android debug Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Run focused NGJ regression
        run: ./gradlew :app:testDebugUnitTest --tests 'com.codex.campboardgamehost.NoGreaterJoySetupRegressionTest' --rerun-tasks --no-daemon

      - name: Run Android FAST unit tests
        run: ./gradlew :app:testFast --rerun-tasks --no-daemon

      - name: Exact diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | paste -sd ' ' -)" = "app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt"
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt').read_text(encoding='utf-8')
          assert 'preparedSetupPlan: RecommendationPlan? = null' not in text
          assert 'resetDealState(GameKind.Clocktower, script, preparedSeed, preparedSetupPlan)' not in text
          assert 'val preparedSetupPlan = if (assignments.any { it.actualRole.enName == "Drunk" })' in text
          assert 'val recommendedDrunkShownRole = preparedSetupPlan' in text
          PY
          git diff -- app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt

      - name: Reconfirm remote head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/trouble-brewing-setup-presets-v2 | cut -f1)" = "$GITHUB_SHA"

      - name: Commit and push production cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          test "$(git diff --cached --name-only | paste -sd ' ' -)" = "app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt"
          git commit -m 'refactor: remove dead setup-plan pass-through'
          git push origin HEAD:codex/trouble-brewing-setup-presets-v2
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Remove one-shot workflow and script
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tbsp-6j-cleanup.yml .github/scripts/tbsp_6j_cleanup_patch.py
          git commit -m 'chore(ci): remove TBSP 6J one-shot workflow'
          git push origin HEAD:codex/trouble-brewing-setup-presets-v2
          echo "CLEANUP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report checkpoints
        run: |
          echo "Product checkpoint: $PRODUCT_SHA"
          echo "Cleanup checkpoint: $CLEANUP_SHA"
