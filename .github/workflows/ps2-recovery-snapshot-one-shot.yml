name: PS2 Recovery Snapshot One Shot

on:
  push:
    branches:
      - codex/persistence-simplification

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v6
        with:
          ref: codex/persistence-simplification
          fetch-depth: 2

      - name: Verify locked parent and blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "6e98bfbbc4ffd7a6b4a5c544de34ebd402d8d359"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" = "1490fcee09fc9758c56176d06f259d13473e807b"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/persistence/RecoverySnapshot.kt)" = "04917b861daeddf2e4bd11d930715b9136dd9e3b"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/persistence/RecoverySnapshotJsonCodec.kt)" = "8db7f3aed7102b607d2a8873811e38434aacb103"
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/persistence/RecoverySnapshotJsonCodecTest.kt)" = "a4ab21ddcda14d1be992422ff91a6f75712de8f6"
          test "$(git hash-object .github/scripts/ps2_recovery_snapshot_patch.py)" = "9bba00d1bfb290db0940ccf8b094ecbad9e7c28b"
          test -z "$(git status --porcelain)"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Prove typed recovery codec contract before App wiring
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.RecoverySnapshotJsonCodecTest' \
            --tests 'com.codex.campboardgamehost.GameArchiveJsonCodecTest' \
            --rerun-tasks --no-daemon

      - name: Patch App active recovery writer
        run: python3 .github/scripts/ps2_recovery_snapshot_patch.py

      - name: Exact App diff audit before tests
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt"
          git diff -- app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt

      - name: Run PS2 focused contracts after wiring
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.RecoverySnapshotJsonCodecTest' \
            --tests 'com.codex.campboardgamehost.GameArchiveJsonCodecTest' \
            --rerun-tasks --no-daemon

      - name: Run Android fast regression suite
        run: ./gradlew :app:testFast --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Commit and push PS2 product change
        id: product
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          git commit -m "refactor: write typed emergency recovery snapshots"
          product_sha="$(git rev-parse HEAD)"
          echo "product_sha=$product_sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:codex/persistence-simplification

      - name: Self-remove PS2 one-shot machinery
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/scripts/ps2_recovery_snapshot_patch.py .github/workflows/ps2-recovery-snapshot-one-shot.yml
          git commit -m "ci: remove PS2 recovery one-shot"
          cleanup_sha="$(git rev-parse HEAD)"
          echo "cleanup_sha=$cleanup_sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:codex/persistence-simplification

      - name: Report checkpoint
        run: |
          echo "PS2 product commit: ${{ steps.product.outputs.product_sha }}"
          echo "PS2 cleanup commit: ${{ steps.cleanup.outputs.cleanup_sha }}"
