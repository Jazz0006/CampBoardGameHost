name: R4D-5.2B Ghost Vote RED

on:
  push:
    branches:
      - codex/ui-r4d5-2b-ghost-vote-authority

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run focused RED
        id: focused
        shell: bash
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest --tests com.codex.campboardgamehost.ClocktowerGhostVoteAuthorityTest --no-daemon
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r4d5-2b-red.yml
          git commit -m "chore: remove R4D-5.2B RED workflow"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Assert RED
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.focused.outputs.status }}" = "0" ]; then
            echo "Expected focused RED to fail before production authority exists."
            exit 1
          fi
          echo "Focused RED failed as expected."
