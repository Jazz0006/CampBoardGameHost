name: UI-NAV-1E closeout and 1F audit

on:
  push:
    branches:
      - codex/ui-nav-1-global-navigation-visual-unification
    paths:
      - .github/workflows/ui-nav-1e-closeout-1f-audit.yml

permissions:
  contents: write

jobs:
  closeout-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify live 1E production checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ba2bd1f934dc4f49519fea4f7fbeba309235004b" || true
          git log --oneline -5
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/AppDealScreens.kt)" = "a89946ff5353c7d28a2130b479b77ed01a80a90e"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" = "62ff90f82cce302d6e020c519b7e61c156320852"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUi.kt)" = "3d125705eb628c53ec0d7693535f3621879c7d00"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt)" = "d898d4db93427bb222e6a68661d80f38bba36d4d"

      - name: Reconcile UI-NAV docs to 1E complete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          handoff = Path('docs/NEXT_DEVELOPMENT_HANDOFF_2026-09-10_UI_NAV_1_GLOBAL_NAVIGATION_VISUAL_UNIFICATION.md')
          text = handoff.read_text()
          text = text.replace(
              'Status: **ACTIVE — UI-NAV-1D COMPLETE / UI-NAV-1E NEXT**',
              'Status: **ACTIVE — UI-NAV-1E COMPLETE / UI-NAV-1F AUDIT NEXT**',
              1,
          )
          start = text.index('### UI-NAV-1E — Identity Reveal square-table controller')
          end = text.index('### UI-NAV-1F — Settings composition under Host Tools', start)
          replacement = '''### UI-NAV-1E — Identity Reveal square-table controller — COMPLETE / PASS

Production checkpoint:

`ba2bd1f934dc4f49519fea4f7fbeba309235004b`

Cleanup head after removing one-shot scaffolding:

`35cb178c3c85f0b21cbc57360e8979f49330b1d0`

Validation one-shot:

`34474761127` — **PASS**

```text
exact four-production-file baseline/diff audit PASS
privacy contract audit PASS
:app:testFast PASS
:app:assembleDebug PASS
production push PASS
one-shot/seam-audit cleanup PASS
```

Implemented behavior:

- `Screen.PassPhone` now renders the Storyteller square-table identity controller for Clocktower;
- the controller receives only player names / physical seat identity and does not receive role/alignment/poison/drunk facts;
- the current seat is highlighted and the center exposes `N / total`, target seat/name, and explicit Show identity;
- Previous/Next move only the existing App-root `currentDealIndex` and never auto-reveal;
- first-seat Previous is disabled;
- Clocktower RevealCard Hide returns to the same controller seat and no longer auto-advances;
- Undercover reveal/auto-pass behavior is preserved;
- player-facing Clocktower RevealCard contains only the current player's shown role/ability and return-to-Storyteller action; no table, Host Tools, or cross-player navigation;
- final-seat Next enters the existing `ClocktowerJudge` first-night `nightStarted == false` boundary;
- that first-night boundary now reads `Identity display complete / Prepare for the first night` and has Previous back to the final identity seat;
- later-night ready boundaries keep Previous disabled;
- no second identity cursor, route owner, phase owner, or persistence/recovery owner was introduced.

The post-push reverse audit confirmed live root routing, privacy separation, Undercover preservation, and first-night-only Previous behavior.

'''
          text = text[:start] + replacement + text[end:]
          immediate = text.index('## 10. Immediate next action')
          text = text[:immediate] + '''## 10. Immediate next action

Start **UI-NAV-1F Settings-under-Host-Tools ownership audit**.

Audit before production change:

1. locate the live `HostToolTab` and `HostGameToolsScreen` owner/API;
2. confirm Settings state and mutations remain App-root-owned;
3. prefer extracting/reusing stateless `SettingsContent` while legacy `SettingsScreen` remains a wrapper;
4. add Settings as an internal Host Tools destination only if callback/state wiring stays narrow;
5. do not duplicate Settings state and do not delete legacy `Screen.Settings` in this slice;
6. if the change requires route ownership redesign, a second Settings owner, or broad App-root churn, record NO-GO/defer and proceed to 1G.
'''
          handoff.write_text(text)

          roadmap = Path('docs/CURRENT_DEVELOPMENT_ROADMAP.md')
          text = roadmap.read_text()
          text = text.replace(
              'UI-NAV-1 global navigation visual unification     CURRENT — 1D COMPLETE / 1E NEXT',
              'UI-NAV-1 global navigation visual unification     CURRENT — 1E COMPLETE / 1F AUDIT NEXT',
              1,
          )
          text = text.replace(
              '> **CURRENT: UI-NAV-1D is complete. Proceed directly with UI-NAV-1E identity delivery before EPI-MQ-0.**',
              '> **CURRENT: UI-NAV-1E is complete. Audit the isolated UI-NAV-1F Settings-under-Host-Tools composition before final 1G validation.**',
              1,
          )
          text = text.replace(
              'UI-NAV-1E  migrate identity delivery to privacy-safe square table      NEXT\nUI-NAV-1F  isolate Settings-under-Host-Tools composition if still narrow',
              'UI-NAV-1E  migrate identity delivery to privacy-safe square table      COMPLETE / PASS\nUI-NAV-1F  audit/compose Settings under Host Tools if still narrow       NEXT',
              1,
          )
          marker = '### Phase-boundary product refinement\n'
          note = '''### UI-NAV-1E completion evidence

```text
identity production: ba2bd1f934dc4f49519fea4f7fbeba309235004b
identity cleanup head: 35cb178c3c85f0b21cbc57360e8979f49330b1d0
one-shot: 34474761127 PASS
- exact four-file diff PASS
- privacy contract audit PASS
- :app:testFast PASS
- :app:assembleDebug PASS
```

Clocktower identity delivery now uses the privacy-safe Storyteller square-table controller. `currentDealIndex` remains the single cursor; RevealCard Hide returns to the same seat; final Next enters the existing first-night ready/recommendation boundary, whose Previous returns to the last identity seat. Undercover behavior remains unchanged.

'''
          if '### UI-NAV-1E completion evidence' not in text:
              text = text.replace(marker, note + marker, 1)
          roadmap.write_text(text)
          PY

      - name: Print UI-NAV-1F ownership seams
        shell: bash
        run: |
          set -euo pipefail
          echo '=== HostToolTab definition ==='
          git grep -n -C 20 'HostToolTab' -- 'app/src/main/java/**/*.kt' | head -240 || true
          echo '=== HostGameToolsScreen definition/calls ==='
          git grep -n -C 30 'HostGameToolsScreen' -- 'app/src/main/java/**/*.kt' | head -320 || true
          echo '=== SettingsScreen definition/call ==='
          git grep -n -C 25 'SettingsScreen(' -- 'app/src/main/java/**/*.kt' | head -260 || true
          echo '=== Host tools related source files ==='
          git grep -l 'HostToolTab\|HostGameToolsScreen' -- 'app/src/main/java/**/*.kt' || true

      - name: Commit docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/NEXT_DEVELOPMENT_HANDOFF_2026-09-10_UI_NAV_1_GLOBAL_NAVIGATION_VISUAL_UNIFICATION.md docs/CURRENT_DEVELOPMENT_ROADMAP.md
          git commit -m 'docs: close UI-NAV-1E and open Settings audit'
          git push origin HEAD:codex/ui-nav-1-global-navigation-visual-unification

      - name: Remove audit workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ui-nav-1e-closeout-1f-audit.yml
          git add .github/workflows/ui-nav-1e-closeout-1f-audit.yml
          git commit -m 'chore: remove UI-NAV-1F ownership audit'
          git push origin HEAD:codex/ui-nav-1-global-navigation-visual-unification
