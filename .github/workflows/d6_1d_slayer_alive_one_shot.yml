name: D6.1d Slayer alive one-shot

on:
  push:
    branches:
      - codex/d6-root-reaudit
    paths:
      - .github/workflows/d6_1d_slayer_alive_one_shot.yml

permissions:
  contents: write

jobs:
  patch-test-push-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: codex/d6-root-reaudit
          fetch-depth: 0

      - name: Verify exact baseline and tooling scope
        shell: bash
        run: |
          set -euo pipefail
          BASE_PRODUCT='ad3b70751c482a82b525904e96bbb8a6eb810563'
          APP='app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt'
          TEST='app/src/test/java/com/codex/campboardgamehost/clocktower/session/ClocktowerGameSessionAliveBoundaryTest.kt'
          EXPECTED_APP_BLOB='ff5705a9798e884c0b239ca685c7dbe25fc533c8'
          EXPECTED_TEST_BLOB='4f7c3db898ea0c8dc174f52daac9be1035b3dd7d'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/codex/d6-root-reaudit | cut -f1)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE_PRODUCT" HEAD
          test "$(git hash-object "$APP")" = "$EXPECTED_APP_BLOB"
          test "$(git hash-object "$TEST")" = "$EXPECTED_TEST_BLOB"
          actual="$(git diff --name-only "$BASE_PRODUCT"..HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/scripts/d6_1d_slayer_alive_patch.py' \
            '.github/workflows/d6_1d_slayer_alive_one_shot.yml' | sort)"
          test "$actual" = "$expected"

      - name: Apply bounded large-file patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/d6_1d_slayer_alive_patch.py

      - name: Exact product diff audit
        shell: bash
        run: |
          set -euo pipefail
          APP='app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt'
          test "$(git diff --name-only)" = "$APP"
          git diff --check
          test "$(grep -c 'synchronizePlayerDeathWithinCurrentRevision(' "$APP")" -eq 3
          git diff -- "$APP"

      - name: Focused alive poison and history tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.clocktower.session.ClocktowerGameSessionAliveBoundaryTest' \
            --tests 'com.codex.campboardgamehost.clocktower.session.ClocktowerGameSessionPoisonBoundaryTest' \
            --tests 'com.codex.campboardgamehost.clocktower.session.ClocktowerHistoricalActionObservationCaptureTest' \
            --tests 'com.codex.campboardgamehost.clocktower.session.ClocktowerGlobalObservationCommitTest' \
            --no-daemon

      - name: Android FAST
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testFast --no-daemon --build-cache

      - name: Commit and push product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          git commit -m 'refactor: sync Slayer death to Clocktower session'
          git push origin HEAD:codex/d6-root-reaudit

      - name: Remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/scripts/d6_1d_slayer_alive_patch.py \
            .github/workflows/d6_1d_slayer_alive_one_shot.yml
          git commit -m 'chore: remove D6 Slayer alive one-shot tooling'
          git push origin HEAD:codex/d6-root-reaudit
