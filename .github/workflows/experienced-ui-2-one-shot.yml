name: Experienced UI 2 one-shot patch

on:
  push:
    branches:
      - codex/experienced-ui-compact-2
    paths:
      - .github/workflows/experienced-ui-2-one-shot.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: codex/experienced-ui-compact-2
          fetch-depth: 0

      - name: Assert one-shot seed
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "3d2ddd53f7b1dab423748c88c71bd396436e8d6b"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/experienced-ui-2-one-shot.yml"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply exact patch
        run: python3 .github/scripts/experienced_ui_2_patch.py

      - name: Audit touched production files
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat <<'EOF'
          app/src/main/java/com/codex/campboardgamehost/ClocktowerChefSquareTableUi.kt
          app/src/main/java/com/codex/campboardgamehost/ClocktowerEmpathSquareTableUi.kt
          app/src/main/java/com/codex/campboardgamehost/ClocktowerFortuneTellerSquareTableUi.kt
          app/src/main/java/com/codex/campboardgamehost/ClocktowerNightActionSquareTableUi.kt
          app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          app/src/main/java/com/codex/campboardgamehost/ClocktowerPairInformationSquareTableUi.kt
          app/src/main/java/com/codex/campboardgamehost/ClocktowerRavenkeeperSquareTableUi.kt
          app/src/main/java/com/codex/campboardgamehost/ClocktowerSquareTableUi.kt
          app/src/main/java/com/codex/campboardgamehost/ClocktowerUndertakerSquareTableUi.kt
          app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt
          EOF
          )"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          git diff --check

      - name: Run Android FAST and debug build
        run: ./gradlew :app:testFast :app:assembleDebug

      - name: Commit verified patch and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/codex/campboardgamehost
          git commit -m "EXPERIENCED-UI-2: refine compact night information surfaces"
          git rm .github/scripts/experienced_ui_2_patch.py .github/workflows/experienced-ui-2-one-shot.yml
          git commit -m "chore: remove Experienced UI 2 one-shot patch"
          git push origin HEAD:codex/experienced-ui-compact-2
