name: UX-R5 Fortune Teller cutover rerun

on:
  push:
    branches:
      - codex/ux-r5-small-domain-specialization

permissions:
  contents: write

jobs:
  cutover:
    if: "${{ github.event.head_commit.message == 'chore: rerun UX-R5 Fortune Teller cutover one-shot' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: codex/ux-r5-small-domain-specialization

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Lock exact remote state and target blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/codex/ux-r5-small-domain-specialization | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt)" = "a87b00ffae3cb11b0605f53f3f9fd36cff30ad1c"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt)" = "98171a02838ee5d17541b06da4888d59ece2f88b"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/clocktower/ui/StructuredStorytellerInformationUi.kt)" = "0ea954af16e9ecdce81b8dd310333b94aa8d86a4"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/StructuredBooleanInformationAdapter.kt)" = "1425d3676cbfd55f70fa26358e9fe1eae2e9c007"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/clocktower/session/StructuredBooleanInformationUiModel.kt)" = "bf0138628da1d8efb569414e4e0cc74639cc405b"
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/StructuredFortuneTellerInformationAdapterTest.kt)" = "09a13184168fccfd5cac3c5ccd9dc765d72db24f"
          test "$(git hash-object .github/scripts/ux_r5_fortune_teller_cutover_patch.py)" = "00d5d240048dba4444768d45f7480dec4c9507cf"
          test -f app/src/main/java/com/codex/campboardgamehost/ClocktowerBooleanDisplayOptionSelection.kt
          test -f app/src/test/java/com/codex/campboardgamehost/ClocktowerBooleanDisplayOptionSelectionTest.kt
          test -f .github/scripts/ux_r5_fortune_teller_cutover_fix.py
          test -z "$(git status --porcelain)"

      - name: Confirm typed Boolean baseline
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.StructuredFortuneTellerInformationAdapterTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerBooleanDisplayOptionSelectionTest' \
            --tests 'com.codex.campboardgamehost.clocktower.session.SmallDomainPresentationTest' \
            --rerun-tasks --no-daemon

      - name: Apply exact UX-R5 Fortune Teller patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ux_r5_fortune_teller_cutover_patch.py
          python3 .github/scripts/ux_r5_fortune_teller_cutover_fix.py

      - name: Exact production diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            'app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt'
            'app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt'
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done
          test "$(grep -F -c 'displayProposition = fortuneTellerMatched?.let { matched ->' app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt)" -eq 2
          test "$(grep -F -c 'findBooleanDisplayOption(' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt)" -eq 1
          grep -F 'val structuredFortuneTellerTruthValue = structuredFortuneTellerProposition?.value' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          grep -F 'StructuredBooleanInformationDecisionPanel(' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          grep -F 'informationDecisionExpectedSnapshot = model.contextSnapshot' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          if grep -Fq 'structuredFortuneTellerProposition.value' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt; then
            echo 'Unsafe nullable Fortune Teller proposition value access remains' >&2
            exit 1
          fi

      - name: Focused GREEN after production cutover
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.StructuredFortuneTellerInformationAdapterTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerBooleanDisplayOptionSelectionTest' \
            --tests 'com.codex.campboardgamehost.StructuredChefInformationAdapterTest' \
            --tests 'com.codex.campboardgamehost.clocktower.session.SmallDomainPresentationTest' \
            --rerun-tasks --no-daemon

      - name: UX-R5 small-domain checkpoint FAST suite
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testFast --no-daemon --build-cache

      - name: Commit product cutover
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt \
            app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt
          git commit -m 'UX-R5: wire Fortune Teller to structured Boolean domain'
          git push origin HEAD:codex/ux-r5-small-domain-specialization

      - name: Self-remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/scripts/ux_r5_fortune_teller_cutover_patch.py \
            .github/scripts/ux_r5_fortune_teller_cutover_fix.py \
            .github/workflows/ux-r5-fortune-teller-cutover-one-shot.yml \
            .github/workflows/ux-r5-fortune-teller-cutover-rerun.yml
          git commit -m 'chore: remove UX-R5 Fortune Teller cutover one-shots'
          git push origin HEAD:codex/ux-r5-small-domain-specialization
