name: F7.6 field APK

on:
  push:
    branches:
      - codex/ui-r4d2-seating-first-setup

permissions:
  contents: write

jobs:
  build-field-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Guard F7.6 product baseline
        run: test "$(git rev-parse HEAD^)" = "40b604eae7ea489347357f88fd3d07be83ce5a78"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Build fresh debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --build-cache

      - name: Prepare field-test artifact
        run: |
          set -euo pipefail
          mkdir -p field-apk
          cp app/build/outputs/apk/debug/app-debug.apk field-apk/CampBoardGameHost-F7.6-40b604ea-debug.apk
          printf '%s\n' 'Product source checkpoint: 40b604eae7ea489347357f88fd3d07be83ce5a78' > field-apk/BUILD_SOURCE.txt

      - name: Upload field-test APK
        uses: actions/upload-artifact@v4
        with:
          name: F7.6-field-apk-40b604ea
          path: field-apk/
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary APK workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/f7-6-field-apk.yml
          git add -A
          git commit -m "ci(F7.6): remove temporary field APK workflow"
          git push origin HEAD:codex/ui-r4d2-seating-first-setup
