name: UI-NAV-1D.1b Werewolf bottom placement one-shot

on:
  push:
    branches:
      - codex/ui-nav-1-global-navigation-visual-unification
    paths:
      - .github/workflows/ui-nav-1d1b-werewolf-bottom-placement-one-shot.yml

permissions:
  contents: write

jobs:
  patch-werewolf-bottom-placement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRANCH: codex/ui-nav-1-global-navigation-visual-unification
      SCRIPT: .github/scripts/ui_nav_1d1b_werewolf_bottom_placement_patch.py
      WORKFLOW: .github/workflows/ui-nav-1d1b-werewolf-bottom-placement-one-shot.yml
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preflight exact head and production blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object "$SCRIPT")" = "2ca2198077687175bbfed88c7d5e400b1d3543f6"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/werewolf/WerewolfHostScreen.kt)" = "aeb2dac480b76873dcffb083cdcd63531ead5046"

      - name: Apply exact UI-NAV-1D.1b patch
        run: python3 "$SCRIPT"

      - name: Audit exact production diff and placement
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "app/src/main/java/com/codex/campboardgamehost/werewolf/WerewolfHostScreen.kt"
          grep -q 'modifier = Modifier.padding(horizontal = 20.dp, vertical = 12.dp)' app/src/main/java/com/codex/campboardgamehost/werewolf/WerewolfHostScreen.kt
          grep -q 'previousEnabled = currentIndex > 0' app/src/main/java/com/codex/campboardgamehost/werewolf/WerewolfHostScreen.kt
          grep -q 'nextEnabled = currentIndex < steps.lastIndex' app/src/main/java/com/codex/campboardgamehost/werewolf/WerewolfHostScreen.kt

      - name: Run Android FAST validation
        run: ./gradlew :app:testFast --no-daemon

      - name: Recheck remote head before production push
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"

      - name: Commit and push production patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/codex/campboardgamehost/werewolf/WerewolfHostScreen.kt
          git diff --cached --check
          git commit -m "ui: pin Werewolf judge navigation to screen bottom"
          git push origin "HEAD:$BRANCH"

      - name: Remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git rm "$SCRIPT" "$WORKFLOW"
          git commit -m "chore(ci): remove UI-NAV-1D.1b one-shot"
          git push origin "HEAD:$BRANCH"
