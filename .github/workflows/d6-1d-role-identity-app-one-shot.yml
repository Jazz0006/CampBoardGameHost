name: D6.1d Role Identity App Cutover One Shot

on:
  push:
    branches:
      - codex/d6-root-reaudit
    paths:
      - .github/workflows/d6-1d-role-identity-app-one-shot.yml
      - scripts/d6_1d_role_identity_app_patch.py

permissions:
  contents: write

jobs:
  patch-test-push-cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trigger head
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify fail-closed baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9dc48b0975ea27ce54fa14413f3c9e7d874ac2a8"
          test "$(git rev-parse HEAD^:app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" = "fb41316387ea1ee5d409835fd8935e4b5a7c7419"
          test "$(git rev-parse HEAD^:app/src/main/java/com/codex/campboardgamehost/clocktower/session/ClocktowerGameSessionRoleIdentityBoundaries.kt)" = "4195de885e62697366bb52679fb9d5f38e2c7c32"
          test "$(git rev-parse HEAD^:app/src/test/java/com/codex/campboardgamehost/clocktower/session/ClocktowerGameSessionRoleIdentityBoundaryTest.kt)" = "cc839bc4fa539687cf6b4f341721c7e670fab983"
          expected=$(printf '%s\n' '.github/workflows/d6-1d-role-identity-app-one-shot.yml' 'scripts/d6_1d_role_identity_app_patch.py')
          actual=$(git diff --name-only HEAD^ HEAD | sort)
          test "$actual" = "$expected"
          test -z "$(git status --porcelain)"

      - name: Apply bounded App patch
        run: python3 scripts/d6_1d_role_identity_app_patch.py

      - name: Audit exact product diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt"
          git diff --check
          test "$(grep -c '^import com.codex.campboardgamehost.clocktower.session.commitActualRoleBoundary$' app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" -eq 1
          test "$(grep -c '^import com.codex.campboardgamehost.clocktower.session.commitShownRoleBoundary$' app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" -eq 1
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt').read_text()
          actual = text[text.index('    fun setClocktowerActualRole('):text.index('    fun setClocktowerShownRole(')]
          shown = text[text.index('    fun setClocktowerShownRole('):text.index('    fun promoteScarletWomanIfNeeded()')]
          assert 'commitActualRoleBoundary(' in actual
          assert 'commitShownRoleBoundary(' in shown
          assert 'advanceClocktowerGameStateRevision()' not in actual
          assert 'advanceClocktowerGameStateRevision()' not in shown
          assert actual.index('recordClocktowerRoleChangeAction(') < actual.index('commitActualRoleBoundary(')
          assert actual.index('commitActualRoleBoundary(') < actual.index('cards[index] =')
          assert shown.index('commitShownRoleBoundary(') < shown.index('cards[index] =')
          PY
          git diff -- app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt

      - name: Run focused session contracts
        run: ./gradlew :app:testDebugUnitTest --tests 'com.codex.campboardgamehost.clocktower.session.ClocktowerGameSessionGameStateBoundaryTest' --tests 'com.codex.campboardgamehost.clocktower.session.ClocktowerGameSessionRoleIdentityBoundaryTest' --no-daemon --build-cache

      - name: Run Android FAST
        run: ./gradlew :app:testFast --no-daemon --build-cache

      - name: Commit and push product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          test "$(git diff --cached --name-only)" = "app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt"
          git commit -m 'refactor: route Clocktower role identity through session'
          git push origin HEAD:codex/d6-root-reaudit

      - name: Remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/d6-1d-role-identity-app-one-shot.yml scripts/d6_1d_role_identity_app_patch.py
          git commit -m 'chore: remove D6.1d role-identity one-shot tooling'
          git push origin HEAD:codex/d6-root-reaudit
