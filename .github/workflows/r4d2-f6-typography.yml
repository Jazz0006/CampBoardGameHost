name: R4D2 F6 Host Seat Typography

on:
  push:
    branches:
      - codex/ui-r4d2-seating-first-setup
    paths:
      - .github/workflows/r4d2-f6-typography.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Guard exact F6 product head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ae3fa44063e6d8ad6457d0b5b06a48f4eccb579a"
          test "$(git rev-parse HEAD^^)" = "2e4d0531aa48d459d73bd532a44abc1d4e1ce68b"
          test "$(git diff --name-only HEAD^^ HEAD^)" = "app/src/main/java/com/codex/campboardgamehost/ClocktowerSquareTableUi.kt"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/r4d2-f6-typography.yml"

      - name: Focused F6 contracts
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests com.codex.campboardgamehost.ClocktowerSquareTableSeatLayoutTest \
            --tests com.codex.campboardgamehost.ClocktowerHostTableLayoutTest \
            --tests com.codex.campboardgamehost.ClocktowerHostTableReorderTest \
            --rerun-tasks

      - name: FAST regression
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testFast

      - name: Exact F6 diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^^ HEAD^
          test "$(git diff --name-only HEAD^^ HEAD^)" = "app/src/main/java/com/codex/campboardgamehost/ClocktowerSquareTableUi.kt"
          git diff --stat HEAD^^ HEAD^
          git diff -- app/src/main/java/com/codex/campboardgamehost/ClocktowerSquareTableUi.kt HEAD^^ HEAD^

      - name: Self-clean temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r4d2-f6-typography.yml
          git commit -m "build: clean temporary F6 validation workflow"
          git push origin HEAD:codex/ui-r4d2-seating-first-setup
