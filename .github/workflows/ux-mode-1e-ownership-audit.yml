name: UX-MODE-1E ownership audit

on:
  push:
    branches:
      - codex/ux-mode-1
    paths:
      - .github/scripts/ux_mode_1e_ownership_audit_trigger.txt

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/ux-mode-1
          fetch-depth: 1
      - name: Locate UX-MODE-1 ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('app/src/main/java/com/codex/campboardgamehost')
          needles = [
              'ClocktowerJudgeScreen',
              'StorytellerRecommendationCard',
              'onApplyRecommendation',
              'automaticStorytellerInfo',
              'RecommendationStyle.AGGRESSIVE',
              'RecommendationStyle.BALANCED',
              'RecommendationStyle.GENTLE',
          ]
          for needle in needles:
              print(f'=== {needle} ===')
              for path in sorted(root.rglob('*.kt')):
                  lines = path.read_text(errors='replace').splitlines()
                  for i, line in enumerate(lines):
                      if needle in line:
                          lo = max(0, i - 5)
                          hi = min(len(lines), i + 6)
                          print(f'--- {path}:{i+1} ---')
                          for j in range(lo, hi):
                              print(f'{j+1:5}: {lines[j]}')
          print('=== LEGACY PUBLIC STYLE COPY ===')
          legacy = ['平衡', '稳健', '激进', '全自动', 'Balanced', 'Gentle', 'Aggressive', 'automatic style', 'selected style']
          for path in sorted(root.rglob('*.kt')):
              for i, line in enumerate(path.read_text(errors='replace').splitlines(), start=1):
                  if any(token in line for token in legacy):
                      print(f'{path}:{i}: {line}')
          PY
