name: TBSP 6L provenance durability repair

on:
  push:
    branches:
      - codex/trouble-brewing-setup-presets-v2
    paths:
      - .github/workflows/tbsp-6l-provenance-durability.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: codex/trouble-brewing-setup-presets-v2
          fetch-depth: 0

      - name: Verify bootstrap head and App blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/codex/trouble-brewing-setup-presets-v2 | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" = "945c11453f4c1ee244fcdb7af86813752c4184c5"
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/TroubleBrewingActiveGameProvenanceWiringTest.kt)" = "c8705b4f6cf7c166b1af6a575f4b1f5393347864"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prove focused RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./gradlew :app:testDebugUnitTest --tests 'com.codex.campboardgamehost.TroubleBrewingActiveGameProvenanceWiringTest' --rerun-tasks --no-daemon 2>&1 | tee /tmp/tbsp-6l-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'curated Trouble Brewing start durably saves provenance after committing selection' /tmp/tbsp-6l-red.log

      - name: Apply exact production repair
        run: python3 .github/scripts/tbsp_6l_provenance_durability_patch.py

      - name: Run focused GREEN
        run: ./gradlew :app:testDebugUnitTest --tests 'com.codex.campboardgamehost.TroubleBrewingActiveGameProvenanceWiringTest' --rerun-tasks --no-daemon

      - name: Run Android FAST unit tests
        run: ./gradlew :app:testFast --rerun-tasks --no-daemon

      - name: Exact diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | paste -sd ' ' -)" = "app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt"
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt').read_text(encoding='utf-8')
          commit = text.index('committedTroubleBrewingSetupSelection = preparedSetup.selection')
          persist = text.index('persistActiveGameStateIfNeeded()', commit)
          assert persist > commit
          PY
          git diff -- app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt

      - name: Reconfirm remote head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/trouble-brewing-setup-presets-v2 | cut -f1)" = "$GITHUB_SHA"

      - name: Commit and push production repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          test "$(git diff --cached --name-only | paste -sd ' ' -)" = "app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt"
          git commit -m 'fix: durably persist TB setup provenance'
          git push origin HEAD:codex/trouble-brewing-setup-presets-v2
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Remove one-shot workflow and script
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tbsp-6l-provenance-durability.yml .github/scripts/tbsp_6l_provenance_durability_patch.py
          git commit -m 'chore(ci): remove TBSP 6L one-shot workflow'
          git push origin HEAD:codex/trouble-brewing-setup-presets-v2
          echo "CLEANUP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report checkpoints
        run: |
          echo "Product checkpoint: $PRODUCT_SHA"
          echo "Cleanup checkpoint: $CLEANUP_SHA"
