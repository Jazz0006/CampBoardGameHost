name: UI Stack Closeout Roadmap One-Shot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-roadmap:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: codex/ui-stack-closeout-2026-09-04
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact closeout head
        uses: actions/checkout@v6
        with:
          ref: codex/ui-stack-closeout-2026-09-04
          fetch-depth: 0

      - name: Verify exact branch, remote head and protected blobs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_HEAD_REF" == "$TARGET_BRANCH" ]] || { echo "Unexpected PR head: $GITHUB_HEAD_REF" >&2; exit 1; }
          local_head="$(git rev-parse HEAD)"
          [[ "$local_head" == "$EXPECTED_HEAD" ]] || { echo "Checkout/PR head mismatch" >&2; exit 1; }
          git fetch origin "$TARGET_BRANCH"
          remote_head="$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")"
          [[ "$remote_head" == "$EXPECTED_HEAD" ]] || { echo "Remote head moved: $remote_head" >&2; exit 1; }
          roadmap_blob="$(git rev-parse HEAD:docs/CURRENT_DEVELOPMENT_ROADMAP.md)"
          [[ "$roadmap_blob" == 'e7728b09546c25e7f2aaea1be51f4d831540586c' ]] || {
            echo "Unexpected roadmap blob: $roadmap_blob" >&2
            exit 1
          }
          script_blob="$(git rev-parse HEAD:.github/scripts/ui_stack_closeout_roadmap_patch.py)"
          [[ "$script_blob" == 'fba5648c40e95f888335e84a48478bae4d0faead' ]] || {
            echo "Unexpected patch-script blob: $script_blob" >&2
            exit 1
          }

      - name: Apply exact roadmap patch
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/ui_stack_closeout_roadmap_patch.py
          changed="$(git diff --name-only)"
          [[ "$changed" == 'docs/CURRENT_DEVELOPMENT_ROADMAP.md' ]] || {
            echo "Unexpected changed files:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }
          grep -Fq 'FINAL MERGE GATE ACTIVE — closeout PR + final [full-ci] + R2 required before merge' docs/CURRENT_DEVELOPMENT_ROADMAP.md
          grep -Fq 'UI-R4D-6.4B Mayor redirect table migration' docs/CURRENT_DEVELOPMENT_ROADMAP.md
          grep -Fq 'UI-R4D-N Night wake/action lifecycle' docs/CURRENT_DEVELOPMENT_ROADMAP.md
          grep -Fq '`docs/UI_STACK_CLOSEOUT_2026-09-04.md`' docs/CURRENT_DEVELOPMENT_ROADMAP.md
          git diff --check

      - name: Commit roadmap checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CURRENT_DEVELOPMENT_ROADMAP.md
          git commit -m 'Docs: update roadmap for UI stack closeout'
          before_push_parent="$(git rev-parse HEAD^)"
          git fetch origin "$TARGET_BRANCH"
          remote_head="$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")"
          [[ "$remote_head" == "$before_push_parent" ]] || {
            echo "Remote branch moved before roadmap push: $remote_head" >&2
            exit 1
          }
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          expected_remote="$(git rev-parse HEAD)"
          git rm .github/scripts/ui_stack_closeout_roadmap_patch.py .github/workflows/ui-stack-closeout-roadmap-one-shot.yml
          git commit -m 'Tooling: remove UI closeout roadmap one-shot'
          git fetch origin "$TARGET_BRANCH"
          remote_head="$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")"
          [[ "$remote_head" == "$expected_remote" ]] || {
            echo "Remote branch moved before cleanup push: $remote_head" >&2
            exit 1
          }
          git push origin "HEAD:$TARGET_BRANCH"
