name: UX-R5 numeric cutover one-shot

on:
  push:
    branches:
      - codex/ux-r5-small-domain-specialization

permissions:
  contents: write

jobs:
  cutover:
    if: "${{ github.event.head_commit.message == 'chore: run UX-R5 numeric cutover one-shot' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/ux-r5-small-domain-specialization

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Lock exact remote state and target blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/codex/ux-r5-small-domain-specialization | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt)" = "67647c9ca068387719f86c0195e6d792834ab164"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt)" = "6bfb535fa10444066c44c2c25541d9d688ca2aec"
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/StructuredChefInformationAdapterTest.kt)" = "02877bf0eea54d65351db1b20fd38a601411dfa9"
          test -z "$(git status --porcelain)"

      - name: Confirm structured numeric adapter baseline
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.StructuredChefInformationAdapterTest' \
            --tests 'com.codex.campboardgamehost.StructuredEmpathInformationAdapterTest' \
            --tests 'com.codex.campboardgamehost.clocktower.session.SmallDomainPresentationTest' \
            --rerun-tasks --no-daemon

      - name: Apply exact UX-R5 large-file patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ux_r5_numeric_cutover_patch.py

      - name: Exact production diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            'app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt'
            'app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt'
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done
          grep -F 'numericMaximumValue = chefMaximumValue' app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt
          grep -F 'val structuredNumberUiModel = structuredEmpathUiModel ?: structuredChefUiModel' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          grep -F 'roleLabel = step.title' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt

      - name: Focused GREEN after production cutover
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.StructuredChefInformationAdapterTest' \
            --tests 'com.codex.campboardgamehost.StructuredEmpathInformationAdapterTest' \
            --tests 'com.codex.campboardgamehost.clocktower.session.SmallDomainPresentationTest' \
            --rerun-tasks --no-daemon

      - name: UX-R5 numeric checkpoint FAST suite
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testFast --no-daemon --build-cache

      - name: Commit product cutover
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt \
            app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt
          git commit -m 'UX-R5: wire Chef to structured numeric domain'
          git push origin HEAD:codex/ux-r5-small-domain-specialization

      - name: Self-remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/scripts/ux_r5_numeric_cutover_patch.py \
            .github/workflows/ux-r5-numeric-cutover-one-shot.yml
          git commit -m 'chore: remove UX-R5 numeric cutover one-shot'
          git push origin HEAD:codex/ux-r5-small-domain-specialization
