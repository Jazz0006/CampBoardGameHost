name: tmp-assemble-ui-polish

on:
  push:
    branches:
      - ui-polish-poison-top3-2026-09-15

permissions:
  contents: write

jobs:
  assemble-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --build-cache
      - name: Self-clean validation workflow
        run: |
          set -euxo pipefail
          git rm .github/workflows/tmp_assemble_ui_polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove temporary UI polish build workflow'
          git push origin HEAD:ui-polish-poison-top3-2026-09-15
