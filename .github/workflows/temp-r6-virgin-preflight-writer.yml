name: TEMP R6 Virgin preflight writer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  writer:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/r6-virgin-preflight-writer-temp' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated writer branch
        uses: actions/checkout@v6
        with:
          ref: codex/r6-virgin-preflight-writer-temp
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply exact Virgin preflight patch
        run: python3 tools/temp_r6_virgin_preflight_patch.py

      - name: Audit unstaged source scope
        shell: bash
        run: |
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt' \
            'app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt' | sort)"
          test "$actual" = "$expected"

      - name: Run focused contracts
        run: |
          bash ./gradlew :app:testDebugUnitTest \
            --tests com.codex.campboardgamehost.ClocktowerVirginPreflightProductionWiringTest \
            --tests com.codex.campboardgamehost.ClocktowerGlobalObservationProductionWiringTest \
            --tests com.codex.campboardgamehost.clocktower.session.ClocktowerGlobalObservationCommitTest

      - name: Commit validated source only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt \
            app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            'app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt' \
            'app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt' | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m 'fix: preflight Virgin execution before Spy registration'
          git push origin HEAD:codex/r6-virgin-preflight-writer-temp
