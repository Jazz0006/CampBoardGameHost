name: D6.1d successor poison cutover one-shot

on:
  push:
    branches:
      - codex/d6-root-reaudit
    paths:
      - .github/workflows/d6_1d_successor_poison_cutover_one_shot.yml

permissions:
  contents: write

jobs:
  patch-test-push-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: codex/d6-root-reaudit
          fetch-depth: 0

      - name: Verify exact baseline and tooling scope
        shell: bash
        run: |
          set -euo pipefail
          BASE_PRODUCT='bd63914343b727270f45eb761030c1fd91ff02f3'
          APP='app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt'
          EXPECTED_APP_BLOB='f1998f9775b161fcd74bb52714437c818dc42eb4'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/codex/d6-root-reaudit | cut -f1)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE_PRODUCT" HEAD
          test "$(git hash-object "$APP")" = "$EXPECTED_APP_BLOB"
          actual="$(git diff --name-only "$BASE_PRODUCT"..HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/scripts/d6_1d_successor_poison_cutover_patch.py' \
            '.github/workflows/d6_1d_successor_poison_cutover_one_shot.yml' | sort)"
          test "$actual" = "$expected"

      - name: Apply bounded large-file patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/d6_1d_successor_poison_cutover_patch.py

      - name: Exact product diff audit
        shell: bash
        run: |
          set -euo pipefail
          APP='app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt'
          test "$(git diff --name-only)" = "$APP"
          git diff --check
          test "$(grep -c 'commitPoisonTargetBoundary(' "$APP")" -eq 1
          test "$(grep -c 'synchronizePoisonTargetWithinCurrentRevision(' "$APP")" -eq 3
          git diff -- "$APP"

      - name: Focused successor poison tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.clocktower.session.ClocktowerGameSessionPoisonBoundaryTest' \
            --tests 'com.codex.campboardgamehost.clocktower.session.NightDawnPoisonClearIntentTest' \
            --tests 'com.codex.campboardgamehost.clocktower.session.NightDawnDurableMaterializationPlannerTest' \
            --tests 'com.codex.campboardgamehost.clocktower.session.NightDawnResolutionPlannerSuccessionResolutionTest' \
            --tests 'com.codex.campboardgamehost.clocktower.session.NightDawnRestoreRetryConvergenceAcceptanceTest' \
            --tests 'com.codex.campboardgamehost.clocktower.session.NightDawnProductionPoisonSelectionRegressionTest' \
            --no-daemon

      - name: Android FAST
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testFast --no-daemon --build-cache

      - name: Commit and push product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          git commit -m 'refactor: sync successor poison state to Clocktower session'
          git push origin HEAD:codex/d6-root-reaudit

      - name: Remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/scripts/d6_1d_successor_poison_cutover_patch.py \
            .github/workflows/d6_1d_successor_poison_cutover_one_shot.yml
          git commit -m 'chore: remove D6 successor poison cutover tooling'
          git push origin HEAD:codex/d6-root-reaudit
