name: D6.1c Clocktower Session Authority One Shot

on:
  push:
    branches:
      - codex/d6-root-reaudit
    paths:
      - .github/workflows/d6-1c-clocktower-session-authority-one-shot.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact branch head and locked blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote origin refs/heads/codex/d6-root-reaudit | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" = 'f3d9a9145e9fcc1424f86ea7221a6572fd06dcb2'
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/clocktower/session/ClocktowerGameSession.kt)" = 'e3a3670fee095569a0dbdb8df01d4b04f7f1e92d'
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/clocktower/session/ClocktowerGameSessionTest.kt)" = 'afbb242876a68637f07ece914b6da3acf6dc5ed8'
          test "$(git hash-object .github/scripts/patch_d6_1c_clocktower_session_authority.py)" = '0da0be9887a5db02f4d35f34f0a3cd96491bd442'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Confirm D6.1b and Recovery contracts are green before App cutover
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.clocktower.session.ClocktowerGameSessionTest' \
            --tests 'com.codex.campboardgamehost.RecoveryRestorePlannerNoGreaterJoyTest' \
            --tests 'com.codex.campboardgamehost.recovery.RecoverySnapshotJsonCodecTest' \
            --rerun-tasks --no-daemon --stacktrace

      - name: Apply exact D6.1c App authority patch
        run: python3 .github/scripts/patch_d6_1c_clocktower_session_authority.py

      - name: Audit exact ownership cutover diff
        shell: bash
        run: |
          set -euo pipefail
          app='app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt'
          test "$(git diff --name-only)" = "$app"
          git diff --check

          forbidden=(
            'var currentClocktowerScript by remember'
            'var clocktowerGameId by remember'
            'var clocktowerGameSeed by remember'
            'var clocktowerGameStateRevision by remember'
            'var clocktowerPlayerInputRevision by remember'
            'var clocktowerSemanticHistoryMode by remember'
            'var clocktowerNextTimelineGlobalSequence by remember'
            'val clocktowerEpistemicObservations = remember { mutableStateListOf'
            'var clocktowerActionTimeline by remember'
            'ClocktowerGameSession.commitGlobalActionFact('
            'ClocktowerGameSession.commitGlobalEpistemicObservation('
          )
          for needle in "${forbidden[@]}"; do
            if grep -Fq "$needle" "$app"; then
              echo "Forbidden duplicate authority remains: $needle" >&2
              exit 1
            fi
          done

          test "$(grep -F -c 'ClocktowerGameSession.createProduction(' "$app")" = '1'
          test "$(grep -F -c 'ClocktowerGameSession.restoreProduction(' "$app")" = '1'
          test "$(grep -F -c 'ClocktowerSessionState(' "$app")" = '1'
          test "$(grep -F -c 'var clocktowerGameSession by remember' "$app")" = '1'
          test "$(grep -F -c 'var clocktowerSessionView by remember' "$app")" = '1'
          test "$(grep -F -c 'fun publishClocktowerSessionView()' "$app")" = '1'
          test "$(grep -F -c 'requireClocktowerGameSession().advanceGameStateRevision()' "$app")" = '1'
          test "$(grep -F -c 'requireClocktowerGameSession().recordPlayerInput()' "$app")" = '1'
          test "$(grep -F -c '.preflightGlobalEpistemicObservation(' "$app")" = '1'

      - name: Run focused and FAST validation
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.clocktower.session.ClocktowerGameSessionTest' \
            --tests 'com.codex.campboardgamehost.RecoveryRestorePlannerNoGreaterJoyTest' \
            --tests 'com.codex.campboardgamehost.recovery.RecoverySnapshotJsonCodecTest' \
            --rerun-tasks --no-daemon --stacktrace
          ./gradlew :app:testFast --rerun-tasks --no-daemon --stacktrace

      - name: Commit and push D6.1c product patch
        id: product
        shell: bash
        run: |
          set -euo pipefail
          app='app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt'
          git diff --check
          test "$(git diff --name-only)" = "$app"
          remote_head="$(git ls-remote origin refs/heads/codex/d6-root-reaudit | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$app"
          git commit -m 'refactor: cut over Clocktower session authority'
          product_sha="$(git rev-parse HEAD)"
          echo "sha=$product_sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:codex/d6-root-reaudit

      - name: Remove temporary D6.1c one-shot files
        shell: bash
        run: |
          set -euo pipefail
          product_sha='${{ steps.product.outputs.sha }}'
          remote_head="$(git ls-remote origin refs/heads/codex/d6-root-reaudit | cut -f1)"
          test "$remote_head" = "$product_sha"
          rm .github/scripts/patch_d6_1c_clocktower_session_authority.py
          rm .github/workflows/d6-1c-clocktower-session-authority-one-shot.yml
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/scripts/patch_d6_1c_clocktower_session_authority.py' '.github/workflows/d6-1c-clocktower-session-authority-one-shot.yml' | sort)"
          test "$actual" = "$expected"
          git add -A
          git commit -m 'chore: remove D6.1c one-shot tooling'
          git push origin HEAD:codex/d6-root-reaudit
