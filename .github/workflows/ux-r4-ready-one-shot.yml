name: UX-R4 ready transition one-shot

on:
  push:
    branches:
      - codex/ux-r4-unified-recommendation-presentation
    paths:
      - .github/workflows/ux-r4-ready-one-shot.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  ready:
    if: "github.actor == 'Jazz0006' && github.event.head_commit.message == 'chore: arm UX-R4 ready transition'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: codex/ux-r4-unified-recommendation-presentation
          fetch-depth: 0

      - name: Verify verified checkpoint parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "6f10e8792e9535c1d125fae9b07e32e81fdfa2a3"

      - name: Mark PR 67 ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr ready 67 --repo "$GITHUB_REPOSITORY"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/67" --jq '.draft')" = "false"

      - name: Remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/ux-r4-ready-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/ux-r4-ready-one-shot.yml
          git commit -m "chore(ci): remove UX-R4 ready transition"
          git push origin HEAD:codex/ux-r4-unified-recommendation-presentation
