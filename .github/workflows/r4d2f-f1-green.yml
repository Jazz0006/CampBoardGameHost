name: R4D2F F1 GREEN validation

on:
  push:
    branches:
      - codex/ui-r4d2-seating-first-setup

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run focused F1 contracts
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerHostTableLayoutTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerHostTableContractTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerHostTableGameStateProjectionTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerSquareTableSeatLayoutTest' \
            --tests 'com.codex.campboardgamehost.HostSeatingRosterTest' \
            --no-daemon --rerun-tasks

      - name: Run Android FAST checkpoint
        run: ./gradlew :app:testFast --no-daemon --rerun-tasks

      - name: Audit F1 diff
        shell: bash
        run: |
          set -euo pipefail
          base='fa7dc5445a7ab247200c5c272ac3cfaa7a62e195'
          git diff --check "$base" HEAD
          mapfile -t changed < <(git diff --name-only --no-renames "$base" HEAD | sort)
          expected=(
            '.github/workflows/r4d2f-f1-green.yml'
            'app/src/main/java/com/codex/campboardgamehost/ClocktowerHostTableContract.kt'
            'app/src/main/java/com/codex/campboardgamehost/ClocktowerHostTableLayout.kt'
            'app/src/main/java/com/codex/campboardgamehost/ClocktowerHostTableUi.kt'
            'app/src/main/java/com/codex/campboardgamehost/ClocktowerSquareTableUi.kt'
            'app/src/test/java/com/codex/campboardgamehost/ClocktowerHostTableContractTest.kt'
            'app/src/test/java/com/codex/campboardgamehost/ClocktowerHostTableGameStateProjectionTest.kt'
            'app/src/test/java/com/codex/campboardgamehost/ClocktowerHostTableLayoutTest.kt'
            'app/src/test/java/com/codex/campboardgamehost/ClocktowerSquareTableSeatLayoutTest.kt'
            'app/src/test/java/com/codex/campboardgamehost/HostSeatingRosterTest.kt'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "$(printf '%s\n' "${changed[@]}")" != "$(printf '%s\n' "${expected_sorted[@]}")" ]]; then
            echo 'Unexpected F1 changed-file set:'
            printf '%s\n' "${changed[@]}"
            exit 1
          fi
