name: R4D2 F6 Roadmap Closeout

on:
  push:
    branches:
      - codex/ui-r4d2-seating-first-setup
    paths:
      - .github/workflows/r4d2-f6-roadmap-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Guard exact F6 cleanup lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "7f0b19fbd7ae35c263253ed862b64e8e4fcf0c5e"
          test "$(git rev-parse HEAD^^)" = "e5109cc95ebb18fdb51a336c24fd4d96e388a0c4"
          test "$(git diff --name-only HEAD^^ HEAD^)" = "scripts/r4d2_f6_roadmap_closeout.py"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/r4d2-f6-roadmap-closeout.yml"

      - name: Apply exact roadmap closeout
        shell: bash
        run: |
          set -euo pipefail
          python scripts/r4d2_f6_roadmap_closeout.py
          git diff --check
          test "$(git diff --name-only)" = "docs/CURRENT_DEVELOPMENT_ROADMAP.md"

      - name: Commit docs and self-clean temporary closeout files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_DEVELOPMENT_ROADMAP.md
          git rm scripts/r4d2_f6_roadmap_closeout.py .github/workflows/r4d2-f6-roadmap-closeout.yml
          git commit -m "docs: close out F6 typography validation"
          git push origin HEAD:codex/ui-r4d2-seating-first-setup
