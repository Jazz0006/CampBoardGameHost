name: R4D-5.2C Vote Transaction RED
on:
  push:
    branches:
      - codex/ui-r4d5-2c-vote-transaction
permissions:
  contents: write
jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run focused RED
        id: focused
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --tests com.codex.campboardgamehost.ClocktowerVoteTransactionTest --no-daemon --build-cache
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r4d5-2c-vote-transaction-red.yml
          git commit -m "chore: remove R4D-5.2C RED workflow"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Assert RED
        if: always()
        run: |
          if [ "${{ steps.focused.outcome }}" = "success" ]; then
            echo "Expected vote transaction contract to fail before production implementation."
            exit 1
          fi
          echo "Vote transaction RED failed as expected."
