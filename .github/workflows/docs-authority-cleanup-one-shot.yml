# one-shot retry after unicode path audit fix
name: Docs authority cleanup one-shot

on:
  push:
    branches:
      - codex/clue-ux-r2-manual-pair-selector
    paths:
      - .github/workflows/docs-authority-cleanup-one-shot.yml

permissions:
  contents: write

jobs:
  patch-doc-authorities:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact branch head and target blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          remote_head="$(git ls-remote origin refs/heads/codex/clue-ux-r2-manual-pair-selector | cut -f1)"
          test "${remote_head}" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD:AGENTS.md)" = "f0aa16eee5797e04e59d040c554ebf87fae70246"
          test "$(git rev-parse 'HEAD:docs/CampBoardGameHost_自动说书人玩家认知一致性算法改进方案_v2_2.md')" = "2491a473da92b8a202c917e644ab26df09f86757"

      - name: Apply exact documentation authority patch
        run: python .github/scripts/docs_authority_cleanup_patch.py

      - name: Audit target diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git -c core.quotePath=false diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'AGENTS.md' \
            'docs/CampBoardGameHost_自动说书人玩家认知一致性算法改进方案_v2_2.md' | sort)"
          test "${actual}" = "${expected}"
          grep -Fq 'single current project-status, active-scope and execution-sequence authority' AGENTS.md
          grep -Fq 'Possible Worlds / 玩家认知一致性基础设计 authority' 'docs/CampBoardGameHost_自动说书人玩家认知一致性算法改进方案_v2_2.md'
          grep -Fq 'Shared Information-Decision Authority' 'docs/CampBoardGameHost_自动说书人玩家认知一致性算法改进方案_v2_2.md'
          ! grep -Fq '> 状态：当前唯一实施规范' 'docs/CampBoardGameHost_自动说书人玩家认知一致性算法改进方案_v2_2.md'

      - name: Recheck remote head before push
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/codex/clue-ux-r2-manual-pair-selector | cut -f1)"
          test "${remote_head}" = "${GITHUB_SHA}"

      - name: Commit product docs and self-clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/docs_authority_cleanup_patch.py
          git rm .github/workflows/docs-authority-cleanup-one-shot.yml
          git add AGENTS.md 'docs/CampBoardGameHost_自动说书人玩家认知一致性算法改进方案_v2_2.md'
          git diff --cached --check
          git commit -m 'docs: clarify current authority hierarchy'
          git push origin HEAD:codex/clue-ux-r2-manual-pair-selector
