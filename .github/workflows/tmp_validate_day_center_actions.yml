name: tmp-validate-day-center-actions

on:
  push:
    branches:
      - ui-day-center-actions-2026-09-15

permissions:
  contents: write

jobs:
  validate-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "ui-day-center-actions-2026-09-15"
          git diff --check HEAD^
      - name: Run fast tests and assemble debug
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testFast :app:assembleDebug --no-daemon --build-cache
      - name: Self-clean validation workflow
        run: |
          set -euo pipefail
          rm .github/workflows/tmp_validate_day_center_actions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/tmp_validate_day_center_actions.yml
          git commit -m "chore: remove temporary day UI validation workflow"
          git push
