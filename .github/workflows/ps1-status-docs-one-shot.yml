name: PS1 Status Docs One Shot

on:
  push:
    branches:
      - codex/persistence-simplification

permissions:
  contents: write

jobs:
  patch-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v6
        with:
          ref: codex/persistence-simplification
          fetch-depth: 2

      - name: Verify locked parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "7380e4cdaf96bcb2062eb7bf2c799b74e9c4e0d0"
          test -z "$(git status --porcelain)"

      - name: Patch status docs
        run: python3 .github/scripts/ps1_status_doc_patch.py

      - name: Audit doc-only diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "docs/CURRENT_DEVELOPMENT_ROADMAP.md"
          test "${changed[1]}" = "docs/NEXT_DEVELOPMENT_HANDOFF_2026-09-07_PERSISTENCE_SIMPLIFICATION.md"
          git diff -- docs/CURRENT_DEVELOPMENT_ROADMAP.md docs/NEXT_DEVELOPMENT_HANDOFF_2026-09-07_PERSISTENCE_SIMPLIFICATION.md

      - name: Commit and push status docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_DEVELOPMENT_ROADMAP.md docs/NEXT_DEVELOPMENT_HANDOFF_2026-09-07_PERSISTENCE_SIMPLIFICATION.md
          git commit -m "docs: record PS1 archive recovery checkpoint"
          git push origin HEAD:codex/persistence-simplification

      - name: Self-remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/scripts/ps1_status_doc_patch.py .github/workflows/ps1-status-docs-one-shot.yml
          git commit -m "ci: remove PS1 status one-shot"
          git push origin HEAD:codex/persistence-simplification
