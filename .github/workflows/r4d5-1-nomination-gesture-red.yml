name: R4D-5.1 nomination gesture RED

on:
  push:
    branches:
      - codex/ui-r4d5-nomination-gesture

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - name: Run focused RED
        run: ./gradlew :app:testDebugUnitTest --tests com.codex.campboardgamehost.ClocktowerDayNominationGestureTest --no-daemon
