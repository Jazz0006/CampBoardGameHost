name: UI-R4B night-action square-table one-shot

on:
  push:
    branches:
      - codex/ui-r4b-night-action-square-table
    paths:
      - .github/workflows/ui-r4b-night-action-square-table-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          ref: codex/ui-r4b-night-action-square-table
          fetch-depth: 2

      - name: Verify bootstrap parent and locked blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "bd8d6508ba4361d8b2c814d468bfad7f7322315c"
          test "$(git hash-object .github/scripts/ui_r4b_night_action_square_table_patch.py)" = "6f3549476fe0ffb4af08f8f54bd3fca60d1aac71"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt)" = "2681ad67c99e1bb3875b8c53b98401bd33c28ca1"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerPlayerDisplayUi.kt)" = "8dce023bfda2b77082bac41b910f228fcbcb0e3a"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt)" = "be283b080ba6d04959d48b14dec0ffdf6028bdd0"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerFortuneTellerSquareTableUi.kt)" = "2de9945d94e7eaa0f011dae28fbc0fff5025193d"
          remote_head="$(git ls-remote origin refs/heads/codex/ui-r4b-night-action-square-table | cut -f1)"
          test "$remote_head" = "$(git rev-parse HEAD)"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run focused owner baseline
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon \
            --tests 'com.codex.campboardgamehost.ClocktowerNightActionSquareTablePresentationTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerChambermaidPresentationSemanticsTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerNightTargetLegalityTest'

      - name: Normalize exact multi-site anchors in one-shot script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/ui_r4b_night_action_square_table_patch.py')
          text = path.read_text(encoding='utf-8')

          # The generalized player-display helper needs a block body because its typed
          # EitherOne branch intentionally uses early returns for malformed propositions.
          marker = "new_highlight = '''"
          trailer = "'''\nplayer = replace_exact"
          if text.count(marker) != 1 or text.count(trailer) != 1:
              raise SystemExit('new_highlight script boundary drifted')
          start = text.index(marker)
          end = text.index(trailer, start)
          segment = text[start:end]
          expr_sig = "): Set<Int> = when (step.displayKind) {\n"
          block_sig = "): Set<Int> {\n    return when (step.displayKind) {\n"
          tail = "    else -> emptySet()\n}\n"
          block_tail = "    else -> emptySet()\n    }\n}\n"
          if segment.count(expr_sig) != 1 or segment.count(tail) != 1:
              raise SystemExit('new_highlight expression-body anchor drifted')
          segment = segment.replace(expr_sig, block_sig, 1).replace(tail, block_tail, 1)
          text = text[:start] + segment + text[end:]

          old = '''def replace_exact(text: str, label: str, old: str, new: str, expected: int = 1) -> str:
              count = text.count(old)
          '''
          new = '''def replace_exact(text: str, label: str, old: str, new: str, expected: int = 1) -> str:
              if label in {"Chambermaid reliable typed proposition", "Chambermaid discretionary typed propositions"}:
                  def deeper(block: str) -> str:
                      return "".join(
                          ("                " + line if line.strip() else line)
                          for line in block.splitlines(keepends=True)
                      )
                  deep_old = deeper(old)
                  deep_new = deeper(new)
                  shallow_count = text.count(old)
                  deep_count = text.count(deep_old)
                  if shallow_count != 1 or deep_count != 1:
                      raise SystemExit(
                          f"{label}: expected one shallow and one deep exact anchor; "
                          f"found shallow={shallow_count}, deep={deep_count}"
                      )
                  return text.replace(old, new, 1).replace(deep_old, deep_new, 1)
              if label == "Fortune Teller dialog onNext signature":
                  expected = 2
              if label == "Fortune Teller center signature onNext":
                  return text
              count = text.count(old)
          '''
          if text.count(old) != 1:
              raise SystemExit('replace_exact helper anchor drifted')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

      - name: Apply exact UI-R4B patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ui_r4b_night_action_square_table_patch.py
          git checkout -- .github/scripts/ui_r4b_night_action_square_table_patch.py

      - name: Audit localized production patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          expected=$(cat <<'EOF'
          app/src/main/java/com/codex/campboardgamehost/ClocktowerFortuneTellerSquareTableUi.kt
          app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          app/src/main/java/com/codex/campboardgamehost/ClocktowerPlayerDisplayUi.kt
          app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt
          EOF
          )
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$(printf '%s\n' "$expected" | sed 's/^          //' | sort)"

      - name: Run focused GREEN after wiring
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon \
            --tests 'com.codex.campboardgamehost.ClocktowerNightActionSquareTablePresentationTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerChambermaidPresentationSemanticsTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerChambermaidSelectionAuthorityTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerPlayerDisplayPresentationTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerFortuneTellerSquareTablePresentationTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerNightTargetLegalityTest'

      - name: Run Android FAST checkpoint
        run: ./gradlew :app:testFast --no-daemon

      - name: Exact diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          git diff -- app/src/main/java/com/codex/campboardgamehost/ClocktowerPlayerDisplayUi.kt \
            app/src/main/java/com/codex/campboardgamehost/ClocktowerFortuneTellerSquareTableUi.kt \
            app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt \
            app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt

      - name: Reconfirm remote head
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/codex/ui-r4b-night-action-square-table | cut -f1)"
          test "$remote_head" = "$(git rev-parse HEAD)"

      - name: Commit and push product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/codex/campboardgamehost/ClocktowerPlayerDisplayUi.kt \
            app/src/main/java/com/codex/campboardgamehost/ClocktowerFortuneTellerSquareTableUi.kt \
            app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt \
            app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt
          git commit -m 'UI-R4B: wire night action square-table surfaces'
          git push origin HEAD:codex/ui-r4b-night-action-square-table

      - name: Remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/ui-r4b-night-action-square-table-one-shot.yml
          git rm .github/scripts/ui_r4b_night_action_square_table_patch.py
          git commit -m 'chore(ci): remove UI-R4B one-shot'
          git push origin HEAD:codex/ui-r4b-night-action-square-table

      - name: Report checkpoints
        run: |
          git log -3 --oneline
