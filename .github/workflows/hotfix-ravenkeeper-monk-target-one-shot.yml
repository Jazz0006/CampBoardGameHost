name: Monk Ravenkeeper target-legality one-shot

on:
  push:
    branches:
      - hotfix/ravenkeeper-monk-target-legality
    paths:
      - .github/workflows/hotfix-ravenkeeper-monk-target-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          ref: hotfix/ravenkeeper-monk-target-legality
          fetch-depth: 0

      - name: Verify bootstrap head and blobs
        shell: bash
        run: |
          set -euo pipefail
          branch='hotfix/ravenkeeper-monk-target-legality'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt)" = 'aa2abbf36ff5d1cef7769013abd244ba7f37a5e8'
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerNightTargetLegality.kt)" = 'eeb15eb97cca6f714b1ea62e83dea8410e6fe94e'
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/ClocktowerNightTargetLegalityTest.kt)" = '9a790560c3bc7903673f5d2752d65f5a9dc24c39'
          test "$(git hash-object .github/scripts/hotfix_ravenkeeper_monk_target_patch.py)" = '87e0c449b7b116eb1e41b2aed3dd03ccda76157b'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run focused legality GREEN before wiring
        run: ./gradlew :app:testDebugUnitTest --tests 'com.codex.campboardgamehost.ClocktowerNightTargetLegalityTest' --rerun-tasks --no-daemon

      - name: Apply exact NightStep patch
        run: python3 .github/scripts/hotfix_ravenkeeper_monk_target_patch.py

      - name: Audit localized patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | paste -sd ' ' -)" = 'app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt'
          grep -Fq 'cards = clocktowerMonkTargetCards(cards, step.actor?.name)' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          grep -Fq 'cards = clocktowerRavenkeeperTargetCards(cards)' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt

      - name: Run focused GREEN after wiring
        run: ./gradlew :app:testDebugUnitTest --tests 'com.codex.campboardgamehost.ClocktowerNightTargetLegalityTest' --rerun-tasks --no-daemon

      - name: Run Android FAST checkpoint
        run: ./gradlew :app:testFast --rerun-tasks --no-daemon

      - name: Exact diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | paste -sd ' ' -)" = 'app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt'
          git diff -- app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt

      - name: Reconfirm remote head
        shell: bash
        run: |
          set -euo pipefail
          branch='hotfix/ravenkeeper-monk-target-legality'
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"

      - name: Commit and push product wiring
        shell: bash
        run: |
          set -euo pipefail
          branch='hotfix/ravenkeeper-monk-target-legality'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          git commit -m 'fix: wire corrected Monk and Ravenkeeper target legality'
          git push origin HEAD:$branch
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          branch='hotfix/ravenkeeper-monk-target-legality'
          git rm .github/workflows/hotfix-ravenkeeper-monk-target-one-shot.yml .github/scripts/hotfix_ravenkeeper_monk_target_patch.py
          git commit -m 'chore(ci): remove target-legality one-shot'
          git push origin HEAD:$branch
          echo "CLEANUP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report checkpoints
        run: |
          echo "Product checkpoint: $PRODUCT_SHA"
          echo "Cleanup checkpoint: $CLEANUP_SHA"
