name: Drunk history identity RED proof

on:
  push:
    branches:
      - codex/drunk-shown-identity-ownership-cleanup
    paths:
      - .github/workflows/drunk-history-identity-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: codex/drunk-shown-identity-ownership-cleanup
          fetch-depth: 0

      - name: Verify RED checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "be35c3f0574a13ba427bf4a94951d69506e343e0"
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/clocktower/history/HistoryCooldownTest.kt)" = "6346fd0e0c823ecea31d5dac32eae8b01a67f2d6"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prove committed identity fingerprint RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.clocktower.history.HistoryCooldownTest' \
            --rerun-tasks --no-daemon 2>&1 | tee /tmp/history-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          xml='app/build/test-results/testDebugUnitTest/TEST-com.codex.campboardgamehost.clocktower.history.HistoryCooldownTest.xml'
          test -f "$xml"
          grep -F 'committed impaired ability identity does not enter recommendation history fingerprint' "$xml"
          grep -F '<failure' "$xml"
