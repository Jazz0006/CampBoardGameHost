name: UI-R5 architecture preflight docs one-shot

on:
  push:
    branches:
      - codex/ui-r5-square-table-stabilization
    paths:
      - .github/workflows/ui-r5-preflight-docs-one-shot.yml

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact trigger head and source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "codex/ui-r5-square-table-stabilization"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote origin refs/heads/codex/ui-r5-square-table-stabilization | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:AGENTS.md)" = "0c0300d8e52e36805e53dd84fdb913559cd1b5c6"
          test "$(git rev-parse HEAD:docs/UI_R5_REMAINING_NIGHT_SURFACE_AUDIT_2026-09-10.md)" = "f6be3c3b1e0770eed3a277da7f2cb1ff9e351444"

      - name: Patch recorded architecture preflight gate
        run: python .github/scripts/ui_r5_preflight_docs_patch.py

      - name: Audit docs patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'AGENTS.md' 'docs/UI_R5_REMAINING_NIGHT_SURFACE_AUDIT_2026-09-10.md' | sort)"
          test "$changed" = "$expected"
          grep -Fq '#### Recorded architecture pre-flight gate' AGENTS.md
          grep -Fq '### Sage architecture pre-flight — recorded before production edit' docs/UI_R5_REMAINING_NIGHT_SURFACE_AUDIT_2026-09-10.md
          grep -Fq 'EXTRACT to a role-local ClocktowerSageStepMaterializer owner.' docs/UI_R5_REMAINING_NIGHT_SURFACE_AUDIT_2026-09-10.md

      - name: Commit and push docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote_head="$(git ls-remote origin refs/heads/codex/ui-r5-square-table-stabilization | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git add AGENTS.md docs/UI_R5_REMAINING_NIGHT_SURFACE_AUDIT_2026-09-10.md
          git commit -m "docs: require recorded architecture preflight"
          git push origin HEAD:codex/ui-r5-square-table-stabilization

      - name: Remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ui-r5-preflight-docs-one-shot.yml
          rm .github/scripts/ui_r5_preflight_docs_patch.py
          git add -A .github/workflows/ui-r5-preflight-docs-one-shot.yml .github/scripts/ui_r5_preflight_docs_patch.py
          git commit -m "chore: remove architecture preflight one-shot"
          git push origin HEAD:codex/ui-r5-square-table-stabilization
