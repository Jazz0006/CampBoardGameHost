name: PS4.5 night map serialization audit

on:
  push:
    branches:
      - codex/persistence-simplification
    paths:
      - .github/workflows/ps4-5-night-map-serialization-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout locked branch
        uses: actions/checkout@v4
        with:
          ref: codex/persistence-simplification
          fetch-depth: 0

      - name: Verify audit preconditions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'd15105f112be0f310d856489454115d4a6f7ab85'

      - name: Audit map serialization and restore composition callers
        shell: bash
        run: |
          set -euo pipefail
          echo '=== production NightTransactionRestoreComposition ==='
          git grep -nE 'NightTransactionRestoreComposition|NightTransactionRestoreResult' -- app/src/main || true
          echo
          echo '=== production persistedValues/fromPersistedValues ==='
          git grep -nE '\.persistedValues\(\)|fromPersistedValues' -- app/src/main || true
          echo
          echo '=== test NightTransactionRestoreComposition ==='
          git grep -nE 'NightTransactionRestoreComposition|NightTransactionRestoreResult' -- app/src/test || true
          echo
          echo '=== test persistedValues/fromPersistedValues ==='
          git grep -nE '\.persistedValues\(\)|fromPersistedValues' -- app/src/test || true
