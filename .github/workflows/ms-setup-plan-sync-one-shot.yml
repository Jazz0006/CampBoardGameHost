name: MS-SETUP plan sync one-shot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ms-setup-plan-sync-one-shot.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify bootstrap head and locked docs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object docs/CURRENT_DEVELOPMENT_ROADMAP.md)" = "4a88e9f9b8d5066fc8afd9ee7b4e302954808164"
          test "$(git hash-object docs/README.md)" = "9fd2b4b8a263706cc89b3b44f84aa4e5da4a5894"
          test "$(git hash-object docs/NEXT_DEVELOPMENT_HANDOFF_2026-08-31_MS_SETUP_ARCHITECTURE.md)" = "c7731c55699b45f455923835d333d46450184fb3"
          test "$(git hash-object docs/NEXT_DEVELOPMENT_HANDOFF_2026-08-30_TBSP_6_PRODUCTION_CUTOVER.md)" = "ed6b4d49231e339363c9193f9e1a34c2a8ad7188"
          test "$(git hash-object docs/NEXT_DEVELOPMENT_HANDOFF_2026-08-31_TBSP_6G_B_PRODUCTION_WIRING.md)" = "e3802380b5e06dd39992438d3bea3a6514c35312"
          test "$(git hash-object docs/NEXT_DEVELOPMENT_HANDOFF_2026-08-31_TBSP_6J_CLEANUP.md)" = "d49629412cf65bec1affb0bd5f24bb5cb1b4643c"
          test "$(git hash-object docs/NEXT_DEVELOPMENT_HANDOFF_2026-08-31_TBSP_6K_FINAL_ACCEPTANCE.md)" = "451845e095eb20a63043c4b6f92284b3720a50f9"
          test "$(git hash-object .github/scripts/ms_setup_plan_sync.py)" = "9d93aa18c635a481aff56945fcdcb8ee25c5decc"

      - name: Apply exact plan sync
        run: python3 .github/scripts/ms_setup_plan_sync.py

      - name: Exact plan diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git diff --name-only | sort | paste -sd ' ' -)"
          expected="$(printf '%s\n' \
            docs/CURRENT_DEVELOPMENT_ROADMAP.md \
            docs/NEXT_DEVELOPMENT_HANDOFF_2026-08-30_TBSP_6_PRODUCTION_CUTOVER.md \
            docs/NEXT_DEVELOPMENT_HANDOFF_2026-08-31_TBSP_6G_B_PRODUCTION_WIRING.md \
            docs/NEXT_DEVELOPMENT_HANDOFF_2026-08-31_TBSP_6J_CLEANUP.md \
            docs/NEXT_DEVELOPMENT_HANDOFF_2026-08-31_TBSP_6K_FINAL_ACCEPTANCE.md \
            docs/README.md | sort | paste -sd ' ' -)"
          test "$actual" = "$expected"
          grep -F '98ee982ef3590822cd06ac72a047b49afac3cfd6' docs/CURRENT_DEVELOPMENT_ROADMAP.md
          grep -F 'MS-S0 fresh live-state + ownership audit' docs/CURRENT_DEVELOPMENT_ROADMAP.md docs/README.md
          grep -F 'NEXT_DEVELOPMENT_HANDOFF_2026-08-31_MS_SETUP_ARCHITECTURE.md' docs/CURRENT_DEVELOPMENT_ROADMAP.md docs/README.md
          grep -F 'LARGE_FILE_GITHUB_ACTIONS_PYTHON_PATCH_WORKFLOW.md' docs/README.md
          test "$(find docs -maxdepth 1 -type f -name 'NEXT_DEVELOPMENT_HANDOFF_*.md' -printf '%f\n')" = "NEXT_DEVELOPMENT_HANDOFF_2026-08-31_MS_SETUP_ARCHITECTURE.md"

      - name: Reconfirm remote head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"

      - name: Commit synchronized plan docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/CURRENT_DEVELOPMENT_ROADMAP.md docs/README.md docs/NEXT_DEVELOPMENT_HANDOFF_2026-08-30_TBSP_6_PRODUCTION_CUTOVER.md docs/NEXT_DEVELOPMENT_HANDOFF_2026-08-31_TBSP_6G_B_PRODUCTION_WIRING.md docs/NEXT_DEVELOPMENT_HANDOFF_2026-08-31_TBSP_6J_CLEANUP.md docs/NEXT_DEVELOPMENT_HANDOFF_2026-08-31_TBSP_6K_FINAL_ACCEPTANCE.md
          git commit -m 'docs: advance roadmap to MS-SETUP'
          git push origin HEAD:main
          echo "PLAN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/ms-setup-plan-sync-one-shot.yml .github/scripts/ms_setup_plan_sync.py
          git commit -m 'chore(ci): remove MS-SETUP plan sync one-shot'
          git push origin HEAD:main
          echo "CLEANUP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report checkpoints
        run: |
          echo "Plan checkpoint: $PLAN_SHA"
          echo "Cleanup checkpoint: $CLEANUP_SHA"
