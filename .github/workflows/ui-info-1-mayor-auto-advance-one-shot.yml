name: UI-INFO-1 Mayor auto-advance one-shot

on:
  push:
    branches:
      - codex/ui-info-1-beginner-night-guidance
    paths:
      - .github/workflows/ui-info-1-mayor-auto-advance-one-shot.yml

permissions:
  contents: write

jobs:
  red-patch-test-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: codex/ui-info-1-beginner-night-guidance
          fetch-depth: 0

      - name: Lock branch and blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/codex/ui-info-1-beginner-night-guidance | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerTemporaryAutomaticRulings.kt)" = "ce618f8bbbf296c79b2946a3e6a1b5e0b7ac7e95"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt)" = "44ef26cb543b48d4dcc139fb7ca8348629c7c8ad"
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/ClocktowerTemporaryAutomaticRulingsTest.kt)" = "7a4db0cddfdca6c7439edf5c8322f55476a27771"
          test "$(git hash-object .github/scripts/ui_info_1_mayor_auto_advance_patch.py)" = "7f7c60952606c8588cec588776481d94e05b88c8"
          test "$(git hash-object .github/workflows/ui-info-1-mayor-readonly-audit.yml)" = "b8de9b042494ac54ce6b68108e9c1d610d77cdf8"

      - name: Focused RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerTemporaryAutomaticRulingsTest' \
            --rerun-tasks --no-daemon > mayor-red.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q 'clocktowerAutomaticMayorRulingShouldAdvance' mayor-red.log
          echo 'RED confirmed: Mayor auto-advance contract is absent before production patch.'

      - name: Apply fail-closed production patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ui_info_1_mayor_auto_advance_patch.py

      - name: Focused GREEN
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerTemporaryAutomaticRulingsTest' \
            --rerun-tasks --no-daemon

      - name: Android fast suite
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testFast --no-daemon

      - name: Remove temporary audit and one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ui-info-1-mayor-readonly-audit.yml
          rm .github/workflows/ui-info-1-mayor-auto-advance-one-shot.yml
          rm .github/scripts/ui_info_1_mayor_auto_advance_patch.py
          rm -f mayor-red.log

      - name: Exact diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/scripts/ui_info_1_mayor_auto_advance_patch.py' \
            '.github/workflows/ui-info-1-mayor-auto-advance-one-shot.yml' \
            '.github/workflows/ui-info-1-mayor-readonly-audit.yml' \
            'app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt' \
            'app/src/main/java/com/codex/campboardgamehost/ClocktowerTemporaryAutomaticRulings.kt' | sort)"
          test "$actual" = "$expected"
          git diff -- app/src/main/java/com/codex/campboardgamehost/ClocktowerTemporaryAutomaticRulings.kt
          git diff -- app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt

      - name: Commit and push Mayor fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Jazz0006'
          git config user.email '37370802+Jazz0006@users.noreply.github.com'
          git add -A
          git commit -m 'fix: skip resolved Beginner Mayor ruling step'
          test "$(git ls-remote origin refs/heads/codex/ui-info-1-beginner-night-guidance | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:codex/ui-info-1-beginner-night-guidance
