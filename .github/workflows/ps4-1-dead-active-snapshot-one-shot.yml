name: PS4.1 dead active snapshot one-shot

on:
  push:
    branches:
      - codex/persistence-simplification
    paths:
      - .github/workflows/ps4-1-dead-active-snapshot-one-shot.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: codex/persistence-simplification
          fetch-depth: 0

      - name: Verify bootstrap head and blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "ffe74faabc898d9d3a9b4e6b48821cce549254e8"
          test "$(git ls-remote origin refs/heads/codex/persistence-simplification | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" = "623fbbf2862ca2a689f52a5ceb4e9c020d620313"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/persistence/AppJsonPrimitives.kt)" = "6fe2f642281e231506388fcc80a748de2d8a792b"
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/persistence/AppJsonPrimitivesTest.kt)" = "37122f621d78348687f34eeeb07f84a271a7f363"
          test "$(git hash-object .github/scripts/ps4_1_dead_active_snapshot_patch.py)" = "163c6b182546ca20a4e0e3603ebed7f72b10a146"

      - name: Fresh repository-wide reference audit
        shell: bash
        run: |
          set -euo pipefail
          echo '--- all repository references before deletion ---'
          git grep -n -F 'activeGameSnapshotJson(' -- . || true
          echo '--- main-source references before deletion ---'
          git grep -n -F 'activeGameSnapshotJson(' -- app/src/main | tee /tmp/ps4_1_main_refs_before.txt
          test "$(wc -l < /tmp/ps4_1_main_refs_before.txt | tr -d ' ')" = "1"
          grep -F 'fun activeGameSnapshotJson(): JSONObject' /tmp/ps4_1_main_refs_before.txt
          if git grep -n -F 'activeGameSnapshotJson(' -- app/src/test; then
            echo 'Unexpected test consumer of activeGameSnapshotJson' >&2
            exit 1
          fi

      - name: Audit exclusive encode-helper chain
        shell: bash
        run: |
          set -euo pipefail
          app='app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt'
          test "$(git grep -F 'playerCardsToJsonArray' -- app/src/main | wc -l | tr -d ' ')" = "2"
          test "$(git grep -F 'eliminationRecordsToJsonArray' -- app/src/main | wc -l | tr -d ' ')" = "2"
          test "$(git grep -F 'clocktowerEventsToJsonArray' -- app/src/main | wc -l | tr -d ' ')" = "2"
          test "$(git grep -F 'recordedEpistemicObservationsToJsonArray' -- app/src/main | wc -l | tr -d ' ')" = "2"
          test "$(git grep -F 'putNullableBoolean' -- app/src/main | wc -l | tr -d ' ')" = "3"
          test "$(git grep -F 'putNullableBoolean' -- app/src/test | wc -l | tr -d ' ')" = "2"
          test "$(grep -F -c '.toJson()' "$app")" = "8"
          grep -n -F 'private fun PlayerCard.toJson()' "$app"
          grep -n -F 'private fun EliminationRecord.toJson()' "$app"
          grep -n -F 'private fun GameOutcome.toJson()' "$app"
          grep -n -F 'private fun ClocktowerEvent.toJson()' "$app"
          grep -n -F 'gameOutcome!!.toJson()' "$app"
          for token in playerCardsToJsonArray eliminationRecordsToJsonArray clocktowerEventsToJsonArray recordedEpistemicObservationsToJsonArray; do
            if git grep -n -F "$token" -- app/src/test; then
              echo "Unexpected test consumer of $token" >&2
              exit 1
            fi
          done

      - name: Audit retained shared dependencies
        shell: bash
        run: |
          set -euo pipefail
          for token in \
            ACTIVE_GAME_STATE_VERSION \
            activeGamePersistenceCoordinator \
            ActiveGamePersistenceInputs \
            PersistedActiveGameIdentityJsonCodec \
            CommittedClocktowerSetupPersistence \
            TroubleBrewingSetupCompletionPersistence \
            stringsToJsonArray \
            putNullableString \
            putNullableInt \
            ClocktowerSemanticHistoryPersistence \
            ClocktowerRulesetPersistenceBasisJsonCodec \
            ClocktowerNightCheckpoint \
            ClocktowerGhostVoteAuthorityPersistence \
            EpistemicSemanticJson
          do
            count=$(git grep -F "$token" -- app/src/main | wc -l | tr -d ' ')
            echo "$token main-source refs before: $count"
            test "$count" -ge 2
          done
          test "$(git grep -F 'optNullableBoolean' -- app/src/main | wc -l | tr -d ' ')" = "1"
          test "$(git grep -F 'optNullableBoolean(' -- app/src/test/java/com/codex/campboardgamehost/persistence/AppJsonPrimitivesTest.kt | wc -l | tr -d ' ')" = "3"

      - name: Apply exact dead-code patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ps4_1_dead_active_snapshot_patch.py

      - name: Post-patch reference and scope audit
        shell: bash
        run: |
          set -euo pipefail
          for token in \
            'activeGameSnapshotJson(' \
            'playerCardsToJsonArray' \
            'eliminationRecordsToJsonArray' \
            'clocktowerEventsToJsonArray' \
            'recordedEpistemicObservationsToJsonArray' \
            'putNullableBoolean'
          do
            if git grep -n -F "$token" -- app/src/main app/src/test; then
              echo "PS4.1 dead token remains: $token" >&2
              exit 1
            fi
          done
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" = "3"
          test "${changed[0]}" = "app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt"
          test "${changed[1]}" = "app/src/main/java/com/codex/campboardgamehost/persistence/AppJsonPrimitives.kt"
          test "${changed[2]}" = "app/src/test/java/com/codex/campboardgamehost/persistence/AppJsonPrimitivesTest.kt"
          git diff --check
          git diff --numstat -- "${changed[@]}"
          git diff -- "${changed[@]}"
          git grep -n -F 'LegacyRestoreCompatibility(' -- app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          git grep -n -F 'RecoverySnapshotJsonCodec.encode(activeGameRecoverySnapshot())' -- app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          for retained in playerCardFromJson toPlayerCards eliminationRecordFromJson toEliminationRecords clocktowerEventFromJson toClocktowerEvents toRecordedEpistemicObservations gameOutcomeFromJson; do
            git grep -n -F "$retained" -- app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          done
          test "$(git grep -F 'optNullableBoolean(' -- app/src/test/java/com/codex/campboardgamehost/persistence/AppJsonPrimitivesTest.kt | wc -l | tr -d ' ')" = "3"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run owning tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.AppJsonPrimitivesTest' \
            --tests 'com.codex.campboardgamehost.persistence.RecoverySnapshotJsonCodecTest' \
            --tests 'com.codex.campboardgamehost.persistence.RecoveryApplicationCoordinatorTest' \
            --tests 'com.codex.campboardgamehost.persistence.RecoveryRestorePlannerTest' \
            --tests 'com.codex.campboardgamehost.persistence.RecoveryPreviewLoaderTest' \
            --tests 'com.codex.campboardgamehost.persistence.RecoveryRestorePlannerNoGreaterJoyTest' \
            --rerun-tasks --no-daemon

      - name: Compile app
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:compileDebugKotlin --rerun-tasks --no-daemon

      - name: Run fast checkpoint suite
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testFast --rerun-tasks --no-daemon

      - name: Final exact diff and dependency audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" = "3"
          test "${changed[0]}" = "app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt"
          test "${changed[1]}" = "app/src/main/java/com/codex/campboardgamehost/persistence/AppJsonPrimitives.kt"
          test "${changed[2]}" = "app/src/test/java/com/codex/campboardgamehost/persistence/AppJsonPrimitivesTest.kt"
          for token in 'activeGameSnapshotJson(' playerCardsToJsonArray eliminationRecordsToJsonArray clocktowerEventsToJsonArray recordedEpistemicObservationsToJsonArray putNullableBoolean; do
            if git grep -n -F "$token" -- app/src/main app/src/test; then
              echo "PS4.1 dead token remains after validation: $token" >&2
              exit 1
            fi
          done
          for token in \
            ACTIVE_GAME_STATE_VERSION \
            activeGamePersistenceCoordinator \
            ActiveGamePersistenceInputs \
            PersistedActiveGameIdentityJsonCodec \
            CommittedClocktowerSetupPersistence \
            TroubleBrewingSetupCompletionPersistence \
            stringsToJsonArray \
            putNullableString \
            putNullableInt \
            ClocktowerSemanticHistoryPersistence \
            ClocktowerRulesetPersistenceBasisJsonCodec \
            ClocktowerNightCheckpoint \
            ClocktowerGhostVoteAuthorityPersistence \
            EpistemicSemanticJson
          do
            count=$(git grep -F "$token" -- app/src/main | wc -l | tr -d ' ')
            echo "$token main-source refs after: $count"
            test "$count" -ge 1
          done
          test "$(git grep -F 'optNullableBoolean' -- app/src/main | wc -l | tr -d ' ')" = "1"
          test "$(git grep -F 'optNullableBoolean(' -- app/src/test/java/com/codex/campboardgamehost/persistence/AppJsonPrimitivesTest.kt | wc -l | tr -d ' ')" = "3"

      - name: Reconfirm remote head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/persistence-simplification | cut -f1)" = "$GITHUB_SHA"

      - name: Commit and push PS4.1 product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt \
                  app/src/main/java/com/codex/campboardgamehost/persistence/AppJsonPrimitives.kt \
                  app/src/test/java/com/codex/campboardgamehost/persistence/AppJsonPrimitivesTest.kt
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" = "3"
          test "${staged[0]}" = "app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt"
          test "${staged[1]}" = "app/src/main/java/com/codex/campboardgamehost/persistence/AppJsonPrimitives.kt"
          test "${staged[2]}" = "app/src/test/java/com/codex/campboardgamehost/persistence/AppJsonPrimitivesTest.kt"
          git commit -m 'refactor: remove dead active snapshot'
          product_sha=$(git rev-parse HEAD)
          test "$(git ls-remote origin refs/heads/codex/persistence-simplification | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/codex/persistence-simplification
          echo "PRODUCT_SHA=$product_sha" >> "$GITHUB_ENV"

      - name: Self-remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/persistence-simplification | cut -f1)" = "$PRODUCT_SHA"
          git rm .github/scripts/ps4_1_dead_active_snapshot_patch.py
          git rm .github/workflows/ps4-1-dead-active-snapshot-one-shot.yml
          git commit -m 'chore: remove PS4.1 one-shot tooling'
          git push origin HEAD:refs/heads/codex/persistence-simplification
