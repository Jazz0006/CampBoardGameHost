name: Experienced UI 2 final verification

on:
  push:
    branches:
      - codex/experienced-ui-compact-2
    paths:
      - .github/workflows/experienced-ui-2-final-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          ref: codex/experienced-ui-compact-2
          fetch-depth: 0

      - name: Assert verification seed
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f7a4ff5e222fc69d2ce038ccaffa09ce1794df1a"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/experienced-ui-2-final-verify.yml"
          git diff --check codex/experienced-ui-compact-1...HEAD

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run Android FAST and debug build
        run: ./gradlew :app:testFast :app:assembleDebug

      - name: Remove verification workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/experienced-ui-2-final-verify.yml
          git commit -m "chore: remove Experienced UI 2 final verification"
          git push origin HEAD:codex/experienced-ui-compact-2
