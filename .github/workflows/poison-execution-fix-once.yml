name: Poison execution crash fix once

on:
  push:
    branches:
      - codex/poison-execution-crash-audit
    paths:
      - .github/workflows/poison-execution-fix-once.yml

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/poison-execution-crash-audit
          fetch-depth: 0

      - name: Patch exact Poisoner chronology call
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt")
          text = path.read_text()

          old_import = "import com.codex.campboardgamehost.clocktower.rules.ClocktowerEffectiveNightStateProjector\n"
          optional_import = "import com.codex.campboardgamehost.clocktower.rules.ClocktowerOptionalNightSourceChronology\n"
          if text.count(old_import) != 1:
              raise SystemExit(f"expected exactly one import anchor, found {text.count(old_import)}")
          if optional_import not in text:
              text = text.replace(old_import, old_import + optional_import, 1)

          start_marker = "        val cursor = ClocktowerEffectiveNightCursor(interactionId, boundary)\n        val sourceAfter = ClocktowerEffectiveNightCursor(\n"
          end_marker = "        ) return null\n"
          if text.count(start_marker) != 1:
              raise SystemExit(f"expected exactly one Poisoner chronology start, found {text.count(start_marker)}")
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          old_block = text[start:end]
          required_fragments = [
              'ClocktowerProductionNightStepIdentity.role(RoleId("Poisoner"))',
              'ClocktowerInteractionBoundary.AFTER',
              'ClocktowerEffectiveNightChronology.isAtOrAfter',
          ]
          missing = [fragment for fragment in required_fragments if fragment not in old_block]
          if missing:
              raise SystemExit(f"unexpected Poisoner chronology block; missing {missing}")

          new_block = (
              "        val cursor = ClocktowerEffectiveNightCursor(interactionId, boundary)\n"
              "        val sourceInteractionId = ClocktowerProductionNightStepIdentity.role(RoleId(\"Poisoner\"))\n"
              "            .interactionId(ClocktowerNightFlowPhase.OTHER_NIGHT)\n"
              "        if (!ClocktowerOptionalNightSourceChronology.hasActedBy(\n"
              "                canonicalInteractionIds = otherNightCanonicalInteractionIds,\n"
              "                cursor = cursor,\n"
              "                sourceInteractionId = sourceInteractionId,\n"
              "            )\n"
              "        ) return null\n"
          )
          text = text[:start] + new_block + text[end:]
          path.write_text(text)

      - name: Verify diff scope
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt"
          git diff -- app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt

      - name: Focused regression tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testFast --tests 'com.codex.campboardgamehost.clocktower.rules.ClocktowerOptionalNightSourceChronologyTest' --tests 'com.codex.campboardgamehost.clocktower.session.PoisonExecutionDuskTimelineRegressionTest'

      - name: FAST unit tests
        run: ./gradlew :app:testFast

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Commit product patch and remove one-shot workflow
        run: |
          rm .github/workflows/poison-execution-fix-once.yml
          git add app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt .github/workflows/poison-execution-fix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: ignore absent Poisoner night chronology'
          git push origin HEAD:codex/poison-execution-crash-audit
