name: Build device-test APK

on:
  push:
    branches:
      - codex/hotfix-first-night-evil-info-display-crash

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact device-test commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --rerun-tasks

      - name: Upload device-test APK
        uses: actions/upload-artifact@v4
        with:
          name: CampBoardGameHost-device-test-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  cleanup:
    name: Remove temporary workflow
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: codex/hotfix-first-night-evil-info-display-crash
          token: ${{ github.token }}

      - name: Remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/build-device-test-apk.yml
          git commit -m "chore: remove temporary device-test APK workflow"
          git push
