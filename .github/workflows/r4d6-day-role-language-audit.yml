name: R4D-6 Day role localization GREEN

on:
  push:
    branches:
      - codex/ui-r4d6-closeout-postdeal-role-visibility

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/ui-r4d6-closeout-postdeal-role-visibility
          fetch-depth: 2

      - name: Lock bootstrap state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a42de69bcd045495088ff4da8e808b3cfab2f73a"
          test "$(git rev-parse HEAD:app/src/main/java/com/codex/campboardgamehost/ClocktowerRoleLocalization.kt)" = "cb5d2a161edc4ecb0439c57d1f80fcc74e21f4bc"
          test "$(git rev-parse HEAD:app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt)" = "8ee1df0f33c249dc6c6021513a72c821014ceddc"
          test "$(git rev-parse HEAD:.github/scripts/r4d6_day_role_cards_localization_patch.py)" = "854139311db05de223c7846e91c680e9d2a65e34"
          test "$(git rev-parse HEAD:app/src/main/java/com/codex/campboardgamehost/ClocktowerPlayerDisplayUi.kt)" = "930762d4a13108799ace45580ed1d9aeb57a6518"
          test "$(git rev-parse HEAD:app/src/main/java/com/codex/campboardgamehost/ClocktowerPairPlayerRevealPresentation.kt)" = "5ebf9353297cd44f7ee6839ee8761f9881c0f64d"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Apply PlayerCard-backed Day localization patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/r4d6_day_role_cards_localization_patch.py

      - name: Run focused GREEN
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerDayOverviewTableStateTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerHostSeatContentPresentationTest' \
            --no-daemon

      - name: Run testFast
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testFast --rerun-tasks --no-daemon

      - name: Audit exact product diff and privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          expected=$'app/src/main/java/com/codex/campboardgamehost/ClocktowerRoleLocalization.kt\napp/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt'
          actual="$(git diff --name-only | sort)"
          printf 'changed=\n%s\n' "$actual"
          test "$actual" = "$expected"
          git diff --check
          test "$(grep -cF 'roleDisplayName = { roleId -> clocktowerRoleLabel(roleId, language, cards) },' app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt)" -eq 6
          grep -F 'cards.asSequence()' app/src/main/java/com/codex/campboardgamehost/ClocktowerRoleLocalization.kt
          grep -F 'sequenceOf(card.clocktowerRole, card.clocktowerShownRole)' app/src/main/java/com/codex/campboardgamehost/ClocktowerRoleLocalization.kt
          test "$(git rev-parse HEAD:app/src/main/java/com/codex/campboardgamehost/ClocktowerPlayerDisplayUi.kt)" = "930762d4a13108799ace45580ed1d9aeb57a6518"
          test "$(git rev-parse HEAD:app/src/main/java/com/codex/campboardgamehost/ClocktowerPairPlayerRevealPresentation.kt)" = "5ebf9353297cd44f7ee6839ee8761f9881c0f64d"

      - name: Recheck remote head
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin refs/heads/codex/ui-r4d6-closeout-postdeal-role-visibility | cut -f1)"
          test "$remote" = "$(git rev-parse HEAD)"

      - name: Commit and push product fix
        id: product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/codex/campboardgamehost/ClocktowerRoleLocalization.kt \
            app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt
          git commit -m 'fix(R4D-6): align Day role localization with active cards'
          product_sha="$(git rev-parse HEAD)"
          echo "product_sha=$product_sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:codex/ui-r4d6-closeout-postdeal-role-visibility

      - name: Remove one-shot files
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/r4d6-day-role-language-audit.yml \
            .github/scripts/r4d6_day_role_cards_localization_patch.py
          git commit -m 'chore(ci): remove Day role localization one-shot files'
          cleanup_sha="$(git rev-parse HEAD)"
          echo "cleanup_sha=$cleanup_sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:codex/ui-r4d6-closeout-postdeal-role-visibility

      - name: Report
        shell: bash
        run: |
          echo "PRODUCT_SHA=${{ steps.product.outputs.product_sha }}"
          echo "CLEANUP_SHA=${{ steps.cleanup.outputs.cleanup_sha }}"
