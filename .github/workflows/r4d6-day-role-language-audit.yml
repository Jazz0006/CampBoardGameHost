name: R4D-6 Day role language audit

on:
  push:
    branches:
      - codex/ui-r4d6-closeout-postdeal-role-visibility

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/ui-r4d6-closeout-postdeal-role-visibility
      - name: Locate all Day role rendering paths
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Day UI role/enName references ==='
          grep -n -C 8 -E 'clocktowerRole|clocktowerShownRole|\.enName|roleDisplayName|roleLabel|roleName' \
            app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerDayScreen.kt \
            app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerDayOverviewTableUi.kt \
            app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerPendingNominationTableUi.kt \
            app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerVoteTableUi.kt \
            app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerArtistTableUi.kt \
            app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerKlutzTableUi.kt \
            2>/dev/null || true
          echo '=== HostScreen Day block role/enName references ==='
          sed -n '3840,4460p' app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt | \
            grep -n -C 6 -E 'clocktowerRole|clocktowerShownRole|\.enName|roleDisplayName|roleLabel|roleName' || true
