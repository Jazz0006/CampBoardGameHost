name: R4D-6 Day role language audit

on:
  push:
    branches:
      - codex/ui-r4d6-closeout-postdeal-role-visibility

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/ui-r4d6-closeout-postdeal-role-visibility
      - name: Locate Day role identity conversion
        shell: bash
        run: |
          set -euo pipefail
          echo '=== toClocktowerGameState definitions/usages ==='
          grep -R -n -C 16 --include='*.kt' 'toClocktowerGameState' app/src/main/java | head -n 500 || true
          echo '=== actualRole RoleId construction near PlayerCard conversion ==='
          grep -R -n -C 12 --include='*.kt' 'RoleId(.*clocktowerRole\|actualRole = RoleId\|shownRole = RoleId' app/src/main/java | head -n 400 || true
          echo '=== ClocktowerRole localization helper ==='
          cat app/src/main/java/com/codex/campboardgamehost/ClocktowerRoleLocalization.kt
