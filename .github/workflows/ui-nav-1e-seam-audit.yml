name: UI-NAV-1E seam audit

on:
  push:
    branches:
      - codex/ui-nav-1-global-navigation-visual-unification
    paths:
      - .github/workflows/ui-nav-1e-seam-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Print identity boundary seams
        shell: bash
        run: |
          set -euo pipefail
          echo '=== recommendation helper definition ==='
          git grep -n -C 25 'fun ClocktowerStorytellerRecommendationScreen' -- 'app/src/main/java/**/*.kt' || true
          echo '=== recommendation helper call sites ==='
          git grep -n -C 20 'ClocktowerStorytellerRecommendationScreen(' -- 'app/src/main/java/**/*.kt' || true
          echo '=== ClocktowerJudge root call ==='
          git grep -n -C 18 'Screen.ClocktowerJudge -> ClocktowerJudgeScreen(' -- app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt || true
          echo '=== current deal routes ==='
          git grep -n -C 18 'Screen.PassPhone -> PassPhoneScreen(' -- app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt || true
          echo '=== files ==='
          git grep -l 'ClocktowerStorytellerRecommendationScreen' -- 'app/src/main/java/**/*.kt' || true
