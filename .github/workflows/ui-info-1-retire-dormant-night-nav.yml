name: UI-INFO-1 retire dormant night navigation owner

on:
  push:
    branches:
      - codex/ui-info-1-beginner-night-guidance
    paths:
      - .github/workflows/ui-info-1-retire-dormant-night-nav.yml

permissions:
  contents: write

jobs:
  red-patch-green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: codex/ui-info-1-beginner-night-guidance
          fetch-depth: 0

      - name: Lock audited inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/codex/ui-info-1-beginner-night-guidance | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt)" = "8742d8dd06f6cf096bad80ba5227c5ff038320d4"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt)" = "f63b4292d36090f4e2fa602f6d928610b8757838"
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/ClocktowerNightDialogInsetsContractTest.kt)" = "7a5bff5b196a4309fccc13f2eee59f9475646d55"
          test "$(git hash-object .github/scripts/ui_info_1_retire_dormant_night_nav.py)" = "1c7c8bf9480ff642cb0a494b9be33b7dc770d173"
          grep -q 'showNavigationActions: Boolean = true' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          grep -q 'HostBottomActionBar(' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          grep -q 'showNavigationActions = false' app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt

      - name: Focused RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerNightDialogInsetsContractTest' \
            --rerun-tasks --no-daemon > dormant-night-nav-red.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -Eq 'ClocktowerNightDialogInsetsContractTest|dormant second bottom navigation owner' dormant-night-nav-red.log
          echo 'RED confirmed: NightStep still owns the dormant fallback bottom navigation branch.'

      - name: Apply fail-closed production cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ui_info_1_retire_dormant_night_nav.py

      - name: Focused GREEN
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerNightDialogInsetsContractTest' \
            --rerun-tasks --no-daemon

      - name: Android fast suite
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testFast --no-daemon

      - name: Structural ownership audit
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn 'showNavigationActions' \
            app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt \
            app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt
          ! grep -n 'HostBottomActionBar(' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          grep -n 'ClocktowerHostFullScreenScaffold(' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightActionSquareTableUi.kt
          ! grep -RInE 'import androidx.compose.ui.window.Dialog|DialogProperties\(|^[[:space:]]*Dialog\(' \
            app/src/main/java/com/codex/campboardgamehost/Clocktower*SquareTableUi.kt
          git diff --check

      - name: Remove temporary one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm -f dormant-night-nav-red.log
          rm .github/scripts/ui_info_1_retire_dormant_night_nav.py
          rm .github/workflows/ui-info-1-retire-dormant-night-nav.yml

      - name: Exact diff audit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git status --short | sed -E 's/^.. //' | sort)
          printf '%s\n' "${files[@]}"
          expected=(
            '.github/scripts/ui_info_1_retire_dormant_night_nav.py'
            '.github/workflows/ui-info-1-retire-dormant-night-nav.yml'
            'app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt'
            'app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${files[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          git diff -- app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt \
            app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt

      - name: Commit and push production cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: retire dormant night navigation owner'
          git push origin HEAD:codex/ui-info-1-beginner-night-guidance
