name: UI-INFO drunk presentation role one-shot

on:
  push:
    branches:
      - codex/ui-info-1-beginner-night-guidance

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[ui-info-drunk-presentation-one-shot]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/ui-info-1-beginner-night-guidance

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Lock exact state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "0f543815a653b56144ef777383a80082cc8759b1"
          test "$(git ls-remote origin refs/heads/codex/ui-info-1-beginner-night-guidance | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt)" = "c23ea456910a050dd3ad7c44ab38a59a2c694772"
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/ClocktowerNightPresentationRoleTest.kt)" = "1ccb04f956bb995786ddbdec99c8fa6648190f04"
          test ! -e app/src/main/java/com/codex/campboardgamehost/ClocktowerNightPresentationRole.kt

      - name: Focused RED proves missing presentation-role contract
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./gradlew :app:testFast \
            --tests 'com.codex.campboardgamehost.ClocktowerNightPresentationRoleTest' \
            --rerun-tasks --no-daemon > /tmp/ui-info-drunk-red.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            cat /tmp/ui-info-drunk-red.log
            echo "Expected focused RED, but test unexpectedly passed"
            exit 1
          fi
          grep -F 'clocktowerNightPresentationRoleEnName' /tmp/ui-info-drunk-red.log
          grep -F 'Unresolved reference' /tmp/ui-info-drunk-red.log

      - name: Apply exact production patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ui_info_drunk_presentation_role_patch.py

      - name: Focused GREEN
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testFast \
            --tests 'com.codex.campboardgamehost.ClocktowerNightPresentationRoleTest' \
            --rerun-tasks --no-daemon

      - name: FAST regression
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testFast --no-daemon

      - name: Exact diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'app/src/main/java/com/codex/campboardgamehost/ClocktowerNightPresentationRole.kt' \
            'app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt' | sort)"
          test "$actual" = "$expected"
          test "$(grep -o 'step\.roleEnName' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt | wc -l | tr -d ' ')" = "1"
          grep -F 'presentationRoleEnName == "Empath"' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          grep -F 'presentationRoleEnName in setOf("Washerwoman", "Librarian", "Investigator")' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          grep -F 'actualRoleEnName == "Drunk"' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightPresentationRole.kt

      - name: Commit and push product fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/codex/campboardgamehost/ClocktowerNightPresentationRole.kt \
            app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt
          git commit -m 'fix: route drunk shown roles to night square tables'
          test "$(git ls-remote origin refs/heads/codex/ui-info-1-beginner-night-guidance | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:codex/ui-info-1-beginner-night-guidance

      - name: Self-remove temporary one-shot files
        shell: bash
        run: |
          set -euo pipefail
          product_head="$(git rev-parse HEAD)"
          test "$(git ls-remote origin refs/heads/codex/ui-info-1-beginner-night-guidance | cut -f1)" = "$product_head"
          git rm \
            .github/scripts/ui_info_drunk_presentation_role_patch.py \
            .github/workflows/ui-info-drunk-presentation-role-one-shot.yml
          git commit -m 'chore: remove drunk presentation role one-shot'
          git push origin HEAD:codex/ui-info-1-beginner-night-guidance
