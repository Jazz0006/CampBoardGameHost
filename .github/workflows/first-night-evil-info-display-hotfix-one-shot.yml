name: First-night evil info display hotfix

on:
  push:
    branches:
      - codex/hotfix-first-night-evil-info-display-crash
    paths:
      - .github/workflows/first-night-evil-info-display-hotfix-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: codex/hotfix-first-night-evil-info-display-crash
          fetch-depth: 0

      - name: Verify bootstrap head and blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/codex/hotfix-first-night-evil-info-display-crash | cut -f1)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "78ead9672c99bc4e31e4a11eb7be7bb51e111186"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt)" = "14ffa22b1227759030d2a3f930c95f260848d261"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerHostCoreSemantics.kt)" = "2b57fa81291f97c446808838d2c516eff67f608d"
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/ClocktowerDisplayedInformationReliabilityTest.kt)" = "266a52c85f3aa8bb6027d5e73430661938778012"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run focused helper baseline
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerDisplayedInformationReliabilityTest' \
            --rerun-tasks --no-daemon

      - name: Apply exact Host patch
        run: python3 .github/scripts/first_night_evil_info_display_hotfix_patch.py

      - name: Run focused GREEN
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerDisplayedInformationReliabilityTest' \
            --rerun-tasks --no-daemon

      - name: Run FAST regression suite
        run: ./gradlew :app:testFast --rerun-tasks --no-daemon

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Exact diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | paste -sd ' ' -)" = "app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt"
          test "$(grep -F 'actorIsUnreliable(displayStep.roleEnName.orEmpty(), actor)' app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt | wc -l)" -eq 0
          test "$(grep -F 'clocktowerDisplayedInformationIsUnreliable(displayStep, ::actorIsUnreliable)' app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt | wc -l)" -eq 2

      - name: Reconfirm remote head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/hotfix-first-night-evil-info-display-crash | cut -f1)" = "$GITHUB_SHA"

      - name: Commit and push production patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt
          test "$(git diff --cached --name-only)" = "app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt"
          git commit -m 'fix: prevent first-night evil info display crash'
          git push origin HEAD:codex/hotfix-first-night-evil-info-display-crash
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/first-night-evil-info-display-hotfix-one-shot.yml
          git rm .github/scripts/first_night_evil_info_display_hotfix_patch.py
          git commit -m 'chore(ci): remove evil info display hotfix one-shot'
          git push origin HEAD:codex/hotfix-first-night-evil-info-display-crash
          echo "CLEANUP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report checkpoints
        run: |
          echo "Product checkpoint: $PRODUCT_SHA"
          echo "Cleanup checkpoint: $CLEANUP_SHA"
