name: R4D2 F5 Final Checkpoint

on:
  push:
    branches:
      - codex/ui-r4d2-seating-first-setup
    paths:
      - .github/workflows/r4d2-f5-final.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Guard exact F5 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8bf1087396544633b52046ddfc670a8c1c75034b"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/r4d2-f5-final.yml"

      - name: Focused F5 contracts
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests com.codex.campboardgamehost.ClocktowerPlayerDisplayPresentationTest \
            --tests com.codex.campboardgamehost.ClocktowerPlayerDisplayResolutionTest

      - name: FAST regression
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testFast

      - name: Final exact F5 diff audit
        shell: bash
        run: |
          set -euo pipefail
          BASE=5ebc562b0ca96ecb5d2f8d92be71a0e0b9a430dc
          git diff --check "$BASE" HEAD
          actual="$(git diff --name-only "$BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/r4d2-f5-final.yml' \
            'app/src/main/java/com/codex/campboardgamehost/ClocktowerPairPlayerRevealPresentation.kt' \
            'app/src/main/java/com/codex/campboardgamehost/ClocktowerPlayerDisplayUi.kt' \
            'app/src/test/java/com/codex/campboardgamehost/ClocktowerPlayerDisplayPresentationTest.kt' | sort)"
          test "$actual" = "$expected"
          test -z "$(git diff --name-only "$BASE" HEAD -- app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt)"
          test -z "$(git diff --name-only "$BASE" HEAD -- app/src/main/java/com/codex/campboardgamehost/ClocktowerPlayerDisplayResolution.kt)"
          test -z "$(git diff --name-only "$BASE" HEAD -- app/src/main/java/com/codex/campboardgamehost/ClocktowerPairManualSelectionUi.kt)"

      - name: Self-clean temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r4d2-f5-final.yml
          git commit -m "build: remove temporary F5 final workflow"
          git push origin HEAD:codex/ui-r4d2-seating-first-setup
