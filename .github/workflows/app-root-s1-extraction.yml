name: App-root S1 structural extraction

on:
  push:
    branches:
      - codex/source-decomposition-app-root
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout structural branch
        uses: actions/checkout@v6
        with:
          ref: codex/source-decomposition-app-root
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Apply exact S1 mechanical extraction
        run: python tools/app_root_s1_extract.py

      - name: Audit extraction scope before tests
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --short)"
          printf '%s\n' "$status"
          printf '%s\n' "$status" | grep -F 'CampBoardGameHostApp.kt'
          printf '%s\n' "$status" | grep -F 'AppPlayerSetupScreens.kt'
          unexpected="$(printf '%s\n' "$status" | grep -v -E 'CampBoardGameHostApp\.kt|AppPlayerSetupScreens\.kt' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected extraction changes:"
            echo "$unexpected"
            exit 1
          fi

      - name: Run Android unit tests and build debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --build-cache

      - name: Exact diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          git diff -- app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt app/src/main/java/com/codex/campboardgamehost/AppPlayerSetupScreens.kt

      - name: Commit verified extraction and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          git add app/src/main/java/com/codex/campboardgamehost/AppPlayerSetupScreens.kt
          git rm tools/app_root_s1_extract.py
          git rm .github/workflows/app-root-s1-extraction.yml
          git commit -m "refactor: extract player setup presentation"
          git push origin HEAD:codex/source-decomposition-app-root
