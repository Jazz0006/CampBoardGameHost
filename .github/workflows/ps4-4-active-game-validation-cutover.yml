name: PS4.4 active-game validation cutover

on:
  push:
    branches:
      - codex/persistence-simplification
    paths:
      - .github/workflows/ps4-4-active-game-validation-cutover.yml

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout locked branch
        uses: actions/checkout@v4
        with:
          ref: codex/persistence-simplification
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify immutable cutover preconditions
        shell: bash
        run: |
          set -euo pipefail
          GREEN_SHA='344c709c35d2a7c99548eb330e595a6b9c2ae5c7'
          EXPECTED_PARENT='4921fb76228243347a8d421984e7836fe8c60b6e'
          APP_BLOB='a1fc22725a4bf6f242ff6de19c10ccf1e89fd48a'
          SCRIPT_BLOB='6deaa016df3faadc146de3f2d134723f92b3110e'
          WORKFLOW='.github/workflows/ps4-4-active-game-validation-cutover.yml'
          SCRIPT='scripts/ps4_4_active_game_validation_cutover.py'
          APP='app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt'

          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git merge-base --is-ancestor "$GREEN_SHA" HEAD
          test "$(git hash-object "$APP")" = "$APP_BLOB"
          test "$(git hash-object "$SCRIPT")" = "$SCRIPT_BLOB"
          test "$(git show --format= --name-only HEAD | sed '/^$/d')" = "$WORKFLOW"

      - name: Audit legacy identity references before cutover
        shell: bash
        run: |
          set -euo pipefail
          PATTERN='ActiveGamePersistenceCoordinator|ActiveGamePersistenceInputs|PersistedActiveGameIdentityEnvelope|PersistedGameContentIdentity|PersistedWerewolfGameIdentity|ClocktowerPersistenceIdentityFactory|WerewolfPersistenceIdentityFactory'
          git grep -nE "$PATTERN" -- app/src/main app/src/test | tee /tmp/ps4_4_legacy_refs.txt || true

          python3 - <<'PY'
          from pathlib import Path

          allowed = {
              'app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt',
              'app/src/main/java/com/codex/campboardgamehost/persistence/ActiveGamePersistenceCoordinator.kt',
              'app/src/main/java/com/codex/campboardgamehost/persistence/ActiveGameIdentityEnvelope.kt',
              'app/src/main/java/com/codex/campboardgamehost/persistence/PersistedGameIdentity.kt',
              'app/src/main/java/com/codex/campboardgamehost/clocktower/persistence/ClocktowerPersistenceIdentityFactory.kt',
              'app/src/main/java/com/codex/campboardgamehost/werewolf/WerewolfPersistenceIdentityFactory.kt',
              'app/src/test/java/com/codex/campboardgamehost/persistence/ActiveGamePersistenceCoordinatorTest.kt',
              'app/src/test/java/com/codex/campboardgamehost/persistence/ActiveGameIdentityEnvelopeTest.kt',
              'app/src/test/java/com/codex/campboardgamehost/persistence/PersistedGameIdentityTest.kt',
              'app/src/test/java/com/codex/campboardgamehost/clocktower/catalog/BuiltInClocktowerRulesetCatalogTest.kt',
              'app/src/test/java/com/codex/campboardgamehost/persistence/RecoveryClocktowerRotationOwnershipTest.kt',
              'app/src/test/java/com/codex/campboardgamehost/persistence/RecoveryRestorePlannerTest.kt',
              'app/src/test/java/com/codex/campboardgamehost/persistence/RecoverySnapshotJsonCodecTest.kt',
          }
          lines = Path('/tmp/ps4_4_legacy_refs.txt').read_text(encoding='utf-8').splitlines()
          paths = {line.split(':', 1)[0] for line in lines if ':' in line}
          unexpected = sorted(paths - allowed)
          if unexpected:
              raise SystemExit('Unexpected legacy identity consumers:\n' + '\n'.join(unexpected))
          app = 'app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt'
          if app not in paths:
              raise SystemExit('Expected App legacy coordinator consumer was not found before cutover.')
          print('Legacy reference allowlist audit passed.')
          print('\n'.join(sorted(paths)))
          PY

      - name: Apply exact App cutover
        run: python3 scripts/ps4_4_active_game_validation_cutover.py

      - name: Verify cutover diff and removed App dependency
        shell: bash
        run: |
          set -euo pipefail
          APP='app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt'
          git diff --check
          test "$(git diff --name-only)" = "$APP"
          if git grep -nE 'activeGamePersistenceCoordinator|ActiveGamePersistenceInputs|ActiveGamePersistenceCoordinator\.fromContext' -- "$APP"; then
            echo 'Legacy active-game coordinator dependency remains in App.' >&2
            exit 1
          fi
          git diff --stat
          git diff -- "$APP"

      - name: Run focused validation ownership test
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests 'com.codex.campboardgamehost.ActiveGameSaveInvariantValidatorTest'

      - name: Run FAST regression suite
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testFast

      - name: Re-audit legacy references after App cutover
        shell: bash
        run: |
          set -euo pipefail
          PATTERN='ActiveGamePersistenceCoordinator|ActiveGamePersistenceInputs|PersistedActiveGameIdentityEnvelope|PersistedGameContentIdentity|PersistedWerewolfGameIdentity|ClocktowerPersistenceIdentityFactory|WerewolfPersistenceIdentityFactory'
          git grep -nE "$PATTERN" -- app/src/main app/src/test | tee /tmp/ps4_4_post_refs.txt || true
          if grep -q '^app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt:' /tmp/ps4_4_post_refs.txt; then
            echo 'App still consumes legacy identity/coordinator symbols.' >&2
            exit 1
          fi

      - name: Commit cutover and self-clean helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ps4-4-active-game-validation-cutover.yml
          git rm scripts/ps4_4_active_game_validation_cutover.py
          git add app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          git diff --cached --check
          git commit -m 'refactor: cut recovery validation off legacy identity coordinator'
          git push origin HEAD:codex/persistence-simplification
