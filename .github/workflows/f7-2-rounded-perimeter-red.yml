name: F7.2 rounded perimeter RED

on:
  push:
    branches:
      - codex/ui-r4d2-seating-first-setup

permissions:
  contents: read

jobs:
  rounded-perimeter-red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run F7.2 rounded-perimeter geometry contract
        run: >-
          ./gradlew :app:testDebugUnitTest
          --tests com.codex.campboardgamehost.ClocktowerRoundedRectanglePerimeterLayoutTest
          --no-daemon
