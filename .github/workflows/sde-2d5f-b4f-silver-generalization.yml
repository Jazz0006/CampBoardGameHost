name: SDE-2D5F B4F SILVER generalization

on:
  push:
    branches:
      - sde-2d5-calibration-policy-evidence
    paths:
      - app/src/test/java/com/codex/campboardgamehost/clocktower/review/Sde2D5ExternalHumanPilot.kt
      - app/src/test/java/com/codex/campboardgamehost/clocktower/review/Sde2D5FB4FSilverGeneralizationExperiment.kt
      - app/build.gradle.kts
      - .github/workflows/sde-2d5f-b4f-silver-generalization.yml

concurrency:
  group: sde-2d5f-b4f-silver-generalization-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generalize:
    name: Generalize GOLD hypotheses against SILVER
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run bounded B4F SILVER generalization
        run: ./gradlew :app:sde2D5FB4FSilverGeneralization --no-daemon --rerun-tasks

      - name: Print B4F SILVER report
        shell: bash
        run: |
          set -euo pipefail
          report="app/build/reports/sde-2d5f-b4f-silver-generalization.md"
          test -f "$report"
          cat "$report"

      - name: Upload B4F SILVER report
        uses: actions/upload-artifact@v4
        with:
          name: sde-2d5f-b4f-silver-generalization
          path: app/build/reports/sde-2d5f-b4f-silver-generalization.md
          if-no-files-found: error
