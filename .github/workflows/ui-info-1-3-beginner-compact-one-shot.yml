name: UI-INFO-1.3 beginner compact one-shot

on:
  push:
    branches:
      - codex/ui-info-1-beginner-night-guidance
    paths:
      - .github/workflows/ui-info-1-3-beginner-compact-one-shot.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ui-info-1-beginner-night-guidance
          fetch-depth: 0

      - name: Add RED contracts
        run: |
          cat > app/src/test/java/com/codex/campboardgamehost/ClocktowerBeginnerCompactNightPresentationTest.kt <<'EOF'
          package com.codex.campboardgamehost

          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Assert.assertEquals
          import org.junit.Test

          class ClocktowerBeginnerCompactNightPresentationTest {
              @Test
              fun `structured beginner wake guidance uses compact surface`() {
                  assertTrue(clocktowerUsesBeginnerCompactNightGuidance("唤醒 投毒者\n3号 张三\n让他选择一名玩家作为中毒目标"))
                  assertFalse(clocktowerUsesBeginnerCompactNightGuidance("Wake P3 张三 and choose a target"))
              }

              @Test
              fun `beginner pair surface hides clue target accents but keeps actor cue`() {
                  val actor = clocktowerBeginnerPairSeatPresentation(seatNumber = 3, actorSeat = 3)
                  val other = clocktowerBeginnerPairSeatPresentation(seatNumber = 5, actorSeat = 3)
                  assertEquals(ClocktowerSquareTableSeatState.Neutral, actor.targetState)
                  assertEquals(ClocktowerSquareTableSeatState.Neutral, other.targetState)
                  assertTrue(actor.isCurrentActor)
                  assertFalse(other.isCurrentActor)
              }
          }
          EOF
          set +e
          ./gradlew :app:testFast --tests '*ClocktowerBeginnerCompactNightPresentationTest' >/tmp/red.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected RED test failure before production patch'
            cat /tmp/red.log
            exit 1
          fi
          grep -E 'unresolved reference|Unresolved reference' /tmp/red.log >/dev/null || { cat /tmp/red.log; exit 1; }

      - name: Apply production patch
        run: |
          cat > app/src/main/java/com/codex/campboardgamehost/ClocktowerBeginnerCompactNightUi.kt <<'EOF'
          package com.codex.campboardgamehost

          import androidx.compose.foundation.layout.Arrangement
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.padding
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp

          internal fun clocktowerUsesBeginnerCompactNightGuidance(instruction: String?): Boolean {
              val lines = instruction
                  ?.lines()
                  ?.map(String::trim)
                  ?.filter(String::isNotBlank)
                  .orEmpty()
              return lines.size in 2..3 &&
                  (lines.firstOrNull()?.startsWith("唤醒 ") == true || lines.firstOrNull()?.startsWith("Wake ") == true)
          }

          internal fun clocktowerBeginnerPairSeatPresentation(
              seatNumber: Int,
              actorSeat: Int?,
          ): ClocktowerNightActionSeatPresentation = ClocktowerNightActionSeatPresentation(
              targetState = ClocktowerSquareTableSeatState.Neutral,
              isCurrentActor = seatNumber == actorSeat,
          )

          @Composable
          internal fun ClocktowerBeginnerSingleTargetAbilityDialog(
              seats: List<HostSeatPresentation>,
              presentation: ClocktowerSingleTargetAbilityPresentation,
              language: String,
              canGoPrevious: Boolean,
              onHostTools: () -> Unit,
              onEvent: (ClocktowerSingleTargetEvent) -> Unit,
          ) {
              ClocktowerNightActionSquareTableDialog(
                  seats = seats,
                  enabled = presentation.selection.enabled,
                  language = language,
                  seatPresentation = { seatNumber ->
                      clocktowerSingleTargetSeatPresentation(
                          seatNumber = seatNumber,
                          actorSeat = presentation.actorSeat,
                          selectedSeat = presentation.selection.selectedSeat,
                          selectableSeats = if (presentation.selection.enabled) presentation.selection.selectableSeats else emptySet(),
                      )
                  },
                  onSeatSelected = { onEvent(ClocktowerSingleTargetEvent.SelectSeat(it)) },
                  canGoPrevious = canGoPrevious,
                  onPrevious = { onEvent(ClocktowerSingleTargetEvent.Previous) },
                  onHostTools = onHostTools,
                  onNext = { onEvent(ClocktowerSingleTargetEvent.Next) },
              ) {
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(6.dp),
                      horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.Center,
                  ) {
                      ClocktowerNightActionWakeInstruction(presentation.wakeInstruction)
                  }
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          single = Path('app/src/main/java/com/codex/campboardgamehost/ClocktowerSingleTargetInteractionUi.kt')
          text = single.read_text()
          old = '''    val action = presentation.action
    val title = when (action) {'''
          new = '''    val action = presentation.action
    if (clocktowerUsesBeginnerCompactNightGuidance(presentation.wakeInstruction)) {
        ClocktowerBeginnerSingleTargetAbilityDialog(
            seats = seats,
            presentation = presentation,
            language = language,
            canGoPrevious = canGoPrevious,
            onHostTools = onHostTools,
            onEvent = onEvent,
        )
        return
    }
    val title = when (action) {'''
          if text.count(old) != 1:
              raise SystemExit('single-target anchor mismatch')
          single.write_text(text.replace(old, new, 1))

          pair = Path('app/src/main/java/com/codex/campboardgamehost/ClocktowerPairInformationSquareTableUi.kt')
          text = pair.read_text()
          old = '''    val canonicalRecommendedOption = remember(interactionKey, presentation, recommendedOption) {'''
          new = '''    val beginnerMode = !allowManualEditing
    val canonicalRecommendedOption = remember(interactionKey, presentation, recommendedOption) {'''
          if text.count(old) != 1:
              raise SystemExit('pair beginner anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''                        val seatPresentation = clocktowerPairInformationSeatPresentation(
                            selection = selection,
                            seatNumber = seat.seatId.number,
                            editing = editing,
                            actorSeat = actorSeat,
                        )'''
          new = '''                        val seatPresentation = if (beginnerMode) {
                            clocktowerBeginnerPairSeatPresentation(
                                seatNumber = seat.seatId.number,
                                actorSeat = actorSeat,
                            )
                        } else {
                            clocktowerPairInformationSeatPresentation(
                                selection = selection,
                                seatNumber = seat.seatId.number,
                                editing = editing,
                                actorSeat = actorSeat,
                            )
                        }'''
          if text.count(old) != 1:
              raise SystemExit('pair seat anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''                        wakeInstruction = wakeInstruction,
                        abilityLabel = abilityLabel,'''
          new = '''                        wakeInstruction = wakeInstruction,
                        beginnerMode = beginnerMode,
                        abilityLabel = abilityLabel,'''
          if text.count(old) != 1:
              raise SystemExit('pair call anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''private fun ClocktowerPairInformationCenterControls(
    wakeInstruction: String?,
    abilityLabel: String,'''
          new = '''private fun ClocktowerPairInformationCenterControls(
    wakeInstruction: String?,
    beginnerMode: Boolean,
    abilityLabel: String,'''
          if text.count(old) != 1:
              raise SystemExit('pair signature anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''    val hasRecommendation = recommendedSelection.resolvedOption != null

    Column('''
          new = '''    val hasRecommendation = recommendedSelection.resolvedOption != null

    if (beginnerMode) {
        Column(
            modifier = Modifier
                .fillMaxSize()
                .padding(6.dp),
            horizontalAlignment = Alignment.CenterHorizontally,
            verticalArrangement = Arrangement.Center,
        ) {
            ClocktowerNightActionWakeInstruction(wakeInstruction)
            Spacer(Modifier.height(8.dp))
            recommendedSelection.resolvedOption?.let { resolved ->
                Button(
                    onClick = { onConfirm(resolved) },
                    modifier = Modifier.fillMaxWidth(),
                ) {
                    Text(if (language == "en") "Show to player" else "展示给玩家")
                }
            }
        }
        return
    }

    Column('''
          if text.count(old) != 1:
              raise SystemExit('pair center anchor mismatch')
          pair.write_text(text.replace(old, new, 1))
          PY

      - name: Focused contracts after patch
        run: ./gradlew :app:testFast --tests '*ClocktowerBeginnerCompactNightPresentationTest' --tests '*ClocktowerBeginnerNightGuidanceTest' --tests '*ClocktowerEvilInfoSquareTablePresentationTest'

      - name: FAST checkpoint
        run: ./gradlew :app:testFast

      - name: Exact UI audit
        run: |
          grep -q 'ClocktowerBeginnerSingleTargetAbilityDialog' app/src/main/java/com/codex/campboardgamehost/ClocktowerSingleTargetInteractionUi.kt
          grep -q 'Show to player' app/src/main/java/com/codex/campboardgamehost/ClocktowerPairInformationSquareTableUi.kt
          grep -q 'clocktowerBeginnerPairSeatPresentation' app/src/main/java/com/codex/campboardgamehost/ClocktowerPairInformationSquareTableUi.kt

      - name: Commit production patch and self-remove
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ui-info-1-3-beginner-compact-one-shot.yml
          git add app/src/main/java/com/codex/campboardgamehost/ClocktowerBeginnerCompactNightUi.kt \
                  app/src/main/java/com/codex/campboardgamehost/ClocktowerSingleTargetInteractionUi.kt \
                  app/src/main/java/com/codex/campboardgamehost/ClocktowerPairInformationSquareTableUi.kt \
                  app/src/test/java/com/codex/campboardgamehost/ClocktowerBeginnerCompactNightPresentationTest.kt
          git commit -m 'feat: compact Beginner night action surfaces'
          git push origin HEAD:codex/ui-info-1-beginner-night-guidance
