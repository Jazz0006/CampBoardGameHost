name: Night dialog insets one-shot

on:
  push:
    branches:
      - codex/ux-mode-1
    paths:
      - .github/workflows/night-dialog-insets-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: codex/ux-mode-1
          fetch-depth: 0

      - name: Verify exact head and locked source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch origin codex/ux-mode-1 --quiet
          test "$(git rev-parse origin/codex/ux-mode-1)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD:app/src/test/java/com/codex/campboardgamehost/ClocktowerNightDialogInsetsContractTest.kt)" = "c7cce8d5d487fd13a699870ea86a063290a08a2f"
          test "$(git rev-parse HEAD:app/src/main/java/com/codex/campboardgamehost/ClocktowerNightActionSquareTableUi.kt)" = "389a9adf407655cab72aa41a193540cfd245b2a0"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Re-prove focused RED
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          set +e
          ./gradlew :app:testDebugUnitTest --tests 'com.codex.campboardgamehost.ClocktowerNightDialogInsetsContractTest' --rerun-tasks --no-daemon
          rc=$?
          set -e
          test "$rc" -ne 0
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path('app/build/test-results/testDebugUnitTest/TEST-com.codex.campboardgamehost.ClocktowerNightDialogInsetsContractTest.xml')
          root = ET.parse(report).getroot()
          assert int(root.attrib['tests']) == 2, root.attrib
          assert int(root.attrib['failures']) == 2, root.attrib
          assert int(root.attrib['errors']) == 0, root.attrib
          print('Focused RED confirmed: 2/2 contract tests fail before production patch')
          PY

      - name: Apply exact production patch
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/night_dialog_insets_patch.py

      - name: Focused GREEN
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest --tests 'com.codex.campboardgamehost.ClocktowerNightDialogInsetsContractTest' --rerun-tasks --no-daemon

      - name: Android FAST regression
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testFast --rerun-tasks --no-daemon

      - name: Exact diff and semantic audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          sort -u /tmp/night-dialog-inset-files.txt > /tmp/expected.txt
          git diff --name-only | sort -u > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          ! grep -R --line-number --fixed-string 'DialogProperties(usePlatformDefaultWidth = false)' app/src/main/java/com/codex/campboardgamehost
          grep -q 'WindowInsets.navigationBarsIgnoringVisibility.only(WindowInsetsSides.Bottom)' app/src/main/java/com/codex/campboardgamehost/ClocktowerNightActionSquareTableUi.kt
          echo 'Changed production files:'
          cat /tmp/actual.txt

      - name: Recheck remote head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/ux-mode-1 --quiet
          test "$(git rev-parse origin/codex/ux-mode-1)" = "${GITHUB_SHA}"

      - name: Commit and push product fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          while IFS= read -r path; do git add -- "$path"; done < /tmp/night-dialog-inset-files.txt
          git commit -m 'fix: keep night actions inside device safe bounds'
          git push origin HEAD:codex/ux-mode-1
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Remove one-shot workflow and script
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/ux-mode-1 --quiet
          test "$(git rev-parse origin/codex/ux-mode-1)" = "${PRODUCT_SHA}"
          git rm .github/scripts/night_dialog_insets_patch.py .github/workflows/night-dialog-insets-one-shot.yml
          git commit -m 'chore: remove night dialog inset patch tooling'
          git push origin HEAD:codex/ux-mode-1
          echo "CLEANUP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report checkpoints
        run: |
          echo "Product commit: ${PRODUCT_SHA}"
          echo "Cleanup commit: ${CLEANUP_SHA}"
