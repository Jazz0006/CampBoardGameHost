name: Document large-file patch priority

on:
  push:
    branches:
      - codex/trouble-brewing-setup-presets-v2
    paths:
      - .github/workflows/document-large-file-patch-priority.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: codex/trouble-brewing-setup-presets-v2
          fetch-depth: 0

      - name: Verify bootstrap head and blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/codex/trouble-brewing-setup-presets-v2 | cut -f1)" = "$GITHUB_SHA"
          test "$(git hash-object AGENTS.md)" = "851a0958e6e5d169483be228ded76317dcad931c"
          test "$(git hash-object docs/AI_DEVELOPMENT_WORKFLOW_V2_2026-08-27.md)" = "38b9e2a3b5841fe97beeecc09a925df17e5618b0"
          test "$(git hash-object .github/scripts/document_large_file_patch_priority.py)" = "1d6e345fc2a352e481c7a68d093ad9ed67762236"

      - name: Apply exact documentation patch
        run: python3 .github/scripts/document_large_file_patch_priority.py

      - name: Exact diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | paste -sd ' ' -)" = "AGENTS.md docs/AI_DEVELOPMENT_WORKFLOW_V2_2026-08-27.md"
          grep -F 'first fallback MUST be a GitHub Actions one-shot workflow + separate Python patch script' AGENTS.md
          grep -F '### Path B — GitHub Actions one-shot large-file patch' AGENTS.md
          grep -F '### Path C — Codex/Luna local implementation' AGENTS.md
          grep -F 'use the GitHub Actions one-shot + separate Python patch script path before Luna' docs/AI_DEVELOPMENT_WORKFLOW_V2_2026-08-27.md
          grep -F 'docs/LARGE_FILE_GITHUB_ACTIONS_PYTHON_PATCH_WORKFLOW.md' AGENTS.md docs/AI_DEVELOPMENT_WORKFLOW_V2_2026-08-27.md

      - name: Reconfirm remote head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/trouble-brewing-setup-presets-v2 | cut -f1)" = "$GITHUB_SHA"

      - name: Commit policy update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md docs/AI_DEVELOPMENT_WORKFLOW_V2_2026-08-27.md
          test "$(git diff --cached --name-only | paste -sd ' ' -)" = "AGENTS.md docs/AI_DEVELOPMENT_WORKFLOW_V2_2026-08-27.md"
          git commit -m 'docs: prioritize one-shot large-file patches'
          git push origin HEAD:codex/trouble-brewing-setup-presets-v2
          echo "POLICY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/document-large-file-patch-priority.yml .github/scripts/document_large_file_patch_priority.py
          git commit -m 'chore(ci): remove workflow-policy one-shot files'
          git push origin HEAD:codex/trouble-brewing-setup-presets-v2
          echo "CLEANUP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report checkpoints
        run: |
          echo "Policy checkpoint: $POLICY_SHA"
          echo "Cleanup checkpoint: $CLEANUP_SHA"
