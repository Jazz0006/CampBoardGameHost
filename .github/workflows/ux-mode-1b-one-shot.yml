name: UX-MODE-1B one-shot

on:
  push:
    branches:
      - codex/ux-mode-1

permissions:
  contents: write

jobs:
  patch-app-root:
    if: "${{ github.event.head_commit.message == 'chore: stage UX-MODE-1B one-shot workflow v4' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate exact head and locked blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote origin refs/heads/codex/ux-mode-1 | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt)" = '47895909b076e9238051fa97ab21ab2e9f7659f5'
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/AppSettingsScreen.kt)" = 'e9a15af00bc924d0131248f143c3054d3bd4d342'
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/clocktower/domain/StorytellerExperienceMode.kt)" = 'f61f0dee1ed56b90ee0100b74d3c7ff2eaaa6eaa'
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/clocktower/domain/StorytellerRecommendationUxPolicy.kt)" = 'e0134fbde0160eeb32ceea5b695a97c0416e9d93'
          test "$(git hash-object app/src/test/java/com/codex/campboardgamehost/clocktower/domain/StorytellerExperienceModeTest.kt)" = 'f88bb032f647a40c65ec3e26239df719f4d08eb8'
          test -z "$(git status --porcelain)"

      - name: Apply exact App-root patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ux_mode_1b_patch.py

      - name: Exact diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = 'app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt'
          ! grep -q 'StorytellerAutomationMode' app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          ! grep -q 'storytellerAutomationMode' app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          grep -q 'StorytellerRecommendationUxPolicy.fromExperienceMode(storytellerExperienceMode)' app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          grep -q 'style = storytellerRecommendationUxPolicy.recommendationStyle' app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          grep -q 'STORYTELLER_EXPERIENCE_MODE_KEY' app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Focused UX-MODE-1B tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.clocktower.domain.StorytellerExperienceModeTest' \
            --tests 'com.codex.campboardgamehost.clocktower.domain.StorytellerRecommendationUxPolicyTest' \
            --rerun-tasks --no-daemon

      - name: Commit and push product patch
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/codex/ux-mode-1 | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          git commit -m 'feat: wire storyteller experience mode'
          git push origin HEAD:codex/ux-mode-1

      - name: Remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/ux_mode_1b_patch.py
          rm .github/workflows/ux-mode-1b-one-shot.yml
          git add -A
          git commit -m 'chore: remove UX-MODE-1B one-shot files'
          git push origin HEAD:codex/ux-mode-1
