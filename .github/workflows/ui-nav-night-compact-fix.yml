name: UI-NAV night compact layout fix

on:
  push:
    branches:
      - codex/ui-nav-1-global-navigation-visual-unification
    paths:
      - .github/workflows/ui-nav-night-compact-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact production baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerNightScreen.kt)" = "713004066b5c309164f24dcfc572edbc8e277b47"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerNightActionSquareTableUi.kt)" = "15fef6c9f97a88c3e5148222e7d68f6655070391"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerSpySquareTableUi.kt)" = "928481293c4ea2bd86cd62f4ae1e3033084fbd3b"

      - name: Apply compact night layout patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          ROOT = Path("app/src/main/java/com/codex/campboardgamehost")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise AssertionError(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          path = ROOT / "clocktower/ui/ClocktowerNightScreen.kt"
          text = path.read_text()
          start = text.index("/** Behavior-preserving R2 extraction for Clocktower night active UI. */")
          end = text.index("\n@Composable\ninternal fun ClocktowerNightReadyCard()", start)
          new = '''/** Compact active-night shell: no independent top chrome; progress belongs inside the table. */
          @Composable
          internal fun ClocktowerNightActiveScreen(
              title: String,
              subtitle: String,
              progress: String,
              canGoPrevious: Boolean,
              nextEnabled: Boolean,
              onPrevious: () -> Unit,
              onHostTools: () -> Unit,
              onNext: () -> Unit,
              content: @Composable () -> Unit,
          ) {
              val language = LocalContext.current.resources.configuration.locales[0].language
              ClocktowerDarkTheme {
                  CompositionLocalProvider(LocalClocktowerNightProgress provides progress) {
                      Column(
                          modifier = Modifier
                              .fillMaxSize()
                              .background(MaterialTheme.colorScheme.background),
                      ) {
                          LazyColumn(
                              modifier = Modifier
                                  .weight(1f)
                                  .fillMaxWidth(),
                              contentPadding = PaddingValues(16.dp),
                              verticalArrangement = Arrangement.spacedBy(12.dp),
                          ) {
                              item { content() }
                          }

                          ClocktowerNightBottomActionBar(
                              language = language,
                              canGoPrevious = canGoPrevious,
                              nextEnabled = nextEnabled,
                              onPrevious = onPrevious,
                              onHostTools = onHostTools,
                              onNext = onNext,
                          )
                      }
                  }
              }
          }
          '''
          text = text[:start] + new.rstrip() + text[end:]
          path.write_text(text)

          path = ROOT / "ClocktowerNightActionSquareTableUi.kt"
          text = path.read_text()
          text = replace_once(
              text,
              "import androidx.compose.runtime.Composable\n",
              "import androidx.compose.runtime.Composable\nimport androidx.compose.runtime.compositionLocalOf\n",
              "night progress composition-local import",
          )
          anchor = "internal data class ClocktowerNightActionSeatPresentation("
          text = replace_once(
              text,
              anchor,
              "internal val LocalClocktowerNightProgress = compositionLocalOf<String?> { null }\n\n" + anchor,
              "night progress composition-local owner",
          )
          old_wake = '''@Composable
          internal fun ClocktowerNightActionWakeInstruction(instruction: String?) {
              instruction?.takeIf { it.isNotBlank() }?.let { value ->
                  Text(
                      text = value,
                      style = MaterialTheme.typography.titleMedium,
                      color = MaterialTheme.colorScheme.primary,
                      fontWeight = FontWeight.Black,
                      textAlign = TextAlign.Center,
                  )
                  Spacer(Modifier.height(4.dp))
              }
          }'''
          new_wake = '''@Composable
          internal fun ClocktowerNightActionWakeInstruction(instruction: String?) {
              LocalClocktowerNightProgress.current?.takeIf { it.isNotBlank() }?.let { value ->
                  Text(
                      text = value,
                      style = MaterialTheme.typography.titleMedium,
                      color = MaterialTheme.colorScheme.primary,
                      fontWeight = FontWeight.Black,
                      textAlign = TextAlign.Center,
                  )
                  Spacer(Modifier.height(4.dp))
              }
              instruction?.takeIf { it.isNotBlank() }?.let { value ->
                  Text(
                      text = value,
                      style = MaterialTheme.typography.titleMedium,
                      color = MaterialTheme.colorScheme.primary,
                      fontWeight = FontWeight.Black,
                      textAlign = TextAlign.Center,
                  )
                  Spacer(Modifier.height(4.dp))
              }
          }'''
          text = replace_once(text, old_wake, new_wake, "square-table center progress")
          path.write_text(text)

          path = ROOT / "ClocktowerSpySquareTableUi.kt"
          text = path.read_text()
          text = replace_once(
              text,
              "import androidx.compose.ui.res.stringResource\n",
              "",
              "spy obsolete stringResource import",
          )
          text = replace_once(
              text,
              "Text(stringResource(R.string.clocktower_host_show_to_player))",
              "Text(if (language == \"en\") \"Show grimoire\" else \"展示魔典\")",
              "spy grimoire label",
          )
          path.write_text(text)

          night = (ROOT / "clocktower/ui/ClocktowerNightScreen.kt").read_text()
          active = night[night.index("internal fun ClocktowerNightActiveScreen("):night.index("internal fun ClocktowerNightReadyCard()")]
          assert "shadowElevation = 8.dp" not in active
          assert "CompositionLocalProvider(LocalClocktowerNightProgress provides progress)" in active
          assert "ClocktowerNightBottomActionBar(" in active

          square = (ROOT / "ClocktowerNightActionSquareTableUi.kt").read_text()
          assert "LocalClocktowerNightProgress.current" in square
          assert ".weight(1f)\n                        .fillMaxWidth()," in square

          spy = (ROOT / "ClocktowerSpySquareTableUi.kt").read_text()
          assert '"展示魔典"' in spy and '"Show grimoire"' in spy
          assert "stringResource" not in spy
          print("UI-NAV compact night layout patch PASS")
          PY

          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            app/src/main/java/com/codex/campboardgamehost/ClocktowerNightActionSquareTableUi.kt \
            app/src/main/java/com/codex/campboardgamehost/ClocktowerSpySquareTableUi.kt \
            app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerNightScreen.kt | sort)"
          test "$actual" = "$expected"
          echo 'UI-NAV compact night exact diff audit PASS'

      - name: Run Android validation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testFast --no-daemon
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload device-test APK
        uses: actions/upload-artifact@v4
        with:
          name: ui-nav-night-compact-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit and push production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/codex/campboardgamehost/ClocktowerNightActionSquareTableUi.kt \
            app/src/main/java/com/codex/campboardgamehost/ClocktowerSpySquareTableUi.kt \
            app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerNightScreen.kt
          git commit -m 'ui: compact night chrome and localize Spy grimoire action'
          git fetch origin codex/ui-nav-1-global-navigation-visual-unification
          test "$(git rev-parse origin/codex/ui-nav-1-global-navigation-visual-unification)" = "$GITHUB_SHA"
          git push origin HEAD:codex/ui-nav-1-global-navigation-visual-unification

      - name: Remove temporary fix workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ui-nav-night-compact-fix.yml
          git add .github/workflows/ui-nav-night-compact-fix.yml
          git commit -m 'chore: remove compact night fix workflow'
          git push origin HEAD:codex/ui-nav-1-global-navigation-visual-unification
