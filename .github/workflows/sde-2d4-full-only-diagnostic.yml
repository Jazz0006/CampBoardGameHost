name: SDE-2D4 full-only diagnostics

on:
  push:
    branches:
      - sde-2d4-d4e-validation-20260919
    paths-ignore:
      - SDE_2D4_FULL_ONLY_DIAGNOSTIC.txt

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - run: chmod +x ./gradlew

      - name: Run new D4 full-only classes separately
        shell: bash
        run: |
          set -euo pipefail
          : > SDE_2D4_FULL_ONLY_DIAGNOSTIC.txt

          run_class() {
            local cls="$1"
            local start end elapsed
            start="$(date +%s)"
            echo "START $cls" | tee -a SDE_2D4_FULL_ONLY_DIAGNOSTIC.txt
            if timeout 900 ./gradlew :app:testDebugUnitTest --tests "$cls" --no-daemon --rerun-tasks; then
              end="$(date +%s)"
              elapsed="$((end-start))"
              echo "PASS $cls elapsedSec=$elapsed" | tee -a SDE_2D4_FULL_ONLY_DIAGNOSTIC.txt
            else
              local status=$?
              end="$(date +%s)"
              elapsed="$((end-start))"
              echo "FAIL $cls status=$status elapsedSec=$elapsed" | tee -a SDE_2D4_FULL_ONLY_DIAGNOSTIC.txt
              exit "$status"
            fi
          }

          run_class "com.codex.campboardgamehost.clocktower.epistemic.Sde2D4ScaleBenchmarkTest"
          run_class "com.codex.campboardgamehost.clocktower.epistemic.Sde2D4TopologyBundlePerformanceTest"
          run_class "com.codex.campboardgamehost.clocktower.epistemic.TroubleBrewingTopologySetupWitnessDifferentialTest"
          run_class "com.codex.campboardgamehost.clocktower.epistemic.TroubleBrewingTopologyObservationDifferentialTest"
          run_class "com.codex.campboardgamehost.clocktower.epistemic.TroubleBrewingTopologyBundleDifferentialTest"

      - name: Commit diagnostic result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f SDE_2D4_FULL_ONLY_DIAGNOSTIC.txt || exit 0
          cat SDE_2D4_FULL_ONLY_DIAGNOSTIC.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SDE_2D4_FULL_ONLY_DIAGNOSTIC.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: record temporary D4 full-only diagnostics"
          git push
