name: UX-MODE-1D setup recommendation UI

on:
  push:
    branches:
      - codex/ux-mode-1
    paths:
      - .github/workflows/ux-mode-1d-setup-recommendation-ui.yml
      - .github/scripts/ux_mode_1d_setup_recommendation_ui_patch.py

permissions:
  contents: write

jobs:
  patch-setup-recommendation-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: codex/ux-mode-1
          fetch-depth: 2

      - name: Validate locked inputs
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/src/main/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUi.kt
          test "$(git rev-parse HEAD:$SRC)" = "3d125705eb628c53ec0d7693535f3621879c7d00"
          test -f app/src/test/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUiModeContractTest.kt
          test -f .github/scripts/ux_mode_1d_setup_recommendation_ui_patch.py

      - name: Apply product patch
        run: python3 .github/scripts/ux_mode_1d_setup_recommendation_ui_patch.py

      - name: Exact diff and language audit
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/src/main/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUi.kt
          test "$(git diff --name-only)" = "$SRC"
          ! grep -Fq 'RecommendationStyle.entries.forEach' "$SRC"
          ! grep -Fq 'showOtherPlans' "$SRC"
          ! grep -Fq 'fun styleName(style: RecommendationStyle)' "$SRC"
          ! grep -Fq '默认选择平衡方案；熟练说书人可比较三种风格。' "$SRC"
          ! grep -Fq '全自动模式已采用平衡方案，不显示其他候选裁定。' "$SRC"
          ! grep -Fq '查看其他方案' "$SRC"
          ! grep -Fq '只看默认方案' "$SRC"
          ! grep -Fq 'selected automatic style' "$SRC"
          grep -Fq '系统推荐已自动采用，无需选择。' "$SRC"
          grep -Fq '系统推荐已就绪；如有需要，可手动调整具体裁定。' "$SRC"
          grep -Fq 'if (!automaticStorytellerInfo && editingDecisions)' "$SRC"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Focused UX-MODE-1D validation
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testFast --no-daemon --tests 'com.codex.campboardgamehost.ClocktowerStorytellerRecommendationUiModeContractTest'

      - name: Commit product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUi.kt
          git commit -m 'feat: simplify setup recommendation UX by experience mode'
          git push origin HEAD:codex/ux-mode-1

      - name: Remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/scripts/ux_mode_1d_setup_recommendation_ui_patch.py
          git rm .github/workflows/ux-mode-1d-setup-recommendation-ui.yml
          git rm .github/workflows/ux-mode-1d-setup-recommendation-ui-v2.yml
          git commit -m 'chore: remove UX-MODE-1D one-shot files'
          git push origin HEAD:codex/ux-mode-1
