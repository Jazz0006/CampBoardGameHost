name: UX-MODE-1D setup recommendation UI

on:
  push:
    branches:
      - codex/ux-mode-1
    paths:
      - .github/workflows/ux-mode-1d-setup-recommendation-ui.yml

permissions:
  contents: write

jobs:
  patch-setup-recommendation-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: codex/ux-mode-1
          fetch-depth: 2

      - name: Validate locked source blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse app/src/main/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUi.kt)" = "3d125705eb628c53ec0d7693535f3621879c7d00"
          test -f app/src/test/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUiModeContractTest.kt

      - name: Apply exact product patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUi.kt')
          s = path.read_text()

          old = '''    fun styleName(style: RecommendationStyle): String = when (style) {
                  RecommendationStyle.GENTLE -> text("稳健", "Gentle")
                  RecommendationStyle.BALANCED -> text("平衡", "Balanced")
                  RecommendationStyle.AGGRESSIVE -> text("激进", "Aggressive")
              }
          '''
          if old not in s:
              raise SystemExit('styleName block not found exactly')
          s = s.replace(old, '', 1)

          old = '    var showOtherPlans by remember { mutableStateOf(false) }\n'
          if old not in s:
              raise SystemExit('showOtherPlans state not found')
          s = s.replace(old, '', 1)

          old = '''            Text(
                          if (automaticStorytellerInfo) {
                              text("全自动模式已采用平衡方案，不显示其他候选裁定。", "Automatic mode has applied the balanced plan; alternative rulings are hidden.")
                          } else {
                              text("默认选择平衡方案；熟练说书人可比较三种风格。", "Balanced is the default; experienced Storytellers can compare all three styles.")
                          },
                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                          style = MaterialTheme.typography.bodySmall,
                      )
          '''
          new = '''            Text(
                          if (automaticStorytellerInfo) {
                              text("系统推荐已自动采用，无需选择。", "The system recommendation is applied automatically; no choice is required.")
                          } else {
                              text("系统推荐已就绪；如有需要，可手动调整具体裁定。", "The system recommendation is ready; adjust individual rulings only when needed.")
                          },
                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                          style = MaterialTheme.typography.bodySmall,
                      )
          '''
          if old not in s:
              raise SystemExit('legacy recommendation intro not found exactly')
          s = s.replace(old, new, 1)

          pattern = re.compile(
              r'''\n            if \(!automaticStorytellerInfo && plans\.isNotEmpty\(\) && showOtherPlans\) \{.*?\n            \}\n            if \(!automaticStorytellerInfo && plans\.size > 1\) \{.*?\n            \}\n''',
              re.S,
          )
          s, count = pattern.subn('\n', s, count=1)
          if count != 1:
              raise SystemExit(f'legacy style controls replacement count={count}')

          old = '        "candidate-seat-spacing" -> text("候选座位距离符合当前风格", "Candidate spacing fits this recommendation style")\n'
          new = '        "candidate-seat-spacing" -> text("候选座位距离符合推荐目标", "Candidate spacing fits the recommendation")\n'
          if old not in s:
              raise SystemExit('candidate spacing style copy not found')
          s = s.replace(old, new, 1)

          old = '                RecommendationUiState.Empty -> Text(text("当前配置没有找到合法推荐，请使用首夜手动流程。", "No legal recommendation was found; use the manual first-night flow."), color = MaterialTheme.colorScheme.secondary)\n'
          new = '''                RecommendationUiState.Empty -> Text(
                              if (automaticStorytellerInfo) {
                                  text("当前配置没有找到合法推荐，请检查当前配置。", "No legal recommendation was found; check the current setup.")
                              } else {
                                  text("当前配置没有找到合法推荐，可检查配置或手动调整。", "No legal recommendation was found; check the setup or adjust it manually.")
                              },
                              color = MaterialTheme.colorScheme.secondary,
                          )
          '''
          if old not in s:
              raise SystemExit('empty-state copy not found')
          s = s.replace(old, new, 1)

          old = '''                    Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  TextButton(onClick = { showDetails = !showDetails }, modifier = Modifier.weight(1f)) {
                                      Text(if (showDetails) text("收起理由", "Hide reasons") else text("查看推荐理由", "Why this plan"))
                                  }
                                  if (!automaticStorytellerInfo) {
                                      Button(
                                          onClick = { onApply(plan) },
                                          modifier = Modifier.weight(1f),
                                          shape = RoundedCornerShape(8.dp),
                                      ) {
                                          Text(if (appliedStyle == plan.style) text("已采用", "Applied") else text("采用推荐", "Apply plan"))
                                      }
                                  }
                              }
          '''
          new = '''                    if (!automaticStorytellerInfo) {
                                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                      TextButton(onClick = { showDetails = !showDetails }, modifier = Modifier.weight(1f)) {
                                          Text(if (showDetails) text("收起理由", "Hide reasons") else text("查看推荐理由", "Why this plan"))
                                      }
                                      Button(
                                          onClick = { onApply(plan) },
                                          modifier = Modifier.weight(1f),
                                          shape = RoundedCornerShape(8.dp),
                                      ) {
                                          Text(if (appliedStyle == plan.style) text("已采用", "Applied") else text("采用推荐", "Apply plan"))
                                      }
                                  }
                              }
          '''
          if old not in s:
              raise SystemExit('recommendation action row not found exactly')
          s = s.replace(old, new, 1)

          old = '''                    Text(
                                  if (automaticStorytellerInfo) {
                                      text("以下首夜步骤将直接使用当前自动模式的信息。", "The first-night steps below will use the selected automatic style.")
                                  } else {
                                      text("采用后仍可在下方首夜步骤中手动修改具体裁定。", "After applying, you can still edit individual decisions in the first-night steps below.")
                                  },
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  style = MaterialTheme.typography.bodySmall,
                              )
          '''
          new = '''                    Text(
                                  if (automaticStorytellerInfo) {
                                      text("系统推荐将在首夜流程中自动使用。", "The system recommendation will be used automatically during the first night.")
                                  } else {
                                      text("需要时可修改具体裁定；所有调整仍使用相同的合法性校验。", "Adjust individual rulings when needed; all changes use the same legality checks.")
                                  },
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  style = MaterialTheme.typography.bodySmall,
                              )
          '''
          if old not in s:
              raise SystemExit('legacy bottom recommendation copy not found exactly')
          s = s.replace(old, new, 1)

          path.write_text(s)
          PY

      - name: Exact diff and product-language audit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "app/src/main/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUi.kt"
          SRC=app/src/main/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUi.kt
          ! grep -Fq 'RecommendationStyle.entries.forEach' "$SRC"
          ! grep -Fq 'showOtherPlans' "$SRC"
          ! grep -Fq 'fun styleName(style: RecommendationStyle)' "$SRC"
          ! grep -Fq '默认选择平衡方案；熟练说书人可比较三种风格。' "$SRC"
          ! grep -Fq '全自动模式已采用平衡方案，不显示其他候选裁定。' "$SRC"
          ! grep -Fq '查看其他方案' "$SRC"
          ! grep -Fq '只看默认方案' "$SRC"
          ! grep -Fq 'selected automatic style' "$SRC"
          grep -Fq '系统推荐已自动采用，无需选择。' "$SRC"
          grep -Fq '系统推荐已就绪；如有需要，可手动调整具体裁定。' "$SRC"
          grep -Fq 'if (!automaticStorytellerInfo && editingDecisions)' "$SRC"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Focused UX-MODE-1D validation
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testFast --no-daemon --tests 'com.codex.campboardgamehost.ClocktowerStorytellerRecommendationUiModeContractTest'

      - name: Commit product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/codex/campboardgamehost/ClocktowerStorytellerRecommendationUi.kt
          git commit -m 'feat: simplify setup recommendation UX by experience mode'
          git push origin HEAD:codex/ux-mode-1

      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/ux-mode-1d-setup-recommendation-ui.yml
          git commit -m 'chore: remove UX-MODE-1D one-shot workflow'
          git push origin HEAD:codex/ux-mode-1
