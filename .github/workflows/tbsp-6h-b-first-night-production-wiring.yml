name: TBSP 6H-B First Night production wiring

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tbsp-6h-b-first-night-production-wiring.yml
      - .github/scripts/tbsp_6h_b_patch.py

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.head_ref == 'codex/trouble-brewing-setup-presets-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_BRANCH: codex/trouble-brewing-setup-presets-v2
      EXPECTED_BASE: 0c0ba304fdf2660e7fc72fb84a067174b7bad4f7
      WORKFLOW_PATH: .github/workflows/tbsp-6h-b-first-night-production-wiring.yml
      PATCH_SCRIPT: .github/scripts/tbsp_6h_b_patch.py
      APP_PATH: app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
      HOST_PATH: app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt
      EXPECTED_APP_BLOB: 4f66a86468343c17c79ffb63745277b387b08381
      EXPECTED_HOST_BLOB: 232d6163dca4c9d465b38c2165bdeaf8b1a3456a

    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v6
        with:
          ref: codex/trouble-brewing-setup-presets-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Verify bootstrap head and source blobs
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only "$EXPECTED_BASE"..HEAD | sort)"
          expected="$(printf '%s\n%s\n' "$WORKFLOW_PATH" "$PATCH_SCRIPT" | sort)"
          test "$actual" = "$expected"
          remote_line="$(git ls-remote origin "refs/heads/$TARGET_BRANCH")"
          remote_sha="${remote_line%%$'\t'*}"
          test "$remote_sha" = "$(git rev-parse HEAD)"
          test "$(git hash-object "$APP_PATH")" = "$EXPECTED_APP_BLOB"
          test "$(git hash-object "$HOST_PATH")" = "$EXPECTED_HOST_BLOB"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply exact two-file 6H-B patch
        shell: bash
        run: |
          set -euo pipefail
          python3 "$PATCH_SCRIPT"

      - name: Compile production wiring
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:compileDebugKotlin

      - name: Run focused typed 6H evidence
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testFast \
            --tests '*TroubleBrewingFirstNightPrecomputeCoordinatorTest' \
            --tests '*NaturalPairInformationCandidateGeneratorTest' \
            --tests '*FirstNightInformationLifecycleTest' \
            --tests '*FirstNightInformationMigrationTest' \
            --tests '*FirstNightPoisonLifecycleTest' \
            --rerun-tasks

      - name: Run T1 testFast checkpoint
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testFast --rerun-tasks

      - name: Audit exact production scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n%s\n' "$APP_PATH" "$HOST_PATH" | sort)"
          test "$actual" = "$expected"
          test ! -e app/src/test/java/com/codex/campboardgamehost/clocktower/session/TroubleBrewingSetupRecommendationProductionWiringTest.kt
          grep -q 'TroubleBrewingFirstNightPrecomputeCoordinator<GameState, List<DecisionCandidate<SetupClueOutcome>>>' "$APP_PATH"
          grep -q 'troubleBrewingFirstNightPrecomputeCoordinator.prewarm' "$APP_PATH"
          grep -q 'troubleBrewingFirstNightPrecomputeScope.launch(Dispatchers.Default)' "$APP_PATH"
          grep -q 'firstNightNaturalPairResultProvider' "$HOST_PATH"
          grep -q 'firstNightNaturalPairCandidates.orEmpty()' "$HOST_PATH"
          git add "$APP_PATH" "$HOST_PATH"
          git diff --cached --check
          staged="$(git diff --cached --name-only | sort)"
          test "$staged" = "$expected"
          git diff --cached --stat

      - name: Reconfirm remote head before push
        shell: bash
        run: |
          set -euo pipefail
          remote_line="$(git ls-remote origin "refs/heads/$TARGET_BRANCH")"
          remote_sha="${remote_line%%$'\t'*}"
          test "$remote_sha" = "$(git rev-parse HEAD)"

      - name: Commit and push 6H-B production wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: wire TBSP 6H first-night precompute'
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Remove one-shot workflow and patch script
        shell: bash
        run: |
          set -euo pipefail
          git rm "$WORKFLOW_PATH" "$PATCH_SCRIPT"
          git commit -m 'chore(ci): remove TBSP 6H-B one-shot workflow'
          git push origin "HEAD:$TARGET_BRANCH"
