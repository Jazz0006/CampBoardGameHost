name: R4D-6.1 Slayer Table Migration

on:
  push:
    branches:
      - codex/ui-r4d6-1-slayer-table-selection

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Verify stacked parent and protected Host blob
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt)" = "dc0b5d959149cc3e8f98ed7ed5d90bfaee22b102"
          git fetch origin codex/ui-r4d5-2c-vote-transaction --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "2d47b3cf35c895f7c668203ef2eb9a93a4f9a194"

      - name: Apply exact active Slayer migration
        run: python3 .github/scripts/r4d6_1_slayer_table_patch.py

      - name: Focused Slayer and shared table regressions
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests com.codex.campboardgamehost.ClocktowerSlayerTableStateTest \
            --tests com.codex.campboardgamehost.ClocktowerDayOverviewTableStateTest \
            --tests com.codex.campboardgamehost.ClocktowerSquareTableSeatLayoutTest \
            --no-daemon --build-cache --rerun-tasks

      - name: Fast suite
        run: ./gradlew :app:testFast --no-daemon --build-cache

      - name: Remove temporary files and audit exact permanent diff
        run: |
          set -euo pipefail
          git rm .github/scripts/r4d6_1_slayer_table_patch.py
          git rm .github/workflows/r4d6-1-slayer-table.yml
          git diff --check 2d47b3cf35c895f7c668203ef2eb9a93a4f9a194
          actual="$(git diff --name-only 2d47b3cf35c895f7c668203ef2eb9a93a4f9a194 | sort)"
          expected="$(printf '%s\n' \
            app/src/main/java/com/codex/campboardgamehost/ClocktowerSlayerTableState.kt \
            app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt \
            app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerSlayerTableUi.kt \
            app/src/test/java/com/codex/campboardgamehost/ClocktowerSlayerTableStateTest.kt | sort)"
          test "$actual" = "$expected"
          test "$(grep -c 'ClocktowerSlayerTableScreen(' app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt)" -ge 1

      - name: Commit validated product checkpoint
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(R4D-6.1): migrate Slayer selection to persistent table"
          git push origin HEAD:${GITHUB_REF_NAME}
