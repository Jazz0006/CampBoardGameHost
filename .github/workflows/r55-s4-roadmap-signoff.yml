name: R5.5 S4 roadmap signoff patch

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/r55-s4-roadmap-signoff.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'codex/storyteller-algorithm-v4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/storyteller-algorithm-v4
          fetch-depth: 0
      - name: Apply exact current-state wording patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/CURRENT_DEVELOPMENT_ROADMAP.md")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "R5 只解锁 R5.5，**没有**直接解锁 R6。R6 仍必须等待 S4–S5 全部通过。",
                  "R5 只解锁 R5.5，**没有**直接解锁 R6。S4 已通过，R6 当前仍必须等待 S5 通过。",
                  "R6 blocker summary",
              ),
              (
                  "### 8.3 `troubleBrewingRulesetRefFor(...)`\n\n该 helper 继续服务 TB A3/A4 correctness boundary；S4 可以审计并设计统一 identity seam，但不能破坏当前 exact correctness contract。",
                  "### 8.3 Trouble Brewing ruleset persistence boundary\n\nS4 已将该边界拆为 `troubleBrewingRulesetKnowledge()`、immutable `ClocktowerRulesetPersistenceBasis` 与 `TroubleBrewingRulesetPersistence`；existing `RulesetRef` 继续服务 TB A3/A4 correctness，normalized script identity 保持独立，S5 cutover 不得混用两种 hash 语义。",
                  "TB ruleset boundary",
              ),
              (
                  "**BLOCKED BY R5.5。**",
                  "**BLOCKED BY S5。**",
                  "R6 section blocker",
              ),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
          git diff --check
          git diff -- docs/CURRENT_DEVELOPMENT_ROADMAP.md
      - name: Commit exact wording patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_DEVELOPMENT_ROADMAP.md
          git diff --cached --quiet && exit 0
          git commit -m "docs(r5.5): align S4 signoff wording"
          git push origin HEAD:codex/storyteller-algorithm-v4
