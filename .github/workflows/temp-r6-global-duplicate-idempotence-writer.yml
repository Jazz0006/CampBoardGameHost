name: Temp R6 global duplicate idempotence writer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/r6-global-duplicate-idempotence-writer-temp
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply exact Global duplicate adapter guard
        shell: python
        run: |
          from pathlib import Path
          path = Path("app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt")
          text = path.read_text(encoding="utf-8")
          start_anchor = "            ClocktowerSemanticHistoryMode.GLOBAL_V1 -> {"
          end_anchor = "    fun addClocktowerEvent(\n"
          if text.count(start_anchor) != 1 or text.count(end_anchor) != 1:
              raise SystemExit("Global branch/event anchors are not unique")
          start = text.index(start_anchor)
          end = text.index(end_anchor, start)
          segment = text[start:end]
          mutation = "                clocktowerEpistemicObservations.clear()"
          guard = "                if (committed.playerInputRevision == clocktowerPlayerInputRevision) return"
          required = [
              "ClocktowerGameSession.commitGlobalEpistemicObservation(",
              "playerInputRevision = clocktowerPlayerInputRevision,",
              mutation,
              "a4ObservationDurabilityGate.markPending(committed.record.recordId)",
          ]
          for needle in required:
              if segment.count(needle) != 1:
                  raise SystemExit(f"unexpected Global seam; expected one {needle!r}, found {segment.count(needle)}")
          if guard in segment:
              raise SystemExit("idempotence guard already present")
          segment = segment.replace(mutation, guard + "\n" + mutation, 1)
          path.write_text(text[:start] + segment + text[end:], encoding="utf-8")
      - name: Validate focused contracts
        run: |
          git diff --check
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests com.codex.campboardgamehost.ClocktowerGlobalObservationProductionWiringTest \
            --tests com.codex.campboardgamehost.clocktower.session.ClocktowerGlobalObservationCommitTest \
            --tests com.codex.campboardgamehost.ActiveGameSemanticHistoryProductionWiringTest \
            --console=plain
      - name: Commit generated App blob
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/codex/campboardgamehost/CampBoardGameHostApp.kt
          git diff --cached --check
          git commit -m "temp: materialize global duplicate idempotence patch"
          git push origin HEAD:codex/r6-global-duplicate-idempotence-writer-temp
