name: UI-R4C one-shot patch

on:
  push:
    branches:
      - codex/ui-r4c-field-test-ui-corrections
    paths:
      - .github/workflows/ui-r4c-one-shot.yml
      - .github/scripts/ui_r4c_patch.py

permissions:
  contents: write

concurrency:
  group: ui-r4c-one-shot
  cancel-in-progress: false

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout locked branch
        uses: actions/checkout@v4
        with:
          ref: codex/ui-r4c-field-test-ui-corrections
          fetch-depth: 0

      - name: Verify one-shot preconditions
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE=975bcfa7f4b145fcad0a8ab1287454233e678a4f
          test "$(git branch --show-current)" = "codex/ui-r4c-field-test-ui-corrections"
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          actual="$(git diff --name-only "$EXPECTED_BASE"..HEAD | sort)"
          expected="$(printf '%s\n' '.github/scripts/ui_r4c_patch.py' '.github/workflows/ui-r4c-one-shot.yml' | sort)"
          test "$actual" = "$expected"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt)" = "cf2adc83eb459935dfd8a4b53f00c7a946f1f05f"
          test "$(git hash-object app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt)" = "98aebb41c79fb8007a0205268306a850dd77cb41"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Normalize known patch-script variants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/ui_r4c_patch.py')
          text = path.read_text(encoding='utf-8')

          old = '''empath_anchor = "                                spyRegistrationKey = empathRegistrationKey,"
          require_count(host, empath_anchor, 2, "empath registration")'''
          new = '''empath_anchors = [
              "\\n                                spyRegistrationKey = empathRegistrationKey,\\n                                spyRegistrationTeams =",
              "\\n                spyRegistrationKey = empathRegistrationKey,\\n                spyRegistrationTeams =",
          ]
          for empath_anchor in empath_anchors:
              require_count(host, empath_anchor, 1, "empath registration")'''
          if old not in text:
              raise SystemExit('empath patch-script anchor declaration changed')
          text = text.replace(old, new, 1)
          old = 'host = host.replace(empath_anchor, empath_legal + empath_anchor)'
          new = '''for empath_anchor in empath_anchors:
              host = host.replace(empath_anchor, empath_legal + empath_anchor, 1)'''
          if old not in text:
              raise SystemExit('empath patch-script replacement changed')
          text = text.replace(old, new, 1)

          old = '''ft_registration_anchor = "                                recluseRegistrationKey = fortuneTellerRecluseRegistrationKey,"
          require_count(host, ft_registration_anchor, 2, "fortune teller registration")'''
          new = '''ft_registration_anchors = [
              "\\n                                recluseRegistrationKey = fortuneTellerRecluseRegistrationKey,\\n                                recluseRegistrationTeams =",
              "\\n                recluseRegistrationKey = fortuneTellerRecluseRegistrationKey,\\n                recluseRegistrationTeams =",
          ]
          for ft_registration_anchor in ft_registration_anchors:
              require_count(host, ft_registration_anchor, 1, "fortune teller registration")'''
          if old not in text:
              raise SystemExit('fortune teller patch-script anchor declaration changed')
          text = text.replace(old, new, 1)
          old = 'host = host.replace(ft_registration_anchor, ft_legal + ft_registration_anchor)'
          new = '''for ft_registration_anchor in ft_registration_anchors:
              host = host.replace(ft_registration_anchor, ft_legal + ft_registration_anchor, 1)'''
          if old not in text:
              raise SystemExit('fortune teller patch-script replacement changed')
          text = text.replace(old, new, 1)

          old = "ft_replacement = '''    fun fortuneTellerMatches(recluseRegistersAsDemon: Boolean): Boolean? {"
          new = "ft_replacement = '''    val roleDefinitionsById = clocktowerRoleDefinitionsForScript(script)\\n        .associateBy { it.id }\\n    fun fortuneTellerMatches(recluseRegistersAsDemon: Boolean): Boolean? {"
          if old not in text:
              raise SystemExit('fortune teller replacement authority anchor changed')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Apply exact-anchor patch
        id: apply_patch
        shell: bash
        run: |
          set +e
          python3 .github/scripts/ui_r4c_patch.py > ui-r4c-patch.log 2>&1
          code=$?
          cat ui-r4c-patch.log
          exit $code

      - name: Upload patch diagnostics
        if: failure() && steps.apply_patch.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ui-r4c-patch-diagnostics
          path: ui-r4c-patch.log
          if-no-files-found: error

      - name: Focused UI-R4C tests
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.codex.campboardgamehost.ClocktowerRoleLocalizationTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerPairManualSelectionModelTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerPlayerDisplayPresentationTest' \
            --tests 'com.codex.campboardgamehost.ClocktowerRegistrationResultDomainTest'

      - name: Fast regression suite
        run: ./gradlew :app:testFast

      - name: Audit product diff
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/scripts/ui_r4c_patch.py
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt' \
            'app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt' | sort)"
          test "$actual" = "$expected"

      - name: Commit product patch and self-remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/scripts/ui_r4c_patch.py
          git rm .github/scripts/ui_r4c_patch.py .github/workflows/ui-r4c-one-shot.yml
          git diff --check
          git add app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt \
                  app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/scripts/ui_r4c_patch.py' \
            '.github/workflows/ui-r4c-one-shot.yml' \
            'app/src/main/java/com/codex/campboardgamehost/ClocktowerNightStepUi.kt' \
            'app/src/main/java/com/codex/campboardgamehost/clocktower/ui/ClocktowerHostScreen.kt' | sort)"
          test "$staged" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'UI-R4C: use final information as registration authority'
          git push origin HEAD:codex/ui-r4c-field-test-ui-corrections
